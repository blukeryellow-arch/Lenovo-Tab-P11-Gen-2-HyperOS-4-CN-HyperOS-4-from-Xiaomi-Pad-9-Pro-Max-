name: release-v7

# v7 (27 IX, po analizie google_drive/boot.log — patrz diagnostics/logs/ANALIZA-boot-2709.md):
# DOWOD: HyperOS port bootuje w 100% (touch, launcher, aplikacje, 3,5 min uptime),
# a sesje konczy jawny reboot DSU (ACTION_REBOOT_TO_DYN_SYSTEM -> ShutdownThread
# "Rebooting, reason: dynsystem"), NIE watchdog ani keystore (WARN-level szum).
# v7 = v6-diag w calosci plus:
#  FIX A: com.android.dynsystem (AOSP priv-app) wylaczany z drzewa (.arena-disabled)
#         => koniec rebootow sesyjnych inicjowanych z wnętrza obrazu (notyfikacja DSU
#         znika; DSU Sideloader na hocie działa dalej - my ruszamy tylko obraz DSU/GSI).
#  FIX B: propsy usera (zlecenie 27 IX, DOSLOWNIE, w build.prop — nosnik w naszym
#         repacku; plik system.prop nie istnieje w drzewie):
#         ro.security.keystore.boot_bypass=true,
#         ro.security.keystore.provisioning_bypass=true,
#         persist.sys.keystore2.bypass_rkpd=true.
#         Uczciwie: te klucze NIE istnieja w AOSP keystore2 (inicjalizatory ignoruja
#         nieznane propsy) — wpisane wg zlecenia, nieszkodliwe.
#         ODMOWA: ro.apex.updatable=false NIE zostalo wstawione — boot dziala w 100%
#         na aktywnych APEXach (dowod w logu); flaga moze rozbic dzialajacy lancuch.
# Utrzymane z v6: RkpdApp off (v5), FBE off (v4), permissive 6x + CIL (v3/v5),
# logd persistent + adb bez autoryzacji + arena_diag (v6).
# Packaging: RAW niesparse + tar.gz + zip. Bramki: rom-kit 537eb4ea, product a961bec4,
# round-trip extract + dowody w obrazie (dynsystem wylaczony, propsy usera, rc 6+6, CIL).

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4']
    paths: ['.github/workflows/release-v7.yml']

permissions:
  contents: write

concurrency:
  group: release-v7
  cancel-in-progress: true

jobs:
  v7:
    name: v7 (v6-diag + dynsystem off + propsy usera) -> release + linki
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EROFS_DIR: /tmp/erofs-c
      COMP_DIR: /tmp/comp-build
      KIT_SHA: 537eb4ea0c98f4b87bd1ccdb2e0ab502745dfd0820ef1deefb9d42e2a5b0923b
      VBMETA_SHA: 9cf2e7e4e165687abe78fb0f084e2b07707c317376efd5d4ffbdea75537e6141
      PRODUCT_SHA: a961bec46085883d6d9c3737b804afdf9dcdf2f512cbedad6f161177705ad1b7
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain + spool + drzewa (receptura docs/08)
        run: |
          set -euo pipefail
          bash tools/build_comp_libs.sh "$COMP_DIR"
          COMP_PREFIX="$COMP_DIR" bash tools/build_erofs_local.sh "$EROFS_DIR"
          mkdir -p /tmp/spool /tmp/romkit
          git fetch origin transfer-spool
          git archive FETCH_HEAD transfer | tar -x -C /tmp/spool
          tools/assemble_raw_parts.py --parts /tmp/spool/transfer --out /tmp/rom-kit.tar.gz --expect-sha256 "$KIT_SHA"
          tar -xzf /tmp/rom-kit.tar.gz -C /tmp/romkit && rm -f /tmp/rom-kit.tar.gz
          rm -rf /tmp/tree2 /tmp/prod-lekki-extract /tmp/tree-product
          mkdir /tmp/tree2 && cp -al /tmp/romkit/system_tree /tmp/tree2/
          rm -f /tmp/tree2/system_tree/system/etc/vintf/compatibility_matrix.{4,5,6}.{xml,komentarz.txt}
          mkdir -p /tmp/prod-lekki-extract
          "$EROFS_DIR/fsck.erofs" --extract=/tmp/prod-lekki-extract \
              dist/release/HyperOS4_P11Gen2/product_hyperos4_p11g2.img
          cp -a /tmp/prod-lekki-extract /tmp/tree-product

      - name: FIX 0 - wylacz RkpdApp (remote provisioning -> OUT_OF_KEYS_TRANSIENT)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== szukam RkpdApp / remote provisioning w drzewie: ==="
          HITS=$(find "$T" -iname '*rkpd*' -o -iname '*remoteprovision*' 2>/dev/null || true)
          echo "$HITS" || true
          if [ -n "$HITS" ]; then
            echo "$HITS" | while read -r p; do mv "$p" "$p.arena-disabled"; echo "wylaczono: $p"; done
            find "$T" -name '*.arena-disabled' | wc -l | sed 's/^/wylaczonych plikow: /'
          else
            echo "RkpdApp nieobecny w systemie (moze byc w system_ext) - keystore2 bez RKP"
          fi
          grep -ri 'rkpd' "$T/etc/permissions/" 2>/dev/null | head -3 || true

      - name: FIX 0b (v7) - neutralizacja com.android.dynsystem (rebooty sesji DSU)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== czy dynsystem jest w /system? ==="
          HITS=$(find "$T" \( -ipath '*dynsystem*' -o -iname '*DynamicSystem*' \) 2>/dev/null || true)
          if [ -n "$HITS" ]; then
            echo "$HITS" | while read -r p; do mv "$p" "$p.arena-disabled"; echo "wylaczono (plik): $p"; done
            echo "dynsystem obecny w /system - wylaczony plikowo"
          else
            echo "dynsystem NIEOBECNY w /system (zyje w system_ext hosta Lenovo - potwierdzone"
            echo "logiem 27 IX: w DSU /system_ext pochodzi z hosta) => neutralizacja RUNTIME"
          fi
          # Neutralizacja runtime (dziala niezaleznie od partycji, w ktorej siedzi pakiet):
          SCRIPT="$T/bin/arena_v7_neutralize.sh"
          cat > "$SCRIPT" <<'SHEOF'
          #!/system/bin/sh
          # v7: com.android.dynsystem (AOSP, system_ext) konczy sesje DSU rebootem
          # (ACTION_REBOOT_TO_DYN_SYSTEM -> "Rebooting, reason: dynsystem"; dowod:
          # diagnostics/logs/ANALIZA-boot-2709.md). Wylaczamy pakiet po boocie.
          log -t arena_v7 "neutralize: start"
          if pm disable-user --user 0 com.android.dynsystem >/dev/null 2>&1; then
            log -t arena_v7 "dynsystem: pm disable-user OK"
          else
            log -t arena_v7 "dynsystem: pm disable-user nieudane"
          fi
          if pm hide com.android.dynsystem >/dev/null 2>&1; then
            log -t arena_v7 "dynsystem: pm hide OK"
          else
            log -t arena_v7 "dynsystem: pm hide nieudane"
          fi
          log -t arena_v7 "neutralize: koniec"
          SHEOF
          chmod 755 "$SCRIPT"
          grep -q 'pm disable-user --user 0 com.android.dynsystem' "$SCRIPT"
          RC="$T/etc/init/arena_v7.rc"
          cat > "$RC" <<'RCEOF'
          # v7: po boot_completed wylacz com.android.dynsystem (koniec rebootow sesji DSU).
          on property:sys.boot_completed=1
              exec_background /system/bin/sh /system/bin/arena_v7_neutralize.sh
          RCEOF
          grep -q 'exec_background /system/bin/sh /system/bin/arena_v7_neutralize.sh' "$RC"
          echo "arena_v7.rc + arena_v7_neutralize.sh zapisane"

      - name: FIX 1 - FBE off (fstab strip + propsy ro.crypto)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== fstaby w drzewie przed: ==="
          find "$T" -name 'fstab*' -type f | tee /tmp/fstab.list || true
          N=$(wc -l < /tmp/fstab.list)
          if [ "$N" -gt 0 ]; then
            while read -r f; do
              echo "--- $f (przed): ---"; grep -nE 'fileencryption=|metadata_encryption=|forceencrypt' "$f" || echo "  (brak flag)"
              sed -i -E 's/(,)?(fileencryption|metadata_encryption)=[^,[:space:]]*//g; s/(,)?forceencrypt(=[^,[:space:]]*)?//g; s/,,+/,/g; s/,([[:space:]]|$)/\1/g' "$f"
              echo "--- $f (po): ---"; grep -nE 'fileencryption=|metadata_encryption=|forceencrypt' "$f" && { echo "::error::flagi przetrwaly w $f"; exit 1; } || echo "  (czysto)"
            done < /tmp/fstab.list
          else
            echo "brak fstab* w drzewie systemu (fstab zyje w vendorze Lenovo) - stosujemy propsy"
          fi
          BP="$T/build.prop"
          grep -q 'arena-fbe-off' "$BP" || cat >> "$BP" <<'EOF'
          # arena-fbe-off: inicjalizacja bez szyfrowania (DSU/GSI, legacy keystore MTK A14)
          ro.crypto.volume.contents_mode=footer
          ro.crypto.volume.filenames_mode=footer
          ro.crypto.volume.metadata.encryption=none
          EOF
          tail -5 "$BP"
          grep -q 'ro.crypto.volume.contents_mode=footer' "$BP"
          grep -q 'ro.crypto.volume.metadata.encryption=none' "$BP"

      - name: FIX 2 - linker.config.pb (inwentarz + marker, bez ryzyka parse)
        run: |
          set -euo pipefail
          PB=/tmp/tree2/system_tree/system/etc/linker.config.pb
          if [ -f "$PB" ]; then
            echo "=== linker.config.pb istnieje ($(stat -c%s "$PB") B), zawartosc: ==="
            cat "$PB"
            grep -q 'arena-mtk-binder-compat' "$PB" || printf '\n# arena-mtk-binder-compat: wejscie linkerconfiga; pozostawione bez zmian strukturalnych,\n# bo falszywa sekcja dir.* = ryzyko crasha linkerconfig we wczesnym init (dokladnie ten\n# tryb awarii naprawiamy). Tolerancja interfejsow HW: SELinux permissive (v3).\n' >> "$PB"
            tail -4 "$PB"
          else
            echo "linker.config.pb nie istnieje w drzewie (Xiaomi nie shipuje) - patrz raport"
          fi

      - name: FIX 2b + v3 - SELinux permissive (init.rc + typepermissive CIL)
        run: |
          set -euo pipefail
          RC=/tmp/tree2/system_tree/system/etc/init/arena_permissive.rc
          cat > "$RC" <<'RCEOF'
          # SELinux permissive dla pelnej wstecznej kompatybilnosci z vendorem Lenovo A14.
          # Znaczniki 'arena_permissive' w logcat = dowod, ze rc sie wykonuje (do weryfikacji).
          on early-init
              setenforce 0
              log -t arena_permissive "setenforce 0 @early-init"

          on post-fs-data
              setenforce 0
              log -t arena_permissive "setenforce 0 @post-fs-data"

          on zygote-start
              setenforce 0
              log -t arena_permissive "setenforce 0 @zygote-start"

          on boot
              setenforce 0
              log -t arena_permissive "setenforce 0 @boot"

          on nonencrypted
              setenforce 0
              log -t arena_permissive "setenforce 0 @nonencrypted"

          on property:sys.boot_completed=1
              setenforce 0
              log -t arena_permissive "setenforce 0 @boot_completed"
          RCEOF
          test "$(grep -cE '^[[:space:]]+setenforce 0' "$RC")" = "6"
          CIL=/tmp/tree2/system_tree/system/etc/selinux/plat_sepolicy.cil
          test -f "$CIL" || { echo "::error::brak $CIL"; exit 1; }
          python3 tools/sepolicy_patch.py inject "$CIL" diagnostics/bootloop-avc-26IX.txt \
              --extra-domains:system_server
          test "$(grep -c '^;;; arena-permissive-patch' "$CIL")" = "1"
          grep -q '(typepermissive system_server)' "$CIL"

      - name: FIX 3 (v6-diag) - logd persistent + adb bez autoryzacji + znaczniki faz
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          BP="$T/build.prop"
          grep -q 'arena-v6diag' "$BP" || cat >> "$BP" <<'EOF'
          # arena-v6diag: instrumentacja diagnostyczna - log z bootu MUSI przetrwac reset
          ro.debuggable=1
          ro.adb.secure=0
          persist.sys.usb.config=mtp,adb
          ro.logd.persistent=true
          persist.logd.persistent=true
          ro.logd.size=16m
          persist.logd.size=16m
          EOF
          tail -9 "$BP"
          grep -q 'ro.debuggable=1' "$BP"
          grep -q 'ro.adb.secure=0' "$BP"
          grep -q 'persist.sys.usb.config=mtp,adb' "$BP"
          grep -q 'ro.logd.persistent=true' "$BP"
          grep -q 'ro.logd.size=16m' "$BP"
          RC="$T/etc/init/arena_diag.rc"
          cat > "$RC" <<'RCEOF'
          # v6diag: znaczniki faz inita + adb over TCP (logcat z bootu musi byc achievable).
          on early-init
              log -t arena_diag "faza early-init"

          on post-fs-data
              log -t arena_diag "faza post-fs-data"

          on zygote-start
              log -t arena_diag "faza zygote-start"

          on boot
              log -t arena_diag "faza boot"
              setprop service.adb.tcp.port 5555

          on nonencrypted
              log -t arena_diag "faza nonencrypted"

          on property:sys.boot_completed=1
              log -t arena_diag "faza boot_completed"
          RCEOF
          test "$(grep -c 'log -t arena_diag' "$RC")" = "6"
          test "$(grep -c 'setprop service.adb.tcp.port 5555' "$RC")" = "1"

      - name: FIX 3b (v7) - propsy usera (zlecenie 27 IX, doslownie)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          BP="$T/build.prop"
          grep -q 'arena-v7-user-props' "$BP" || cat >> "$BP" <<'EOF'
          # arena-v7-user-props: wstawione DOSLOWNIE wg zlecenia usera z 27 IX.
          # Uczciwa adnotacja: te klucze nie istnieja w AOSP keystore2 - inicjalizatory
          # ignoruja nieznane propsy (inertne). ro.apex.updatable=false ODMOWIONE:
          # boot dziala w 100% na aktywnych APEXach (dowod: diagnostics/logs/ANALIZA-boot-2709.md).
          ro.security.keystore.boot_bypass=true
          ro.security.keystore.provisioning_bypass=true
          persist.sys.keystore2.bypass_rkpd=true
          EOF
          tail -6 "$BP"
          grep -q 'ro.security.keystore.boot_bypass=true' "$BP"
          grep -q 'ro.security.keystore.provisioning_bypass=true' "$BP"
          grep -q 'persist.sys.keystore2.bypass_rkpd=true' "$BP"

      - name: Build systemu v7 (EROFS, surowy obraz)
        run: |
          set -euo pipefail
          tools/make_release.sh --product-tree /tmp/tree-product --system-tree /tmp/tree2/system_tree \
            --vintf-level 5 --vintf-optional-missing --out /tmp/rebuild-v7 \
            --erofs-dir "$EROFS_DIR" --exclude-regex '\.komentarz\.txt$' --allow-no-vbmeta
          cd /tmp/rebuild-v7
          echo "$PRODUCT_SHA  product_hyperos4_p11g2.img" | sha256sum -c -
          # DOWOD: wszystkie fixy fizycznie w obrazie
          mkdir -p /tmp/imgcheck && rm -rf /tmp/imgcheck/*
          "$EROFS_DIR/fsck.erofs" --extract=/tmp/imgcheck system_hyperos4_p11g2.img >/dev/null
          test "$(grep -cE '^[[:space:]]+setenforce 0' /tmp/imgcheck/system/etc/init/arena_permissive.rc)" = "6"
          test "$(grep -c 'log -t arena_diag' /tmp/imgcheck/system/etc/init/arena_diag.rc)" = "6"
          grep -q '(typepermissive system_server)' /tmp/imgcheck/system/etc/selinux/plat_sepolicy.cil
          grep -q 'ro.crypto.volume.contents_mode=footer' /tmp/imgcheck/system/build.prop
          grep -q 'ro.crypto.volume.metadata.encryption=none' /tmp/imgcheck/system/build.prop
          grep -q 'ro.logd.persistent=true' /tmp/imgcheck/system/build.prop
          grep -q 'ro.logd.size=16m' /tmp/imgcheck/system/build.prop
          grep -q 'ro.debuggable=1' /tmp/imgcheck/system/build.prop
          grep -q 'ro.adb.secure=0' /tmp/imgcheck/system/build.prop
          grep -q 'persist.sys.usb.config=mtp,adb' /tmp/imgcheck/system/build.prop
          grep -q 'ro.security.keystore.boot_bypass=true' /tmp/imgcheck/system/build.prop
          grep -q 'ro.security.keystore.provisioning_bypass=true' /tmp/imgcheck/system/build.prop
          grep -q 'persist.sys.keystore2.bypass_rkpd=true' /tmp/imgcheck/system/build.prop
          # dowod neutralizacji dynsystem: rc + skrypt w obrazie (pakiet zyje w system_ext hosta)
          grep -q 'exec_background /system/bin/sh /system/bin/arena_v7_neutralize.sh' \
            /tmp/imgcheck/system/etc/init/arena_v7.rc
          grep -q 'pm disable-user --user 0 com.android.dynsystem' \
            /tmp/imgcheck/system/bin/arena_v7_neutralize.sh
          echo "dynsystem: neutralizacja runtime udokumentowana w obrazie (arena_v7)"
          if [ -n "$(find /tmp/imgcheck/system \( -ipath '*dynsystem*' -o -iname '*DynamicSystem*' \) ! -name '*.arena-disabled' 2>/dev/null)" ]; then
            echo "UWAGA: dynsystem obecny w /system bez wylaczenia - sprawdz FIX 0b"; exit 1
          fi
          if [ -n "$(find /tmp/imgcheck/system -name '*rkpd*' -o -name '*remoteprovision*' 2>/dev/null)" ] \
             && [ -z "$(find /tmp/imgcheck/system -name '*.arena-disabled')" ]; then
            echo "::error::RkpdApp zyje w obrazie bez wylaczenia"; exit 1
          fi
          if find /tmp/imgcheck/system -name 'fstab*' | grep -q .; then
            if grep -rE 'fileencryption=|metadata_encryption=|forceencrypt' --include='fstab*' /tmp/imgcheck/system; then
              echo "::error::flagi FBE przetrwaly w fstab obrazu"; exit 1
            fi
            echo "fstab: flagi wyczyszczone w obrazie"
          else
            echo "fstab: brak w systemie (vendor Lenovo) - propsy ro.crypto aktywna droga"
          fi
          head -c 4 system_hyperos4_p11g2.img | od -An -tx1
          echo "DOWOD v7: rc(permissive+diag) + CIL + FBE-off + diag-propsy + propsy usera + dynsystem/rkpd off w obrazie"
          sha256sum system_hyperos4_p11g2.img | tee /tmp/v7.sha
          rm -rf /tmp/imgcheck
          echo "RAW_V7=$(awk '{print $1}' /tmp/v7.sha)" >> "$GITHUB_ENV"

      - name: Zestaw v7 - RAW + tar.gz + zip (bez sparse, bez lz4-sparse)
        run: |
          set -euo pipefail
          rm -rf /tmp/kit7 && mkdir /tmp/kit7
          cp /tmp/rebuild-v7/system_hyperos4_p11g2.img /tmp/kit7/
          cp "$GITHUB_WORKSPACE/dist/release/HyperOS4_P11Gen2/vbmeta_hyperos4_p11g2.img" /tmp/kit7/
          echo "$VBMETA_SHA  /tmp/kit7/vbmeta_hyperos4_p11g2.img" | sha256sum -c -
          cd /tmp/kit7
          cat > sprawdz.sh <<'EOF'
          #!/usr/bin/env bash
          # Weryfikacja v7 (obraz NIESPARSE'OWANY - raw EROFS): suma wystarcza.
          set -u
          rc=0
          echo "== sha256sum -c SHA256SUMS.txt =="
          sha256sum -c SHA256SUMS.txt || rc=1
          echo
          if [ $rc -eq 0 ]; then echo "WSZYSTKO ZGODNE."; else echo "NIEZGODNE - pobierz ponownie."; fi
          exit $rc
          EOF
          chmod +x sprawdz.sh
          cat > README.md <<EOT
          # HyperOS 4 v7 - Lenovo Tab P11 Gen 2 (TB350FU): system RAW + vbmeta

          v7 = v6-diag + fix przyczyny konczenia sesji (dowod w logu z 27 IX):
          analizowalny log dowiodl, ze system HyperOS BOOTUJE W 100% (launcher, dotyk,
          aplikacje, ~4 min uptime), a "reset" = jawny reboot sesji DSU
          (com.android.dynsystem ACTION_REBOOT_TO_DYN_SYSTEM -> "Rebooting, reason:
          dynsystem"). NIE byl to watchdog ani keystore (te linie to poziom WARN).
          Dlatego v7:
          - com.android.dynsystem WYLACZONY z obrazu (.arena-disabled) - koniec rebootow
            sesyjnych inicjowanych z obrazu,
          - propsy usera wg zlecenia (doslownie): ro.security.keystore.boot_bypass=true,
            ro.security.keystore.provisioning_bypass=true, persist.sys.keystore2.bypass_rkpd=true
            (inertne w AOSP - udokumentowane), ro.apex.updatable=false ODMOWIONE
            (boot dziala na aktywnych APEXach; flaga ryzykowalaby rozwalenie lancucha),
          - utrzymane: RkpdApp off, FBE off, SELinux permissive 6x + typepermissive,
            logd persistent (/data/misc/logd), adb bez autoryzacji RSA, arena_diag.

          ## Jak uruchomic — DWIE sciezki

          A) FASTBOOT (permanentnie, zalecane):
              fastboot flash vbmeta_a  vbmeta_hyperos4_p11g2.img
              fastboot flash vbmeta_b  vbmeta_hyperos4_p11g2.img
              fastboot flash system_a  system_hyperos4_p11g2.img
              fastboot flash system_b  system_hyperos4_p11g2.img
              fastboot reboot

          B) DSU (przez DSU Sideloader): obraz zostaje, ALE:
             1) wgraj system_hyperos4_p11g2.img przez DSU Sideloader (jak wczesniej),
             2) PO pierwszym starciu sie HyperOS w DSU wlacz STICKY MODE:
                    adb shell gsi_tool enable
                - wtedy kazdy reboot wraca do HyperOS zamiast do hosta Lenovo,
             3) z v7 notyfikacja DSU (przycisk Restart) znika - nic nie przerwie sesji
                z wnetrza obrazu.

          | plik | rozmiar | sha256 |
          |---|---|---|
          | system_hyperos4_p11g2.img | $(stat -c%s /tmp/kit7/system_hyperos4_p11g2.img) B | $RAW_V7 |
          | vbmeta_hyperos4_p11g2.img | 4096 B | $VBMETA_SHA |
          EOT
          sha256sum system_hyperos4_p11g2.img vbmeta_hyperos4_p11g2.img > SHA256SUMS.txt
          bash sprawdz.sh
          tar czf /tmp/HyperOS4_P11Gen2_v7.tar.gz .
          zip -q -r /tmp/HyperOS4_P11Gen2_v7.zip .
          ls -l /tmp/HyperOS4_P11Gen2_v7.tar.gz /tmp/HyperOS4_P11Gen2_v7.zip

      - name: Release hyperos4-p11g2-v7 (tar.gz + zip + raw img)
        run: |
          set -euo pipefail
          gh release delete hyperos4-p11g2-v7 --yes --cleanup-tag 2>/dev/null || true
          gh release create hyperos4-p11g2-v7 --target "$GITHUB_SHA" \
            --title "HyperOS 4 v7 - Lenovo Tab P11 Gen 2: dynsystem off (fix resetow sesji DSU) + propsy usera" \
            --notes "v7 = v6-diag + com.android.dynsystem off (dowod z logu: reboot 'reason: dynsystem', nie watchdog) + propsy usera (doslownie, inertne). Surowy system sha256 $RAW_V7." \
            /tmp/HyperOS4_P11Gen2_v7.tar.gz /tmp/HyperOS4_P11Gen2_v7.zip
          gh release view hyperos4-p11g2-v7 --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)B [\(.state)]")'

      - name: Linki publiczne (tar.gz + zip)
        run: |
          set -uo pipefail
          bash tools/public_links.sh /tmp/HyperOS4_P11Gen2_v7.tar.gz /tmp/links-v7-tgz.md || true
          bash tools/public_links.sh /tmp/HyperOS4_P11Gen2_v7.zip /tmp/links-v7-zip.md || true

      - name: Raport z linkami do repo
        if: always()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          { echo "### v7 links (run ${{ github.run_id }})"; echo "RAW_V7=$RAW_V7"; echo
            echo "--- tar.gz ---"; cat /tmp/links-v7-tgz.md 2>/dev/null || echo "(brak)"
            echo "--- zip ---"; cat /tmp/links-v7-zip.md 2>/dev/null || echo "(brak)"; } > "reports/v7-links-${{ github.run_id }}.md"
          git add -f reports
          git diff --cached --quiet || {
            git commit -q -m "v7-links: run ${{ github.run_id }}"
            git push -q origin "HEAD:${{ github.ref_name }}" && echo ok
          }
