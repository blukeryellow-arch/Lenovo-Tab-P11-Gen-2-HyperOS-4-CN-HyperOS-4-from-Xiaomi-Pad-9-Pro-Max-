        with:
          name: MysticalOS_0.5_HyperOS_Port
          path: |
            /tmp/m2/out/MysticalOS_0.5_HyperOS_Port.img
            /tmp/m2/out/preview/preview-boot.jpg
            /tmp/m2/out/preview/preview-wallpaper.jpg
            /tmp/m2/out/port-report.txt
            /tmp/m2/out/ui-report.txt
            /tmp/m2/vbmeta/FLAGS3/vbmeta.img
            /tmp/m2/vbmeta/FLAGS3/vbmeta_system.img
            /tmp/m2/vbmeta/FLAGS3/vbmeta_vendor.img
            /tmp/m2/vbmeta/STOCK-ORYGINAL/vbmeta.img
            /tmp/m2/vbmeta/STOCK-ORYGINAL/vbmeta_system.img
