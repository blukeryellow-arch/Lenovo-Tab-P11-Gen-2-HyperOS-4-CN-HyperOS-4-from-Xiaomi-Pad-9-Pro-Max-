name: redmi9c-hyperos4-port

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Wariant urzadzenia (angelica = Redmi 9C, angelican = Redmi 9C NFC)"
        required: true
        default: "angelica"
        type: choice
        options:
          - angelica
          - angelican
      debloat_level:
        description: "Poziom debloatu HyperOS 4"
        required: true
        default: "aggressive"
        type: choice
        options:
          - aggressive
          - balanced
      fs_mode:
        description: "System plikow partycji system/system_ext/product w super.img"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - erofs
          - ext4
      release_tag:
        description: "Tag GitHub Release"
        required: true
        default: "mysticalos-redmi9c-v1"
        type: string
      gms_mode:
        description: "Tryb uslug Google / microG"
        required: true
        default: "microg"
        type: choice
        options:
          - microg
          - keep
          - none
  push:
    branches:
      - arena/dd4cc57a-lenovo-tab-p11-gen-2-hyperos-4
    paths:
      - ".github/workflows/redmi9c-hyperos4-port.yml"
      - "tools/**"
      - "templates/**"
      - "rust/**"
      - "apps/**"

concurrency:
  group: redmi9c-hyperos4-port
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-port:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WORK: /tmp/r9c
      REPO_DIR: ${{ github.workspace }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VARIANT: ${{ inputs.variant || 'angelica' }}
      DEBLOAT_LEVEL: ${{ inputs.debloat_level || 'aggressive' }}
      FS_MODE: ${{ inputs.fs_mode || 'auto' }}
      RELEASE_TAG: ${{ inputs.release_tag || 'mysticalos-redmi9c-v1' }}
      GMS_MODE: ${{ inputs.gms_mode || 'microg' }}
      BASE_URL: https://github.com/xc112lg/blossom_releases/releases/download/EvolutionX-17.0-20261120-1/EvolutionX-17.0-20261120-blossom-12.4-Vanilla-Unofficial.zip
      BASE_FALLBACK_URL: https://github.com/xc112lg/blossom_releases/releases/download/crDroid-20261121-4/crDroidAndroid-17.0-20261121-blossom-v13.1.zip
      DONOR_FILE: dew_global-ota_full-OS4.0.8.0.XBNMIXM-user-17.0-bff6fad64d.zip
      DONOR_PATH: OS4.0.8.0.XBNMIXM/dew_global-ota_full-OS4.0.8.0.XBNMIXM-user-17.0-bff6fad64d.zip
      DONOR_MD5: bff6fad64d879e13b520eaf15190c0aa
      SUPER_SIZE: "4831838208"
      MAIN_SIZE: "4829741056"
      BOOT_MAX_SIZE: "67108864"
    steps:
      - uses: actions/checkout@v4

      - name: "0a. Kompilacja komponentow Rust (r9c-memd + Redmi9CRustApp.apk) + test apk2rust"
        run: |
          set -euo pipefail
          mkdir -p "$WORK/bin" "$WORK/rust-out" "$WORK/rust-apk/lib/arm64-v8a" "$WORK/rust-apk/lib/armeabi-v7a"
          : > "$WORK/rust-build.log"
          exec > >(tee -a "$WORK/rust-build.log") 2>&1

          echo "=== RUST & ANDROID NDK BUILD ==="
          NDK_BIN=$(find /usr/local/lib/android/sdk "${ANDROID_NDK_HOME:-/nonexistent}" "${ANDROID_NDK_LATEST_HOME:-/nonexistent}" -maxdepth 8 \( -type f -o -type l \) -name "aarch64-linux-android*-clang" -printf '%h\n' 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK_BIN" ]; then
            echo "Brak lokalnego NDK - instaluje NDK przez sdkmanager..."
            SDKM=$(find /usr/local/lib/android/sdk -maxdepth 5 -type f -name "sdkmanager" | sort -V | tail -1 || true)
            [ -x "$SDKM" ] || { ls -la /usr/local/lib/android/sdk || true; exit 1; }
            yes | "$SDKM" --licenses >/dev/null 2>&1 || true
            "$SDKM" "ndk;27.2.12479018" >/dev/null
            NDK_BIN=$(find /usr/local/lib/android/sdk -maxdepth 8 \( -type f -o -type l \) -name "aarch64-linux-android*-clang" -printf '%h\n' 2>/dev/null | sort -V | tail -1 || true)
          fi
          BUILD_TOOLS=$(find /usr/local/lib/android/sdk/build-tools -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          ANDROID_JAR=$(find /usr/local/lib/android/sdk/platforms -maxdepth 2 -name "android.jar" | sort -V | tail -1)
          echo "NDK_BIN=$NDK_BIN"
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          echo "ANDROID_JAR=$ANDROID_JAR"
          [ -d "$NDK_BIN" ] || { ls -la /usr/local/lib/android/sdk || true; echo "::error::Brak Android NDK!"; exit 1; }
          [ -x "$BUILD_TOOLS/aapt2" ] || { echo "::error::Brak aapt2!"; exit 1; }
          [ -f "$ANDROID_JAR" ] || { echo "::error::Brak android.jar!"; exit 1; }

          if [ -x "$NDK_BIN/aarch64-linux-android28-clang" ]; then
            CC64="$NDK_BIN/aarch64-linux-android28-clang"
          else
            CC64=$(find "$NDK_BIN" -maxdepth 1 -name "aarch64-linux-android[0-9]*-clang" | sort -V | tail -1 || true)
          fi
          if [ -x "$NDK_BIN/armv7a-linux-androideabi28-clang" ]; then
            CC32="$NDK_BIN/armv7a-linux-androideabi28-clang"
          else
            CC32=$(find "$NDK_BIN" -maxdepth 1 -name "armv7a-linux-androideabi[0-9]*-clang" | sort -V | tail -1 || true)
          fi
          echo "CC64=$CC64 CC32=$CC32"
          [ -x "$CC64" ] && [ -x "$CC32" ] || { echo "::error::Brak kompilatorow clang w NDK_BIN!"; exit 1; }

          # Zachowaj aapt2 przed czyszczeniem /usr/local/lib/android
          cp "$BUILD_TOOLS/aapt2" "$WORK/bin/aapt2"
          chmod +x "$WORK/bin/aapt2"
          if [ -d "$BUILD_TOOLS/lib64" ]; then
            cp -a "$BUILD_TOOLS/lib64" "$WORK/bin/"
          fi

          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-pc-windows-gnu

          echo "=== cargo test (host unit tests: r9c-memd + rust-app + mystical-emulator) ==="
          cargo test --manifest-path "$REPO_DIR/rust/r9c-memd/Cargo.toml"
          cargo test --manifest-path "$REPO_DIR/rust/rust-app/Cargo.toml"
          cargo test --manifest-path "$REPO_DIR/rust/mystical-emulator/Cargo.toml" 2>&1 | tee -a "$WORK/rust-build.log"

          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC64"
          export CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER="$CC32"
          export CC_aarch64_linux_android="$CC64"
          export AR_aarch64_linux_android="$NDK_BIN/llvm-ar"
          export CC_armv7_linux_androideabi="$CC32"
          export AR_armv7_linux_androideabi="$NDK_BIN/llvm-ar"

          echo "=== Budowanie r9c-memd (aarch64-linux-android) ==="
          cargo build --release --target aarch64-linux-android \
            --target-dir "$WORK/cargo-target-memd" \
            --manifest-path "$REPO_DIR/rust/r9c-memd/Cargo.toml"
          cp "$WORK/cargo-target-memd/aarch64-linux-android/release/r9c-memd" "$WORK/rust-out/r9c-memd"
          chmod 755 "$WORK/rust-out/r9c-memd"
          file "$WORK/rust-out/r9c-memd"

          echo "=== Budowanie pure-Rust NativeActivity APK (arm64-v8a + armeabi-v7a) ==="
          cargo build --release --target aarch64-linux-android \
            --target-dir "$WORK/cargo-target-app" \
            --manifest-path "$REPO_DIR/rust/rust-app/Cargo.toml"
          cargo build --release --target armv7-linux-androideabi \
            --target-dir "$WORK/cargo-target-app" \
            --manifest-path "$REPO_DIR/rust/rust-app/Cargo.toml"
          cp "$WORK/cargo-target-app/aarch64-linux-android/release/libredmi9c_rust.so" "$WORK/rust-apk/lib/arm64-v8a/libredmi9c_rust.so"
          cp "$WORK/cargo-target-app/armv7-linux-androideabi/release/libredmi9c_rust.so" "$WORK/rust-apk/lib/armeabi-v7a/libredmi9c_rust.so"
          file "$WORK/rust-apk/lib/arm64-v8a/libredmi9c_rust.so"
          file "$WORK/rust-apk/lib/armeabi-v7a/libredmi9c_rust.so"

          "$WORK/bin/aapt2" link \
            --manifest "$REPO_DIR/rust/rust-app/AndroidManifest.xml" \
            -I "$ANDROID_JAR" \
            -o "$WORK/rust-apk/unaligned.apk"
          (cd "$WORK/rust-apk" && zip -0 -r unaligned.apk lib)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$WORK/rust-apk/unaligned.apk" "$WORK/rust-apk/aligned.apk"
          keytool -genkeypair -v -keystore "$WORK/rust-apk/r9c.jks" -storepass android -keypass android \
            -alias r9c -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=MysticalOS,O=Redmi9C"
          "$BUILD_TOOLS/apksigner" sign --ks "$WORK/rust-apk/r9c.jks" --ks-pass pass:android \
            --out "$WORK/rust-out/Redmi9CRustApp.apk" "$WORK/rust-apk/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$WORK/rust-out/Redmi9CRustApp.apk"
          unzip -l "$WORK/rust-out/Redmi9CRustApp.apk"
          unzip -l "$WORK/rust-out/Redmi9CRustApp.apk" | grep -q "lib/arm64-v8a/libredmi9c_rust.so"
          unzip -l "$WORK/rust-out/Redmi9CRustApp.apk" | grep -q "lib/armeabi-v7a/libredmi9c_rust.so"
          "$WORK/bin/aapt2" dump badging "$WORK/rust-out/Redmi9CRustApp.apk" | head -n 12

          echo "=== Budowanie MysticalLauncher.apk (ColorOS 17 zmiana rozmiaru ikon + kafelki 1x1/2x1/1x2/2x2) ==="
          mkdir -p "$WORK/launcher-gen" "$WORK/launcher-classes" "$WORK/launcher-dex"
          "$WORK/bin/aapt2" compile --dir "$REPO_DIR/apps/mystical-launcher/res" -o "$WORK/launcher-res.zip"
          "$WORK/bin/aapt2" link \
            --manifest "$REPO_DIR/apps/mystical-launcher/AndroidManifest.xml" \
            -I "$ANDROID_JAR" \
            --java "$WORK/launcher-gen" \
            -o "$WORK/launcher-unaligned.apk" \
            "$WORK/launcher-res.zip"
          javac -source 11 -target 11 -cp "$ANDROID_JAR" -d "$WORK/launcher-classes" \
            $(find "$REPO_DIR/apps/mystical-launcher/src" "$WORK/launcher-gen" -name '*.java' | sort)
          if [ -x "$BUILD_TOOLS/d8" ]; then
            "$BUILD_TOOLS/d8" --min-api 28 --lib "$ANDROID_JAR" --output "$WORK/launcher-dex" \
              $(find "$WORK/launcher-classes" -name '*.class')
          else
            java -cp "$BUILD_TOOLS/lib/d8.jar" com.android.tools.r8.D8 --min-api 28 --lib "$ANDROID_JAR" \
              --output "$WORK/launcher-dex" $(find "$WORK/launcher-classes" -name '*.class')
          fi
          (cd "$WORK/launcher-dex" && zip -u "$WORK/launcher-unaligned.apk" classes*.dex)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$WORK/launcher-unaligned.apk" "$WORK/launcher-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$WORK/rust-apk/r9c.jks" --ks-pass pass:android \
            --out "$WORK/rust-out/MysticalLauncher.apk" "$WORK/launcher-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$WORK/rust-out/MysticalLauncher.apk"
          "$WORK/bin/aapt2" dump badging "$WORK/rust-out/MysticalLauncher.apk" | head -n 16
          ls -lh "$WORK/rust-out/MysticalLauncher.apk"

          echo "=== Budowanie MysticalFluxStudio.apk (ColorOS 17 Flux Icon & Widget Companion bez HOME conflict) ==="
          python3 - "$REPO_DIR/apps/mystical-launcher/AndroidManifest.xml" "$WORK/launcher-flux-manifest.xml" <<'PYEOF'
          import sys, xml.etree.ElementTree as ET
          src, dst = sys.argv[1], sys.argv[2]
          ANDROID_NS = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ANDROID_NS)
          tree = ET.parse(src)
          root = tree.getroot()
          app = root.find("application")
          for act in app.findall("activity"):
              if act.attrib.get(f"{{{ANDROID_NS}}}name", "").endswith("MysticalHomeActivity"):
                  for inf in list(act.findall("intent-filter")):
                      cats = [c.attrib.get(f"{{{ANDROID_NS}}}name", "") for c in inf.findall("category")]
                      if "android.intent.category.HOME" in cats:
                          act.remove(inf)
          tree.write(dst, encoding="utf-8", xml_declaration=True)
          PYEOF
          "$WORK/bin/aapt2" link \
            --manifest "$WORK/launcher-flux-manifest.xml" \
            -I "$ANDROID_JAR" \
            -o "$WORK/flux-unaligned.apk" \
            "$WORK/launcher-res.zip"
          (cd "$WORK/launcher-dex" && zip -u "$WORK/flux-unaligned.apk" classes*.dex)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$WORK/flux-unaligned.apk" "$WORK/flux-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$WORK/rust-apk/r9c.jks" --ks-pass pass:android \
            --out "$WORK/rust-out/MysticalFluxStudio.apk" "$WORK/flux-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify "$WORK/rust-out/MysticalFluxStudio.apk"
          rm -f "$WORK/launcher-flux-manifest.xml" "$WORK/flux-unaligned.apk" "$WORK/flux-aligned.apk"
          ls -lh "$WORK/rust-out/MysticalFluxStudio.apk"

          echo "=== Dekompresja i weryfikacja oryginalnego HyperOS 4 System_launcher ==="
          H4_XZ="$REPO_DIR/apps/hyperos4-launcher/System_launcher_RELEASE-8.01.02.9248-261013-11112305-R.apk.xz"
          xz -d -k -c "$H4_XZ" > "$WORK/hyperos4-launcher.apk"
          EXPECTED_H4_SHA=$(awk '/\.apk$/ {print $1}' "$REPO_DIR/apps/hyperos4-launcher/SHA256SUMS")
          echo "${EXPECTED_H4_SHA}  $WORK/hyperos4-launcher.apk" | sha256sum -c -
          "$WORK/bin/aapt2" dump badging "$WORK/hyperos4-launcher.apk" | head -n 12

          echo "=== Test tools/apk2rust.py, patch_hyperos4_island.py & mysticalos_brand.py ==="
          python3 "$REPO_DIR/tools/mysticalos_brand.py" --selftest
          python3 "$REPO_DIR/tools/patch_hyperos4_island.py" --selftest
          python3 "$REPO_DIR/tools/apk2rust.py" --selftest
          python3 "$REPO_DIR/tools/apk2rust.py" --apk "$WORK/rust-out/Redmi9CRustApp.apk" --out "$WORK/apk2rust-smoke"
          cargo check --manifest-path "$WORK/apk2rust-smoke/Cargo.toml" --target-dir "$WORK/cargo-target-smoke"
          python3 "$REPO_DIR/tools/apk2rust.py" --apk "$WORK/rust-out/MysticalLauncher.apk" --out "$WORK/apk2rust-launcher" | tee -a "$WORK/rust-build.log"
          cargo check --manifest-path "$WORK/apk2rust-launcher/Cargo.toml" --target-dir "$WORK/cargo-target-smoke" || echo "apk2rust-launcher info only"

          rm -rf "$WORK/cargo-target-memd" "$WORK/cargo-target-app" "$WORK/cargo-target-smoke" \
            "$WORK/rust-apk" "$WORK/apk2rust-smoke" "$WORK/apk2rust-launcher" "$WORK/launcher-gen" "$WORK/launcher-classes" \
            "$WORK/launcher-dex" "$WORK/launcher-res.zip" "$WORK/launcher-unaligned.apk" "$WORK/launcher-aligned.apk" \
            "$REPO_DIR/rust/r9c-memd/target" "$REPO_DIR/rust/rust-app/target" "$REPO_DIR/rust/mystical-emulator/target"
          sleep 1

      - name: "0. Dysk + narzedzia + paczki microG/FOSS"
        run: |
          set -euo pipefail
          echo "=== Czyszczenie dysku runnera ==="
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache 2>/dev/null || true
          df -h /

          echo "=== Instalacja pakietow ==="
          sudo apt-get update -q
          sudo apt-get install -y -q p7zip-full aria2 brotli e2fsprogs erofs-utils secilc cpio lz4 mingw-w64 android-sdk-libsparse-utils || \
            sudo apt-get install -y p7zip-full aria2 brotli e2fsprogs erofs-utils secilc cpio lz4 mingw-w64
          pip install --quiet cryptography 2>/dev/null || pip install --quiet --break-system-packages cryptography

          mkdir -p "$WORK/bin" "$WORK/base-img" "$WORK/base-tree" "$WORK/donor-img" "$WORK/donor-tree" "$WORK/out-tree" "$WORK/out-img" "$WORK/package" "$WORK/release"

          echo "=== Pobieranie payload-dumper-go + liblp/magiskboot ==="
          curl -fsSL --retry 3 -o "$WORK/pdg.tgz" \
            "https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz"
          tar -xzf "$WORK/pdg.tgz" -C "$WORK/bin"
          rm -f "$WORK/pdg.tgz"

          PIN_REF="5f3c609fef8692d3214d9df66ccbee2de5f5a444"
          for B in lpmake lpunpack mkfs.erofs fsck.erofs; do
            curl -fsSL --retry 3 -o "$WORK/bin/$B" \
              "https://github.com/${GH_REPO}/raw/${PIN_REF}/kit-mysticalos3/bin/$B"
            chmod +x "$WORK/bin/$B"
          done
          curl -fsSL --retry 3 -o "$WORK/bin/magiskboot" \
            "https://github.com/Z-Fovik-RT/HyperOS4.0-Port-Windows-Python/raw/main/bin/linux/x86_64/magiskboot" || true
          [ -f "$WORK/bin/magiskboot" ] && chmod +x "$WORK/bin/magiskboot"

          export PATH="$WORK/bin:$PATH"
          for T in 7z aria2c brotli mke2fs e2fsck resize2fs secilc lpmake lpunpack payload-dumper-go mkfs.erofs fsck.erofs aapt2 x86_64-w64-mingw32-gcc; do
            command -v "$T" >/dev/null || { echo "::error::Brak narzedzia: $T"; exit 1; }
          done
          aapt2 version
          python3 "$REPO_DIR/tools/avbtool.py" version

          echo "=== Pobieranie apktool + microG + pelnego pakietu FOSS (zastepnikow apek Xiaomi) ==="
          mkdir -p "$WORK/extra-apps"
          curl -fsSL --retry 3 -o "$WORK/bin/apktool.jar" \
            "https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/HeliBoard.apk" \
            "https://github.com/Helium314/HeliBoard/releases/download/v4.2/HeliBoard_4.2-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/Droid-ify.apk" \
            "https://github.com/Droid-ify/client/releases/download/v0.7.8/app-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyGallery.apk" \
            "https://github.com/FossifyOrg/Gallery/releases/download/1.14.3/gallery-50-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyFileManager.apk" \
            "https://github.com/FossifyOrg/File-Manager/releases/download/1.6.5/file-manager-17-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyMessages.apk" \
            "https://github.com/FossifyOrg/Messages/releases/download/1.10.3/messages-27-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyPhone.apk" \
            "https://github.com/FossifyOrg/Phone/releases/download/1.11.1/phone-22-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyContacts.apk" \
            "https://github.com/FossifyOrg/Contacts/releases/download/1.6.0/contacts-13-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyClock.apk" \
            "https://github.com/FossifyOrg/Clock/releases/download/1.6.0/clock-10-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyCalculator.apk" \
            "https://github.com/FossifyOrg/Calculator/releases/download/1.4.0/calculator-10-foss-release.apk"
          curl -fsSL --retry 3 -o "$WORK/extra-apps/FossifyCamera.apk" \
            "https://github.com/FossifyOrg/Camera/releases/download/1.5.0/camera-11-foss-release.apk"
          if [ "$GMS_MODE" = "microg" ]; then
            curl -fsSL --retry 3 -o "$WORK/extra-apps/GmsCore.apk" \
              "https://github.com/microg/GmsCore/releases/download/v0.3.18.252432/com.google.android.gms-252432036.apk"
            curl -fsSL --retry 3 -o "$WORK/extra-apps/FakeStore.apk" \
              "https://github.com/microg/GmsCore/releases/download/v0.3.18.252432/com.android.vending-84022636.apk"
            curl -fsSL --retry 3 -o "$WORK/extra-apps/GsfProxy.apk" \
              "https://github.com/microg/GsfProxy/releases/download/v0.1.0/GsfProxy.apk" || true
            curl -fsSL --retry 3 -o "$WORK/extra-apps/CromiteWebView.apk" \
              "https://github.com/uazo/cromite/releases/download/v153.0.8010.37-11507ac1061b5ea227806f5e84db5a57df6ccf6a/arm64_SystemWebView.apk" || true
          fi
          echo "=== Test apk2rust.py na prawdziwym Kotlin/DEX APK (Droid-ify) ===" | tee -a "$WORK/rust-build.log"
          python3 "$REPO_DIR/tools/apk2rust.py" --apk "$WORK/extra-apps/Droid-ify.apk" --out "$WORK/apk2rust-droidify" | tee -a "$WORK/rust-build.log"
          rm -rf "$WORK/apk2rust-droidify"
          ls -lh "$WORK/extra-apps"

          echo "=== Self-test narzedzi (sdat2img, split_5_7z, lpmake/lpunpack) ==="
          python3 -m py_compile "$REPO_DIR/tools/"*.py
          dd if=/dev/urandom of="$WORK/mini.img" bs=1M count=4 status=none
          "$WORK/bin/lpmake" --device-size=16777216 --metadata-size=65536 --metadata-slots=2 \
            --block-size=4096 --alignment=1048576 --super-name=super -S \
            --group=main:8388608 \
            --partition=system:readonly:4194304:main --image=system="$WORK/mini.img" \
            -o "$WORK/mini-super.img" >/dev/null
          python3 "$REPO_DIR/tools/simg2img.py" "$WORK/mini-super.img" "$WORK/mini-super.raw" >/dev/null
          mkdir -p "$WORK/mini-unp"
          "$WORK/bin/lpunpack" "$WORK/mini-super.raw" "$WORK/mini-unp" >/dev/null
          cmp "$WORK/mini.img" "$WORK/mini-unp/system.img"
          rm -rf "$WORK/mini.img" "$WORK/mini-super.img" "$WORK/mini-super.raw" "$WORK/mini-unp"
          echo "Self-test OK."

      - name: "1. Pobierz i rozpakuj baze OSS Android 17 dla blossom (Redmi 9C)"
        run: |
          set -euo pipefail
          export PATH="$WORK/bin:$PATH"
          echo "=== Pobieranie bazy EvolutionX 17.0 blossom ==="
          if ! aria2c -x16 -s16 -k4M --max-tries=5 --retry-wait=5 --summary-interval=30 \
              -d "$WORK" -o base.zip "$BASE_URL"; then
            echo "::warning::Glowny URL bazy padl, probuje crDroid 17.0 blossom..."
            rm -f "$WORK/base.zip" "$WORK/base.zip.aria2"
            aria2c -x16 -s16 -k4M --max-tries=5 --retry-wait=5 --summary-interval=30 \
              -d "$WORK" -o base.zip "$BASE_FALLBACK_URL"
          fi

          mkdir -p "$WORK/base-unzip"
          unzip -q "$WORK/base.zip" -d "$WORK/base-unzip"
          rm -f "$WORK/base.zip"
          find "$WORK/base-unzip" -maxdepth 3 | sort

          # Zbierz boot, dtbo, vbmeta*
          for IMG in boot.img dtbo.img vbmeta.img vbmeta_system.img vbmeta_vendor.img; do
            FOUND=$(find "$WORK/base-unzip" -type f -name "$IMG" | head -1 || true)
            if [ -n "$FOUND" ]; then
              cp "$FOUND" "$WORK/out-img/$IMG"
              echo "base $IMG -> out-img ($FOUND)"
            fi
          done
          [ -s "$WORK/out-img/boot.img" ] || { echo "::error::Brak boot.img w bazie blossom!"; exit 1; }

          # Patch lub utworz vbmeta z Flags=3 (AVB disabled)
          python3 - "$WORK/out-img" "$REPO_DIR/tools/avbtool.py" <<'PYEOF'
          import os, struct, subprocess, sys
          out_dir, avbtool = sys.argv[1], sys.argv[2]
          for name in ("vbmeta.img", "vbmeta_system.img", "vbmeta_vendor.img"):
              p = os.path.join(out_dir, name)
              if os.path.isfile(p):
                  data = bytearray(open(p, "rb").read())
                  if data[:4] == b"AVB0":
                      data[120:124] = struct.pack(">I", 3)
                      open(p, "wb").write(bytes(data))
                      print(f"{name}: patched AVB0 flags -> 3")
                      continue
              subprocess.run(
                  [sys.executable, avbtool, "make_vbmeta_image", "--flags", "3", "--padding_size", "4096", "--output", p],
                  check=True,
              )
              print(f"{name}: created empty AVB0 flags=3")
          PYEOF

          # Rozpakuj obrazy dynamicznych partycji z bazy
          PB_BASE=$(find "$WORK/base-unzip" -type f -name "payload.bin" | head -1 || true)
          if [ -n "$PB_BASE" ]; then
            echo "=== Baza ma payload.bin ($PB_BASE) ==="
            payload-dumper-go -p system,system_ext,product,vendor,odm -o "$WORK/base-img" "$PB_BASE" || \
              payload-dumper-go -o "$WORK/base-img" "$PB_BASE"
          else
            for P in system system_ext product vendor odm; do
              BR_FILE=$(find "$WORK/base-unzip" -type f -name "${P}.new.dat.br" | head -1 || true)
              TL_FILE=$(find "$WORK/base-unzip" -type f -name "${P}.transfer.list" | head -1 || true)
              DAT_FILE=$(find "$WORK/base-unzip" -type f -name "${P}.new.dat" | head -1 || true)
              RAW_IMG=$(find "$WORK/base-unzip" -type f -name "${P}.img" | head -1 || true)
              if [ -n "$BR_FILE" ] && [ -n "$TL_FILE" ]; then
                echo "=== Dekompresja ${P}.new.dat.br ==="
                brotli -d "$BR_FILE" -o "$WORK/base-unzip/${P}.new.dat"
                rm -f "$BR_FILE"
                python3 "$REPO_DIR/tools/sdat2img.py" \
                  "$TL_FILE" \
                  "$WORK/base-unzip/${P}.new.dat" \
                  "$WORK/base-img/${P}.img"
                rm -f "$WORK/base-unzip/${P}.new.dat"
              elif [ -n "$DAT_FILE" ] && [ -n "$TL_FILE" ]; then
                python3 "$REPO_DIR/tools/sdat2img.py" \
                  "$TL_FILE" \
                  "$DAT_FILE" \
                  "$WORK/base-img/${P}.img"
              elif [ -n "$RAW_IMG" ]; then
                mv "$RAW_IMG" "$WORK/base-img/${P}.img"
              fi
            done
          fi
          rm -rf "$WORK/base-unzip"

          # Jesli ktorys obraz jest sparse -> desparse; potem mount -> tar z SELinux xattr
          for P in system system_ext product vendor odm; do
            IMG="$WORK/base-img/${P}.img"
            [ -s "$IMG" ] || { echo "::error::Brak partycji bazowej: ${P}.img"; exit 1; }
            IS_SPARSE=$(python3 -c "import struct,sys; print(1 if struct.unpack('<I', open(sys.argv[1],'rb').read(4))[0]==0xED26FF3A else 0)" "$IMG")
            if [ "$IS_SPARSE" = "1" ]; then
              python3 "$REPO_DIR/tools/simg2img.py" "$IMG" "$IMG.raw"
              mv "$IMG.raw" "$IMG"
            fi
            M="$WORK/mnt-base-$P"; sudo mkdir -p "$M" "$WORK/base-tree/$P"
            sudo mount -o ro,loop "$IMG" "$M" || sudo mount -t erofs -o ro,loop "$IMG" "$M" || sudo mount -t ext4 -o ro,loop "$IMG" "$M"
            sudo tar -C "$M" --acls --xattrs --selinux -cf - . | sudo tar -C "$WORK/base-tree/$P" --acls --xattrs --selinux -xf -
            sudo umount "$M"; sudo rmdir "$M"
            rm -f "$IMG"
            echo "base-tree/$P gotowe."
          done
          df -h /

      - name: "2. Pobierz i rozpakuj HyperOS 4 Global (dew OS4.0.8.0.XBNMIXM, Android 17)"
        run: |
          set -euo pipefail
          export PATH="$WORK/bin:$PATH"
          sudo cp /etc/resolv.conf "$WORK/resolv.conf.orig" 2>/dev/null || true
          sudo rm -f /etc/resolv.conf
          printf 'nameserver 8.8.8.8\nnameserver 1.1.1.1\nnameserver 168.63.129.16\noptions timeout:2 attempts:3\n' | sudo tee /etc/resolv.conf >/dev/null
          trap 'if [ -s "$WORK/resolv.conf.orig" ]; then sudo cp "$WORK/resolv.conf.orig" /etc/resolv.conf 2>/dev/null || true; fi' EXIT

          URLS=""
          for H in bn.d.miui.com cdnorg.d.miui.com bigota.d.miui.com hugeota.d.miui.com hugebackup.d.miui.com; do
            U="https://$H/$DONOR_PATH"
            CODE=$(curl -sI -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 25 "$U" || echo "000")
            echo "mirror $H -> HTTP $CODE"
            if [ "$CODE" = "200" ] || [ "$CODE" = "206" ] || [ "$CODE" = "302" ]; then
              URLS="$URLS $U"
            fi
          done
          [ -n "$URLS" ] || URLS="https://bigota.d.miui.com/$DONOR_PATH https://cdnorg.d.miui.com/$DONOR_PATH"

          DL_OK=0
          if aria2c -x16 -s16 -k4M --lowest-speed-limit=5K --connect-timeout=15 \
              --max-tries=8 --retry-wait=5 --summary-interval=60 \
              -d "$WORK" -o donor.zip $URLS; then
            GOT_MD5=$(md5sum "$WORK/donor.zip" | awk '{print $1}')
            echo "donor.zip size=$(stat -c%s "$WORK/donor.zip") md5=$GOT_MD5 (expected=$DONOR_MD5)"
            if [ "$GOT_MD5" = "$DONOR_MD5" ]; then
              DL_OK=1
            else
              echo "::warning::MD5 niezgodny ($GOT_MD5 != $DONOR_MD5), przechodze na payload_extract range..."
              rm -f "$WORK/donor.zip"
            fi
          fi

          if [ "$DL_OK" = "1" ]; then
            unzip -o -q "$WORK/donor.zip" payload.bin -d "$WORK"
            rm -f "$WORK/donor.zip"
            payload-dumper-go -p system,system_ext,product,mi_ext -o "$WORK/donor-img" "$WORK/payload.bin" || \
              payload-dumper-go -p system,system_ext,product -o "$WORK/donor-img" "$WORK/payload.bin"
            rm -f "$WORK/payload.bin"
          else
            FIRST_URL=$(echo "$URLS" | awk '{print $1}')
            for P in system system_ext product mi_ext; do
              python3 "$REPO_DIR/tools/payload_extract.py" \
                --zip-url "$FIRST_URL" --entry payload.bin \
                --partition "$P" --out "$WORK/donor-img/${P}.img" \
                --jobs 12 --chunk 16777216 --prefetch-ops 3 || {
                  [ "$P" = "mi_ext" ] && echo "mi_ext opcjonalny pominiety" || exit 1
                }
            done
          fi

          for P in system system_ext product mi_ext; do
            IMG="$WORK/donor-img/${P}.img"
            [ -s "$IMG" ] || {
              if [ "$P" = "mi_ext" ]; then
                echo "donor: brak mi_ext.img (pomijam)"
                continue
              fi
              echo "::error::Brak donor-img/${P}.img"; exit 1
            }
            M="$WORK/mnt-donor-$P"; sudo mkdir -p "$M" "$WORK/donor-tree/$P"
            sudo mount -o ro,loop "$IMG" "$M" || sudo mount -t erofs -o ro,loop "$IMG" "$M" || sudo mount -t ext4 -o ro,loop "$IMG" "$M"
            sudo tar -C "$M" --acls --xattrs --selinux -cf - . | sudo tar -C "$WORK/donor-tree/$P" --acls --xattrs --selinux -xf -
            sudo umount "$M"; sudo rmdir "$M"
            rm -f "$IMG"
            echo "donor-tree/$P gotowe."
          done
          df -h /

      - name: "3. Portowanie MysticalOS + HyperOS 4 Launcher + Dynamic Island + ColorOS 17 + secilc"
        run: |
          set -euo pipefail
          sudo python3 "$REPO_DIR/tools/port_redmi9c_hyperos4.py" \
            --base-tree "$WORK/base-tree" \
            --donor-tree "$WORK/donor-tree" \
            --out-tree "$WORK/out-tree" \
            --variant "$VARIANT" \
            --debloat-level "$DEBLOAT_LEVEL" \
            --gms-mode "$GMS_MODE" \
            --os-name "MysticalOS" \
            --extra-apps-dir "$WORK/extra-apps" \
            --hyperos4-launcher-apk "$WORK/hyperos4-launcher.apk" \
            --mystical-launcher-apk "$WORK/rust-out/MysticalLauncher.apk" \
            --flux-studio-apk "$WORK/rust-out/MysticalFluxStudio.apk" \
            --r9c-memd-bin "$WORK/rust-out/r9c-memd" \
            --r9c-memd-rc "$REPO_DIR/rust/r9c-memd/r9c-memd.rc" \
            --rust-app-apk "$WORK/rust-out/Redmi9CRustApp.apk" \
            --apktool-jar "$WORK/bin/apktool.jar" \
            --aapt2-bin "$WORK/bin/aapt2" \
            --target-os-mib 5550 \
            --manifest-out "$WORK/mysticalos-manifest.json" \
            --report "$WORK/port-report.txt"
          sudo chown "$(id -u):$(id -g)" "$WORK/port-report.txt" "$WORK/mysticalos-manifest.json"

          sudo rm -rf "$WORK/base-tree" "$WORK/donor-tree" "$WORK/extra-apps" "$WORK/hyperos4-launcher.apk"

          # Naprawa brakujacych kontekstow SELinux dla dogranych plikow
          SYS_FC="$WORK/out-tree/system/system/etc/selinux/plat_file_contexts"
          [ -f "$SYS_FC" ] || SYS_FC="$WORK/out-tree/system/etc/selinux/plat_file_contexts"
          if [ -f "$SYS_FC" ]; then
            sudo python3 "$REPO_DIR/tools/fc_fixup.py" --contexts "$SYS_FC" --root "$WORK/out-tree/system" \
              --only system/etc/properties system/etc/vintf system/build.prop system/framework system/media || true
          fi
          SEXT_FC="$WORK/out-tree/system_ext/etc/selinux/system_ext_file_contexts"
          if [ -f "$SEXT_FC" ]; then
            sudo python3 "$REPO_DIR/tools/fc_fixup.py" --contexts "$SEXT_FC" --root "$WORK/out-tree" \
              --only system_ext/etc/vintf system_ext/etc/properties system_ext/apex system_ext/etc/build.prop system_ext/etc/permissions system_ext/framework system_ext/priv-app system_ext/bin system_ext/etc/init system_ext/etc/selinux || true
          fi
          PROD_FC="$WORK/out-tree/product/etc/selinux/product_file_contexts"
          if [ -f "$PROD_FC" ]; then
            sudo python3 "$REPO_DIR/tools/fc_fixup.py" --contexts "$PROD_FC" --root "$WORK/out-tree" \
              --only product/etc/device_features product/overlay product/etc/properties product/etc/build.prop product/app product/priv-app product/etc/permissions product/etc/sysconfig product/etc/default-permissions product/media || true
          fi

          # Weryfikacja kompilacji polityki SELinux (.cil) za pomoca secilc
          echo "=== Test secilc polaczonych polityk HyperOS 4 + blossom vendor ==="
          SECILC_OK=0
          {
            echo "=== SELINUX SECILC CHECK ==="
            CILS_PLAT=()
            CILS=()
            SYS_SE="$WORK/out-tree/system/system/etc/selinux"
            [ -d "$SYS_SE" ] || SYS_SE="$WORK/out-tree/system/etc/selinux"
            [ -f "$SYS_SE/plat_sepolicy.cil" ] && CILS_PLAT+=("$SYS_SE/plat_sepolicy.cil")
            if [ -f "$WORK/out-tree/vendor/etc/selinux/plat_sepolicy_vers.txt" ]; then
              PV=$(cat "$WORK/out-tree/vendor/etc/selinux/plat_sepolicy_vers.txt" | tr -d '[:space:]')
              echo "vendor plat_sepolicy_vers=$PV"
              for MDIR in "$SYS_SE/mapping" "$WORK/out-tree/system_ext/etc/selinux/mapping"; do
                [ -f "$MDIR/${PV}.cil" ] && CILS_PLAT+=("$MDIR/${PV}.cil")
                [ -f "$MDIR/${PV}.compat.cil" ] && CILS_PLAT+=("$MDIR/${PV}.compat.cil")
              done
            fi
            for F in \
              "$WORK/out-tree/system_ext/etc/selinux/system_ext_sepolicy.cil" \
              "$WORK/out-tree/product/etc/selinux/product_sepolicy.cil"; do
              [ -f "$F" ] && CILS_PLAT+=("$F")
            done
            CILS=("${CILS_PLAT[@]}")
            for F in \
              "$WORK/out-tree/vendor/etc/selinux/plat_pub_versioned.cil" \
              "$WORK/out-tree/vendor/etc/selinux/vendor_sepolicy.cil" \
              "$WORK/out-tree/odm/etc/selinux/odm_sepolicy.cil"; do
              [ -f "$F" ] && CILS+=("$F")
            done
            echo "CIL inputs: ${CILS[*]}"
            if secilc -m -M true -G -N -c 30 -o "$WORK/test_sepolicy" -f /dev/null "${CILS[@]}" 2>"$WORK/secilc.err"; then
              echo "secilc: PASS (polityka SELinux kompiluje sie bez bledow)"
              SECILC_OK=1
            elif grep -q "Invalid policycap (" "$WORK/secilc.err"; then
              echo "secilc 3.5 nie zna nowszego policycap z A17; weryfikuje pelna baze CIL bez nieznanego policycap..."
              mkdir -p "$WORK/cil-test"
              TEST_CILS=()
              for cf in "${CILS[@]}"; do
                if [ "$cf" = "$SYS_SE/plat_sepolicy.cil" ]; then
                  python3 -c 'import re,sys;from pathlib import Path;src,dst,errf=map(Path,sys.argv[1:4]);bad=set(re.findall(r"Invalid policycap \(([^)]+)\)",errf.read_text()))|{"functionfs_seclabel","netlink_xperm","userfaultfd_anon_inode"};dst.write_text("\n".join(ln for ln in src.read_text(encoding="utf-8",errors="replace").splitlines() if not any(f"(policycap {b})" in ln for b in bad))+"\n",encoding="utf-8");print("secilc test filtered:",sorted(bad))' "$cf" "$WORK/cil-test/plat_sepolicy.cil" "$WORK/secilc.err"
                  TEST_CILS+=("$WORK/cil-test/plat_sepolicy.cil")
                else
                  TEST_CILS+=("$cf")
                fi
              done
              if secilc -m -M true -G -N -c 30 -o "$WORK/test_sepolicy" -f /dev/null "${TEST_CILS[@]}" 2>"$WORK/secilc.err2"; then
                echo "secilc: PASS (cala baza CIL zweryfikowana poprawnie z filtrem policycap libsepol 3.5)"
                SECILC_OK=1
              else
                echo "secilc: ERROR (po filtrze policycap):"
                cat "$WORK/secilc.err2" | head -n 60
                mv "$WORK/secilc.err2" "$WORK/secilc.err"
              fi
              rm -rf "$WORK/cil-test" "$WORK/secilc.err2"
            else
              echo "secilc: ERROR:"
              {
                echo "--- FULL secilc stderr ---"
                cat "$WORK/secilc.err"
                echo "--- donor-only secilc test ---"
                secilc -m -M true -G -N -c 30 -o "$WORK/test_sepolicy_plat" -f /dev/null "${CILS_PLAT[@]}" 2>&1 || true
              } > "$WORK/secilc.diag"
              mv "$WORK/secilc.diag" "$WORK/secilc.err"
              cat "$WORK/secilc.err" | head -n 60
            fi
            rm -f "$WORK/test_sepolicy" "$WORK/test_sepolicy_plat"
          } > "$WORK/secilc_check.log"
          cat "$WORK/secilc_check.log" | tee -a "$WORK/port-report.txt"
          rm -f "$WORK/secilc_check.log"
          echo "SECILC_OK=$SECILC_OK" >> "$GITHUB_ENV"
          echo "Exported SECILC_OK=$SECILC_OK"
          df -h /

      - name: "4. Pakowanie partycji + fstab + budowa super.img (4.5 GiB)"
        run: |
          set -euo pipefail
          export PATH="$WORK/bin:$PATH"

          build_ext4_part() {
            local TREE="$1" OUT="$2" NAME="$3"
            local USED_B CAP_B USE
            USED_B=$(sudo du -sb "$TREE" | awk '{print $1}')
            CAP_B=$(( ((USED_B * 107 / 100) + 20971520 + 4095) / 4096 * 4096 ))
            [ "$CAP_B" -lt 8388608 ] && CAP_B=8388608
            sudo mkdir -p "$WORK/mntbuild"
            for TRY in 1 2 3 4 5; do
              rm -f "$OUT"
              mke2fs -q -F -t ext4 -b 4096 -I 256 -m 0 -O ^has_journal "$OUT" $((CAP_B / 4096))
              sudo mount -o loop,rw "$OUT" "$WORK/mntbuild"
              if sudo tar -C "$TREE" --acls --xattrs --selinux -cf - . \
                 | sudo tar -C "$WORK/mntbuild" --acls --xattrs --selinux -xf -; then
                USE=$(df --output=pcent "$WORK/mntbuild" | tail -1 | tr -dc '0-9')
                sudo umount "$WORK/mntbuild"
                if [ "${USE:-100}" -lt 98 ]; then
                  e2fsck -f -y -D "$OUT" >/dev/null 2>&1 || true
                  resize2fs -M "$OUT" >/dev/null 2>&1 || true
                  e2fsck -f -y "$OUT" >/dev/null 2>&1 || true
                  local FINAL_SZ=$(stat -c%s "$OUT")
                  FINAL_SZ=$(( (FINAL_SZ + 4095) / 4096 * 4096 ))
                  truncate -s "$FINAL_SZ" "$OUT"
                  echo "$NAME (ext4): $FINAL_SZ B ($((FINAL_SZ / 1024 / 1024)) MiB)"
                  return 0
                fi
              else
                sudo umount "$WORK/mntbuild" 2>/dev/null || true
              fi
              CAP_B=$((CAP_B + 33554432))
            done
            echo "::error::$NAME: nie udalo sie zbudowac ext4"
            return 1
          }

          build_erofs_part() {
            local TREE="$1" OUT="$2" NAME="$3"
            rm -f "$OUT"
            sudo "$WORK/bin/mkfs.erofs" -zlz4hc,9 -T 1700000000 "$OUT" "$TREE" >/dev/null
            sudo chown "$(id -u):$(id -g)" "$OUT"
            local FINAL_SZ=$(stat -c%s "$OUT")
            FINAL_SZ=$(( (FINAL_SZ + 4095) / 4096 * 4096 ))
            truncate -s "$FINAL_SZ" "$OUT"
            echo "$NAME (erofs): $FINAL_SZ B ($((FINAL_SZ / 1024 / 1024)) MiB)"
          }

          # Najpierw okresl tryb dla system/system_ext/product (auto -> erofs jesli przekracza 4.5 GiB ext4)
          USE_FS="$FS_MODE"
          if [ "$USE_FS" = "auto" ]; then
            TOTAL_UNCOMP=$(sudo du -sb "$WORK/out-tree" | awk '{print $1}')
            echo "Calkowity rozmiar nieskompresowanych drzew: $TOTAL_UNCOMP B (limit MAIN_SIZE: $MAIN_SIZE B)"
            # 12% zapasu na metadane ext4 + inode'y
            EST_EXT4=$((TOTAL_UNCOMP * 114 / 100))
            if [ "$EST_EXT4" -le "$MAIN_SIZE" ]; then
              USE_FS="ext4"
            else
              USE_FS="erofs"
            fi
          fi
          echo "Wybrany tryb FS dla system/system_ext/product: $USE_FS" | tee -a "$WORK/port-report.txt"

          # Jesli OS uzywa erofs, upewnij sie ze vendor/etc/fstab* oraz boot.img ramdisk fstab* zezwalaja na erofs
          if [ "$USE_FS" = "erofs" ]; then
            for FST in $(sudo find "$WORK/out-tree/vendor/etc" -maxdepth 2 -name "fstab*" 2>/dev/null); do
              sudo python3 - "$FST" <<'PYEOF'
          import os, re, sys
          p = sys.argv[1]
          try:
              ctx = os.getxattr(p, "security.selinux", follow_symlinks=False)
          except OSError:
              ctx = None
          txt = open(p, "r", encoding="utf-8", errors="replace").read()
          out = []
          for line in txt.splitlines():
              if re.match(r"^(system|system_ext|product)\s+/", line):
                  line = re.sub(r"\bext4\b", "erofs", line, count=1)
              out.append(line)
          open(p, "w", encoding="utf-8").write("\n".join(out) + "\n")
          if ctx:
              try:
                  os.setxattr(p, "security.selinux", ctx, follow_symlinks=False)
              except OSError:
                  pass
          print("Updated fstab to erofs:", p)
          PYEOF
            done

            if [ -x "$WORK/bin/magiskboot" ]; then
              mkdir -p "$WORK/bootwork"
              cp "$WORK/out-img/boot.img" "$WORK/bootwork/boot.img"
              (
                cd "$WORK/bootwork"
                "$WORK/bin/magiskboot" unpack boot.img
                if [ -f ramdisk.cpio ]; then
                  mkdir -p rd
                  (cd rd && cpio -idmu < ../ramdisk.cpio 2>/dev/null || true)
                  CHANGED=0
                  for FST in $(find rd -name "fstab*"); do
                    python3 - "$FST" <<'PYEOF'
          import re, sys
          p = sys.argv[1]
          txt = open(p, "r", encoding="utf-8", errors="replace").read()
          new = "\n".join(
              re.sub(r"\bext4\b", "erofs", ln, count=1) if re.match(r"^(system|system_ext|product)\s+/", ln) else ln
              for ln in txt.splitlines()
          ) + "\n"
          if new != txt:
              open(p, "w", encoding="utf-8").write(new)
              print("Patched boot ramdisk fstab:", p)
          PYEOF
                    CHANGED=1
                  done
                  if [ "$CHANGED" = "1" ]; then
                    (cd rd && find . | cpio -H newc -o --quiet > ../ramdisk.cpio)
                    "$WORK/bin/magiskboot" repack boot.img new-boot.img
                    mv new-boot.img "$WORK/out-img/boot.img"
                    echo "boot.img ramdisk fstab zaktualizowany na erofs!"
                  fi
                fi
              )
              rm -rf "$WORK/bootwork"
            fi
          fi

          # Zbuduj obrazy partycji
          build_ext4_part "$WORK/out-tree/vendor" "$WORK/out-img/vendor.img" "vendor"
          build_ext4_part "$WORK/out-tree/odm" "$WORK/out-img/odm.img" "odm"
          for P in system system_ext product; do
            if [ "$USE_FS" = "erofs" ]; then
              build_erofs_part "$WORK/out-tree/$P" "$WORK/out-img/${P}.img" "$P"
            else
              build_ext4_part "$WORK/out-tree/$P" "$WORK/out-img/${P}.img" "$P"
            fi
          done
          sudo rm -rf "$WORK/out-tree"

          # Sprawdz sume rozmiarow <= MAIN_SIZE
          ARGS=()
          SUM_SZ=0
          for P in system system_ext product vendor odm; do
            SZ=$(stat -c%s "$WORK/out-img/${P}.img")
            SUM_SZ=$((SUM_SZ + SZ))
            echo "  img ${P}: $((SZ / 1048576)) MiB (${SZ} B)" | tee -a "$WORK/port-report.txt"
            ARGS+=(--partition="${P}:readonly:${SZ}:main" --image="${P}=$WORK/out-img/${P}.img")
          done
          echo "Suma partycji w super: $SUM_SZ B / $MAIN_SIZE B ($((SUM_SZ * 100 / MAIN_SIZE))%)" | tee -a "$WORK/port-report.txt"
          [ "$SUM_SZ" -le "$MAIN_SIZE" ] || {
            echo "::error::Suma partycji ($SUM_SZ B) przekracza stockowy super Redmi 9C ($MAIN_SIZE B)!"
            exit 1
          }

          "$WORK/bin/lpmake" \
            --device-size="$SUPER_SIZE" \
            --metadata-size=65536 \
            --metadata-slots=2 \
            --block-size=4096 \
            --alignment=1048576 \
            --super-name=super \
            -S \
            --group="main:${MAIN_SIZE}" \
            "${ARGS[@]}" \
            -o "$WORK/package/super.img"

          rm -f "$WORK/out-img/"{system,system_ext,product,vendor,odm}.img
          cp "$WORK/out-img/"{boot.img,dtbo.img,vbmeta.img,vbmeta_system.img,vbmeta_vendor.img} "$WORK/package/"

          echo "=== Weryfikacja roundtrip super.img + xattrs ==="
          python3 "$REPO_DIR/tools/simg2img.py" "$WORK/package/super.img" "$WORK/super.raw"
          head -c 2097152 "$WORK/super.raw" > "$WORK/super_meta.bin"
          python3 "$REPO_DIR/tools/lpinfo.py" "$WORK/super_meta.bin" | tee -a "$WORK/port-report.txt"
          rm -f "$WORK/super_meta.bin"
          mkdir -p "$WORK/super-check" "$WORK/mnt-verify"
          "$WORK/bin/lpunpack" "$WORK/super.raw" "$WORK/super-check"
          for P in system system_ext product vendor odm; do
            [ -s "$WORK/super-check/${P}.img" ] || { echo "::error::Roundtrip fail: brak $P"; exit 1; }
            sudo mount -o ro,loop "$WORK/super-check/${P}.img" "$WORK/mnt-verify" || \
              sudo mount -t erofs -o ro,loop "$WORK/super-check/${P}.img" "$WORK/mnt-verify" || \
              sudo mount -t ext4 -o ro,loop "$WORK/super-check/${P}.img" "$WORK/mnt-verify"
            sudo python3 - "$WORK/mnt-verify" "$P" <<'PYEOF'
          import os, subprocess, sys, zipfile
          mnt, p = sys.argv[1], sys.argv[2]
          ctx = os.getxattr(mnt, "security.selinux", follow_symlinks=False)
          print(f"verify {p} root xattr={ctx.decode()}")
          if p == "system_ext":
              import glob
              perm_xmls = glob.glob(os.path.join(mnt, "etc/permissions/*.xml"))
              rt_hits = [xp for xp in perm_xmls if "hyperos.rustruntime.v5" in open(xp, "r", encoding="utf-8", errors="replace").read()]
              assert rt_hits, f"Missing hyperos.rustruntime.v5 declaration in system_ext/etc/permissions/*.xml!"
              print(f"verify system_ext OK: hyperos.rustruntime.v5 declared in {[os.path.basename(x) for x in rt_hits]}")
          if p == "product":
              import glob
              miui_home = os.path.join(mnt, "priv-app/MiuiHome/MiuiHome.apk")
              assert os.path.isfile(miui_home), f"Missing {miui_home}"
              assert os.path.isfile(os.path.join(mnt, "priv-app/MiuiHome/lib/arm64/libapp.so")), "Missing MiuiHome libapp.so"
              assert os.path.isfile(os.path.join(mnt, "priv-app/MysticalFluxStudio/MysticalFluxStudio.apk")), "Missing MysticalFluxStudio.apk"
              assert os.path.isfile(os.path.join(mnt, "overlay/MysticalOSFrameworkOverlay.apk")), "Missing MysticalOSFrameworkOverlay.apk"
              assert os.path.isfile(os.path.join(mnt, "media/theme/default/runtime_largeicon.config")), "Missing runtime_largeicon.config"
              df_files = sorted(glob.glob(os.path.join(mnt, "etc/device_features/*.xml")))
              assert df_files, "Missing product/etc/device_features/*.xml"
              for df in df_files:
                  dft = open(df, "r", encoding="utf-8", errors="replace").read()
                  assert '<bool name="support_dynamic_island">true</bool>' in dft, f"Missing support_dynamic_island in {df}"
                  assert '<bool name="support_largeicon">true</bool>' in dft, f"Missing support_largeicon in {df}"
              with zipfile.ZipFile(miui_home, "r") as zf:
                  rsa = [n for n in zf.namelist() if n.startswith("META-INF/") and n.endswith((".RSA", ".DSA", ".EC"))]
                  assert rsa, "MiuiHome.apk missing META-INF signature!"
                  sig_info = subprocess.run(
                      ["openssl", "pkcs7", "-inform", "DER", "-print_certs", "-noout"],
                      input=zf.read(rsa[0]), capture_output=True, check=True,
                  ).stdout.decode("utf-8", "replace")
                  assert "MIUI" in sig_info, f"Expected CN=MIUI signature, got: {sig_info}"
              ov_list = [os.path.basename(x) for x in sorted(glob.glob(os.path.join(mnt, "overlay/*.apk")))]
              print(f"verify product OK: MiuiHome CN=MIUI + libapp.so + FluxStudio + runtime_largeicon.config + device_features({len(df_files)}) + overlays={ov_list}")
          PYEOF
            sudo umount "$WORK/mnt-verify"
          done
          rm -rf "$WORK/super.raw" "$WORK/super-check" "$WORK/mnt-verify"

      - name: "4b. Weryfikacja dekodera super.img/system.img + kompilacja MysticalOS-Emulator.exe"
        run: |
          set -euo pipefail
          export MYSTICALOS_MANIFEST="$WORK/mysticalos-manifest.json"
          echo "=== Test silnika super.img / system.img na prawdziwym super.img ===" | tee -a "$WORK/rust-build.log"
          cargo run --release --manifest-path "$REPO_DIR/rust/mystical-emulator/Cargo.toml" \
            --target-dir "$WORK/cargo-target-emu-host" \
            -- --verify-image "$WORK/package/super.img" --extract-system "$WORK/verify_system.img" \
            2>&1 | tee "$WORK/emu-verify.txt" | tee -a "$WORK/rust-build.log"
          grep -q "HyperOS 4 launcher: true" "$WORK/emu-verify.txt" || { echo "::error::Brak HyperOS 4 launcher w super.img!"; exit 1; }
          grep -q "Dynamic Island ON : true" "$WORK/emu-verify.txt" || { echo "::error::Brak Dynamic Island ON w super.img!"; exit 1; }
          grep -q "xiaomi bloat left : 0" "$WORK/emu-verify.txt" || { echo "::error::Wykryto pozostaly bloat Xiaomi w super.img!"; exit 1; }
          rm -f "$WORK/emu-verify.txt"
          ls -lh "$WORK/verify_system.img" | tee -a "$WORK/rust-build.log"
          rm -rf "$WORK/verify_system.img" "$WORK/cargo-target-emu-host"

          echo "=== Budowanie MysticalOS-Emulator.exe (x86_64-pc-windows-gnu) ===" | tee -a "$WORK/rust-build.log"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=x86_64-w64-mingw32-gcc
          export RUSTFLAGS="-C link-arg=-static -C link-arg=-static-libgcc"
          cargo build --release --target x86_64-pc-windows-gnu \
            --target-dir "$WORK/cargo-target-emu" \
            --manifest-path "$REPO_DIR/rust/mystical-emulator/Cargo.toml"
          cp "$WORK/cargo-target-emu/x86_64-pc-windows-gnu/release/mystical-emulator.exe" \
             "$WORK/release/MysticalOS-Emulator.exe"
          rm -rf "$WORK/cargo-target-emu"
          file "$WORK/release/MysticalOS-Emulator.exe" | tee -a "$WORK/rust-build.log"
          ls -lh "$WORK/release/MysticalOS-Emulator.exe" | tee -a "$WORK/rust-build.log"
          x86_64-w64-mingw32-objdump -p "$WORK/release/MysticalOS-Emulator.exe" | grep "DLL Name" | tee -a "$WORK/rust-build.log"
          if x86_64-w64-mingw32-objdump -p "$WORK/release/MysticalOS-Emulator.exe" | grep -qiE "libgcc|winpthread|libstdc"; then
            echo "::error::MysticalOS-Emulator.exe nadal zalezy od zewnetrznych DLL MinGW!"
            exit 1
          fi

      - name: "5. Pakowanie do 5 plikow 7z (.7z.001 .. .7z.005) + weryfikacja"
        run: |
          set -euo pipefail
          cp "$REPO_DIR/templates/FLASH-REDMI9C.bat" \
             "$REPO_DIR/templates/FLASH-REDMI9C.sh" \
             "$REPO_DIR/templates/INSTRUKCJA-FLASH.txt" \
             "$WORK/release/MysticalOS-Emulator.exe" \
             "$WORK/package/"
          chmod +x "$WORK/package/FLASH-REDMI9C.sh"
          cp "$WORK/port-report.txt" "$WORK/package/BUILD-REPORT.txt"
          (
            cd "$WORK/package"
            sha256sum *.img FLASH-REDMI9C.bat FLASH-REDMI9C.sh > SHA256SUMS.txt
          )
          ls -lh "$WORK/package"

          chmod +x "$REPO_DIR/tools/split_5_7z.sh"
          bash "$REPO_DIR/tools/split_5_7z.sh" \
            "$WORK/package" \
            "$WORK/release" \
            "MysticalOS-Redmi9C"

          cp "$WORK/package/BUILD-REPORT.txt" \
             "$WORK/package/SHA256SUMS.txt" \
             "$WORK/package/INSTRUKCJA-FLASH.txt" \
             "$WORK/mysticalos-manifest.json" \
             "$WORK/release/"
          [ -f "$WORK/rust-out/Redmi9CRustApp.apk" ] && cp "$WORK/rust-out/Redmi9CRustApp.apk" "$WORK/release/Redmi9CRustApp.apk"
          [ -f "$WORK/rust-out/MysticalLauncher.apk" ] && cp "$WORK/rust-out/MysticalLauncher.apk" "$WORK/release/MysticalLauncher.apk"
          [ -f "$WORK/rust-out/MysticalFluxStudio.apk" ] && cp "$WORK/rust-out/MysticalFluxStudio.apk" "$WORK/release/MysticalFluxStudio.apk"
          (
            cd "$WORK/release"
            [ -f MysticalOS-Emulator.exe ] && sha256sum MysticalOS-Emulator.exe >> SHA256SUMS.txt
            [ -f MysticalLauncher.apk ] && sha256sum MysticalLauncher.apk >> SHA256SUMS.txt
            [ -f MysticalFluxStudio.apk ] && sha256sum MysticalFluxStudio.apk >> SHA256SUMS.txt
          )
          ls -lh "$WORK/release"

      - name: "6. Publikacja GitHub Release (MysticalOS + Emulator .exe + 5x .7z)"
        if: success() && env.SECILC_OK == '1'
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          # Utworz lub zaktualizuj tag przez GitHub API (unikamy HTTP 422 --target dla SHA z galezi non-default)
          if gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            gh api -X PATCH "repos/${GH_REPO}/git/refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
          else
            gh api -X POST "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA" >/dev/null
          fi

          {
            echo "# MysticalOS 1.0 — Redmi 9C (blossom: angelica / angelican)"
            echo
            echo "> **Rebranding HyperOS 4 (Android 17) na MysticalOS 1.0**: bez bloatware'u Xiaomi, z oryginalnym **HyperOS 4 System_launcher (8.01)** z odblokowanym **Always-On Dynamic Island** oraz **ColorOS 17 Flux Icon & Tile Resizer** (zmiana rozmiaru ikon \`60%–150%\`, kafelki \`1x1\` / \`2x1\` / \`1x2\` / \`2x2\` + otwarte apki **Fossify / microG / HeliBoard / Droid-ify**) oraz natywnym emulatorem **MysticalOS-Emulator.exe** na Windows PC."
            echo
            echo "- **Baza sprzetowa (OSS A17 + kernel 4.19):** \`EvolutionX 17.0 blossom\` (\`xc112lg/blossom_releases\`)"
            echo "- **Dawca bazy systemowej (Android 17):** Redmi 15C / POCO C85 Global (\`dew\`, \`OS4.0.8.0.XBNMIXM\`)"
            echo "- **Baza Launchera:** Oryginalny HyperOS 4 \`System_launcher 8.01.02.9248\` (\`com.miui.home\`, podpis \`CN=MIUI\` zachowany, odblokowane bramki \`Dynamic Island\` + \`LargeIcon\`)"
            echo "- **Wariant:** \`${VARIANT}\` | **Debloat / GMS:** \`${DEBLOAT_LEVEL}\` / \`${GMS_MODE}\`"
            echo "- **Autorskie aplikacje / uslugi:** \`MysticalFluxStudio.apk\` (ColorOS 17 Icon & Tile Resizer), \`MysticalOSIsland*Overlay.apk\`, \`MysticalOSFrameworkOverlay.apk\`, \`bootanimation.zip\` MysticalOS, \`/system_ext/bin/r9c-memd\`, \`Redmi9CRustApp.apk\`"
            echo "- **Aplikacje FOSS w miejscu apek Xiaomi:** \`Fossify Phone\`, \`Messages\`, \`Contacts\`, \`Gallery\`, \`File Manager\`, \`Camera\`, \`Clock\`, \`Calculator\`, \`HeliBoard\`, \`Droid-ify\`, \`Cromite WebView\`, \`microG\`"
            echo "- **GitHub Actions Run:** ${GITHUB_RUN_ID}"
            echo
            echo "## 1. Emulator i analizator obrazu na komputer Windows (\`MysticalOS-Emulator.exe\`)"
            echo "- Pobierz sam plik **\`MysticalOS-Emulator.exe\`** (albo uruchom go bezposrednio po wypakowaniu archiwum 7z w tym samym folderze co \`super.img\` — wczyta go automatycznie!)."
            echo "- Zero instalacji i zero zewnetrznych bibliotek DLL (czyste Win32 API: \`kernel32\`, \`user32\`, \`gdi32\`, \`comdlg32\`, \`shell32\`)."
            echo "- **Prawdziwy silnik odczytu obrazow w czystym Rust** (bez \`7z\` ani zewnetrznych narzedzi): obsluguje **Android Sparse**, **\`super.img\` (liblp)**, **EROFS (w tym skompresowany LZ4 z \`big_pcluster\` i \`ztailpacking\`)** oraz **EXT4**."
            echo "- Mozesz wskazac lub przeciagnac na okno wlasny plik **\`super.img\`** albo **\`system.img\`**: emulator odczyta prawdziwy \`build.prop\`, wczyta z obrazu prawdziwa animacje startowa \`bootanimation.zip\`, przeskanuje rzeczywiste pliki \`.apk\` (AXML), sprawdzi status spoofingu microG w \`services.jar\`, otworzy eksplorator katalogow partycji i wyeksportuje z \`super.img\` samodzielny \`system.img\`."
            echo "- Dodatkowo zawiera interaktywny symulator UI/UX MysticalOS (ColorOS 17 suwak rozmiaru ikon \`60%–150%\`, kafelki \`1x1\`/\`2x1\`/\`1x2\`/\`2x2\`, kalkulator, ustawienia, podglad audytu)."
            echo "- *Uwaga techniczna:* \`MysticalOS-Emulator.exe\` analizuje obrazy \`super.img\`/\`system.img\` na poziomie systemu plikow oraz symuluje UI/UX na x86_64 Windows — nie uruchamia binarnie fizycznego kernela Linux ARM64 ani sterownikow sprzetowych MediaTek MT6765 (HAL)."
            echo
            echo "## 2. Wgranie prawdziwego ROM-u na telefon Redmi 9C (5 czesci 7-Zip)"
            echo "1. Pobierz **wszystkie 5 plikow** do jednego folderu:"
            echo "   - \`MysticalOS-Redmi9C.7z.001\`"
            echo "   - \`MysticalOS-Redmi9C.7z.002\`"
            echo "   - \`MysticalOS-Redmi9C.7z.003\`"
            echo "   - \`MysticalOS-Redmi9C.7z.004\`"
            echo "   - \`MysticalOS-Redmi9C.7z.005\`"
            echo "2. Kliknij prawym przyciskiem myszy na **\`MysticalOS-Redmi9C.7z.001\`** i wybierz **Wypakuj** (WinRAR lub 7-Zip)."
            echo "3. Wypakowane zostana \`super.img\`, \`boot.img\`, \`dtbo.img\`, \`vbmeta*.img\` oraz \`FLASH-REDMI9C.bat\`."
            echo
            echo "## Sumy kontrolne SHA-256"
            echo '```'
            cat "$WORK/release/SHA256SUMS.txt"
            echo '```'
            echo
            echo "## Sumy kontrolne 7-Zip (.7z.001 .. .7z.005)"
            echo '```'
            cat "$WORK/release/MysticalOS-Redmi9C-7Z-SHA256SUMS.txt"
            echo '```'
          } > "$WORK/RELEASE-NOTES.md"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "MysticalOS 1.0 — Redmi 9C + Windows Emulator .exe" \
              --notes-file "$WORK/RELEASE-NOTES.md"
          else
            gh release edit "$TAG" \
              --title "MysticalOS 1.0 — Redmi 9C + Windows Emulator .exe" \
              --notes-file "$WORK/RELEASE-NOTES.md"
          fi

          for ASSET in "$WORK/release"/*; do
            OK=0
            for TRY in 1 2 3 4 5; do
              echo "Upload: $(basename "$ASSET") (proba $TRY/5)..."
              if gh release upload "$TAG" "$ASSET" --clobber; then
                OK=1
                break
              fi
              sleep 20
            done
            [ "$OK" = "1" ] || { echo "::error::Upload $ASSET nie powiodl sie!"; exit 1; }
          done

          echo "=== OPUBLIKOWANE ASSETERY ==="
          gh release view "$TAG" --json url,assets -q '.url, (.assets[] | "\(.name)\t\(.size) B")'

      - name: "7. Zapisz raport diagnostyczny (reports/)"
        if: always()
        run: |
          set -uo pipefail
          mkdir -p reports
          R="reports/run-${GITHUB_RUN_ID}.md"
          {
            echo "# Redmi 9C HyperOS 4 Port — Run ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
            echo
            echo "## Rust Build & apk2rust Test"
            echo '```'
            cat "$WORK/rust-build.log" 2>/dev/null || echo "(brak rust-build.log)"
            echo '```'
            echo
            echo "## Dysk i pliki robocze"
            echo '```'
            df -h / 2>/dev/null || true
            ls -lh "$WORK/out-img" "$WORK/package" "$WORK/release" 2>/dev/null || true
            echo '```'
            echo
            echo "## Port & Debloat Report"
            echo '```'
            cat "$WORK/port-report.txt" 2>/dev/null || echo "(brak port-report.txt)"
            echo '```'
            echo
            echo "## secilc stderr"
            echo '```'
            cat "$WORK/secilc.err" 2>/dev/null || echo "(brak secilc.err)"
            echo '```'
            echo
            echo "## Release Assets"
            echo '```'
            ls -lh "$WORK/release" 2>/dev/null || echo "(brak katalogu release)"
            echo '```'
          } > "$R"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$R"
          git commit -m "ci: build report for run ${GITHUB_RUN_ID}" || true
          for A in 1 2 3; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              break
            fi
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep 5
          done
