name: public-dl-links

# Linki z BEZPOSREDNIM pobieraniem (klik = plik) na kilku hostach, kazdy
# zweryfikowany probe'em HTTP z runnera. Runner pobiera ZIP z release'a
# (752 MB) i wgrywa go na bashupload/temp.sh/litterbox/gofile.
# Sandboxed agent nie ma trasy do zadnego z tych hostow - stad ten workflow.

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4']
    paths: ['tools/public_links.sh', '.github/workflows/public-dl-links.yml']

permissions:
  contents: write

concurrency:
  group: public-dl-links
  cancel-in-progress: true

jobs:
  links:
    name: ZIP -> hosty z bezposrednim pobieraniem
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz ZIP z release i wgraj na hosty
        run: |
          set -uo pipefail
          mkdir -p /tmp/dl
          gh release download hyperos4-p11g2 --pattern 'HyperOS4_P11Gen2.zip' --dir /tmp/dl
          ls -l /tmp/dl
          bash tools/public_links.sh /tmp/dl/HyperOS4_P11Gen2.zip /tmp/links.md

      - name: Raport z linkami do repo
        if: always()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports
          cp /tmp/links.md "reports/direct-links-${{ github.run_id }}.md"
          git add -f reports
          git diff --cached --quiet || {
            git commit -q -m "direct-links: run ${{ github.run_id }}"
            git push -q origin "HEAD:${{ github.ref_name }}" && echo "raport z linkami wypchniety"
          }
