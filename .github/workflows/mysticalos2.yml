      - name: "10. Evidence (reports/)"
        if: always()
        run: |
          set -uo pipefail
          R="reports/mysticalos2-${GITHUB_RUN_ID}.md"
          {
            echo "# mysticalos2 run ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
            echo
            echo "## struktura paczki / partycje"; echo '```'
            cat "$WORK/stream-manifest.txt" 2>/dev/null || true
            for P in system system_ext; do
              echo "ps-$P: $(cat "$WORK/ps-$P" 2>/dev/null)"; echo "fsz-$P: $(cat "$WORK/fsz-$P" 2>/dev/null)"
              echo "fstype-$P: $(cat "$WORK/fstype-$P" 2>/dev/null)"
            done
            echo '```'
            echo "## debloat"; echo '```'; cat "$WORK/debloat-report.txt" 2>/dev/null || true; echo '```'
            echo "## rust"; echo '```'; cat "$WORK/rust-manifest.txt" 2>/dev/null || true; echo '```'
            echo "## sysroot systemu"; echo '```'; cat "$WORK/sysroot-listing.txt" 2>/dev/null || true; echo '```'
            echo "## app/priv-app/app_backup (listing)"; echo '```'; cat "$WORK/applist.txt" 2>/dev/null || true; echo '```'
            echo "## qemu"; echo '```'; cat "$WORK/qemu-coreutils.txt" 2>/dev/null || true; echo '```'
            echo "## dysk"; echo '```'; df -h / 2>/dev/null || true; echo '```'
          } > "$R"
          git config user.name "arena-agent"
          git config user.email "arena-agent@users.noreply.github.com"
          git add "$R" || true
          git commit -m "mysticalos2: evidence run ${GITHUB_RUN_ID}" \
            || echo "nic do commitu"
          for A in 1 2 3; do
            if git push; then echo "evidence: push OK"; break; fi
            git pull --rebase origin "$GITHUB_REF_NAME" || true
            sleep 10
          done
          echo "RAPORT: $R"
