# ============================================================================
# mysticalos2 v1.1 - MYSTICALOS 2.1 PERMANENT (Rozkaz 15 - anti-bootloop)
# ============================================================================
# V2.1 (Rozkaz 15 - eliminacja soft-bootloopa v2.0, wislo na logo Lenovo):
# 1. SAFE DEBLOAT: NIE usuwamy folderow z /system/priv-app - struktura zostaje,
#    APK zastapione pustymi atrapami (poprawny pusty ZIP; te same nazwy, tryby
#    i konteksty SELinux); telemetria Lenovo wylaczana WARSTWA USLUG
#    (pm disable-user) przez mystical-rust-daemon PO zaladowaniu frameworka.
#    (v2.0: fizyczne usuwanie -> DeadObjectException w system_server przez
#     powiazania IPC z /product i /system_ext).
# 2. ADB OD PIERWSZEJ SEKUNDY: ro.debuggable=1, ro.secure=0, ro.adb.secure=0,
#    persist.sys.usb.config=mtp,adb, persist.service.adb.enable=1 (oba build.prop).
# 3. Rust: coreutils + daemon jako u:object_r:system_file:s0 (0755); rc startuje
#    dopiero on property:sys.boot_completed=1 przez exec_background u:r:init:s0
#    (v2.0: serwis class main we wczesnym inita - ryzyko blokady boota).
# 4. Tozsamosc: display.id=MysticalOS 2.1 (HyperOS 4 x A17), sdk=33 NIETYKANE,
#    120Hz/blur/dalvik/zRAM bez zmian.
# 5. AVB: jak w v2.0 - flags 2, sha256, no FEC, PS 3489660928 B.
# ============================================================================
# ============================================================================
# CEL: pelny, samodzielny obraz system.img (+ system_ext.img) ze STOCKA
# Lenovo TB350FU_S130714_250118_ROW (A13/VNDK33) do wgrania FastbootD.
# Koniec z DSU - modyfikacje na STALE wbudowane w system plikow ext4.
#
# SPEC (user):
# 1. Baza: oficjalny system.img z paczki ROW S130714 (lolinet 7,3 GB);
#    surowy ext4 z kontekstami SELinux; ro.build.version.sdk=33 NIETYKANE.
# 2. /system/build.prop (+ system_ext/etc/build.prop): maska A17/HyperOS 4
#    (release=17, display.id=MysticalOS 2.1, hyperos=4.0.0, miui.ui=V16,
#    security_patch=2026-10-05) + flagi graficzne 120Hz/blur/skiagl
#    + dodatki z wlasnego system.prop usera (heap/dalvik/MT6789).
# 3. DEBLOAT fizyczny: LSF/LSF-Device-Phone, LenovoExtend, HecAgent,
#    UdcPlatform, LenovoUserExperience, LenovoCenter, DSA, TbEngine,
#    EngineeringCode. NIETYKALNE: PenService, Dolby, Audio, Wi-Fi, display.
# 4. RUST ENGINE: statyczna aarch64-musl binarka coreutils (uutils multicall,
#    ELF64 EXEC static - dostarczona przez usera, zweryfikowana) ->
#    /system/bin/coreutils; demon /system/bin/mystical-rust-daemon (zRAM 4GB
#    LZ4 + schedutil tuning, skrypt usera); serwis init mystical_rust.rc
#    DOKLADNIE wg spec (class main / user root / group root / oneshot,
#    bez seclabel = kontekst inita - sprawdzony wzorzec mystic-* rc).
# 5. Stopka AVB wg komendy ze spec: add_hashtree_footer --partition_name
#    system --hash_algorithm sha256 --do_not_generate_fec --flags 2
#    (+PS z oryginalu, algorytm SHA256_RSA2048, klucz testowy).
#
# ZRODLO: lolinet /firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/
#        TB350FU_S130714_250118_ROW.zip (7,3 GB) - obsluga payload.bin
#        (ssut/payload-dumper-go 2.1.0) ORAZ super.img (stream_lpunpack).
# PS partycji = rozmiar oryginalnego obrazu z paczki (fs+hashtree+footer
# = dokladnie rozmiar partycji logicznej); fs zrzucany erase_footer.
# Drzewo: mount ro -> tar --selinux --acls --xattrs -> mody -> mke2fs ext4
# -> tar-in (konteksty wlascicieli zachowane 1:1). Konteksty nowych plikow
# kopiowane z sasiadow (bin/sh, istniejacy .rc) przez getxattr/setxattr.
# WYJSCIE: MysticalOS_2.1_TB350FU_System.img + _System_ext.img + vbmetty
# FLAGS3 (do wgrania PRZED system - stopka flags 2 nie obejmie wlasnego
# rozmiaru stockowej vbmetty) + instrukcja FastbootD.
# ============================================================================

name: mysticalos2
# bump3: retry - run 7 (8e93eb2) cancelled w kolejce (zewn. canceler); fix SIGPIPE nie wykonal sie

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/mysticalos2.yml', 'kit-mysticalos3/rust-engine/**', 'kit-mysticalos3/stock-vbmeta-S130714/**']

concurrency:
  group: mysticalos2
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      WORK: /tmp/m2
      KDIR: ${{ github.workspace }}/kit-mysticalos3
      STOCK_URL: https://mirrors.lolinet.com/firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/TB350FU_S130714_250118_ROW.zip
    steps:
      - uses: actions/checkout@v4

      - name: "0. Zaleznosci + dysk"
        run: |
          set -euo pipefail
          # ~20 GB wolnego (zip 7,3 + super/payload ~8 + drzewa + 2 obrazy)
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          sudo apt-get update -q >/dev/null 2>&1 || true
          sudo apt-get install -y -q qemu-user-static >/dev/null 2>&1 || sudo apt-get install -y qemu-user-static
          for T in mke2fs e2fsck resize2fs tar blkid unzip qemu-aarch64-static openssl; do
            command -v "$T" >/dev/null || { echo "::error::brak $T"; exit 1; }
          done
          python3 -c "import cryptography" 2>/dev/null || pip install --quiet cryptography
          python3 "$KDIR/tools/avbtool.py" version
          df -h /

      - name: "1. Rust engine + vbmetty STOCK z kitu + patch FLAGS3"
        run: |
          set -euo pipefail
          mkdir -p "$WORK/rust" "$WORK/out" "$WORK/vbmeta/FLAGS3" "$WORK/vbmeta/STOCK-ORYGINAL"
          cp "$KDIR/rust-engine/coreutils" "$KDIR/rust-engine/mystical-rust-daemon" "$WORK/rust/"
          python3 - "$WORK/rust/coreutils" <<'EOF'
          import struct, sys
          d = open(sys.argv[1], 'rb').read(20)
          assert d[:4] == b'\x7fELF', 'coreutils: to nie ELF'
          assert d[4] == 2, 'coreutils: nie ELF64'
          assert struct.unpack('<H', d[18:20])[0] == 183, 'coreutils: nie AArch64!'
          full = open(sys.argv[1], 'rb').read()
          assert b'ld-linux' not in full and b'/ld-musl' not in full, 'coreutils: dynamiczny?!'
          print('coreutils: ELF64 AArch64 STATIC (musl, uutils multicall), %d B' % len(full))
          EOF
          sh -n "$WORK/rust/mystical-rust-daemon"
          chmod 0755 "$WORK/rust/coreutils" "$WORK/rust/mystical-rust-daemon"
          sha256sum "$WORK/rust/coreutils" "$WORK/rust/mystical-rust-daemon" | tee "$WORK/rust-manifest.txt"
          for N in vbmeta vbmeta_system vbmeta_vendor; do
            cp "$KDIR/stock-vbmeta-S130714/$N.img" "$WORK/vbmeta/STOCK-ORYGINAL/"
          done
          # fingerprint-proof: to vbmetty z S130714_250118_ROW
          python3 "$KDIR/tools/avbtool.py" info_image --image "$WORK/vbmeta/STOCK-ORYGINAL/vbmeta_system.img" \
            | tee "$WORK/vbmeta-stock-info.txt"
          grep -q "S130714_250118_ROW" "$WORK/vbmeta-stock-info.txt" \
            || { echo "::error::vbmeta_system: fingerprint != S130714_250118_ROW"; exit 1; }
          # patch flags 0 -> 3 (HASHTREE_DISABLED|VERIFICATION_DISABLED):
          # u32 BE @ offset 120 w naglowku AVB0; zmiana DOKLADNIE 1 bajtu
          python3 - "$WORK" <<'EOF'
          import struct, sys
          W = sys.argv[1]
          for n in ['vbmeta', 'vbmeta_system', 'vbmeta_vendor']:
              src = f'{W}/vbmeta/STOCK-ORYGINAL/{n}.img'
              dst = f'{W}/vbmeta/FLAGS3/{n}.img'
              data = bytearray(open(src, 'rb').read())
              assert data[:4] == b'AVB0', n + ': zla magic'
              assert bytes(data[128:135]) == b'avbtool', n + ': release string nie na 128'
              old = struct.unpack('>I', data[120:124])[0]
              assert old == 0, n + ': flags != 0'
              data[120:124] = struct.pack('>I', 3)
              orig = open(src, 'rb').read()
              assert [i for i in range(len(orig)) if orig[i] != data[i]] == [123], n + ': diff != 1 bajt'
              open(dst, 'wb').write(bytes(data))
              print(n, 'flags 0 -> 3 OK (1 bajt, reszta oryginal Lenovo)')
          EOF
          for N in vbmeta vbmeta_system vbmeta_vendor; do
            python3 "$KDIR/tools/avbtool.py" info_image --image "$WORK/vbmeta/FLAGS3/$N.img" \
              | grep -q "Flags: *3$" || { echo "::error::FLAGS3/$N.img: Flags != 3"; exit 1; }
          done

      - name: "2. Stock ROW S130714 z lolinet (7,3 GB, resume)"
        run: |
          set -euo pipefail
          for A in 1 2 3; do
            if curl -fL --retry 3 --retry-delay 5 -C - --connect-timeout 30 -o "$WORK/stock.zip" "$STOCK_URL"; then
              break
            fi
            echo "proba $A nieudana - czekam 20 s"; sleep 20
          done
          [ -s "$WORK/stock.zip" ] || { echo "::error::lolinet nieosiagalny z runera (zip nie pobrany)"; exit 1; }
          SZ=$(stat -c%s "$WORK/stock.zip")
          [ "$SZ" -gt 7000000000 ] || { echo "::error::stock.zip ${SZ} B < 7 GB?!"; exit 1; }
          echo "stock.zip: ${SZ} B OK"
          unzip -l "$WORK/stock.zip" > "$WORK/ziplist.txt" || true
          head -40 "$WORK/ziplist.txt"
          grep -E "system|super|payload|vbmeta" "$WORK/ziplist.txt" || true
          df -h /

      - name: "3. Wyluskaj system + system_ext (payload.bin ALBO super.img)"
        run: |
          set -euo pipefail
          # sparse (0x3AFF26ED) -> raw; flashtool images bywaja sparse (product.img
          # 2474779240 B nie jest 4096-aligned = prawie na pewno sparse)
          desparse() {
            local M
            M=$(python3 -c "import struct,sys; print('1' if struct.unpack('<I', open(sys.argv[1],'rb').read(4))[0]==0xED26FF3A else '0')" "$1")
            if [ "$M" = "1" ]; then
              python3 "$KDIR/tools/simg2img.py" "$1" "$1.raw" \
                || { echo "::error::simg2img $1 padl"; return 1; }
              mv "$1.raw" "$1"
              echo "$1: SPARSE -> raw ($(stat -c%s "$1") B)"
            else
              echo "$1: raw ($(stat -c%s "$1") B)"
            fi
          }
          # UWAGA: grep zawsze na PLIKU - "echo | grep -q" to wyścig SIGPIPE
          # (grep -q zamyka rure po 1. trafieniu; listing >64 KB bufora rury ->
          # 'echo: write error: Broken pipe' pod pipefail; run 37371231584)
          unzip -l "$WORK/stock.zip" > "$WORK/ziplist.txt" || true
          if grep -q "payload\.bin$" "$WORK/ziplist.txt"; then
            echo "== paczka OTA: payload.bin =="
            unzip -o -q "$WORK/stock.zip" "*payload.bin" -d "$WORK"
            PB=$(find "$WORK" -maxdepth 2 -name "payload.bin" | head -1)
            [ -n "$PB" ] || { echo "::error::payload.bin nie rozpakowany"; exit 1; }
            rm -f "$WORK/stock.zip"
            curl -fL --retry 3 -o "$WORK/pdg.tgz" \
              https://github.com/ssut/payload-dumper-go/releases/download/v2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
            tar -xzf "$WORK/pdg.tgz" -C "$WORK"
            rm -f "$WORK/pdg.tgz"
            "$WORK/payload-dumper-go" -p system,system_ext -o "$WORK/out" "$PB" \
              || { echo "payload: system_ext moze nie istniec - retry tylko system"
                   "$WORK/payload-dumper-go" -p system -o "$WORK/out" "$PB" \
                     || { echo "::error::payload-dumper-go padl"; exit 1; } }
            rm -f "$PB"
            rm -f "$WORK/payload-dumper-go"
          elif grep -q "system\.img$" "$WORK/ziplist.txt"; then
            echo "== paczka flashtool: luzne obrazy partycji (image/*.img) =="
            unzip -o -q "$WORK/stock.zip" "*system.img" "*system_ext*.img" -d "$WORK/fl" 2>/dev/null || true
            rm -f "$WORK/stock.zip"
            SYS=$(find "$WORK/fl" -type f -name "system.img" | head -1)
            SEXT=$(find "$WORK/fl" -type f -name "system_ext.img" | head -1)
            [ -n "$SYS" ] || { echo "::error::brak system.img w paczce flashtool"; exit 1; }
            desparse "$SYS"
            mv "$SYS" "$WORK/out/system.img"
            echo "system.img: $(stat -c%s "$WORK/out/system.img") B"
            if [ -n "$SEXT" ]; then
              desparse "$SEXT"
              mv "$SEXT" "$WORK/out/system_ext.img"
              echo "system_ext.img: $(stat -c%s "$WORK/out/system_ext.img") B"
            fi
            rm -rf "$WORK/fl"
          elif grep -q "super\.img$" "$WORK/ziplist.txt"; then
            echo "== paczka flashtool: super.img =="
            unzip -o -q "$WORK/stock.zip" "*super.img" -d "$WORK"
            SU=$(find "$WORK" -maxdepth 2 -name "super.img" | head -1)
            [ -n "$SU" ] || { echo "::error::super.img nie rozpakowany"; exit 1; }
            rm -f "$WORK/stock.zip"
            python3 - "$SU" <<'EOF'
          import struct, sys
          raw = open(sys.argv[1], 'rb').read(4)
          print('super magic:', raw.hex(), '(3aff26ed = sparse)')
          open(sys.argv[1] + '.sparse', 'w').write(
              '1' if struct.unpack('<I', raw)[0] == 0xED26FF3A else '0')
          EOF
            if [ "$(cat "$SU.sparse")" = "1" ]; then
              python3 "$KDIR/tools/simg2img_stream.py" < "$SU" \
                | python3 "$KDIR/tools/stream_lpunpack.py" --stdin --out "$WORK/out" --only system,system_ext \
                | tee "$WORK/stream-manifest.txt"
            else
              python3 "$KDIR/tools/stream_lpunpack.py" --file "$SU" --out "$WORK/out" --only system,system_ext \
                | tee "$WORK/stream-manifest.txt"
            fi
            for P in system system_ext; do
              awk -F'\t' -v p="$P" '$1=="P"&&$2==p{f=1} END{exit f?0:1}' "$WORK/stream-manifest.txt" \
                || { echo "::error::brak partycji $P w super"; exit 1; }
            done
            rm -f "$SU" "$SU.sparse"
          else
            head -80 "$WORK/ziplist.txt"
            echo "::error::nieznana struktura paczki (brak payload.bin, super.img i system.img)"
            exit 1
          fi
          # PS = rozmiar oryginalnego obrazu (fs+hashtree+footer = partycja);
          # potem erase_footer -> czysty fs. Brak stopki = PS wg wzorca.
          for P in system system_ext; do
            S="$WORK/out/$P.img"
            if [ -s "$S" ]; then
              PS=$(stat -c%s "$S")
              echo "$PS" > "$WORK/ps-$P"
              python3 "$KDIR/tools/avbtool.py" info_image --image "$S" > "$WORK/out/avb-stock-$P.txt" 2>/dev/null || true
              if grep -q "Footer magic" "$WORK/out/avb-stock-$P.txt" 2>/dev/null; then
                python3 "$KDIR/tools/avbtool.py" erase_footer --image "$S" \
                  || { echo "::error::erase_footer $P"; exit 1; }
                echo "$P: stopka stock zrzucona (PS=$PS B z oryginalu)"
              else
                # brak stopki: fs = Image Size z deskryptora hashtree dla tej
                # partycji (stock vbmeta_system z kitu), plik moze zawierac
                # hashtree/FEC bez footera -> trim; PS = max(plik, wzorzec)
                FSZ=$(stat -c%s "$S")
                TRIM=$(awk -v tgt="$P" '/Hashtree descriptor:/{h=1;next} h&&/Image Size:/{v=$3} h&&/Partition Name:/{if($NF==tgt){print v; exit}}' "$WORK/vbmeta-stock-info.txt")
                if [ -n "$TRIM" ] && [ "$TRIM" -gt 100000000 ] && [ "$TRIM" -lt "$FSZ" ] && [ $((TRIM % 4096)) -eq 0 ]; then
                  truncate -s "$TRIM" "$S"
                  echo "$P: brak stopki -> fs TRIM do deskryptora vbmeta ($TRIM B z $FSZ B)"
                else
                  echo "$P: brak stopki i deskryptora -> fs = caly plik ($FSZ B)"
                fi
                FORM=$(( (FSZ + FSZ/100 + 16777216 + 4194303) / 4194304 * 4194304 ))
                [ "$PS" -ge "$FORM" ] || PS="$FORM"
                echo "$PS" > "$WORK/ps-$P"
                echo "$P: PS wg pliku/wzorca = $PS B"
              fi
              FSZ=$(stat -c%s "$S")
              echo "$FSZ" > "$WORK/fsz-$P"
              [ $((FSZ % 4096)) -eq 0 ] || { echo "::error::$P: fs $FSZ % 4096 != 0"; exit 1; }
              TYPE=$(blkid -o value -s TYPE "$S" || true)
              echo "${TYPE:-unknown}" > "$WORK/fstype-$P"
              echo "== $P: fs=$FSZ B, PS=$(cat "$WORK/ps-$P") B, typ=${TYPE:-?} =="
            else
              echo "UWAGA: $P.img nie ma w paczce - pomijam te partycje"
              touch "$WORK/no-$P"
            fi
          done
          [ -s "$WORK/out/system.img" ] || { echo "::error::brak system.img!"; exit 1; }
          df -h /

      - name: "4. Drzewo SELinux + debloat + propsy A17 + Rust engine"
        run: |
          set -euo pipefail
          for P in system system_ext; do
            if [ -e "$WORK/no-$P" ]; then continue; fi
            S="$WORK/out/$P.img"; T="$WORK/tree-$P"
            TYPE=$(cat "$WORK/fstype-$P")
            M="$WORK/mnt-$P"; sudo mkdir -p "$M"
            if ! sudo mount -o ro,loop "$S" "$M" 2>/dev/null; then
              sudo mount -t erofs -o ro,loop "$S" "$M" 2>/dev/null \
                || sudo mount -t ext4 -o ro,loop "$S" "$M" \
                || { echo "::error::$P: montaz zrodlowy padl (typ=$TYPE)"; exit 1; }
            fi
            mkdir -p "$T"
            sudo tar -C "$M" --acls --xattrs --selinux -cf - . \
              | sudo tar -C "$T" --acls --xattrs --selinux -xf - \
              || { echo "::error::$P: tar roundtrip padl"; exit 1; }
            sudo umount "$M"; sudo rmdir "$M"
            rm -f "$S"
            echo "$P: drzewo OK ($(sudo find "$T" 2>/dev/null | wc -l) wpisow)"; df -h /
          done
          # SYSROOT: PERMANENT = struktura stocka 1:1 (BEZ shiftu!). Flashtool
          # images mialy wrapper (krok 4 runa 37368017357: brak app/ w korzeniu,
          # root-owned storage/data/lost+found) - tylko wskazujemy sciezke.
          T="$WORK/tree-system"
          if sudo test -d "$T/app"; then SYS="$T"
          elif sudo test -d "$T/system/app"; then SYS="$T/system"
          else
            A=$(sudo find "$T" -maxdepth 3 -type d -name app -print -quit 2>/dev/null || true)
            [ -n "$A" ] || { echo "::error::brak app/ w drzewie systemu! Diagnostyka:"
                             sudo ls -la "$T"; sudo ls -la "$T/system" 2>/dev/null || true
                             exit 1; }
            SYS=$(dirname "$A")
          fi
          echo "$SYS" > "$WORK/sysroot-system"
          echo "sysroot systemu: ${SYS#"$T"/} -> $SYS"
          sudo test -f "$SYS/build.prop" \
            || { echo "::error::brak build.prop w sysroot"; sudo ls -la "$SYS"; exit 1; }
          sudo ls -la "$SYS" > "$WORK/sysroot-listing.txt" || true
          # system_ext FOLDED? (zip flashtool S130714 nie ma system_ext.img)
          SEBP=""
          if [ -e "$WORK/no-system_ext" ]; then
            for CAND in "$SYS/system_ext/etc/build.prop" "$T/system_ext/etc/build.prop"; do
              if sudo test -f "$CAND"; then SEBP="$CAND"; echo "system_ext FOLDED: $SEBP"; break; fi
            done
            [ -n "$SEBP" ] || echo "UWAGA: brak system_ext/etc/build.prop w drzewie - propsy tylko /system"
          fi
          if [ -n "$SEBP" ]; then echo "${SEBP#"$T"/}" > "$WORK/sebp-rel"; else : > "$WORK/sebp-rel"; fi
          # ---- konteksty zachowane? (probka; sudo - drzewo root-owned) ----
          sudo python3 - "$SYS" <<'EOF'
          import os, sys
          S = sys.argv[1]
          for rel in ['bin/sh', 'build.prop', 'etc/selinux']:
              lbl = os.getxattr(os.path.join(S, rel), 'security.selinux')
              assert lbl and lbl.startswith(b'u:object_r:'), rel + ': brak kontekstu SELinux!'
              print('kontekst OK:', rel, '->', lbl.decode())
          EOF
          # ---- DEBLOAT FIZYCZNY (9 pozycji ze spec; run 37374889233: tylko
          # 3/9 mialo "podrecznikowe" nazwy - reszta ma inne nazwy folderow w
          # stocku LUB zyje w product (nieosiagalne z system.img). Skan tez
          # app_backup (staging OTA Lenovo). Miekki fail: listing do logu. ----
          sudo python3 - "$WORK" "$SYS" <<'EOF'
          import os, re, shutil, sys
          W = sys.argv[1]; T = sys.argv[2]
          TOKENS = [r'\blsf\b|lsf-device-phone|lsf\.device|com\.lenovo\.lsf',
                    r'lenovoextend|hecextend|com\.lenovo\.hec\.lenovoextend',
                    r'hec[._-]?agent|hecplatform|com[.]lenovo[.]hecplatform',
                    r'udcplatform|com\.lenovo\.udcplatform',
                    r'userexperience|lenovoue|tabletue|com[.]lenovo[.]ue[.]device|com[.]lenovo[.]ue',
                    r'lencenter|lenovocenter|tabletcenter|com[.]tblenovo[.]center',
                    r'\bdsa\b|com\.lenovo\.dsa',
                    r'tbengine|com\.lenovo\.tbengine',
                    r'engineeringcode|com\.lenovo\.engineeringcode']
          PROTECT = re.compile(r'pen|dolby|atmos|audio|wifi|wlan|display|driver|framework|boot', re.I)
          stubbed = []
          listing = []
          STUB = b'PK\x05\x06' + b'\x00' * 18   # poprawny pusty ZIP = atrapa APK
          for base in ['app', 'priv-app', 'app_backup']:
              d = os.path.join(T, base)
              if not os.path.isdir(d):
                  continue
              for name in sorted(os.listdir(d)):
                  full = os.path.join(d, name)
                  if not os.path.isdir(full):
                      continue
                  entries = [name] + os.listdir(full)
                  listing.append(base + '/' + name + '  [' + ' '.join(sorted(entries)[:6]) + ']')
                  if PROTECT.search(name):
                      continue
                  hay = ' '.join(entries).lower()
                  if any(re.search(t, hay) for t in TOKENS):
                      saved = 0; napks = 0
                      for root, dirs, files in os.walk(full):
                          for f in files:
                              if not f.endswith('.apk'):
                                  continue
                              px = os.path.join(root, f)
                              try:
                                  xctx = os.getxattr(px, 'security.selinux')
                              except OSError:
                                  xctx = None
                              saved += os.path.getsize(px)
                              with open(px, 'wb') as fh:
                                  fh.write(STUB)
                              os.chmod(px, 0o644)
                              if xctx:
                                  os.setxattr(px, 'security.selinux', xctx)
                              saved -= len(STUB)
                              napks += 1
                      stubbed.append((base, name, saved, napks))
                      print(f'ATRAPA: {base}/{name}: {napks} APK -> stuby (odchudzone {saved/1e6:.1f} MB)')
          print(f'DEBLOAT-SAFE v2.1: {len(stubbed)} folderow jako atrapy (struktura zachowana)')
          open(f'{W}/debloat-report.txt', 'w').write(
              '\n'.join(f'{a}/{b} apks={d_} saved={c}' for a, b, c, d_ in stubbed) + '\n')
          open(f'{W}/applist.txt', 'w').write('\n'.join(listing) + '\n')
          if len(stubbed) < 5:
              print('UWAGA: stub < 5 trafien - pelny listing folderow:')
              print('\n'.join(listing))
              print('(pozostale cele zyja w product - wylaczy je pm disable-user w demonie)')
          EOF
          # ---- PROPSY (spec 20 + dodatki z system.prop usera) ----
          sudo python3 - "$WORK" "$SYS" "$SEBP" <<'EOF'
          import os, sys
          W, SYS, SEBP = sys.argv[1], sys.argv[2], sys.argv[3]
          PROPS = {
            # tozsamosc A17 / HyperOS 4 (spec usera)
            'ro.build.version.release': '17',
            'ro.build.version.release_or_codename': '17',
            'ro.build.display.id': 'MysticalOS 2.1 (HyperOS 4 x A17)',
            'ro.build.version.incremental': 'MysticalOS-2.1-Rust',
            'ro.build.version.security_patch': '2026-10-05',
            'ro.mysticalos.version': '2.1',
            'ro.mysticalos.edition': 'Rust-Powered Edition',
            'ro.hyperos.version': '4.0.0',
            'ro.miui.ui.version.name': 'V16',
            'ro.miui.ui.version.code': '16',
            # ADB OD PIERWSZEJ SEKUNDY (spec v2.1 - live debugging na logo)
            'ro.debuggable': '1',
            'ro.secure': '0',
            'ro.adb.secure': '0',
            'persist.sys.usb.config': 'mtp,adb',
            'persist.service.adb.enable': '1',
            # grafika / 120Hz (spec usera)
            'ro.surface_flinger.supports_background_blur': '1',
            'persist.sys.sf.blur': '1',
            'persist.sys.background_blur': '1',
            'persist.sys.lenovo.refresh_rate': '120',
            'ro.surface_flinger.set_idle_timer_ms': '0',
            'ro.surface_flinger.set_touch_timer_ms': '1000',
            'persist.sys.miui.anim.enabled': 'true',
            'persist.sys.miui_anim_duration_ratio': '0.85',
            'debug.hwui.renderer': 'skiagl',
            'debug.renderengine.backend': 'skiaglthreaded',
            # dodatki z wlasnego system.prop usera (modul 2.0)
            'persist.sys.sf.native_mode': '1',
            'ro.surface_flinger.max_frame_buffer_acquired_buffers': '3',
            'debug.sf.latch_unsignaled': '1',
            'debug.sf.enable_gl_backpressure': '1',
            'ro.surface_flinger.use_content_detection_for_refresh_rate': 'true',
            'touch.pressure.scale': '0.001',
            'persist.sys.purgeable_assets': '1',
            'ro.config.low_ram': 'false',
            'dalvik.vm.heapgrowthlimit': '384m',
            'dalvik.vm.heapsize': '768m',
            'dalvik.vm.heaptargetutilization': '0.75',
            'dalvik.vm.heapminfree': '8m',
            'dalvik.vm.heapmaxfree': '32m',
            'dalvik.vm.dex2oat-filter': 'speed-profile',
            'dalvik.vm.image-dex2oat-filter': 'speed-profile',
            'renderthread.skia.reduceopstasksplitting': 'true',
          }
          def apply(path):
              if not os.path.isfile(path):
                  os.makedirs(os.path.dirname(path), exist_ok=True)
                  open(path, 'w').write('# MysticalOS 2.1\n')
              raw = open(path, encoding='utf-8', errors='surrogateescape').read()
              lines = raw.split('\n')
              out, seen = [], set()
              for l in lines:
                  if '=' in l and not l.lstrip().startswith('#'):
                      k = l.split('=', 1)[0].strip()
                      if k in PROPS:
                          out.append(k + '=' + PROPS[k]); seen.add(k); continue
                  out.append(l)
              missing = [k for k in PROPS if k not in seen]
              if missing:
                  out.append('# ==== MysticalOS 2.1 (HyperOS 4 x A17 / Rust) ====')
                  for k in missing:
                      out.append(k + '=' + PROPS[k])
              open(path, 'w', encoding='utf-8', errors='surrogateescape').write('\n'.join(out))
              return len(seen), len(missing)
          r1 = apply(f'{SYS}/build.prop')
          print('/system/build.prop:', r1[0], 'podmieniono,', r1[1], 'dodano')
          if SEBP:
              r2 = apply(SEBP)
              print('system_ext/etc/build.prop (folded):', r2[0], 'podmieniono,', r2[1], 'dodano')
          # KRYTYCZNE: SDK 33 NIETYKANE (stabilnosc system_server + Mali-G57)
          bp = open(f'{SYS}/build.prop').read()
          assert 'ro.build.version.sdk=33' in bp, 'sdk != 33?!'
          assert 'ro.build.version.sdk=34' not in bp and 'ro.build.version.sdk=36' not in bp
          print('ro.build.version.sdk=33 NIETYKANE OK')
          EOF
          # ---- RUST ENGINE (binarka usera + demon + rc DOKLADNIE ze spec) ----
          sudo install -m 0755 "$WORK/rust/coreutils" "$SYS/bin/coreutils"
          sudo install -m 0755 "$WORK/rust/mystical-rust-daemon" "$SYS/bin/mystical-rust-daemon"
          cat > "$WORK/mystical_rust.rc" <<'RCEOF'
          # MysticalOS 2.1 - Rust Engine (start PO pelnym boocie; nie blokuje inita)
          # v2.0: serwis w klasie main startowal WE WCZESNYM inita (przed frameworkiem)
          # -> wczesny reset zRAM/swapon mogl zawieszac boot na logo. v2.1: wyzwalacz
          # boot_completed + exec_background w kontekscie inita (blok ze spec usera).
          on property:sys.boot_completed=1
              exec_background u:r:init:s0 -- /system/bin/mystical-rust-daemon
          RCEOF
          sudo install -m 0644 "$WORK/mystical_rust.rc" "$SYS/etc/init/mystical_rust.rc"
          # konteksty SELinux nowych plikow = konteksty sasiadow z tego obrazu
          sudo python3 - "$SYS" <<'EOF'
          import os, sys
          S = sys.argv[1]
          # v2.1 spec: binarki Rust jako u:object_r:system_file:s0 (0755)
          sysf = b'u:object_r:system_file:s0'
          rc_ctx = None
          idir = f'{S}/etc/init'
          for f in sorted(os.listdir(idir)):
              if f.endswith('.rc'):
                  rc_ctx = os.getxattr(os.path.join(idir, f), 'security.selinux'); break
          if rc_ctx is None:
              rc_ctx = sysf
          for rel, ctx, mod in [('bin/coreutils', sysf, 0o755),
                                ('bin/mystical-rust-daemon', sysf, 0o755),
                                ('etc/init/mystical_rust.rc', rc_ctx, 0o644)]:
              os.setxattr(os.path.join(S, rel), 'security.selinux', ctx)
              os.chmod(os.path.join(S, rel), mod)
              print('kontekst+tryb nadany:', rel, '->', ctx.decode(), oct(mod))
          EOF
          echo "== mody drzewa OK =="; df -h /

      - name: "5. Zbuduj ext4 (system + system_ext; fallback EROFS)"
        run: |
          set -euo pipefail
          build_ext4() {
            local T="$1" OUT="$2" FSZ="$3" PS="$4" N="$5" CAP MAX R USE
            MAX=$(( PS - 33554432 ))
            [ "$FSZ" -le "$MAX" ] || FSZ="$MAX"
            CAP="$FSZ"
            sudo mkdir -p "$WORK/mntbuild"
            for R in 1 2 3 4 5 6 7 8; do
              rm -f "$OUT"
              mke2fs -q -F -t ext4 -b 4096 -I 256 -m 0 -O ^has_journal "$OUT" $((CAP/4096)) \
                || { echo "::error::$N: mke2fs"; return 1; }
              if ! sudo mount -o loop,rw "$OUT" "$WORK/mntbuild"; then
                echo "::error::$N: montaz rw padl"; return 1
              fi
              if sudo tar -C "$T" --acls --xattrs --selinux -cf - . \
                 | sudo tar -C "$WORK/mntbuild" --acls --xattrs --selinux -xf -; then
                USE=$(df --output=pcent "$WORK/mntbuild" | tail -1 | tr -dc '0-9')
                echo "$N: ext4 cap $CAP B, uzycie ${USE}%; $(df -h "$WORK/mntbuild" | tail -1); inody: $(df -i "$WORK/mntbuild" | tail -1)"
                if [ "$USE" -lt 99 ]; then
                  sudo umount "$WORK/mntbuild"
                  e2fsck -f -y -D "$OUT" > "$WORK/fsck-$N.log" 2>&1 || true
                  tail -3 "$WORK/fsck-$N.log"
                  return 0
                fi
                sudo umount "$WORK/mntbuild"
              else
                sudo umount "$WORK/mntbuild" 2>/dev/null || true
              fi
              CAP=$((CAP + 67108864))
              [ "$CAP" -le "$MAX" ] || { echo "::error::$N: nie miesci sie w partycji (max $MAX)"; return 1; }
              echo "$N: retry z cap $CAP B"
            done
            return 1
          }
          build_erofs() {
            local T="$1" OUT="$2" N="$3" FC
            FC=$(sudo find "$T" -name plat_file_contexts -type f -print -quit 2>/dev/null || true)
            [ -n "$FC" ] || { echo "::error::$N: brak plat_file_contexts (fallback EROFS)"; return 1; }
            "$KDIR/bin/mkfs.erofs" -zlz4 -T 0 --file-contexts="$FC" "$OUT" "$T" \
              || { echo "::error::$N: mkfs.erofs padl"; return 1; }
            echo "$N: EROFS fallback OK"
          }
          echo "drzewo systemu: $(sudo du -sh "$WORK/tree-system" 2>/dev/null | cut -f1) (dedup e2fsdroid: tree > stock fs)"
          if ! build_ext4 "$WORK/tree-system" "$WORK/out/MysticalOS_2.1_TB350FU_System.img" \
                          "$(cat "$WORK/fsz-system")" "$(cat "$WORK/ps-system")" system; then
            echo "== system: fallback EROFS (ext4 nie zmiescil sie w partycji) =="
            build_erofs "$WORK/tree-system" "$WORK/out/MysticalOS_2.1_TB350FU_System.img" system
          fi
          if [ ! -e "$WORK/no-system_ext" ]; then
            if ! build_ext4 "$WORK/tree-system-ext" "$WORK/out/MysticalOS_2.1_TB350FU_System_ext.img" \
                            "$(cat "$WORK/fsz-system_ext")" "$(cat "$WORK/ps-system_ext")" system_ext; then
              echo "== system_ext: fallback EROFS =="
              build_erofs "$WORK/tree-system-ext" "$WORK/out/MysticalOS_2.1_TB350FU_System_ext.img" system_ext
            fi
          fi
          sudo rm -rf "$WORK/tree-system" "$WORK/tree-system-ext"
          df -h /
          ls -la "$WORK/out/"

      - name: "6. Stopka AVB (komenda ze spec usera: flags 2)"
        run: |
          set -euo pipefail
          openssl genrsa -out /tmp/avb_key2.pem 2048 2>/dev/null
          add_footer() {
            local IMG
            python3 "$KDIR/tools/avbtool.py" add_hashtree_footer \
              --image "$1" --partition_name "$2" --partition_size "$3" \
              --hash_algorithm sha256 --do_not_generate_fec --flags 2 \
              --algorithm SHA256_RSA2048 --key /tmp/avb_key2.pem \
              || { echo "::error::add_hashtree_footer $2 padl"; exit 1; }
            IMG=$(stat -c%s "$1")
            [ "$IMG" -le "$3" ] || { echo "::error::$2: obraz $IMG > PS $3"; exit 1; }
            dd if="$1" bs=1 skip=$((IMG-64)) count=64 2>/dev/null | grep -aq "AVBf" \
              || { echo "::error::$2: brak magic AVBf w stopce"; exit 1; }
            echo "$2: stopka OK ($IMG B / PS $3 B, AVBf potwierdzone)"
          }
          # spec: avbtool add_hashtree_footer --image system.img --partition_name
          # system --hash_algorithm sha256 --do_not_generate_fec --flags 2
          add_footer "$WORK/out/MysticalOS_2.1_TB350FU_System.img" system "$(cat "$WORK/ps-system")"
          if [ ! -e "$WORK/no-system_ext" ]; then
            add_footer "$WORK/out/MysticalOS_2.1_TB350FU_System_ext.img" system_ext "$(cat "$WORK/ps-system_ext")"
          fi
          rm -f /tmp/avb_key2.pem
          # info + kryptograficzny dowod (verify_image potrzebuje nazwy pliku
          # = partition_name w katalogu obrazu):
          mkdir -p "$WORK/vfy"
          cp "$WORK/out/MysticalOS_2.1_TB350FU_System.img" "$WORK/vfy/system.img"
          ( cd "$WORK/vfy" && python3 "$KDIR/tools/avbtool.py" verify_image --image system.img ) \
            | tee "$WORK/out/avb-verify-system.txt" \
            || { echo "::error::verify_image system NIE przechodzi"; exit 1; }
          grep -q "Successfully verified" "$WORK/out/avb-verify-system.txt" \
            || { echo "::error::system: brak potwierdzenia weryfikacji"; exit 1; }
          if [ ! -e "$WORK/no-system_ext" ]; then
            cp "$WORK/out/MysticalOS_2.1_TB350FU_System_ext.img" "$WORK/vfy/system_ext.img"
            ( cd "$WORK/vfy" && python3 "$KDIR/tools/avbtool.py" verify_image --image system_ext.img ) \
              | tee "$WORK/out/avb-verify-system-ext.txt" \
              || { echo "::error::verify_image system_ext NIE przechodzi"; exit 1; }
          fi
          python3 "$KDIR/tools/avbtool.py" info_image --image "$WORK/out/MysticalOS_2.1_TB350FU_System.img" \
            | tee "$WORK/out/avb-info-system.txt"
          grep -q "Flags: *2$" "$WORK/out/avb-info-system.txt" || { echo "::error::Flags != 2 (system)"; exit 1; }
          grep -q "Hashtree descriptor" "$WORK/out/avb-info-system.txt" || { echo "::error::brak hashtree (system)"; exit 1; }
          if [ ! -e "$WORK/no-system_ext" ]; then
            python3 "$KDIR/tools/avbtool.py" info_image --image "$WORK/out/MysticalOS_2.1_TB350FU_System_ext.img" \
              | tee "$WORK/out/avb-info-system-ext.txt"
            grep -q "Flags: *2$" "$WORK/out/avb-info-system-ext.txt" || { echo "::error::Flags != 2 (system_ext)"; exit 1; }
          fi
          rm -rf "$WORK/vfy"

      - name: "7. Weryfikacja finalna (propsy + debloat + Rust + qemu)"
        run: |
          set -euo pipefail
          M="$WORK/mntv"; sudo mkdir -p "$M"
          if ! sudo mount -o ro,loop "$WORK/out/MysticalOS_2.1_TB350FU_System.img" "$M" 2>/dev/null; then
            sudo mount -t erofs -o ro,loop "$WORK/out/MysticalOS_2.1_TB350FU_System.img" "$M" \
              || { echo "::error::montaz weryfikacyjny system"; exit 1; }
          fi
          # sysroot na finalnym obrazie (ta sama detekcja co w kroku 4)
          if sudo test -d "$M/app"; then MSYS="$M"
          elif sudo test -d "$M/system/app"; then MSYS="$M/system"
          else MSYS=$(dirname "$(sudo find "$M" -maxdepth 3 -type d -name app -print -quit 2>/dev/null || true)")
          fi
          [ -n "$MSYS" ] || { echo "::error::finalny obraz bez app/!"; sudo ls -la "$M"; exit 1; }
          echo "finalny sysroot: $MSYS"
          BP="$MSYS/build.prop"
          # 20 kluczowych propsow ze spec (identity + grafika) + sdk
          for KV in \
            "ro.build.version.release=17" \
            "ro.build.version.release_or_codename=17" \
            "ro.build.display.id=MysticalOS 2.1 (HyperOS 4 x A17)" \
            "ro.build.version.incremental=MysticalOS-2.1-Rust" \
            "ro.build.version.security_patch=2026-10-05" \
            "ro.mysticalos.version=2.1" \
            "ro.mysticalos.edition=Rust-Powered Edition" \
            "ro.hyperos.version=4.0.0" \
            "ro.miui.ui.version.name=V16" \
            "ro.miui.ui.version.code=16" \
            "ro.debuggable=1" \
            "ro.secure=0" \
            "ro.adb.secure=0" \
            "persist.sys.usb.config=mtp,adb" \
            "persist.service.adb.enable=1" \
            "ro.surface_flinger.supports_background_blur=1" \
            "persist.sys.sf.blur=1" \
            "persist.sys.background_blur=1" \
            "persist.sys.lenovo.refresh_rate=120" \
            "ro.surface_flinger.set_idle_timer_ms=0" \
            "ro.surface_flinger.set_touch_timer_ms=1000" \
            "persist.sys.miui.anim.enabled=true" \
            "persist.sys.miui_anim_duration_ratio=0.85" \
            "debug.hwui.renderer=skiagl" \
            "debug.renderengine.backend=skiaglthreaded" \
            "ro.build.version.sdk=33"; do
            sudo grep -q "^$KV$" "$BP" || { echo "::error::build.prop: brak $KV"; exit 1; }
          done
          echo "propsy 26/26 OK (sdk=33 nietkane; ADB live od logo)"
          # v2.1 SAFE DEBLOAT: foldery MUSZA zostac (struktura + atrapy APK)
          sudo python3 - "$MSYS" <<'EOF'
          import os, sys
          M = sys.argv[1]
          targets = ['app/EngineeringCode', 'app/HEC_agent', 'priv-app/LSF-Device-Phone',
                     'priv-app/TabletCenter', 'priv-app/TabletUE', 'priv-app/UDCplatform']
          for rel in targets:
              d = os.path.join(M, rel)
              assert os.path.isdir(d), rel + ': folderu brak (struktura musi zostac!)'
              apks = [os.path.join(r, f) for r, _, fs in os.walk(d) for f in fs if f.endswith('.apk')]
              assert apks, rel + ': brak plikow APK (atrapy!)'
              for a in apks:
                  assert os.path.getsize(a) <= 4096, a + ': APK nie jest atrapa?!'
              print('ATRAPA OK:', rel, '(%d stub APK)' % len(apks))
          print('debloat-safe 6/6 OK (struktura zachowana, APK = puste atrapy)')
          EOF
          # nietykalne (ostrzezenie jesli ich nie widac - moga byc w product):
          for KEEP in pen dolby audio; do
            sudo find "$MSYS/app" "$MSYS/priv-app" -maxdepth 1 -iname "*${KEEP}*" > "$WORK/keep-hit.txt" 2>/dev/null || true
            if [ -s "$WORK/keep-hit.txt" ]; then echo "zachowano: *${KEEP}*"; else echo "UWAGA: brak *${KEEP}* w /system (moze byc w product/vendor)"; fi
          done
          # Rust engine
          [ -x "$MSYS/bin/coreutils" ] || { echo "::error::brak /system/bin/coreutils"; exit 1; }
          [ -x "$MSYS/bin/mystical-rust-daemon" ] || { echo "::error::brak demona"; exit 1; }
          [ -f "$MSYS/etc/init/mystical_rust.rc" ] || { echo "::error::brak mystical_rust.rc"; exit 1; }
          sh -n "$MSYS/bin/mystical-rust-daemon" || { echo "::error::demon: blad skladni sh"; exit 1; }
          sudo grep -q "on property:sys.boot_completed=1" "$MSYS/etc/init/mystical_rust.rc" \
            || { echo "::error::rc: brak wyzwalacza boot_completed"; exit 1; }
          sudo grep -q "exec_background u:r:init:s0 -- /system/bin/mystical-rust-daemon" "$MSYS/etc/init/mystical_rust.rc" \
            || { echo "::error::rc: brak exec_background demona (v2.1)"; exit 1; }
          if sudo grep -Eq '^[[:space:]]*class[[:space:]]+main' "$MSYS/etc/init/mystical_rust.rc"; then
            echo "::error::rc: serwis class main (v2.0, wczesny init!) nadal w rc"; exit 1
          fi
          sudo grep -q "4294967296" "$MSYS/bin/mystical-rust-daemon" || { echo "::error::demon: brak zram 4GB"; exit 1; }
          sudo grep -q "lz4" "$MSYS/bin/mystical-rust-daemon" || { echo "::error::demon: brak lz4"; exit 1; }
          sudo grep -q "pm disable-user" "$MSYS/bin/mystical-rust-daemon" || { echo "::error::demon: brak pm disable-user (safe debloat v2.1)"; exit 1; }
          sudo grep -q "com.tblenovo.center" "$MSYS/bin/mystical-rust-daemon" || { echo "::error::demon: brak listy telemetrii Lenovo"; exit 1; }
          # konteksty SELinux v2.1: binarki Rust = system_file (spec)
          sudo python3 - "$MSYS" <<'EOF'
          import os, sys
          M = sys.argv[1]
          sysf = b'u:object_r:system_file:s0'
          def ctx(rel):
              # ext4 + libselinux zapisuja kontekst z koncowym NUL - normalizujemy
              return os.getxattr(f'{M}/{rel}', 'security.selinux').rstrip(b'\x00')
          cu = ctx('bin/coreutils')
          da = ctx('bin/mystical-rust-daemon')
          assert cu == sysf, f'kontekst coreutils {cu} != system_file (spec v2.1)'
          assert da == sysf, f'kontekst demona {da} != system_file (spec v2.1)'
          rc = ctx('etc/init/mystical_rust.rc')
          assert rc.startswith(b'u:object_r:'), 'kontekst rc?!'
          print('konteksty SELinux v2.1 OK:', cu.decode(), '/', da.decode(), '/', rc.decode())
          EOF
          # QEMU: binarka Rust DZIALA (hard evidence, prosto z obrazu)
          qemu-aarch64-static "$MSYS/bin/coreutils" --version > "$WORK/qemu-coreutils.txt" 2>&1 \
            || { echo "::error::qemu: coreutils --version padl"; cat "$WORK/qemu-coreutils.txt"; exit 1; }
          head -2 "$WORK/qemu-coreutils.txt"
          grep -qi "coreutils" "$WORK/qemu-coreutils.txt" \
            || { echo "::error::qemu: coreutils --version bez potwierdzenia"; exit 1; }
          sudo qemu-aarch64-static "$MSYS/bin/coreutils" ls "$MSYS/bin" >/dev/null \
            || { echo "::error::qemu: coreutils ls padl"; exit 1; }
          echo "qemu-aarch64: coreutils --version + ls OK (multicall dziala)"
          USE=$(df --output=pcent "$M" | tail -1 | tr -dc '0-9')
          echo "system: uzycie ${USE}%"
          [ "$USE" -lt 99 ] || { echo "::error::system ext4 zapchany"; exit 1; }
          # system_ext FOLDED w obrazie systemu (zapisana sciezka z kroku 4)
          SEBPREL=$(cat "$WORK/sebp-rel" 2>/dev/null || true)
          if [ -n "$SEBPREL" ] && sudo test -f "$M/$SEBPREL"; then
            for KV in "ro.build.version.release=17" "ro.mysticalos.version=2.1" "ro.hyperos.version=4.0.0" "ro.debuggable=1" "ro.secure=0"; do
              sudo grep -q "^$KV$" "$M/$SEBPREL" || { echo "::error::system_ext(folded): brak $KV"; exit 1; }
            done
            echo "system_ext (folded, $SEBPREL): propsy OK"
          else
            echo "system_ext: brak w obrazie (propsy tylko /system/build.prop)"
          fi
          sudo umount "$M"
          sudo rmdir "$M" 2>/dev/null || true
          df -h /

      - name: "8. INSTRUKCJA + SHA256SUMS"
        run: |
          set -euo pipefail
          { cat "$WORK/debloat-report.txt"; echo; cat "$WORK/rust-manifest.txt"; echo
            echo "fsck:"; tail -3 "$WORK/fsck-system.log" 2>/dev/null; } > "$WORK/out/mods-report.txt" 2>/dev/null || true
          cat > "$WORK/out/INSTRUKCJA-FASTBOOTD.txt" <<'EOF'
          =====================================================================
          MYSTICALOS 2.1 (HyperOS 4 x A17 / RUST) - TB350FU - PERMANENT
          Baza: stock Lenovo S130714_250118_ROW (A13, VNDK 33)
