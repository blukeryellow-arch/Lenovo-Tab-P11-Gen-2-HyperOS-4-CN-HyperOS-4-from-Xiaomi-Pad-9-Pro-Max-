name: release-mystical3

# ============================================================================
# MysticalOS 3 - HYBRYDOWY SUPER.IMG TB350FU (zlecenie 29 IX, "BUILD V16")
# Repack wewnatrz FABRYCZNEGO layoutu super Lenovo (super.img container).
#
# RECEIPTY (sondy 36592788531/36602341301/36605363414; runy 36600150934/
# 36601392335/36603503837/36617353135):
#   - runner: dysk 72G, avail 8-14G (FLUKTUJE); RAM 7,9G => tmpfs 3,9G,
#   - zip lolinet (4 692 836 474 B) = pakiet SP Flash Tool: image/super.img
#     RAW 8 297 863 612 B (deflate 45%); partycje _a w super = 8,18G DANYCH
#     (product 2,79G / system 3,68G / system_ext 0,76G / vendor 0,92G /
#     vendor_dlkm 31M / odm_dlkm 348K) => lpmake (8,1G img + 8,3G out) i
#     materializacja drzew NIEWYKONALNE na dysku,
#   - lolinet wspiera HTTP range (206).
#
# ARCHITEKTURA v8 (peak dysku ~8,1G przy avail >=8G):
#   - BAZA: httpzip.py (wpisy zipa przez range; zip nigdy na dysku) +
#     stream_lpunpack.py --only (per-partycja, stop po celu; AOSP-identyczny),
#   - MODY: overlayfs (lower = loop-mount obrazu, upper = tmpfs) => PURGE =
#     whiteouty, INJECT/TRANSPLANT = upper, build.prop = copy-up; mkfs.erofs
#     z merged BEZ materializacji drzewa (test sandbox: dziala),
#   - SUPER: super_patch.py - splicuje extenty w metadanych bazowego super
#     (checksumy liblp wyprowadzone empirycznie; AOSP lpunpack zaakceptowal)
#     + emituje SPARSE wprost do ~32 czastek (sha256 on-the-fly; obrazy
#     unlinkowane po skonsumowaniu => dysk zwalnia w trakcie),
#   - WERYFIKACJA: sparse_head.py (glowa raw z czastek) -> lpinfo; fsck.erofs
#     strukturalny; dump.erofs --path/--cat na pliki m3 w obrazach.
#
# Donor yingtian 4.0.13 (TIERED: A=donor-cache m1, B=Drive product.img,
# C=fonty z assets.tar.gz w transfer-spool). Output: release mysticalos-3-super
# + gofile (3 tary).
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/release-mystical3.yml', 'tools/lpinfo.py', 'tools/httpzip.py', 'tools/stream_lpunpack.py', 'tools/super_patch.py', 'tools/sparse_head.py']

concurrency:
  group: mystical3-super
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # poll statusu m1 w TIER A

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LOLINET_ZIP: https://mirrors.lolinet.com/firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/TB350FU_S230982_251013_ROW.zip
      LOLINET_SIZE: 4692836474
      LOLINET_SUPER_LEN: 8297863612
      LOLINET_BOOT_LEN: 67108864
      BASE_ENTRY_PREFIX: TB350FU_S230982_251013_ROW/image
      BASE_BUILD: TB350FU_S230982_251013_ROW
      DONOR_DRIVE_ID: 1wkAkQyd-68oPB_x35BGvqIlzQ0BLffdd
      DONOR_SIZE: 10340028849
      PRODUCT_DONOR_DRIVE_ID: ""
      SUPER_EMPTY_DRIVE_ID: 1NUHbEzgwECQiumZgxlqzR6uNTimMQT9D
      SUPER_SIZE: 9663676416
      MAIN_GROUP_SIZE: 9661579264
      GMS_APK_URL: https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.google.android.gms-252432032.apk
      VENDING_APK_URL: https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.android.vending-84022632.apk
      AURORA_URL: https://gitlab.com/AuroraOSS/AuroraStore/uploads/3376fef895820893ddeb7154b056a07e/AuroraStore-preload-4.8.4.apk
      LP_TOOLS_URL: https://codeload.github.com/Rprop/aosp15_partition_tools/tar.gz/refs/heads/main
      AVB_URL: https://codeload.github.com/LineageOS/android_external_avb/tar.gz/refs/heads/lineage-22.2
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: "Spool donorow (checkout transfer-spool)"
        uses: actions/checkout@v4
        with:
          ref: transfer-spool
          path: spool

      - name: "0. Toolchain + dyski + smokes (sparse/stream/overlay/erofs)"
        run: |
          set -euo pipefail
          WD=/tmp/m3
          echo "WORK=$WD" >> "$GITHUB_ENV"
          SHMD=/dev/shm/m3
          echo "SHM=$SHMD" >> "$GITHUB_ENV"
          mkdir -p "$WD/bin" "$WD/img" "$WD/one" "$WD/keep/app" "$WD/keep/fonts" "$WD/keep/themes" "$WD/kit" "$SHMD"
          echo "dyski: WORK=$WD ($(df -h / | tail -1)); SHM=$SHMD ($(df -h /dev/shm | tail -1))"
          SRCD=/tmp/m3src; mkdir -p "$SRCD"
          # --- lp tools (statyczne, android-15.0.0_r25) ---
          curl -fsSL "$LP_TOOLS_URL" | tar -xz -C "$SRCD"
          LPT=$(ls -d "$SRCD"/aosp15_partition_tools-*/linux_glibc_x86_64 | head -1)
          for b in lpmake lpunpack lpdumps; do
            install -m 755 "$LPT/$b" "$WD/bin/$b"
            OUT=$("$WD/bin/$b" --help 2>&1 || true)
            echo "$OUT" | head -4 | grep -qiE "usage|lpmake|lpunpack|lpdumps|super|missing|must specify" \
              || { echo "::error::$b nie uruchamia sie"; exit 1; }
            echo "$b: OK"
          done
          # --- avbtool ---
          curl -fsSL "$AVB_URL" | tar -xz -C "$SRCD"
          cp "$SRCD"/android_external_avb-*/avbtool.py "$WD/bin/avbtool.py"
          python3 "$WD/bin/avbtool.py" version || python3 "$WD/bin/avbtool.py" --help | head -1
          # --- erofs-utils lokalnie (shim libselinux dla --file-contexts) ---
          bash tools/build_comp_libs.sh "$SRCD/comp" >/dev/null 2>&1 || bash tools/build_comp_libs.sh "$SRCD/comp"
          COMP_PREFIX="$SRCD/comp" bash tools/build_erofs_local.sh "$WD/erofs"
          "$WD/erofs/mkfs.erofs" --help 2>&1 | grep -q -- --file-contexts || { echo "::error::mkfs.erofs bez --file-contexts"; exit 1; }
          "$WD/erofs/fsck.erofs" --help >/dev/null 2>&1 || { echo "::error::brak fsck.erofs"; exit 1; }
          "$WD/erofs/dump.erofs" --help >/dev/null 2>&1 || { echo "::error::brak dump.erofs"; exit 1; }
          rm -rf "$SRCD"
          echo "== smoke 1: lpmake -S -> simg2img -> lpunpack (lancuch sparse) =="
          dd if=/dev/urandom of="$SHMD/fake.img" bs=1M count=8 status=none
          "$WD/bin/lpmake" --device-size=33554432 --metadata-size=65536 --metadata-slots=3 \
            --block-size=4096 --alignment=1048576 --super-name=super -S \
            --group=main_a:16777216 \
            --partition=system_a:readonly:8388608:main_a --image=system_a="$SHMD/fake.img" \
            -o "$SHMD/super_mini.img"
          mkdir -p "$SHMD/mini_unp"
          python3 tools/simg2img.py "$SHMD/super_mini.img" "$SHMD/super_mini_raw.img"
          "$WD/bin/lpunpack" "$SHMD/super_mini_raw.img" "$SHMD/mini_unp/" >/dev/null 2>&1
          cmp "$SHMD/fake.img" "$SHMD/mini_unp/system_a.img" && echo "SPARSE roundtrip: BIT-IDENTYCZNY OK"
          echo "== smoke 2: stream_lpunpack vs lpunpack (unpacker streaming) =="
          dd if=/dev/urandom of="$SHMD/f2.img" bs=1M count=6 status=none
          "$WD/bin/lpmake" --device-size=20971520 --metadata-size=65536 --metadata-slots=3 \
            --block-size=4096 --alignment=1048576 --super-name=super \
            --group=main_a:18874368 \
            --partition=system_a:readonly:6291456:main_a --image=system_a="$SHMD/f2.img" \
            --partition=vendor_a:readonly:6291456:main_a --image=vendor_a="$SHMD/f2.img" \
            -o "$SHMD/super_raw2.img"
          mkdir -p "$SHMD/mini_unp" "$SHMD/stream_unp"
          "$WD/bin/lpunpack" "$SHMD/super_raw2.img" "$SHMD/mini_unp/" >/dev/null 2>&1
          # redirection < zamiast cat| (SIGPIPE pod pipefail; unpacker konczy po _a)
          python3 tools/stream_lpunpack.py --stdin --out "$SHMD/stream_unp" < "$SHMD/super_raw2.img" | tail -2
          cmp "$SHMD/mini_unp/system_a.img" "$SHMD/stream_unp/system.img" \
            && cmp "$SHMD/mini_unp/vendor_a.img" "$SHMD/stream_unp/vendor.img" \
            && echo "STREAM-LPUNPACK vs lpunpack: BIT-IDENTYCZNY OK"
          echo "== smoke 3: super_patch -> czastki -> simg2img -> lpunpack =="
          head -c 3145728 "$SHMD/f2.img" > "$SHMD/m3sys.img"
          head -c 2097152 "$SHMD/f2.img" > "$SHMD/m3ven.img"
          python3 tools/stream_lpunpack.py --file "$SHMD/super_raw2.img" --out "$SHMD/hd" --only system --head "$SHMD/head.bin" >/dev/null
          python3 tools/super_patch.py --head "$SHMD/head.bin" --device-size 20971520 --keep \
            --img system="$SHMD/m3sys.img" --img vendor="$SHMD/m3ven.img" \
            --out-dir "$SHMD/pts" --parts 2 --prefix sp. 2>"$SHMD/patch.log"
          if [ -f "$SHMD/pts/sp.00" ]; then
            cat "$SHMD/pts"/sp.* > "$SHMD/sp_sparse.img"
            python3 tools/simg2img.py "$SHMD/sp_sparse.img" "$SHMD/sp_raw.img"
            mkdir -p "$SHMD/sp_unp"; "$WD/bin/lpunpack" "$SHMD/sp_raw.img" "$SHMD/sp_unp/" >/dev/null 2>&1
            cmp "$SHMD/m3sys.img" "$SHMD/sp_unp/system_a.img" && cmp "$SHMD/m3ven.img" "$SHMD/sp_unp/vendor_a.img" \
              && echo "SUPER-PATCH roundtrip: BIT-IDENTYCZNY (checksumy liblp OK)"
          else
            echo "::error::super_patch nie wyprodukowal czastek"; cat "$SHMD/patch.log"; exit 1
          fi
          echo "== smoke 4: overlayfs (mody bez materializacji drzewa) =="
          rm -rf "$SHMD/ovt"; mkdir -p "$SHMD/ovt/lower/app" "$SHMD/ovt/merged" "$SHMD/ovt/upper" "$SHMD/ovt/work"
          echo g > "$SHMD/ovt/lower/app/gms.apk"; echo w > "$SHMD/ovt/lower/app/webview.apk"
          sudo mount -t overlay overlay -o lowerdir="$SHMD/ovt/lower",upperdir="$SHMD/ovt/upper",workdir="$SHMD/ovt/work" "$SHMD/ovt/merged"
          sudo rm "$SHMD/ovt/merged/app/gms.apk"
          sudo mkdir -p "$SHMD/ovt/merged/priv-app/microG"; echo m | sudo tee "$SHMD/ovt/merged/priv-app/microG/GmsCore.apk" >/dev/null
          { test ! -e "$SHMD/ovt/merged/app/gms.apk" && test -e "$SHMD/ovt/merged/app/webview.apk" \
            && test -e "$SHMD/ovt/merged/priv-app/microG/GmsCore.apk"; } \
            || { echo "::error::overlay nie dziala"; exit 1; }
          sudo umount "$SHMD/ovt/merged"
          echo "OVERLAY: whiteout + keep + inject OK"
          echo "== smoke 5: erofs w kernelu (modprobe + mini mount) =="
          rm -f "$SHMD/e.img"; "$WD/erofs/mkfs.erofs" "$SHMD/e.img" "$SHMD/ovt/lower" >/dev/null 2>&1
          mkdir -p "$SHMD/emnt"; EROFS_OK=0
          if sudo mount -t erofs -o ro,loop "$SHMD/e.img" "$SHMD/emnt" 2>/dev/null; then EROFS_OK=1; sudo umount "$SHMD/emnt";
          else sudo modprobe erofs 2>/dev/null || true
            if sudo mount -t erofs -o ro,loop "$SHMD/e.img" "$SHMD/emnt" 2>/dev/null; then EROFS_OK=1; sudo umount "$SHMD/emnt"; fi
          fi
          echo "EROFS_OK=$EROFS_OK" >> "$GITHUB_ENV"
          [ "$EROFS_OK" = "1" ] && echo "EROFS kernel: OK" || echo "::warning::kernel bez erofs - jesli bazowe obrazy sa erofs, krok 4 padnie (ext4 przejdzie)"
          # sudo: pliki w overlay-upper sa root-owned (sudo tee/cp przez merged)
          sudo rm -rf "$SHMD/fake.img" "$SHMD/f2.img" "$SHMD/super_mini.img" "$SHMD/super_mini_raw.img" \
                 "$SHMD/super_raw2.img" "$SHMD/mini_unp" "$SHMD/stream_unp" "$SHMD/m3sys.img" \
                 "$SHMD/m3ven.img" "$SHMD/hd" "$SHMD/head.bin" "$SHMD/pts" "$SHMD/patch.log" \
                 "$SHMD/sp_sparse.img" "$SHMD/sp_raw.img" "$SHMD/sp_unp" "$SHMD/ovt" "$SHMD/e.img" "$SHMD/emnt"
          echo "toolchain kompletny"
          df -h / /dev/shm | tail -2

      - name: "1. Geometria fabryczna super (super_empty.img)"
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          curl -fsSL --retry 3 -o "$WORK/super_empty.img" \
            "https://drive.usercontent.google.com/download?id=${SUPER_EMPTY_DRIVE_ID}&export=download&confirm=t" \
            || cp tools/super_empty_tb350fu.img "$WORK/super_empty.img"
          test "$(stat -c%s "$WORK/super_empty.img")" -eq 5184
          python3 tools/lpinfo.py "$WORK/super_empty.img" | tee "$WORK/geometry.txt"
          grep -q "size=9663676416" "$WORK/geometry.txt"
          grep -q "main_a" "$WORK/geometry.txt"
          grep -q "system_ext_a" "$WORK/geometry.txt"
          echo "GEOMETRIA OK: super=${SUPER_SIZE}B, grupy main_a/main_b po ${MAIN_GROUP_SIZE}B, VAB"

      - name: "2. Baza lolinet: probe przez range (zip NIE dotyka dysku)"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          python3 tools/httpzip.py "$LOLINET_ZIP" --probe | tee /tmp/lolinet-probe.txt
          grep -q "size=${LOLINET_SIZE}" /tmp/lolinet-probe.txt || echo "::warning::content-length != pin"
          python3 tools/httpzip.py "$LOLINET_ZIP" --list | tee /tmp/lolinet-list.txt
          SUPL=$(awk -F'\t' -v e="${BASE_ENTRY_PREFIX}/super.img" '$3 == e {print $1}' /tmp/lolinet-list.txt)
          BOOTL=$(awk -F'\t' -v e="${BASE_ENTRY_PREFIX}/boot.img" '$3 == e {print $1}' /tmp/lolinet-list.txt)
          echo "super.img w zipie: ${SUPL:-BRAK} B (pin ${LOLINET_SUPER_LEN}); boot.img: ${BOOTL:-BRAK} B (pin ${LOLINET_BOOT_LEN})"
          test -n "$SUPL" || { echo "::error::brak super.img w zipie lolinet"; exit 1; }
          test -n "$BOOTL" || { echo "::error::brak boot.img w zipie lolinet"; exit 1; }
          [ "$SUPL" = "$LOLINET_SUPER_LEN" ] || echo "::warning::super.img $SUPL != pin $LOLINET_SUPER_LEN"
          AVAIL=$(( $(df --output=avail -B1G "$WORK" | tail -1) ))
          echo "dysk: ${AVAIL}G wolne (wymagane >=7.5G: partycje+mkfs+czastki z progresywnym unlink)"
          [ "$AVAIL" -ge 8 ] || { echo "::error::za malo miejsca: ${AVAIL}G < 8G (saby runner; retrigger)"; exit 1; }
          df -h / /dev/shm | tail -2

      - name: "3. Donor HyperOS - TIER A (cache m1) / B / C"
        # Krok TOLERANCYJNY: donor nigdy nie zabija builda (TIER C zawsze
        # dostepny; najgorszy przypadek = build bez transplantow/fontow).
        run: |
          set +e   # receipt 36641414863: exit 2 z nieustalonego miejsca mimo || true
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          GH="gh"
          try_cache() {
            rm -rf "$SHM/dcache"; mkdir -p "$SHM/dcache"; cd "$SHM/dcache"
            if ! $GH release view donor-cache >/dev/null 2>&1; then return 2; fi
            if ! $GH release download donor-cache --clobber -p 'donor-product.manifest' -p 'donor-product.part.*' 2>/dev/null; then return 2; fi
            [ -f donor-product.manifest ] || return 2
            WMD5=$(grep -oP '(?<=md5=).*' donor-product.manifest | head -1)
            WSIZE=$(grep -oP '(?<=size=).*' donor-product.manifest | head -1)
            [ -n "$WMD5" ] && [ -n "$WSIZE" ] || return 2
            : > "$WORK/one/donor-product.img"
            for P in $(ls donor-product.part.* | sort); do cat "$P" >> "$WORK/one/donor-product.img"; rm -f "$P"; done
            GMD5=$(md5sum "$WORK/one/donor-product.img" | cut -d' ' -f1)
            GSIZE=$(stat -c%s "$WORK/one/donor-product.img")
            echo "cache: md5=$GMD5 (oczek. $WMD5), size=$GSIZE (oczek. $WSIZE)"
            [ "$GMD5" = "$WMD5" ] && [ "$GSIZE" = "$WSIZE" ] || { rm -f "$WORK/one/donor-product.img"; return 1; }
            cd "$WORK"; return 0
          }
          TIER=""
          echo "== TIER A: donor-cache =="
          RC=$(try_cache && echo 0 || echo $?)
          [ "$RC" = "0" ] && TIER="A (donor-cache release)"
          if [ -z "$TIER" ] && [ -n "${PRODUCT_DONOR_DRIVE_ID:-}" ]; then
            echo "== TIER B: product.img z Drive =="
            if curl -fL --retry 3 --speed-limit 400000 --speed-time 150 \
              -o "$WORK/one/donor-product.img" \
              "https://drive.usercontent.google.com/download?id=${PRODUCT_DONOR_DRIVE_ID}&export=download&confirm=t" 2>>"$WORK/urlprobe.log"; then
              [ "$(stat -c%s "$WORK/one/donor-product.img")" -gt 3000000000 ] && TIER="B (Drive product.img)"
            fi
          fi
          if [ -n "$TIER" ] && [ -f "$WORK/one/donor-product.img" ]; then
            echo "== harvest (tier $TIER, $(stat -c%s "$WORK/one/donor-product.img") B) =="
            rm -rf "$SHM/dmnt" "$SHM/dext"; mkdir -p "$SHM/dmnt"
            if sudo mount -t erofs -o ro,loop "$WORK/one/donor-product.img" "$SHM/dmnt" 2>/dev/null; then
              P="$SHM/dmnt"; [ -d "$SHM/dmnt/product" ] && P="$SHM/dmnt/product"
              echo "donor: loop-mount erofs OK"
            elif sudo mount -o ro,loop "$WORK/one/donor-product.img" "$SHM/dmnt" 2>/dev/null; then
              P="$SHM/dmnt"; [ -d "$SHM/dmnt/product" ] && P="$SHM/dmnt/product"
              echo "donor: loop-mount (auto) OK"
            else
              sudo "$WORK/erofs/fsck.erofs" --extract="$SHM/dext" "$WORK/one/donor-product.img" >/dev/null 2>&1 || true
              P="$SHM/dext"; [ -d "$SHM/dext/product" ] && P="$SHM/dext/product"
              echo "donor: fsck extract"
            fi
            for NAME in MiuiHome MiuiGallery MiuiGalleryNew MiuiMusic MiuiFileManager; do
              D=$(sudo find "$P" -maxdepth 3 -type d -iname "$NAME" 2>/dev/null | head -1)
              if [ -n "$D" ] && sudo find "$D" -name '*.apk' 2>/dev/null | grep -q .; then
                DEST="$WORK/keep/app/$(basename "$D" | sed 's/New$//')"
                mkdir -p "$DEST"
                sudo find "$D" -name '*.apk' -exec cp -a {} "$DEST/" \;
                sudo chown -R "$(id -u):$(id -g)" "$DEST"
                echo "  apk: $NAME <- $D"
              fi
            done
            if sudo test -d "$P/fonts"; then
              sudo find "$P/fonts" -maxdepth 1 \( -name 'Mi*.ttf' -o -name 'Mi*.otf' \) -size +100k -exec cp -a {} "$WORK/keep/fonts/" \;
              sudo chown "$(id -u):$(id -g)" "$WORK/keep/fonts"/* 2>/dev/null || true
            fi
            sudo umount "$SHM/dmnt" 2>/dev/null || true
            rm -rf "$WORK/one/donor-product.img" "$SHM/dext" "$SHM/dcache"
            NA=$(find "$WORK/keep/app" -name '*.apk' | wc -l)
            NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
            echo "harvest: $NA apk, $NF fontow"
            if [ "$NA" -ge 1 ]; then echo "OK (tier $TIER; $NA apk: $(ls "$WORK/keep/app" | tr '\n' ' '))" > /tmp/transplant.status
            else echo "BRAK APK mimo tier $TIER" > /tmp/transplant.status; fi
          else
            echo "== TIER C: fonty z assets.tar.gz (product.img Xiaomi) w transfer-spool =="
            if ls spool/transfer/drive-1IjQeuVkiaE6B5c9YZkZJTpiAI-n4EU_1-assets.tar.gz.part.* >/dev/null 2>&1; then
              rm -rf "$SHM/tierc"; mkdir -p "$SHM/tierc"
              cat spool/transfer/drive-1IjQeuVkiaE6B5c9YZkZJTpiAI-n4EU_1-assets.tar.gz.part.* > "$SHM/tierc/assets.tar.gz"
              echo "assets.tar.gz: $(stat -c%s "$SHM/tierc/assets.tar.gz") B"
              # UWAGA: GitHub dokleja -e do run:; tar|head/grep -q = SIGPIPE pod
              # pipefail => krok padal (receipt 36641414863, exit 2). Listing do PLIKU.
              tar tzf "$SHM/tierc/assets.tar.gz" > "$SHM/tierc/tarlist.txt" 2>/dev/null || true
              echo "-- zawartosc (sample) --"; head -12 "$SHM/tierc/tarlist.txt"
              FONTS=$(grep -icE '\.(ttf|otf|ttc)$' "$SHM/tierc/tarlist.txt" || true)
              echo "plikow fontow w tar: ${FONTS:-0}"
              if [ "${FONTS:-0}" -gt 0 ]; then
                tar xzf "$SHM/tierc/assets.tar.gz" -C "$SHM/tierc" 2>/dev/null || true
                find "$SHM/tierc" \( -name 'Mi*.ttf' -o -name 'Mi*.otf' -o -name 'Mi*.ttc' \) -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; 2>/dev/null || true
                NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
                if [ "$NF" -eq 0 ]; then
                  find "$SHM/tierc" \( -name '*.ttf' -o -name '*.otf' \) -size +100k | head -8 | while read -r F; do
                    [ "$(ls "$WORK/keep/fonts" | wc -l)" -lt 8 ] && cp -a "$F" "$WORK/keep/fonts/" || true
                  done
                  NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
                fi
                echo "OK (TIER C; fonty z assets.tar.gz: $NF)" > /tmp/transplant.status
              else
                echo "TIER C: brak fontow w assets.tar.gz (0 .ttf/.otf/.ttc)" > /tmp/transplant.status
              fi
              rm -rf "$SHM/tierc"
            else
              echo "FALLBACK (brak donor-cache m1, brak PRODUCT_DONOR_DRIVE_ID, brak assets w spool; build bez transplantow)" > /tmp/transplant.status
            fi
          fi
          cat /tmp/transplant.status || true
          [ -f /tmp/transplant.status ] || echo "FALLBACK (krok 3 przerwany wczesniej; bez transplantow)" > /tmp/transplant.status
          rm -rf "$SHM/dcache" "$SHM/dmnt" "$SHM/dext" "$SHM/tierc"
          df -h / /dev/shm | tail -2
          exit 0

      - name: "4. Baza per-partycja (httpzip range) + mody overlay + mkfs"
        # Kolejnosc pod budzet dysku (peak ~8,1G):
        #   odm_dlkm (348K, +head) -> system (3,7G src + 3,5G out) ->
        #   product (2,8G src, out -> TMPFS) -> system_ext+vendor+vendor_dlkm
        #   (jeden pass do konca super) -> boot.img.
        # Mody na overlayfs: PURGE=whiteout, INJECT/TRANSPLANT=upper,
        # build.prop=copy-up; mkfs.erofs z merged (bez drzewa na dysku).
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          need() { # $1=G $2=co
            AV=$(( $(df --output=avail -B1G "$WORK" | tail -1) ))
            [ "$AV" -ge "$1" ] || { echo "::error::$2: ${AV}G < ${1}G (retrigger na lepszy runner)"; exit 1; }
          }
          ov_up() { # $1=part -> /mnt/m3/$1/merged
            sudo mkdir -p "/mnt/m3/$1/lower" "/mnt/m3/$1/merged" "$SHM/ov/$1/upper" "$SHM/ov/$1/work"
            if ! sudo mount -t erofs -o ro,loop "$WORK/one/$1.img" "/mnt/m3/$1/lower" 2>/dev/null; then
              if ! sudo mount -o ro,loop "$WORK/one/$1.img" "/mnt/m3/$1/lower" 2>/dev/null; then
                echo "::error::$1: nie daje sie zamontowac (erofs_ok=$EROFS_OK; moze kernel?)"; return 1
              fi
            fi
            sudo mount -t overlay overlay \
              -o "lowerdir=/mnt/m3/$1/lower,upperdir=$SHM/ov/$1/upper,workdir=$SHM/ov/$1/work" \
              "/mnt/m3/$1/merged"
          }
          ov_down() { # $1=part
            sudo umount "/mnt/m3/$1/merged" 2>/dev/null || true
            sudo umount "/mnt/m3/$1/lower" 2>/dev/null || true
            sudo rm -rf "$SHM/ov/$1"
          }
          purge_gms() { # $1=merged; stdout = liczba usunietych (diag stderr)
            local M="$1" N=0 D
            local HITS
            HITS=$(sudo find "$M/app" "$M/priv-app" -maxdepth 1 -type d 2>/dev/null | grep -iE \
              'gms|google|Phonesky|SetupWizard|PrebuiltGmsCore|GoogleServicesFramework|GooglePartnerSetup|GoogleFeedback|GoogleOneTimeInitializer|GoogleRestore|ConfigUpdater|CarrierServices|AndroidPlatformServices|GoogleExt' || true)
            if [ -n "$HITS" ]; then
              printf '%s\n' "$HITS" >> /tmp/gms-purge.list
              printf '%s\n' "$HITS" >&2
            fi
            for D in $HITS; do
              case "$(basename "$D")" in
                com.google.android.webview|WebView) echo "  ZOSTAWIAM (webview): $(basename "$D")" >&2; continue ;;
              esac
              sudo rm -rf "$D"; N=$((N+1))
            done
            # xml-e Google: po nazwie PLIKU (privapp-permissions-com.google.*) lub zawartosci
            sudo find "$M/etc/permissions" "$M/etc/sysconfig" -name '*.xml' 2>/dev/null \
              | grep -iE 'google|gms' | sudo xargs -r rm -f || true
            sudo find "$M/etc/permissions" "$M/etc/sysconfig" -name '*.xml' 2>/dev/null \
              | sudo xargs -r grep -il 'gms\|google' 2>/dev/null | sudo xargs -r rm -f || true
            echo "$N"
          }
          pass() { # $1=lista part (csv), $2=outdir, $3=--head? (opcjonalny plik)
            local HEADARG=()
            [ -n "${3:-}" ] && HEADARG=(--head "$3")
            python3 tools/httpzip.py "$LOLINET_ZIP" --entry "${BASE_ENTRY_PREFIX}/super.img" \
              | python3 tools/stream_lpunpack.py --stdin --only "$1" --out "$2" "${HEADARG[@]}" \
              | tee -a /tmp/stream-manifest.txt
          }
          rm -f /tmp/stream-manifest.txt
          echo "== pass 1: odm_dlkm (+ zapis glowy super) =="
          pass odm_dlkm "$WORK/one" "$WORK/one/head_super.bin"
          awk -F'\t' '$1=="W" && $2=="odm_dlkm" && $5=="OK"{ok=1} END{exit !ok}' /tmp/stream-manifest.txt \
            || { echo "::error::odm_dlkm niepelny"; exit 1; }
          mv "$WORK/one/odm_dlkm.img" "$WORK/img/"
          python3 tools/lpinfo.py "$WORK/one/head_super.bin" | tee "$WORK/base-super-geometry.txt"
          grep -q "main_a" "$WORK/base-super-geometry.txt"
          grep -q "system_a" "$WORK/base-super-geometry.txt"
          df -h / /dev/shm | tail -2
          echo "== pass 2: system + mody =="
          need 7 "system"
          pass system "$WORK/one"
          awk -F'\t' '$1=="W" && $2=="system" && $5=="OK"{ok=1} END{exit !ok}' /tmp/stream-manifest.txt \
            || { echo "::error::system niepelny"; exit 1; }
          ov_up system
          M="/mnt/m3/system/merged"
          [ -d "$M/app" ] || { echo "::error::system: brak /app w merged"; exit 1; }
          echo "== PURGE GMS (system) =="
          N=$(purge_gms "$M"); echo "system: USUNIETO $N katalogow Google"
          echo "== INJECT microG + FakeStore + Aurora =="
          curl -fsSL --retry 3 -o /tmp/gmscore.apk "$GMS_APK_URL"
          curl -fsSL --retry 3 -o /tmp/fakestore.apk "$VENDING_APK_URL"
          AURORA_PICK=""
          for U in "$AURORA_URL" "https://gitlab.com/AuroraOSS/AuroraStore/uploads/3376fef895820893ddeb7154b056a07e/AuroraStore-preload-4.8.4.apk"; do
            if curl -fsI --connect-timeout 20 "$U" >/dev/null 2>&1; then AURORA_PICK="$U"; break; fi
          done
          test -n "$AURORA_PICK" || { echo "::error::AuroraStore: zaden URL nie odpowiada"; exit 1; }
          curl -fsSL --retry 3 -o /tmp/aurora.apk "$AURORA_PICK"
          sudo mkdir -p "$M/priv-app/microG" "$M/priv-app/FakeStore" "$M/app/AuroraStore"
          sudo cp /tmp/gmscore.apk   "$M/priv-app/microG/GmsCore.apk"
          sudo cp /tmp/fakestore.apk "$M/priv-app/FakeStore/FakeStore.apk"
          sudo cp /tmp/aurora.apk    "$M/app/AuroraStore/AuroraStore.apk"
          sudo tee "$M/etc/permissions/privapp-permissions-mystical.xml" > /dev/null <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
            <privapp-permissions package="com.google.android.gms">
              <permission name="android.permission.FAKE_PACKAGE_SIGNATURE"/>
              <permission name="android.permission.INSTALL_LOCATION_PROVIDER"/>
              <permission name="android.permission.UPDATE_DEVICE_STATS"/>
              <permission name="android.permission.UPDATE_APP_OPS_STATS"/>
              <permission name="android.permission.CHANGE_DEVICE_IDLE_TEMP_WHITELIST"/>
              <permission name="android.permission.MANAGE_USB"/>
              <permission name="android.permission.MODIFY_PHONE_STATE"/>
              <permission name="android.permission.FOREGROUND_SERVICE"/>
              <permission name="android.permission.LOCAL_MAC_ADDRESS"/>
              <permission name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
            </privapp-permissions>
            <privapp-permissions package="com.android.vending">
              <permission name="android.permission.FAKE_PACKAGE_SIGNATURE"/>
            </privapp-permissions>
          </permissions>
          XEOF
          echo "== TRANSPLANT: $(cat /tmp/transplant.status 2>/dev/null | head -1) =="
          if [ -d "$WORK/keep/app" ] && [ -n "$(ls "$WORK/keep/app" 2>/dev/null)" ]; then
            for D in "$WORK/keep/app"/*; do
              NAME=$(basename "$D")
              sudo mkdir -p "$M/app/$NAME"; sudo cp -a "$D"/. "$M/app/$NAME/"
              echo "  transplant: /system/app/$NAME"
            done
          fi
          if [ -d "$WORK/keep/fonts" ] && [ -n "$(ls "$WORK/keep/fonts" 2>/dev/null)" ]; then
            sudo cp -a "$WORK/keep/fonts"/*.ttf "$M/fonts/" 2>/dev/null || true
            sudo cp -a "$WORK/keep/fonts"/*.otf "$M/fonts/" 2>/dev/null || true
            sudo cp -a "$WORK/keep/fonts"/*.ttc "$M/fonts/" 2>/dev/null || true
            echo "  fonty: $(sudo ls "$M/fonts" | grep -icE 'mi|sans' || true) z $(ls "$WORK/keep/fonts" | wc -l) (fonts.xml nietkniety)"
          fi
          if [ -d "$WORK/keep/themes" ] && [ -n "$(ls "$WORK/keep/themes" 2>/dev/null)" ]; then
            sudo mkdir -p "$M/miui-themes"; sudo cp -a "$WORK/keep/themes"/. "$M/miui-themes/"
            echo "  motywy: /system/miui-themes ($(sudo du -sm "$M/miui-themes" | cut -f1) MB, inertne)"
          fi
          echo "== audyt miui-framework w transplantach =="
          sudo find "$M/app" -maxdepth 2 -name '*.apk' 2>/dev/null | while read -r APK; do
            REF=$(sudo unzip -p "$APK" classes.dex 2>/dev/null | strings -a 2>/dev/null | grep -cE "^Lmiui/|^Lcom/miui/" || true)
            echo "  $(basename "$APK"): ${REF:-0} odniesien miui.*"
          done
          printf '\n# === MysticalOS 3 ===\nro.mysticalos.version=3\nro.mysticalos.base=%s\n# display mitigation (receipt ANALIZA-RGB-forensics-29IX):\n# staly refresh, bez content-detection przy pierwszym mode-switch\nro.surface_flinger.use_content_detection_for_refresh_rate=false\n' "$BASE_BUILD" | sudo tee -a "$M/build.prop" >/dev/null
          sudo grep -c "mysticalos" "$M/build.prop"
          echo "== pre-flight kontekstow SELinux =="
          FC="$M/etc/selinux/plat_file_contexts"
          sudo test -f "$FC" || { echo "::error::brak plat_file_contexts w systemie Lenovo"; exit 1; }
          sudo cp "$FC" "$WORK/plat.fc"; sudo chown "$(id -u):$(id -g)" "$WORK/plat.fc"
          sudo python3 tools/fc_fixup.py --contexts "$FC" --root "$M" --dry-run --report /tmp/fc-report.txt
          if grep -E "MISS .*(priv-app/microG|priv-app/FakeStore|app/AuroraStore|app/Miui|permissions-mystical|fonts/Mi|miui-themes)" /tmp/fc-report.txt; then
            echo "::error::dodane pliki bez kontekstu"; exit 1
          fi
          echo "pre-flight kontekstow: OK"
          df -h / /dev/shm | tail -2
          echo "== mkfs system (EROFS, UUID m3) =="
          sudo "$WORK/erofs/mkfs.erofs" -zlz4 -T 0 -U 6d797374-6963-4000-8000-616c00000003 \
            --file-contexts="$FC" "$WORK/img/system.img" "$M"
          sudo chown "$(id -u):$(id -g)" "$WORK/img/system.img"
          ov_down system
          rm -f "$WORK/one/system.img"
          echo "== weryfikacja system.img (fsck strukturalny + dump.erofs) =="
          sudo "$WORK/erofs/fsck.erofs" "$WORK/img/system.img" >/dev/null 2>&1 && echo "fsck: OK"
          # bez potoku: dump|grep -q => SIGPIPE dump pod -e+pipefail (receipt 36641414863)
          path_ok() {
            local O
            O=$(sudo "$WORK/erofs/dump.erofs" --path="$1" "$WORK/img/system.img" 2>&1 || true)
            printf '%s' "$O" | grep -q "<E>" && return 1
            return 0
          }
          path_ok /priv-app/microG/GmsCore.apk   || { echo "::error::brak GmsCore w obrazie"; exit 1; }
          path_ok /priv-app/FakeStore/FakeStore.apk || { echo "::error::brak FakeStore"; exit 1; }
          path_ok /app/AuroraStore/AuroraStore.apk  || { echo "::error::brak Aurora"; exit 1; }
          path_ok /etc/permissions/privapp-permissions-mystical.xml || { echo "::error::brak perms xml"; exit 1; }
          path_ok /priv-app/PrebuiltGmsCore && { echo "::error::GMS pozostal w systemie!"; exit 1; } || true
          BPV=$(sudo "$WORK/erofs/dump.erofs" --path=/build.prop --cat "$WORK/img/system.img" 2>/dev/null || true)
          printf '%s' "$BPV" | grep -q "ro.mysticalos.version=3" \
            || { echo "::error::build.prop bez mysticalos"; exit 1; }
          APLS=$(sudo "$WORK/erofs/dump.erofs" --path=/app --ls "$WORK/img/system.img" 2>/dev/null || true)
          printf '%s' "$APLS" | grep -qi webview && echo "webview: ZACHOWANY w obrazie"
          echo "system_m3: $(stat -c%s "$WORK/img/system.img") B (bazowy system: 3678793728 B)"
          df -h / /dev/shm | tail -2
          echo "== pass 3: product + PURGE =="
          need 6 "product"
          pass product "$WORK/one"
          awk -F'\t' '$1=="W" && $2=="product" && $5=="OK"{ok=1} END{exit !ok}' /tmp/stream-manifest.txt \
            || { echo "::error::product niepelny"; exit 1; }
          ov_up product
          MP="/mnt/m3/product/merged"
          if [ -d "$MP/app" ] || [ -d "$MP/priv-app" ]; then
            echo "== PURGE GMS (product) =="
            N=$(purge_gms "$MP"); echo "product: USUNIETO $N katalogow Google"
            if [ "$N" -gt 0 ]; then
              echo "PURGED_product=1" >> /tmp/purge-partitions.status
              DF="$MP/etc/selinux/product_file_contexts"
              sudo test -f "$DF" || DF="$WORK/plat.fc"
              sudo test -f "$DF" || { echo "::error::product: brak kontekstow"; exit 1; }
              mkdir -p "$SHM/out"
              sudo "$WORK/erofs/mkfs.erofs" -zlz4 -T 0 -U 6d797374-6963-4000-8000-616c00000013 \
                --file-contexts="$DF" "$SHM/out/product.img" "$MP"
              sudo chown "$(id -u):$(id -g)" "$SHM/out/product.img"
              echo "product_m3 -> tmpfs: $(stat -c%s "$SHM/out/product.img") B"
            else
              echo "product: zero Google - oryginal"
              mv "$WORK/one/product.img" "$WORK/img/product.img"
            fi
          else
            echo "product: drzewo bez /app - oryginal"
            mv "$WORK/one/product.img" "$WORK/img/product.img"
          fi
          ov_down product
          rm -f "$WORK/one/product.img"
          df -h / /dev/shm | tail -2
          echo "== pass 4: system_ext + vendor + vendor_dlkm (jeden pass do konca) =="
          need 5 "system_ext/vendor"
          pass system_ext,vendor,vendor_dlkm "$WORK/one"
          for P in system_ext vendor vendor_dlkm; do
            awk -F'\t' -v p="$P" '$1=="W" && $2==p && $5=="OK"{ok=1} END{exit !ok}' /tmp/stream-manifest.txt \
              || { echo "::error::$P niepelny"; exit 1; }
          done
          if [ -s "$WORK/one/system_ext.img" ]; then
            ov_up system_ext
            ME="/mnt/m3/system_ext/merged"
            if [ -d "$ME/app" ] || [ -d "$ME/priv-app" ]; then
              echo "== PURGE GMS (system_ext) =="
              N=$(purge_gms "$ME"); echo "system_ext: USUNIETO $N katalogow Google"
              if [ "$N" -gt 0 ]; then
                echo "PURGED_system_ext=1" >> /tmp/purge-partitions.status
                DF="$ME/etc/selinux/system_ext_file_contexts"
                sudo test -f "$DF" || DF="$WORK/plat.fc"
                sudo test -f "$DF" || { echo "::error::system_ext: brak kontekstow"; exit 1; }
                sudo "$WORK/erofs/mkfs.erofs" -zlz4 -T 0 -U 6d797374-6963-4000-8000-616c00000023 \
                  --file-contexts="$DF" "$WORK/img/system_ext.img" "$ME"
                sudo chown "$(id -u):$(id -g)" "$WORK/img/system_ext.img"
                echo "system_ext_m3: $(stat -c%s "$WORK/img/system_ext.img") B"
              else
                echo "system_ext: zero Google - oryginal"
                mv "$WORK/one/system_ext.img" "$WORK/img/system_ext.img"
              fi
            else
              mv "$WORK/one/system_ext.img" "$WORK/img/system_ext.img"
            fi
            ov_down system_ext
            rm -f "$WORK/one/system_ext.img"
          fi
          mv "$WORK/one/vendor.img" "$WORK/img/" 2>/dev/null || true
          mv "$WORK/one/vendor_dlkm.img" "$WORK/img/" 2>/dev/null || true
          echo "== boot.img przez httpzip =="
          python3 tools/httpzip.py "$LOLINET_ZIP" --entry "${BASE_ENTRY_PREFIX}/boot.img" > "$WORK/one/boot.img"
          BSL=$(stat -c%s "$WORK/one/boot.img")
          echo "boot.img: $BSL B (pin ${LOLINET_BOOT_LEN})"
          [ "$BSL" = "$LOLINET_BOOT_LEN" ] || echo "::warning::boot.img $BSL != pin $LOLINET_BOOT_LEN"
          echo "== obrazy po petli =="
          ls -la "$WORK/img/" "$SHM/out/" 2>/dev/null
          for REQ in system vendor; do
            test -s "$WORK/img/$REQ.img" || { echo "::error::brak $REQ.img"; exit 1; }
          done
          echo "Baza+MODY kompletne"
          df -h / /dev/shm | tail -2

      - name: "5. super_patch -> ~32 czastek (metadane bazowe + sparse on-the-fly)"
        # Obrazy przekazywane sa do patchera i UNLINKOWANE po skonsumowaniu
        # (dysk zwalnia w trakcie zapisu czastek; product z tmpfs konsumowany
        # pierwszy). Po petli na dysku zostaja tylko czastki + kit.
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          PPRODUCT="$WORK/img/product.img"
          [ -s "$PPRODUCT" ] || PPRODUCT="$SHM/out/product.img"
          PSYSXT="$WORK/img/system_ext.img"
          IMGARGS=(--img system="$WORK/img/system.img" --img product="$PPRODUCT")
          [ -s "$PSYSXT" ] && IMGARGS+=(--img system_ext="$PSYSXT")
          IMGARGS+=(--img vendor="$WORK/img/vendor.img" --img odm_dlkm="$WORK/img/odm_dlkm.img" --img vendor_dlkm="$WORK/img/vendor_dlkm.img")
          echo "== super_patch (czastki + sha256 on-the-fly) =="
          python3 tools/super_patch.py --head "$WORK/one/head_super.bin" \
            --device-size "$SUPER_SIZE" "${IMGARGS[@]}" \
            --out-dir "$WORK/kit" --parts 32 2> "$WORK/patch.log"
          grep -E "^(S|L|#)" "$WORK/patch.log" | tee "$WORK/super-patch-manifest.txt"
          awk -F'\t' '$1=="S"{print $3"  "$2}' "$WORK/patch.log" > "$WORK/kit/parts.sha"
          NP=$(ls "$WORK/kit"/super_mystical3.part.* | wc -l)
          echo "czastek: $NP (rozmiar kit: $(du -sh "$WORK/kit" | cut -f1))"
          [ "$NP" -le 32 ] || { echo "::error::wiecej niz 32 czastki ($NP)"; exit 1; }
          [ "$NP" -ge 30 ] || echo "::warning::czastek tylko $NP (sparse mniejszy niz zakladano)"
          echo "== weryfikacja zlozonego sparse (glowa raw -> lpinfo) =="
          python3 tools/sparse_head.py 4194304 "$WORK/kit"/super_mystical3.part.* > "$SHM/super_head.img"
          python3 tools/lpinfo.py "$SHM/super_head.img" | tee "$WORK/super-built-geometry.txt"
          grep -q "size=9663676416" "$WORK/super-built-geometry.txt"
          grep -q "system_a" "$WORK/super-built-geometry.txt"
          grep -q "main_a" "$WORK/super-built-geometry.txt"
          grep -q "vendor_a" "$WORK/super-built-geometry.txt"
          echo "GEOMETRIA zbudowanego super: ZWERYFIKOWANA"
          rm -f "$SHM/super_head.img"
          echo "== sha256 zlozonego sparse (streamowane) =="
          SPARSUM=$(cat "$WORK/kit"/super_mystical3.part.* | sha256sum | cut -d' ' -f1)
          SSZ=$(awk -F'\t' '$1=="S"{s+=$4} END{print s}' "$WORK/patch.log")
          { echo "parts=$NP"
            echo "size_sparse=$SSZ"
            echo "sha256_sparse_zlozony=$SPARSUM"; } > "$WORK/kit/super.manifest"
          cat "$WORK/kit/super.manifest"
          echo "== czystka po patcherze =="
          rm -f "$WORK/img"/*.img "$SHM/out"/*.img 2>/dev/null || true
          df -h / /dev/shm | tail -2

      - name: "6. vbmeta_disable + kit (FLASH-M3 + SHA256SUMS)"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          python3 "$WORK/bin/avbtool.py" make_vbmeta_image --flags 3 -o "$WORK/kit/vbmeta_disable.img" --padding_size 4096
          truncate -s 8192 "$WORK/kit/vbmeta_disable.img"
          cp "$WORK/kit/vbmeta_disable.img" "$WORK/kit/vbmeta_system_disable.img"
          truncate -s 4096 "$WORK/kit/vbmeta_system_disable.img"
          cp "$WORK/kit/vbmeta_disable.img" "$WORK/kit/vbmeta_vendor_disable.img"
          truncate -s 4096 "$WORK/kit/vbmeta_vendor_disable.img"
          [ -s "$WORK/one/boot.img" ] && cp "$WORK/one/boot.img" "$WORK/kit/boot_${BASE_BUILD}.img" \
            || echo "::warning::brak boot.img"
          cp tools/simg2img.py "$WORK/kit/simg2img.py"
          cat > "$WORK/kit/FLASH-M3.md" <<EOT
          # MysticalOS 3 - flash super.img (TB350FU)

          ## Co to jest
          Pelny kontener super (fabryczna geometria 9,66 GB, VAB, slot A) ze
          SPOJNYM zestawem S230982 (system_ext/product/vendor/odm*) + system
          MysticalOS 3 (PURGE GMS [webview zostaje] + microG + FakeStore +
          Aurora + transplant HyperOS + staly refresh rate).

          ## Format
          super_mystical3.part.NN = SPARSE super.img w ~32 czastkach
          (zlozenie: cat super_mystical3.part.* > super_mystical3.img;
          potem sha256sum -c SHA256SUMS.txt).

          ## Flash (fastbootd; bootloader odblokowany)
          1. fastboot flash vbmeta vbmeta_disable.img
          2. fastboot flash vbmeta_system vbmeta_system_disable.img
          3. fastboot flash vbmeta_vendor vbmeta_vendor_disable.img
          4. fastboot flash super super_mystical3.img   (fastbootd sam
             rozpakuje sparse; do fastbootd: fastboot reboot fastboot)
          5. fastboot --set-active=a    (build zawiera TYLKO slot A!)
          6. fastboot reboot
          7. JESLI bootloop (kernel S231044 vs moduly S230982):
             fastboot flash boot boot_${BASE_BUILD}.img && fastboot reboot

          ## UWAGI
          - to NIE jest DSU: super nadpisuje partycje dynamiczne na stale;
            slot B zostaje nietkniety (rollback: fastboot --set-active=b),
          - SP Flash Tool: najpierw konwersja sparse->raw:
            python3 simg2img.py super_mystical3.img super_raw.img
            (format sparse Android, magic 0xED26FF3A),
          - userdata zostaje (A14->A14, ten sam branch),
          - apki MIUI moga wymagac frameworku MIUI (audyt w trace);
            Aurora Store doinstaluje launcher z sieci w razie problemow.
          EOT
          cat > "$WORK/kit/sprawdz.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u; rc=0
          echo "== sha256sum -c SHA256SUMS.txt =="; sha256sum -c SHA256SUMS.txt || rc=1
          [ $rc -eq 0 ] && echo "WSZYSTKO ZGODNE." || echo "NIEZGODNE - pobierz ponownie."
          exit $rc
          EOF
          chmod +x "$WORK/kit/sprawdz.sh"
          cd "$WORK/kit"
          cat parts.sha > SHA256SUMS.txt
          sha256sum vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img \
            $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" ) >> SHA256SUMS.txt
          head -5 SHA256SUMS.txt
          ls -la
          df -h / /dev/shm | tail -2

      - name: "7. Release mysticalos-3-super (czastki + kit)"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          cd "$WORK/kit"
          TRANSPLANT=$(cat /tmp/transplant.status 2>/dev/null | head -1 || echo "?")
          gh release delete mysticalos-3-super --yes --cleanup-tag 2>/dev/null || true
          gh release create mysticalos-3-super --target "$GITHUB_SHA" \
            --title "MysticalOS 3 - TB350FU super.img repack (stock Lenovo base + microG/Aurora + HyperOS transplant)" \
            --notes "MysticalOS 3 = hybrydowy super.img w FABRYCZNEJ geometrii TB350FU (9,66 GB, VAB, slot A): spojny zestaw S230982 (system_ext/product/vendor/odm*) + system MysticalOS 3 (PURGE GMS z system+product+system_ext; zachowany tylko WebView; microG v0.3.16.252432 + FakeStore + Aurora 4.8.4; transplant: $TRANSPLANT; mitigation display: staly refresh rate). Techniczne: ekstrakcja bazy strumieniowo z zipa lolinet (httpzip range + stream_lpunpack), modyfikacje na overlayfs (bez materializacji drzew), super zbudowany wlasnym patcherem liblp (checksumy zgodne z AOSP lpunpack). Format: sparse super w ~32 czastkach + vbmeta_disable (flags=3) + boot_S230982 + simg2img.py. Flash: fastbootd wg FLASH-M3.md (vbmeta x3 -> super -> set-active=a). Slot B = rollback. To zamiana partycji dynamicznych, NIE DSU." \
            super_mystical3.part.* vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img \
            FLASH-M3.md sprawdz.sh SHA256SUMS.txt super.manifest simg2img.py $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" )
          gh release view mysticalos-3-super --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)B [\(.state)]")'

      - name: "8. Linki publiczne (gofile; 3 tary przez tmpfs)"
        # Czastki ~8,4G => 3 tary po ~2,8G (tar pojedynczo w tmpfs, upload,
        # zwolnienie; pelny tar nie zmiescilby sie obok czastek na dysku).
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          cd "$WORK/kit"
          rm -rf "$SHM/gf"; mkdir -p "$SHM/gf"
          NP=$(ls super_mystical3.part.* | wc -l)
          T1=$(( (NP + 2) / 3 )); T2=$(( (2 * NP + 2) / 3 ))
          set -- super_mystical3.part.*
          A1=(); A2=(); A3=(); i=0
          for F in "$@"; do
            if [ "$i" -lt "$T1" ]; then A1+=("$F")
            elif [ "$i" -lt "$T2" ]; then A2+=("$F")
            else A3+=("$F"); fi
            i=$((i+1))
          done
          { echo "== MysticalOS 3 super kit (gofile, 3 tary) =="
            echo "Po rozpakowaniu WSZYSTKICH tarow w jednym katalogu:"
            echo "  cat super_mystical3.part.* > super_mystical3.img"
            echo "  sha256sum -c SHA256SUMS.txt"; } > /tmp/links-m3.md
          tar cf "$SHM/gf/MysticalOS3_kit-A.tar" "${A1[@]}" FLASH-M3.md sprawdz.sh SHA256SUMS.txt super.manifest simg2img.py $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" )
          bash tools/public_links.sh "$SHM/gf/MysticalOS3_kit-A.tar" /tmp/links-A.md || true
          cat /tmp/links-A.md >> /tmp/links-m3.md 2>/dev/null || true
          rm -f "$SHM/gf/MysticalOS3_kit-A.tar"
          tar cf "$SHM/gf/MysticalOS3_kit-B.tar" "${A2[@]}" vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img
          bash tools/public_links.sh "$SHM/gf/MysticalOS3_kit-B.tar" /tmp/links-B.md || true
          cat /tmp/links-B.md >> /tmp/links-m3.md 2>/dev/null || true
          rm -f "$SHM/gf/MysticalOS3_kit-B.tar"
          tar cf "$SHM/gf/MysticalOS3_kit-C.tar" "${A3[@]}"
          bash tools/public_links.sh "$SHM/gf/MysticalOS3_kit-C.tar" /tmp/links-C.md || true
          cat /tmp/links-C.md >> /tmp/links-m3.md 2>/dev/null || true
          rm -rf "$SHM/gf"

      - name: "9. Raport z linkami + trace do repo"
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          mkdir -p reports
          F="reports/mystical3-links-${{ github.run_id }}.md"
          { echo "### MysticalOS 3 (super.img TB350FU) links (run ${{ github.run_id }})"
            echo "release: mysticalos-3-super"
            echo "transplant: $(cat /tmp/transplant.status 2>/dev/null | head -1 || echo '?')"
            echo "purge product/system_ext: $(cat /tmp/purge-partitions.status 2>/dev/null | tr '\n' ' ' || echo 'brak zmian')"
            echo
            echo "--- gofile (3 tary) ---"; cat /tmp/links-m3.md 2>/dev/null || echo "(brak)"
            echo "--- manifest stream_lpunpack (baza) ---"; cat /tmp/stream-manifest.txt 2>/dev/null || echo "(brak)"
            echo "--- manifest super_patch ---"; cat "$WORK/super-patch-manifest.txt" 2>/dev/null || echo "(brak)"
            echo "--- sondy URL ---"; cat "$WORK/urlprobe.log" 2>/dev/null || echo "(brak)"
            echo "--- manifest ---"; cat "$WORK/kit/super.manifest" 2>/dev/null || echo "(brak)"
            echo "--- geometria fabryczna ---"; cat "$WORK/geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- metadane bazowego super ---"; cat "$WORK/base-super-geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- geometria zbudowana ---"; cat "$WORK/super-built-geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- purge GMS ---"; cat /tmp/gms-purge.list 2>/dev/null || echo "(brak)"; } > "$F" || true
          cat "$F" || true
          if [ -f reports/mystical3-build-trace.log ]; then
            echo "trace builda: reports/mystical3-build-trace.log ($(stat -c%s reports/mystical3-build-trace.log) B)"
          fi
          git add -f reports tools/lpinfo.py tools/simg2img.py tools/httpzip.py tools/stream_lpunpack.py tools/super_patch.py tools/sparse_head.py tools/test_super_roundtrip.sh || true
          git commit -q -m "m3-links+trace: run ${{ github.run_id }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || echo "push nie wyszedl"
          exit 0
