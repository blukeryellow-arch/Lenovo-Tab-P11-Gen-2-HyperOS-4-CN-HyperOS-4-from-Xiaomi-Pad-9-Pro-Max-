name: release-mystical3

# ============================================================================
# MysticalOS 3 - HYBRYDOWY SUPER.IMG TB350FU (zlecenie 29 IX, "BUILD V16")
# UWAGA v8.1: super.img w zipie lolinet jest SPARSE (8 297 863 612 B sparse
# -> 9 663 676 416 B raw; receipt 36725294534: segmenty _a do 8 365 445 120
# raw > rozmiar pliku => NIE raw). Stad simg2img_stream w pipeline (stdin->stdout,
# passthrough gdy wejscie nie-sparse).
# Repack wewnatrz FABRYCZNEGO layoutu super Lenovo (super.img container).
#
# RECEIPTY (sondy 36592788531/36602341301/36605363414 + runy 36600150934/
# 36601392335/36603503837):
#   - runner: dysk 72G, avail na czystym FLUKTUJE 8-14G; RAM 7,9G ->
#     /dev/shm (tmpfs) = 3,9G (NIE 8G!),
#   - zip lolinet (4 692 836 474 B) NIE jest OTA payload - to pakiet
#     SP Flash Tool: image/super.img RAW 8 297 863 612 B (deflate 45%),
#     boot.img 67 108 864 B itd.; rozpakowanie super na dysk niewykonalne,
#   - lolinet wspiera HTTP range (206) -> STREAMING: httpzip.py (range-file
#     nad zipfile) + stream_lpunpack.py (sekwencyjny unpacker liblp v10.x,
#     BIT-IDENTYCZNY z lpunpack AOSP na tescie mini-super).
#
# BUDZET (worst-case dysk 8G, tmpfs 3,9G): zip NIGDY nie dotyka dysku;
# partycje bazowe _a -> $WORK/one (4,4G); pętla per-partycja (extract tree
# -> tmpfs; mody; mkfs -> $WORK/img; rm zrodla) = peak 5,9G; super: stage
# malych w tmpfs + sparse 4,5G = peak 6,0G; split tail-first z truncate =
# peak 7,7G; gofile 2 tary po ~2,3G przez tmpfs.
#
# Donor HyperOS yingtian 4.0.13 (TIERED): A=release donor-cache (m1), B=
# product.img z Drive, C=fonty z assets.tar.gz w transfer-spool (checkout).
# MODY: PURGE GMS (webview zostaje), INJECT microG+FakeStore+Aurora,
# TRANSPLANT apk MIUI+fonty+motywy, mitigation display (staly refresh).
# Output: super_mystical3 SPARSE (~32 czastki) + vbmeta_disable(flags=3) +
# boot_S230982 + FLASH-M3.md -> release mysticalos-3-super + gofile (2 tary).
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/release-mystical3.yml', 'tools/lpinfo.py', 'tools/httpzip.py', 'tools/stream_lpunpack.py']

concurrency:
  group: mystical3-super
  cancel-in-progress: false

permissions:
  contents: write
  actions: read   # poll statusu m1 w TIER A (fix: contents:write sam zeruje reszte)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      LOLINET_ZIP: https://mirrors.lolinet.com/firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/TB350FU_S230982_251013_ROW.zip
      LOLINET_SIZE: 4692836474
      LOLINET_SUPER_LEN: 8297863612
      LOLINET_BOOT_LEN: 67108864
      # rozmiary partycji _a w bazowym super S230982 (receipt: stream-manifest runu 36617353135)
      SIZE_SYSTEM: 3678793728
      SIZE_PRODUCT: 2792497152
      SIZE_SYSTEM_EXT: 756998144
      SIZE_VENDOR: 916553728
      SIZE_VENDOR_DLKM: 31363072
      SIZE_ODM_DLKM: 348160
      BASE_ENTRY_PREFIX: TB350FU_S230982_251013_ROW/image
      BASE_BUILD: TB350FU_S230982_251013_ROW
      DONOR_DRIVE_ID: 1wkAkQyd-68oPB_x35BGvqIlzQ0BLffdd
      DONOR_SIZE: 10340028849
      PRODUCT_DONOR_DRIVE_ID: ""
      SUPER_EMPTY_DRIVE_ID: 1NUHbEzgwECQiumZgxlqzR6uNTimMQT9D
      SUPER_SIZE: 9663676416
      MAIN_GROUP_SIZE: 9661579264
      GMS_APK_URL: https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.google.android.gms-252432032.apk
      VENDING_APK_URL: https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.android.vending-84022632.apk
      AURORA_URL: https://gitlab.com/AuroraOSS/AuroraStore/uploads/3376fef895820893ddeb7154b056a07e/AuroraStore-preload-4.8.4.apk
      LP_TOOLS_URL: https://codeload.github.com/Rprop/aosp15_partition_tools/tar.gz/refs/heads/main
      PDG_URL: https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
      AVB_URL: https://codeload.github.com/LineageOS/android_external_avb/tar.gz/refs/heads/lineage-22.2
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: "Spool donorow (checkout transfer-spool)"
        uses: actions/checkout@v4
        with:
          ref: transfer-spool
          path: spool

      - name: "0. Toolchain + dyski (WORK/SHM przez GITHUB_ENV)"
        run: |
          set -euo pipefail
          WD=/tmp/m3
          echo "WORK=$WD" >> "$GITHUB_ENV"
          SHMD=/dev/shm/m3
          echo "SHM=$SHMD" >> "$GITHUB_ENV"
          mkdir -p "$WD/bin" "$WD/img" "$WD/one" "$WD/keep/app" "$WD/keep/fonts" "$WD/keep/themes" "$WD/kit" "$SHMD"
          echo "dyski: WORK=$WD ($(df -h / | tail -1)); SHM=$SHMD ($(df -h /dev/shm | tail -1))"
          SRCD=/tmp/m3src; mkdir -p "$SRCD"
          # --- lp tools (statyczne, android-15.0.0_r25) ---
          curl -fsSL "$LP_TOOLS_URL" | tar -xz -C "$SRCD"
          LPT=$(ls -d "$SRCD"/aosp15_partition_tools-*/linux_glibc_x86_64 | head -1)
          for b in lpmake lpunpack lpdumps; do
            install -m 755 "$LPT/$b" "$WD/bin/$b"
            # lpunpack/lpdumps --help = exit 64 (usage error) - to NIE awaria
            OUT=$("$WD/bin/$b" --help 2>&1 || true)
            echo "$OUT" | head -4 | grep -qiE "usage|lpmake|lpunpack|lpdumps|super|missing|must specify" \
              || { echo "::error::$b nie uruchamia sie"; exit 1; }
            echo "$b: OK"
          done
          # --- payload-dumper-go (uzywany tylko do -l listy, jesli zajdzie) ---
          if curl -fsSL "$PDG_URL" -o "$SRCD/pdg.tar.gz"; then
            tar -xzf "$SRCD/pdg.tar.gz" -C "$SRCD"
            PDGB=$(find "$SRCD" -maxdepth 1 -type f -name 'payload-dumper-go*' | head -1)
            install -m 755 "$PDGB" "$WD/bin/payload-dumper-go"
            "$WD/bin/payload-dumper-go" --help >/dev/null 2>&1 || rm -f "$WD/bin/payload-dumper-go"
          fi
          pip cache purge >/dev/null 2>&1 || true
          # --- avbtool ---
          curl -fsSL "$AVB_URL" | tar -xz -C "$SRCD"
          cp "$SRCD"/android_external_avb-*/avbtool.py "$WD/bin/avbtool.py"
          python3 "$WD/bin/avbtool.py" version || python3 "$WD/bin/avbtool.py" --help | head -1
          # --- erofs-utils lokalnie (shim libselinux dla --file-contexts) ---
          bash tools/build_comp_libs.sh "$SRCD/comp" >/dev/null 2>&1 || bash tools/build_comp_libs.sh "$SRCD/comp"
          COMP_PREFIX="$SRCD/comp" bash tools/build_erofs_local.sh "$WD/erofs"
          "$WD/erofs/mkfs.erofs" --help 2>&1 | grep -q -- --file-contexts || { echo "::error::mkfs.erofs bez --file-contexts"; exit 1; }
          "$WD/erofs/fsck.erofs" --help >/dev/null 2>&1 || { echo "::error::brak fsck.erofs"; exit 1; }
          rm -rf "$SRCD"
          echo "== smoke: lpmake -S -> simg2img -> lpunpack (pelny lancuch sparse) =="
          dd if=/dev/urandom of="$SHMD/fake.img" bs=1M count=8 status=none
          "$WD/bin/lpmake" --device-size=33554432 --metadata-size=65536 --metadata-slots=3 \
            --block-size=4096 --alignment=1048576 --super-name=super -S \
            --group=main_a:16777216 \
            --partition=system_a:readonly:8388608:main_a --image=system_a="$SHMD/fake.img" \
            -o "$SHMD/super_mini.img"
          mkdir -p "$SHMD/mini_unp"
          # UWAGA: lpunpack/lpdumps NIE czytaja sparse (exit 64) - najpierw
          # simg2img (MAGIC 0xED26FF3A, fix 29 IX), potem lpunpack na raw.
          python3 tools/simg2img.py "$SHMD/super_mini.img" "$SHMD/super_mini_raw.img"
          "$WD/bin/lpunpack" "$SHMD/super_mini_raw.img" "$SHMD/mini_unp/" >/dev/null 2>&1
          cmp "$SHMD/fake.img" "$SHMD/mini_unp/system_a.img" && echo "SPARSE roundtrip: BIT-IDENTYCZNY OK"
          echo "== smoke: stream_lpunpack vs lpunpack (unpacker streaming) =="
          dd if=/dev/urandom of="$SHMD/f2.img" bs=1M count=6 status=none
          "$WD/bin/lpmake" --device-size=20971520 --metadata-size=65536 --metadata-slots=3 \
            --block-size=4096 --alignment=1048576 --super-name=super \
            --group=main_a:18874368 \
            --partition=system_a:readonly:6291456:main_a --image=system_a="$SHMD/f2.img" \
            --partition=vendor_a:readonly:6291456:main_a --image=vendor_a="$SHMD/f2.img" \
            -o "$SHMD/super_raw2.img"
          mkdir -p "$SHMD/mini_unp"   # lpunpack WYMAGA istniejacego katalogu (receipt 36594014181 + 36616340063)
          "$WD/bin/lpunpack" "$SHMD/super_raw2.img" "$SHMD/mini_unp/" >/dev/null 2>&1
          # UWAGA: unpacker konczy po ostatnim segmencie _a (nie czyta ogona
          # b-slotow) => producent pipe dostaje SIGPIPE (exit 141 pod pipefail).
          # Stad redirection < zamiast cat; httpzip (krok 4) lapie BrokenPipeError.
          python3 tools/stream_lpunpack.py --stdin --out "$SHMD/stream_unp" < "$SHMD/super_raw2.img" | tail -2
          cmp "$SHMD/mini_unp/system_a.img" "$SHMD/stream_unp/system.img" \
            && cmp "$SHMD/mini_unp/vendor_a.img" "$SHMD/stream_unp/vendor.img" \
            && echo "STREAM-LPUNPACK vs lpunpack: BIT-IDENTYCZNY OK"
          rm -rf "$SHMD/fake.img" "$SHMD/f2.img" "$SHMD/super_mini.img" "$SHMD/super_mini_raw.img" \
                 "$SHMD/super_raw2.img" "$SHMD/mini_unp" "$SHMD/stream_unp"
          echo "toolchain kompletny"
          df -h / /dev/shm | tail -2

      - name: "1. Geometria fabryczna super (super_empty.img)"
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          curl -fsSL --retry 3 -o "$WORK/super_empty.img" \
            "https://drive.usercontent.google.com/download?id=${SUPER_EMPTY_DRIVE_ID}&export=download&confirm=t" \
            || cp tools/super_empty_tb350fu.img "$WORK/super_empty.img"
          test "$(stat -c%s "$WORK/super_empty.img")" -eq 5184
          python3 tools/lpinfo.py "$WORK/super_empty.img" | tee "$WORK/geometry.txt"
          grep -q "size=9663676416" "$WORK/geometry.txt"
          grep -q "main_a" "$WORK/geometry.txt"
          grep -q "system_ext_a" "$WORK/geometry.txt"
          echo "GEOMETRIA OK: super=${SUPER_SIZE}B, grupy main_a/main_b po ${MAIN_GROUP_SIZE}B, VAB"

      - name: "2. Baza lolinet: probe przez range (zip NIE dotyka dysku)"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          python3 tools/httpzip.py "$LOLINET_ZIP" --probe | tee /tmp/lolinet-probe.txt
          grep -q "size=${LOLINET_SIZE}" /tmp/lolinet-probe.txt || echo "::warning::content-length != pin"
          python3 tools/httpzip.py "$LOLINET_ZIP" --list | tee /tmp/lolinet-list.txt
          SUPL=$(awk -F'\t' -v e="${BASE_ENTRY_PREFIX}/super.img" '$3 == e {print $1}' /tmp/lolinet-list.txt)
          BOOTL=$(awk -F'\t' -v e="${BASE_ENTRY_PREFIX}/boot.img" '$3 == e {print $1}' /tmp/lolinet-list.txt)
          echo "super.img w zipie: ${SUPL:-BRAK} B (pin ${LOLINET_SUPER_LEN}); boot.img: ${BOOTL:-BRAK} B (pin ${LOLINET_BOOT_LEN})"
          test -n "$SUPL" || { echo "::error::brak super.img w zipie lolinet"; exit 1; }
          test -n "$BOOTL" || { echo "::error::brak boot.img w zipie lolinet"; exit 1; }
          [ "$SUPL" = "$LOLINET_SUPER_LEN" ] || echo "::warning::super.img $SUPL != pin $LOLINET_SUPER_LEN"
          AVAIL=$(( $(df --output=avail -B1G "$WORK" | tail -1) ))
          echo "dysk: ${AVAIL}G wolne (wymagane >=7G: peak 2xsystem_m3+ext przy lpmake z watcherem)"
          [ "$AVAIL" -ge 7 ] || { echo "::error::za malo miejsca: ${AVAIL}G < 7G (saby runner; retrigger)"; exit 1; }
          df -h / /dev/shm | tail -2

      - name: "3. Donor HyperOS - TIER A (cache m1, poll 150 min) / B / C"
        # PRZED streamingiem: harvest do $WORK/keep (dysk, <300M).
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          GH="gh"
          try_cache() {
            rm -rf "$SHM/dcache"; mkdir -p "$SHM/dcache"; cd "$SHM/dcache"
            if ! $GH release view donor-cache >/dev/null 2>&1; then return 2; fi
            if ! $GH release download donor-cache --clobber -p 'donor-product.manifest' -p 'donor-product.part.*' 2>/dev/null; then return 2; fi
            [ -f donor-product.manifest ] || return 2
            WMD5=$(grep -oP '(?<=md5=).*' donor-product.manifest | head -1)
            WSIZE=$(grep -oP '(?<=size=).*' donor-product.manifest | head -1)
            [ -n "$WMD5" ] && [ -n "$WSIZE" ] || return 2
            : > "$WORK/one/donor-product.img"
            for P in $(ls donor-product.part.* | sort); do cat "$P" >> "$WORK/one/donor-product.img"; rm -f "$P"; done
            GMD5=$(md5sum "$WORK/one/donor-product.img" | cut -d' ' -f1)
            GSIZE=$(stat -c%s "$WORK/one/donor-product.img")
            echo "cache: md5=$GMD5 (oczek. $WMD5), size=$GSIZE (oczek. $WSIZE)"
            [ "$GMD5" = "$WMD5" ] && [ "$GSIZE" = "$WSIZE" ] || { rm -f "$WORK/one/donor-product.img"; return 1; }
            cd "$WORK"; return 0
          }
          TIER=""
          echo "== TIER A: donor-cache (poll do 150 min) =="
          WAITED=0
          while [ "$WAITED" -lt 150 ]; do
            RC=$(try_cache && echo 0 || echo $?)
            [ "$RC" = "0" ] && { TIER="A (donor-cache release)"; break; }
            M1RUN=$($GH run list --workflow release-mystical1.yml --limit 1 --json status --jq '.[0].status' 2>/dev/null || echo "?")
            echo "[+${WAITED}m] cache niegotowy (rc=$RC), m1=$M1RUN"
            [ "$M1RUN" != "in_progress" ] && [ "$M1RUN" != "queued" ] && { echo "m1 nie biegnie -> TIER B/C"; break; }
            sleep 300; WAITED=$((WAITED+5))
          done
          [ -f "$WORK/one/donor-product.img" ] && TIER="${TIER:-A (donor-cache release)}"
          if [ -z "$TIER" ] && [ -n "${PRODUCT_DONOR_DRIVE_ID:-}" ]; then
            echo "== TIER B: product.img z Drive =="
            if curl -fL --retry 3 --speed-limit 400000 --speed-time 150 \
              -o "$WORK/one/donor-product.img" \
              "https://drive.usercontent.google.com/download?id=${PRODUCT_DONOR_DRIVE_ID}&export=download&confirm=t" 2>>"$WORK/urlprobe.log"; then
              [ "$(stat -c%s "$WORK/one/donor-product.img")" -gt 3000000000 ] && TIER="B (Drive product.img)"
            fi
          fi
          if [ -n "$TIER" ] && [ -f "$WORK/one/donor-product.img" ]; then
            echo "== harvest (tier $TIER, $(stat -c%s "$WORK/one/donor-product.img") B) =="
            rm -rf "$SHM/dmnt" "$SHM/dext"; mkdir -p "$SHM/dmnt"
            if sudo mount -t erofs -o ro,loop "$WORK/one/donor-product.img" "$SHM/dmnt" 2>/dev/null; then
              P="$SHM/dmnt"; [ -d "$SHM/dmnt/product" ] && P="$SHM/dmnt/product"
              echo "donor: loop-mount erofs OK"
            else
              "$WORK/erofs/fsck.erofs" --extract="$SHM/dext" "$WORK/one/donor-product.img" >/dev/null 2>&1 || true
              P="$SHM/dext"; [ -d "$SHM/dext/product" ] && P="$SHM/dext/product"
              echo "donor: fsck extract"
            fi
            for NAME in MiuiHome MiuiGallery MiuiGalleryNew MiuiMusic MiuiFileManager; do
              D=$(find "$P" -maxdepth 3 -type d -iname "$NAME" 2>/dev/null | head -1)
              if [ -n "$D" ] && find "$D" -name '*.apk' 2>/dev/null | grep -q .; then
                DEST="$WORK/keep/app/$(basename "$D" | sed 's/New$//')"
                mkdir -p "$DEST"
                find "$D" -name '*.apk' -exec cp -a {} "$DEST/" \; 2>/dev/null || sudo find "$D" -name '*.apk' -exec cp -a {} "$DEST/" \;
                echo "  apk: $NAME <- $D"
              fi
            done
            if [ -d "$P/fonts" ]; then
              find "$P/fonts" -maxdepth 1 -name 'Mi*.ttf' -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; 2>/dev/null \
                || sudo find "$P/fonts" -maxdepth 1 -name 'Mi*.ttf' -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; || true
            fi
            for TD in themes media/theme; do
              SRC=$(find "$P" -maxdepth 2 -type d -path "*$TD" 2>/dev/null | head -1)
              if [ -n "$SRC" ]; then
                SZD=$(du -sm "$SRC" 2>/dev/null | cut -f1)
                if [ "${SZD:-999}" -le 300 ]; then
                  mkdir -p "$WORK/keep/themes/$(basename "$SRC")"
                  cp -a "$SRC"/. "$WORK/keep/themes/$(basename "$SRC")"/ 2>/dev/null || sudo cp -a "$SRC"/. "$WORK/keep/themes/$(basename "$SRC")"/
                  echo "  motywy/assets: $SRC (${SZD} MB)"
                else
                  echo "  motywy $SRC pominiete (${SZD} MB > 300)"
                fi
              fi
            done
            sudo umount "$SHM/dmnt" 2>/dev/null || true
            rm -rf "$WORK/one/donor-product.img" "$SHM/dext" "$SHM/dcache"
            NA=$(find "$WORK/keep/app" -name '*.apk' | wc -l)
            NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
            echo "harvest: $NA apk, $NF fontow Mi"
            if [ "$NA" -ge 1 ]; then echo "OK (tier $TIER; $NA apk: $(ls "$WORK/keep/app" | tr '\n' ' '))" > /tmp/transplant.status
            else echo "BRAK APK mimo tier $TIER" > /tmp/transplant.status; fi
          else
            echo "== TIER C: fonty z assets.tar.gz (product.img Xiaomi) w transfer-spool =="
            if ls spool/transfer/drive-1IjQeuVkiaE6B5c9YZkZJTpiAI-n4EU_1-assets.tar.gz.part.* >/dev/null 2>&1; then
              rm -rf "$SHM/tierc"; mkdir -p "$SHM/tierc"
              cat spool/transfer/drive-1IjQeuVkiaE6B5c9YZkZJTpiAI-n4EU_1-assets.tar.gz.part.* > "$SHM/tierc/assets.tar.gz"
              echo "assets.tar.gz: $(stat -c%s "$SHM/tierc/assets.tar.gz") B"
              if tar tzf "$SHM/tierc/assets.tar.gz" 2>/dev/null | grep -qi '\.ttf'; then
                tar xzf "$SHM/tierc/assets.tar.gz" -C "$SHM/tierc" 2>/dev/null
                find "$SHM/tierc" -name 'Mi*.ttf' -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; 2>/dev/null || true
                find "$SHM/tierc" -name '*.ttf' -size +100k ! -name 'Mi*' -exec sh -c 'test $(find "$WORK/keep/fonts" | wc -l) -lt 8 && cp -a "$1" "$WORK/keep/fonts/" || true' _ {} \; 2>/dev/null || true
                NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
                echo "OK (TIER C; fonty z assets.tar.gz product.img Xiaomi: $NF)" > /tmp/transplant.status
              else
                echo "TIER C: brak .ttf w assets.tar.gz" > /tmp/transplant.status
              fi
              rm -rf "$SHM/tierc"
            else
              echo "FALLBACK (brak donor-cache m1, brak PRODUCT_DONOR_DRIVE_ID, brak assets w spool; build bez transplantow)" > /tmp/transplant.status
            fi
          fi
          cat /tmp/transplant.status || true
          rm -rf "$SHM/dcache" "$SHM/dmnt" "$SHM/dext"
          # spool (checkout transfer-spool, do ~1,8G blobow) juz niepotrzebny
          rm -rf "$GITHUB_WORKSPACE/spool" || true
          echo "spool usuniety; dysk: $(df -h / | tail -1)"
          df -h / /dev/shm | tail -2

      - name: "4. Streaming per-partycja (httpzip|stream_lpunpack --only) + mody + mkfs"
        # BUDZET (avail ~7,5G dysku; tmpfs 3,9G; receipt runu 36617353135: partycje
        # _a = 7,91G SUMA - zapis wszystkich naraz = ENOSPC):
        #   SYSTEM : img->tmpfs(3,43G) tree->dysk(3,7G) mkfs->tmpfs mv->DYSK
        #            (krok 5: konsumowany PIERWSZY, watcher usuwa go z dysku)
        #   PRODUCT: img->tmpfs(2,6G) tree->dysk mkfs->tmpfs(2,4G ZOSTAJE)
        #   EXT    : img->tmpfs(0,71G) tree->dysk mkfs->tmpfs(0,7G ZOSTAJE)
        #   VENDOR*: img->DYSK(0,95G) bez ekstrakcji; potem ZAMIANA:
        #            ext_m3 tmpfs->dysk, vendor* dysk->tmpfs
        #            => krok 5 peak dysku = 2x(system_m3)+ext_m3 ~ 6,9-7,5G
        #   boot.img: httpzip -> $WORK/one (67M, pin)
        # Rozmiary partycji weryfikowane vs PINY z trace runu #9.
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          mkdir -p "$SHM/one" "$SHM/m3" "$WORK/tree" "$WORK/img" "$WORK/one"
          purge_gms() { # $1=tree; na STDOUT wyłącznie liczba usuniętych (diag -> stderr)
            local T="$1" N=0 D
            local HITS
            HITS=$(find "$T/app" "$T/priv-app" -maxdepth 1 -type d 2>/dev/null | grep -iE \
              'gms|google|Phonesky|SetupWizard|PrebuiltGmsCore|GoogleServicesFramework|GooglePartnerSetup|GoogleFeedback|GoogleOneTimeInitializer|GoogleRestore|ConfigUpdater|CarrierServices|AndroidPlatformServices|GoogleExt' || true)
            if [ -n "$HITS" ]; then
              printf '%s\n' "$HITS" >> /tmp/gms-purge.list
              printf '%s\n' "$HITS" >&2
            fi
            for D in $HITS; do
              case "$(basename "$D")" in
                com.google.android.webview|WebView) echo "  ZOSTAWIAM (webview): $(basename "$D")" >&2; continue ;;
              esac
              sudo rm -rf "$D"; N=$((N+1))
            done
            find "$T/etc/permissions" "$T/etc/sysconfig" -name '*.xml' 2>/dev/null | \
              xargs -r grep -il 'gms\|google' | xargs -r sudo rm -f || true
            echo "$N"
          }
          stream_parts() { # $1=csv -> $SHM/one + weryfikacja pinow rozmiarow
            rm -f "$SHM/one"/*.img 2>/dev/null || true
            python3 tools/httpzip.py "$LOLINET_ZIP" --entry "${BASE_ENTRY_PREFIX}/super.img" \
              | python3 tools/simg2img_stream.py \
              | python3 tools/stream_lpunpack.py --stdin --out "$SHM/one" --only "$1" \
              | tee /tmp/stream-manifest.txt
            local P PINVAR PINV
            for P in $(echo "$1" | tr ',' ' '); do
              PINVAR="SIZE_$(echo "$P" | tr 'a-z' 'A-Z')"
              PINV=$(eval "echo \${$PINVAR:-0}")
              awk -F'\t' -v p="$P" -v pin="$PINV" \
                '$1=="P" && $2==p { if (pin>0 && $3!=pin) { print "::error::"p" rozmiar "$3" != pin "pin; bad=1 } f=1 } END { exit (bad?1:(f?0:2)) }' \
                /tmp/stream-manifest.txt
              AWKRC=$?
              [ "$AWKRC" -eq 1 ] && { echo "::error::$P: rozmiar odbiega od pinu"; exit 1; }
              [ "$AWKRC" -eq 2 ] && { echo "::error::$P nie ma w manifeście streamu"; exit 1; }
              awk -F'\t' -v p="$P" '$1=="W" && $2==p && $5!="OK" && $5!="SKIP" { bad=1 } END { exit bad?1:0 }' \
                /tmp/stream-manifest.txt || { echo "::error::$P NIEPELNY w streamie"; exit 1; }
              echo "  pin OK: $P = ${PINV}B"
            done
          }
          fs_type() { # $1=img -> "erofs"|"ext4"|"?"
            python3 - "$1" <<'FSEOF'
          import struct, sys
          with open(sys.argv[1], "rb") as f:
              f.seek(1024)
              sb = f.read(64)
          if len(sb) >= 58:
              if struct.unpack("<H", sb[56:58])[0] == 0xEF53:
                  print("ext4"); raise SystemExit
          if len(sb) >= 4:
              if struct.unpack("<I", sb[0:4])[0] == 0xE0F5E1E2:
                  print("erofs"); raise SystemExit
          print("?")
          FSEOF
          }
          diag_img() { # $1=part $2=img -> diagnostyka do trace (receipt 36727601026)
            echo "-- diag $1 --"
            file "$2" || true
            python3 - "$2" <<'DGEOF'
          import sys
          f = open(sys.argv[1], "rb")
          for off in (8, 100, 1000, 3000):
              f.seek(off * 1024 * 1024)
              c = f.read(1024 * 1024)
              if not c:
                  print(f"  MB@{off}: EOF"); continue
              print(f"  MB@{off}: zer {c.count(0)}/{len(c)}")
          f.seek(1024)
          sb = f.read(64)
          import struct
          if len(sb) >= 58 and struct.unpack("<H", sb[56:58])[0] == 0xEF53:
              inodes, blocks = struct.unpack("<II", sb[0:8])
              print(f"  ext4 sb: inodes={inodes} blocks={blocks}")
