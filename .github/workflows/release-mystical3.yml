          declare -A PPATH=( \
            [system]="$WORK/img/system.img" \
            [system_ext]="$WORK/img/system_ext.img" \
            [product]="$WORK/img/product.img" \
            [vendor]="$WORK/img/vendor.img" \
            [vendor_dlkm]="$WORK/img/vendor_dlkm.img" \
            [odm_dlkm]="$WORK/img/odm_dlkm.img" )
