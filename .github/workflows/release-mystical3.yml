name: release-mystical3

# ============================================================================
# MysticalOS 3 - HYBRYDOWY SUPER.IMG TB350FU (zlecenie 29 IX, "BUILD V16")
# Repack wewnatrz FABRYCZNEGO layoutu super Lenovo (super.img container).
#
# RECEIPTY DYSKOWE (sonda 36592788531 + run 36600150934):
#   - runner = JEDEN dysk 72 GB, wolne FLUKTUUJE 8-14G (rozne obrazy runnera!),
#   - RAM 16 GB => /dev/shm (tmpfs ~8G) jako drugi nosnik,
#   - stad: obrazy bazowe PROSTO do tmpfs (dysk trzyma tylko zip 4,5G),
#     przetwarzanie PER-PARTYCJA (extract tree -> mody -> mkfs -> rm tree ->
#     rm source img; peak tmpfs = 1 drzewo + niewykorzystane img).
#
# Baza: TB350FU_S230982_251013_ROW (lolinet, 4,7 GB, A14; najnowszy ROW na
# lustrze) - komplet partycji dynamicznych + boot + vbmeta.
# Geometria: super_empty.img TB350FU (Drive + backup tools/):
#   super = 9 663 676 416 B, grupy main_a/main_b po 9 661 579 264 B,
#   metadata 65536 x 3, block 4096, align 1 MiB, VAB, 6 partycji/slot.
#
# Donor HyperOS yingtian 4.0.13 (TIERED): A = release 'donor-cache' (m1),
# B = product.img z Drive, C = fonty Mi z transfer-spool. Donor PRZED pętla
# partycji (harvest -> $WORK/keep; tmpfs czysty po nim).
#
# MODY: PURGE GMS (system+product+system_ext; webview zostaje), INJECT
# microG v0.3.16.252432 + FakeStore + Aurora 4.8.4, TRANSPLANT apk MIUI +
# fonty Mi + motywy (inertne), mitigation display (staly refresh rate).
#
# Output: super_mystical3 SPARSE (lpmake -S; magic 0xED26FF3A) w ~32 czastkach
# + vbmeta_disable (flags=3) + boot_S230982 + FLASH-M3.md + simg2img.py
# -> release mysticalos-3-super + gofile (tar).
# ============================================================================

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/release-mystical3.yml', 'tools/lpinfo.py']

concurrency:
  group: mystical3-super
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 360 min (max per job): lolinet + poll donor-cache (150) + EROFS + lpmake
    # + split + uploady.
    timeout-minutes: 360

    env:
      LOLINET_ZIP: https://mirrors.lolinet.com/firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/TB350FU_S230982_251013_ROW.zip
      LOLINET_SIZE: 4805247432
      BASE_BUILD: TB350FU_S230982_251013_ROW
      DONOR_DRIVE_ID: 1wkAkQyd-68oPB_x35BGvqIlzQ0BLffdd
      DONOR_SIZE: 10340028849
      PRODUCT_DONOR_DRIVE_ID: ""
      SUPER_EMPTY_DRIVE_ID: 1NUHbEzgwECQiumZgxlqzR6uNTimMQT9D
      SUPER_SIZE: 9663676416
      MAIN_GROUP_SIZE: 9661579264
      GMS_APK_URL: https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.google.android.gms-252432032.apk
      VENDING_APK_URL: https://github.com/microg/GmsCore/releases/download/v0.3.16.252432/com.android.vending-84022632.apk
      AURORA_URL: https://gitlab.com/-/project/6922885/uploads/3376fef895820893ddeb7154b056a07e/AuroraStore-preload-4.8.4.apk
      LP_TOOLS_URL: https://codeload.github.com/Rprop/aosp15_partition_tools/tar.gz/refs/heads/main
      PDG_URL: https://github.com/ssut/payload-dumper-go/releases/download/2.1.0/payload-dumper-go_2.1.0_linux_amd64.tar.gz
      AVB_URL: https://codeload.github.com/LineageOS/android_external_avb/tar.gz/refs/heads/lineage-22.2
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4

      - name: "Spool donorow (checkout transfer-spool)"
        uses: actions/checkout@v4
        with:
          ref: transfer-spool
          path: spool

      - name: "0. Toolchain + dyski (WORK/SHM przez GITHUB_ENV)"
        run: |
          set -euo pipefail
          WD=/tmp/m3
          echo "WORK=$WD" >> "$GITHUB_ENV"
          SHMD=/dev/shm/m3
          echo "SHM=$SHMD" >> "$GITHUB_ENV"
          mkdir -p "$WD/bin" "$WD/img" "$WD/keep/app" "$WD/keep/fonts" "$WD/keep/themes" "$WD/kit" "$SHMD"
          echo "dyski: WORK=$WD ($(df -h / | tail -1)); SHM=$SHMD ($(df -h /dev/shm | tail -1))"
          SRCD=/tmp/m3src; mkdir -p "$SRCD"
          # --- lp tools (statyczne, android-15.0.0_r25) ---
          curl -fsSL "$LP_TOOLS_URL" | tar -xz -C "$SRCD"
          LPT=$(ls -d "$SRCD"/aosp15_partition_tools-*/linux_glibc_x86_64 | head -1)
          for b in lpmake lpunpack lpdumps; do
            install -m 755 "$LPT/$b" "$WD/bin/$b"
            # lpunpack/lpdumps --help = exit 64 (usage error) - to NIE awaria
            OUT=$("$WD/bin/$b" --help 2>&1 || true)
            echo "$OUT" | head -4 | grep -qiE "usage|lpmake|lpunpack|lpdumps|super|missing|must specify" \
              || { echo "::error::$b nie uruchamia sie"; exit 1; }
            echo "$b: OK"
          done
          # --- payload-dumper-go (fallback: pip payload-dumper) ---
          if curl -fsSL "$PDG_URL" -o "$SRCD/pdg.tar.gz"; then
            tar -xzf "$SRCD/pdg.tar.gz" -C "$SRCD"
            PDGB=$(find "$SRCD" -maxdepth 1 -type f -name 'payload-dumper-go*' | head -1)
            install -m 755 "$PDGB" "$WD/bin/payload-dumper-go"
            "$WD/bin/payload-dumper-go" --help >/dev/null 2>&1 || PDGB=""
          fi
          if [ -z "${PDGB:-}" ] || [ ! -x "$WD/bin/payload-dumper-go" ]; then
            echo "payload-dumper-go niedostepny -> fallback pip payload-dumper"
            pip install --quiet payload-dumper
            command -v payload-dumper >/dev/null || { echo "::error::brak extractor'a payload"; exit 1; }
          fi
          pip cache purge >/dev/null 2>&1 || true
          # --- avbtool ---
          curl -fsSL "$AVB_URL" | tar -xz -C "$SRCD"
          cp "$SRCD"/android_external_avb-*/avbtool.py "$WD/bin/avbtool.py"
          python3 "$WD/bin/avbtool.py" version || python3 "$WD/bin/avbtool.py" --help | head -1
          # --- erofs-utils lokalnie (shim libselinux dla --file-contexts) ---
          bash tools/build_comp_libs.sh "$SRCD/comp" >/dev/null 2>&1 || bash tools/build_comp_libs.sh "$SRCD/comp"
          COMP_PREFIX="$SRCD/comp" bash tools/build_erofs_local.sh "$WD/erofs"
          "$WD/erofs/mkfs.erofs" --help 2>&1 | grep -q -- --file-contexts || { echo "::error::mkfs.erofs bez --file-contexts"; exit 1; }
          "$WD/erofs/fsck.erofs" --help >/dev/null 2>&1 || { echo "::error::brak fsck.erofs"; exit 1; }
          rm -rf "$SRCD"
          echo "== smoke: lpmake -S -> simg2img -> lpunpack (pelny lancuch sparse) =="
          dd if=/dev/urandom of="$SHMD/fake.img" bs=1M count=8 status=none
          "$WD/bin/lpmake" --device-size=33554432 --metadata-size=65536 --metadata-slots=3 \
            --block-size=4096 --alignment=1048576 --super-name=super -S \
            --group=main_a:16777216 \
            --partition=system_a:readonly:8388608:main_a --image=system_a="$SHMD/fake.img" \
            -o "$SHMD/super_mini.img"
          mkdir -p "$SHMD/mini_unp"
          # UWAGA: lpunpack/lpdumps NIE czytaja sparse (exit 64) - najpierw
          # simg2img (MAGIC 0xED26FF3A, fix 29 IX), potem lpunpack na raw.
          python3 tools/simg2img.py "$SHMD/super_mini.img" "$SHMD/super_mini_raw.img"
          "$WD/bin/lpunpack" "$SHMD/super_mini_raw.img" "$SHMD/mini_unp/" >/dev/null 2>&1
          cmp "$SHMD/fake.img" "$SHMD/mini_unp/system_a.img" && echo "SPARSE roundtrip: BIT-IDENTYCZNY OK"
          rm -rf "$SHMD/fake.img" "$SHMD/super_mini.img" "$SHMD/super_mini_raw.img" "$SHMD/mini_unp"
          echo "toolchain kompletny"
          df -h / /dev/shm | tail -2

      - name: "1. Geometria fabryczna super (super_empty.img)"
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          curl -fsSL --retry 3 -o "$WORK/super_empty.img" \
            "https://drive.usercontent.google.com/download?id=${SUPER_EMPTY_DRIVE_ID}&export=download&confirm=t" \
            || cp tools/super_empty_tb350fu.img "$WORK/super_empty.img"
          test "$(stat -c%s "$WORK/super_empty.img")" -eq 5184
          python3 tools/lpinfo.py "$WORK/super_empty.img" | tee "$WORK/geometry.txt"
          grep -q "size=9663676416" "$WORK/geometry.txt"
          grep -q "main_a" "$WORK/geometry.txt"
          grep -q "system_ext_a" "$WORK/geometry.txt"
          echo "GEOMETRIA OK: super=${SUPER_SIZE}B, grupy main_a/main_b po ${MAIN_GROUP_SIZE}B, VAB"

      - name: "2. Baza Lenovo (lolinet S230982) - obrazy do tmpfs"
        # Dysk trzyma TYLKO zip (4,5G); obrazy (4,4G) prosto do tmpfs.
        # Fallback (tmpfs < 5G): obrazy na dysk, dump sekwencyjny per partycja.
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          AVAIL=$(( $(df --output=avail -B1G "$WORK" | tail -1) ))
          [ "$AVAIL" -ge 5 ] || { echo "::error::za malo miejsca na zip: ${AVAIL}G < 5G"; exit 1; }
          echo "dysk na zip: ${AVAIL}G"
          SHM_AVAIL_MB=$(( $(df --output=avail -B1M /dev/shm | tail -1) ))
          if [ "$SHM_AVAIL_MB" -ge 5000 ]; then
            IMGDIR="$SHM/img"; echo "obrazy -> tmpfs (${SHM_AVAIL_MB}M wolne)"
          else
            IMGDIR="$WORK/img"; echo "tmpfs za maly (${SHM_AVAIL_MB}M) -> obrazy -> dysk (dump sekwencyjny)"
          fi
          echo "IMGDIR=$IMGDIR" >> "$GITHUB_ENV"
          mkdir -p "$IMGDIR"
          curl -fL --retry 3 --connect-timeout 30 --speed-limit 400000 --speed-time 150 \
            -o "$WORK/base.zip" "$LOLINET_ZIP" 2>>"$WORK/urlprobe.log" \
            || { echo "::error::pobranie lolinet padlo"; exit 1; }
          BSZ=$(stat -c%s "$WORK/base.zip")
          echo "base.zip: $BSZ B"
          LO=$(( LOLINET_SIZE - LOLINET_SIZE / 50 )); HI=$(( LOLINET_SIZE + LOLINET_SIZE / 50 ))
          { [ "$BSZ" -ge "$LO" ] && [ "$BSZ" -le "$HI" ]; } || echo "::warning::rozmiar base.zip odbiega od pinu ($BSZ vs $LOLINET_SIZE)"
          unzip -l "$WORK/base.zip" | head -25
          dump_parts() { # $1 = lista partycji (csv) albo puste = wszystkie
            if [ -x "$WORK/bin/payload-dumper-go" ]; then
              "$WORK/bin/payload-dumper-go" ${1:+-p "$1"} -o "$IMGDIR" "$WORK/base.zip" 2>&1 | tail -3
            else
              unzip -o -j "$WORK/base.zip" 'payload.bin' -d "$WORK/" >/dev/null
              payload-dumper ${1:+-p "$1"} -o "$IMGDIR" "$WORK/payload.bin" 2>&1 | tail -3
              rm -f "$WORK/payload.bin"
            fi
          }
          if unzip -l "$WORK/base.zip" | grep -q 'payload.bin'; then
            echo "struktura: payload OTA"
            if [ -x "$WORK/bin/payload-dumper-go" ]; then
              "$WORK/bin/payload-dumper-go" -l "$WORK/base.zip" 2>&1 | tee /tmp/payload-parts.txt || true
              AV=$(grep -oiE 'system|system_ext|product|vendor|odm|odm_dlkm|vendor_dlkm|boot|vbmeta|vbmeta_system|vbmeta_vendor' /tmp/payload-parts.txt | sort -u | tr '\n' ',' | sed 's/,$//')
            else
              AV="system,system_ext,product,vendor,odm,odm_dlkm,vendor_dlkm,boot,vbmeta,vbmeta_system,vbmeta_vendor"
            fi
            echo "partycje w payload: ${AV:-(wszystkie)}"
            if [ "$IMGDIR" = "$SHM/img" ]; then
              dump_parts "${AV:-}"
            else
              # fallback dyskowy: sekwencyjnie per partycja (kontrola peaku)
              IFS=',' read -ra PARR <<< "${AV:-system,system_ext,product,vendor,boot}"
              for P in "${PARR[@]}"; do dump_parts "$P"; done
            fi
          elif unzip -l "$WORK/base.zip" | grep -qi 'super.*\.img'; then
            echo "struktura: super.img w pakiecie"
            unzip -o -j "$WORK/base.zip" '*super*.img' -d "$WORK/" >/dev/null
            python3 tools/simg2img.py "$WORK"/super*.img "$WORK/super_base.img" || cp "$WORK"/super*.img "$WORK/super_base.img"
            "$WORK/bin/lpunpack" "$WORK/super_base.img" "$IMGDIR/"
            rm -f "$WORK"/super*.img "$WORK/super_base.img"
            unzip -o -j "$WORK/base.zip" '*boot*.img' '*vbmeta*.img' -d "$IMGDIR/" >/dev/null || true
          else
            echo "::error::nieznana struktura pakietu (ani payload.bin, ani super.img)"
            unzip -l "$WORK/base.zip" | tail -20; exit 1
          fi
          rm -f "$WORK/base.zip"
          echo "== obrazy bazowe ($IMGDIR) =="
          ls -la "$IMGDIR/"
          test -s "$IMGDIR/system.img" || { echo "::error::brak system.img"; exit 1; }
          test -s "$IMGDIR/vendor.img" || { echo "::error::brak vendor.img"; exit 1; }
          df -h / /dev/shm | tail -2

      - name: "3. Donor HyperOS - TIER A (cache m1, poll 150 min) / B / C"
        # PRZED petla partycji: harvest do $WORK/keep (dysk, <300M); tmpfs
        # po tym kroku czysty na drzewa.
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          GH="gh"
          try_cache() {
            rm -rf "$SHM/dcache"; mkdir -p "$SHM/dcache"; cd "$SHM/dcache"
            if ! $GH release view donor-cache >/dev/null 2>&1; then return 2; fi
            if ! $GH release download donor-cache --clobber -p 'donor-product.manifest' -p 'donor-product.part.*' 2>/dev/null; then return 2; fi
            [ -f donor-product.manifest ] || return 2
            WMD5=$(grep -oP '(?<=md5=).*' donor-product.manifest | head -1)
            WSIZE=$(grep -oP '(?<=size=).*' donor-product.manifest | head -1)
            [ -n "$WMD5" ] && [ -n "$WSIZE" ] || return 2
            # progresywna sklejka: cat part >> img, rm part (peak ~7G tmpfs/dysk)
            : > "$SHM/donor-product.img"
            for P in $(ls donor-product.part.* | sort); do cat "$P" >> "$SHM/donor-product.img"; rm -f "$P"; done
            GMD5=$(md5sum "$SHM/donor-product.img" | cut -d' ' -f1)
            GSIZE=$(stat -c%s "$SHM/donor-product.img")
            echo "cache: md5=$GMD5 (oczek. $WMD5), size=$GSIZE (oczek. $WSIZE)"
            [ "$GMD5" = "$WMD5" ] && [ "$GSIZE" = "$WSIZE" ] || { rm -f "$SHM/donor-product.img"; return 1; }
            cd "$WORK"; return 0
          }
          TIER=""
          echo "== TIER A: donor-cache (poll do 150 min) =="
          WAITED=0
          while [ "$WAITED" -lt 150 ]; do
            RC=$(try_cache && echo 0 || echo $?)
            [ "$RC" = "0" ] && { TIER="A (donor-cache release)"; break; }
            M1RUN=$($GH run list --workflow release-mystical1.yml --limit 1 --json status --jq '.[0].status' 2>/dev/null || echo "?")
            echo "[+${WAITED}m] cache niegotowy (rc=$RC), m1=$M1RUN"
            [ "$M1RUN" != "in_progress" ] && { echo "m1 zakonczone bez cache -> TIER B/C"; break; }
            sleep 300; WAITED=$((WAITED+5))
          done
          [ -f "$SHM/donor-product.img" ] && TIER="${TIER:-A (donor-cache release)}"
          if [ -z "$TIER" ] && [ -n "${PRODUCT_DONOR_DRIVE_ID:-}" ]; then
            echo "== TIER B: product.img z Drive =="
            if curl -fL --retry 3 --speed-limit 400000 --speed-time 150 \
              -o "$SHM/donor-product.img" \
              "https://drive.usercontent.google.com/download?id=${PRODUCT_DONOR_DRIVE_ID}&export=download&confirm=t" 2>>"$WORK/urlprobe.log"; then
              [ "$(stat -c%s "$SHM/donor-product.img")" -gt 3000000000 ] && TIER="B (Drive product.img)"
            fi
          fi
          if [ -n "$TIER" ] && [ -f "$SHM/donor-product.img" ]; then
            echo "== harvest (tier $TIER, $(stat -c%s "$SHM/donor-product.img") B) =="
            rm -rf "$SHM/dmnt"; mkdir -p "$SHM/dmnt"
            if sudo mount -t erofs -o ro,loop "$SHM/donor-product.img" "$SHM/dmnt" 2>/dev/null; then
              P="$SHM/dmnt"; [ -d "$SHM/dmnt/product" ] && P="$SHM/dmnt/product"
              echo "donor: loop-mount erofs OK"
            else
              "$WORK/erofs/fsck.erofs" --extract="$SHM/dext" "$SHM/donor-product.img" >/dev/null 2>&1 || true
              P="$SHM/dext"; [ -d "$SHM/dext/product" ] && P="$SHM/dext/product"
              echo "donor: fsck extract"
            fi
            for NAME in MiuiHome MiuiGallery MiuiGalleryNew MiuiMusic MiuiFileManager; do
              D=$(find "$P" -maxdepth 3 -type d -iname "$NAME" 2>/dev/null | head -1)
              if [ -n "$D" ] && find "$D" -name '*.apk' 2>/dev/null | grep -q .; then
                DEST="$WORK/keep/app/$(basename "$D" | sed 's/New$//')"
                mkdir -p "$DEST"
                find "$D" -name '*.apk' -exec cp -a {} "$DEST/" \; 2>/dev/null || sudo find "$D" -name '*.apk' -exec cp -a {} "$DEST/" \;
                echo "  apk: $NAME <- $D"
              fi
            done
            if [ -d "$P/fonts" ]; then
              find "$P/fonts" -maxdepth 1 -name 'Mi*.ttf' -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; 2>/dev/null \
                || sudo find "$P/fonts" -maxdepth 1 -name 'Mi*.ttf' -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; || true
            fi
            for TD in themes media/theme; do
              SRC=$(find "$P" -maxdepth 2 -type d -path "*$TD" 2>/dev/null | head -1)
              if [ -n "$SRC" ]; then
                SZD=$(du -sm "$SRC" 2>/dev/null | cut -f1)
                if [ "${SZD:-999}" -le 300 ]; then
                  mkdir -p "$WORK/keep/themes/$(basename "$SRC")"
                  cp -a "$SRC"/. "$WORK/keep/themes/$(basename "$SRC")"/ 2>/dev/null || sudo cp -a "$SRC"/. "$WORK/keep/themes/$(basename "$SRC")"/
                  echo "  motywy/assets: $SRC (${SZD} MB)"
                else
                  echo "  motywy $SRC pominiete (${SZD} MB > 300)"
                fi
              fi
            done
            sudo umount "$SHM/dmnt" 2>/dev/null || true
            rm -rf "$SHM/donor-product.img" "$SHM/dext" "$SHM/dcache"
            NA=$(find "$WORK/keep/app" -name '*.apk' | wc -l)
            NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
            echo "harvest: $NA apk, $NF fontow Mi"
            if [ "$NA" -ge 1 ]; then echo "OK (tier $TIER; $NA apk: $(ls "$WORK/keep/app" | tr '\n' ' '))" > /tmp/transplant.status
            else echo "BRAK APK mimo tier $TIER" > /tmp/transplant.status; fi
          else
            echo "== TIER C: fallback fonty Mi z transfer-spool =="
            find spool -maxdepth 4 -name 'Mi*.ttf' -size +100k -exec cp -a {} "$WORK/keep/fonts/" \; 2>/dev/null || true
            NF=$(ls "$WORK/keep/fonts" 2>/dev/null | wc -l)
            echo "FALLBACK (fonty z spool: $NF; transplant apk wymaga donor-cache z m1 albo product.img na Drive [PRODUCT_DONOR_DRIVE_ID])" > /tmp/transplant.status
          fi
          cat /tmp/transplant.status || true
          rm -rf "$SHM/dcache" "$SHM/dmnt" "$SHM/dext"
          df -h / /dev/shm | tail -2

      - name: "4. Per-partycja: extract -> mody -> mkfs (EROFS + konteksty)"
        # SEKWENCYJNIE (peak tmpfs = 1 drzewo + pozostale img):
        #   system: extract -> PURGE GMS -> INJECT -> TRANSPLANT -> props ->
        #           audyt miui -> pre-flight SELinux -> mkfs -> imgcheck -> rm
        #   product/system_ext: extract -> PURGE GMS -> mkfs (jesli cos zmieniono)
        # MKFS outputy -> $WORK/img (dysk); zrodla z $IMGDIR sa usuwane po uzytku.
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          purge_gms() { # $1=tree; na STDOUT wyłącznie liczba usuniętych (diag -> stderr)
            local T="$1" N=0 D
            local HITS
            HITS=$(find "$T/app" "$T/priv-app" -maxdepth 1 -type d 2>/dev/null | grep -iE \
              'gms|google|Phonesky|SetupWizard|PrebuiltGmsCore|GoogleServicesFramework|GooglePartnerSetup|GoogleFeedback|GoogleOneTimeInitializer|GoogleRestore|ConfigUpdater|CarrierServices|AndroidPlatformServices|GoogleExt' || true)
            if [ -n "$HITS" ]; then
              printf '%s\n' "$HITS" >> /tmp/gms-purge.list
              printf '%s\n' "$HITS" >&2
            fi
            for D in $HITS; do
              case "$(basename "$D")" in
                com.google.android.webview|WebView) echo "  ZOSTAWIAM (webview): $(basename "$D")" >&2; continue ;;
              esac
              sudo rm -rf "$D"; N=$((N+1))
            done
            find "$T/etc/permissions" "$T/etc/sysconfig" -name '*.xml' 2>/dev/null | \
              xargs -r grep -il 'gms\|google' | xargs -r sudo rm -f || true
            echo "$N"
          }
          extract_tree() { # $1=part -> sciezka drzewa na stdout-compatible: ustawia TREE
            local IMG="$IMGDIR/$1.img"
            TREE="$SHM/tree_$1"
            rm -rf "$TREE"; mkdir -p "$TREE"
            if sudo mount -t erofs -o ro,loop "$IMG" /mnt 2>/dev/null; then
              sudo cp -a /mnt/. "$TREE/"; sudo umount /mnt; echo "$1: erofs (loop-mount)"
            elif "$WORK/erofs/fsck.erofs" --extract="$SHM/ex_$1" "$IMG" >/dev/null 2>&1; then
              if [ -d "$SHM/ex_$1/$1" ]; then rm -rf "$TREE" && mv "$SHM/ex_$1/$1" "$TREE"; rm -rf "$SHM/ex_$1"
              else rm -rf "$TREE" && mv "$SHM/ex_$1" "$TREE"; fi
              echo "$1: erofs (fsck extract)"
            else
              sudo e2fsck -fy "$IMG" >/dev/null 2>&1 || true
              sudo mount -o ro,loop "$IMG" /mnt
              sudo cp -a /mnt/. "$TREE/"; sudo umount /mnt; echo "$1: ext4 (loop-mount)"
            fi
          }
          # ---------- SYSTEM ----------
          extract_tree system
          T="$SHM/tree_system"
          [ -d "$T/app" ] || { echo "::error::system: drzewo bez /app"; exit 1; }
          echo "== PURGE GMS (system) =="
          N=$(purge_gms "$T"); echo "system: USUNIETO $N katalogow Google"
          echo "== INJECT microG + FakeStore + Aurora =="
          curl -fsSL --retry 3 -o /tmp/gmscore.apk "$GMS_APK_URL"
          curl -fsSL --retry 3 -o /tmp/fakestore.apk "$VENDING_APK_URL"
          AURORA_PICK=""
          for U in "$AURORA_URL" "https://gitlab.com/AuroraOSS/AuroraStore/uploads/3376fef895820893ddeb7154b056a07e/AuroraStore-preload-4.8.4.apk"; do
            if curl -fsI --connect-timeout 20 "$U" >/dev/null 2>&1; then AURORA_PICK="$U"; break; fi
          done
          test -n "$AURORA_PICK" || { echo "::error::AuroraStore: zaden URL nie odpowiada"; exit 1; }
          curl -fsSL --retry 3 -o /tmp/aurora.apk "$AURORA_PICK"
          mkdir -p "$T/priv-app/microG" "$T/priv-app/FakeStore" "$T/app/AuroraStore"
          cp /tmp/gmscore.apk   "$T/priv-app/microG/GmsCore.apk"
          cp /tmp/fakestore.apk "$T/priv-app/FakeStore/FakeStore.apk"
          cp /tmp/aurora.apk    "$T/app/AuroraStore/AuroraStore.apk"
          cat > "$T/etc/permissions/privapp-permissions-mystical.xml" <<'XEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <permissions>
            <privapp-permissions package="com.google.android.gms">
              <permission name="android.permission.FAKE_PACKAGE_SIGNATURE"/>
              <permission name="android.permission.INSTALL_LOCATION_PROVIDER"/>
              <permission name="android.permission.UPDATE_DEVICE_STATS"/>
              <permission name="android.permission.UPDATE_APP_OPS_STATS"/>
              <permission name="android.permission.CHANGE_DEVICE_IDLE_TEMP_WHITELIST"/>
              <permission name="android.permission.MANAGE_USB"/>
              <permission name="android.permission.MODIFY_PHONE_STATE"/>
              <permission name="android.permission.FOREGROUND_SERVICE"/>
              <permission name="android.permission.LOCAL_MAC_ADDRESS"/>
              <permission name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
            </privapp-permissions>
            <privapp-permissions package="com.android.vending">
              <permission name="android.permission.FAKE_PACKAGE_SIGNATURE"/>
            </privapp-permissions>
          </permissions>
          XEOF
          echo "== TRANSPLANT: $(cat /tmp/transplant.status 2>/dev/null | head -1) =="
          if [ -d "$WORK/keep/app" ] && [ -n "$(ls "$WORK/keep/app" 2>/dev/null)" ]; then
            for D in "$WORK/keep/app"/*; do
              NAME=$(basename "$D")
              mkdir -p "$T/app/$NAME"; cp -a "$D"/. "$T/app/$NAME/"
              echo "  transplant: /system/app/$NAME"
            done
          fi
          if [ -d "$WORK/keep/fonts" ] && [ -n "$(ls "$WORK/keep/fonts" 2>/dev/null)" ]; then
            cp -a "$WORK/keep/fonts"/*.ttf "$T/fonts/" 2>/dev/null || true
            echo "  fonty Mi: $(ls "$T/fonts"/Mi*.ttf 2>/dev/null | wc -l) (fonts.xml nietkniety - inertne)"
          fi
          if [ -d "$WORK/keep/themes" ] && [ -n "$(ls "$WORK/keep/themes" 2>/dev/null)" ]; then
            mkdir -p "$T/miui-themes"; cp -a "$WORK/keep/themes"/. "$T/miui-themes/"
            echo "  motywy: /system/miui-themes ($(du -sm "$T/miui-themes" | cut -f1) MB, inertne)"
          fi
          echo "== audyt miui-framework w transplantach =="
          for APK in $(find "$T/app" -maxdepth 2 -name '*.apk' 2>/dev/null); do
            REF=$(unzip -p "$APK" classes.dex 2>/dev/null | strings -a 2>/dev/null | grep -cE "^Lmiui/|^Lcom/miui/" || true)
            echo "  $(basename "$APK"): ${REF:-0} odniesien miui.*"
          done
          BP="$T/build.prop"
          { echo ""
            echo "# === MysticalOS 3 ==="
            echo "ro.mysticalos.version=3"
            echo "ro.mysticalos.base=${BASE_BUILD}"
            echo "# display mitigation (receipt ANALIZA-RGB-forensics-29IX):"
            echo "# staly refresh, bez content-detection przy pierwszym mode-switch"
            echo "ro.surface_flinger.use_content_detection_for_refresh_rate=false"; } >> "$BP"
          grep -c "mysticalos" "$BP"
          echo "== pre-flight kontekstow SELinux =="
          FC="$T/etc/selinux/plat_file_contexts"
          test -f "$FC" || { echo "::error::brak plat_file_contexts w systemie Lenovo"; exit 1; }
          python3 tools/fc_fixup.py --contexts "$FC" --root "$T" --dry-run --report /tmp/fc-report.txt
          if grep -E "MISS .*(priv-app/microG|priv-app/FakeStore|app/AuroraStore|app/Miui|permissions-mystical|fonts/Mi|miui-themes)" /tmp/fc-report.txt; then
            echo "::error::dodane pliki bez kontekstu"; exit 1
          fi
          echo "pre-flight kontekstow: OK"
          df -h / /dev/shm | tail -2
          echo "== mkfs system (EROFS, UUID m3) =="
          "$WORK/erofs/mkfs.erofs" -zlz4 -T 0 -U 6d797374-6963-4000-8000-616c00000003 \
            --file-contexts="$FC" "$WORK/img/system.img" "$T"
          rm -rf "$T" "$IMGDIR/system.img"
          # DOWOD: etykiety + dodane pliki
          for C in system_file privapp; do
            N=$(grep -ac "$C" "$WORK/img/system.img" || true)
            echo "kontekst $C w obrazie: $N trafien"
          done
          rm -rf "$SHM/imgcheck" && mkdir -p "$SHM/imgcheck"
          "$WORK/erofs/fsck.erofs" --extract="$SHM/imgcheck" "$WORK/img/system.img" >/dev/null 2>&1
          C="$SHM/imgcheck/system"
          test -f "$C/priv-app/microG/GmsCore.apk"
          test -f "$C/priv-app/FakeStore/FakeStore.apk"
          test -f "$C/app/AuroraStore/AuroraStore.apk"
          test -f "$C/etc/permissions/privapp-permissions-mystical.xml"
          grep -q "mysticalos.version=3" "$C/build.prop"
          grep -q "use_content_detection_for_refresh_rate=false" "$C/build.prop"
          echo "PURGE GMS w system: $(find "$C/app" "$C/priv-app" -maxdepth 1 -type d 2>/dev/null | grep -icE 'google|gms' || echo 0) pakietow Google (oczek. 0-1: webview)"
          find "$C/app" -maxdepth 1 -type d | grep -iE 'Miui' && echo "transplanty MIUI w obrazie OK" || true
          rm -rf "$SHM/imgcheck"
          # ---------- PRODUCT + SYSTEM_EXT ----------
          for P in product system_ext; do
            [ -s "$IMGDIR/$P.img" ] || { echo "$P: brak w bazie"; continue; }
            extract_tree "$P"
            TT="$SHM/tree_$P"
            [ -d "$TT/app" ] || [ -d "$TT/priv-app" ] || { echo "$P: drzewo bez /app - pomijam"; rm -rf "$TT"; continue; }
            echo "== PURGE GMS ($P) =="
            M=$(purge_gms "$TT")
            if [ "$M" -gt 0 ]; then
              echo "$P: usunieto $M -> repack"
              echo "PURGED_$P=1" >> /tmp/purge-partitions.status
              DF="$TT/etc/selinux/${P}_file_contexts"
              if [ ! -f "$DF" ]; then
                # fallback: plat_file_contexts z wypieczonego system_m3
                rm -rf "$SHM/fcext"; mkdir -p "$SHM/fcext"
                "$WORK/erofs/fsck.erofs" --extract="$SHM/fcext" "$WORK/img/system.img" >/dev/null 2>&1 || true
                DF="$SHM/fcext/system/etc/selinux/plat_file_contexts"
              fi
              test -f "$DF" || { echo "::error::$P: brak kontekstow do mkfs"; exit 1; }
              UUID_SUFFIX=13; [ "$P" = "system_ext" ] && UUID_SUFFIX=23
              "$WORK/erofs/mkfs.erofs" -zlz4 -T 0 -U "6d797374-6963-4000-8000-616c000000$UUID_SUFFIX" \
                --file-contexts="$DF" "$WORK/img/$P.img" "$TT"
              rm -rf "$TT" "$IMGDIR/$P.img" "$SHM/fcext"
            else
              echo "$P: zero pakietow Google - bez repacku (oryginal do super)"
              rm -rf "$TT"
            fi
            df -h / /dev/shm | tail -2
          done
          echo "== obrazy po petli =="
          ls -la "$WORK/img/" "$IMGDIR/" 2>/dev/null
          echo "PURGE+INJECT+REPACK kompletny"
          df -h / /dev/shm | tail -2

      - name: "5. super.img (lpmake -S sparse, geometria fabryczna, slot A)"
        # Przetworzone obrazy w $WORK/img; niezmienione (vendor/odm*/boot) w $IMGDIR.
        # Male obrazy stage'owane w tmpfs -> dysk trzyma system.img + sparse.
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          STAGE="$SHM/stage"; rm -rf "$STAGE"; mkdir -p "$STAGE"
          pick() { # $1=part -> sciezka (przetworzony > zrodlowy)
            if [ -s "$WORK/img/$1.img" ]; then echo "$WORK/img/$1.img"
            elif [ -s "$IMGDIR/$1.img" ]; then echo "$IMGDIR/$1.img"
            else echo ""; fi
          }
          declare -A USE=()
          TOTAL=0; ARGS=()
          for P in system system_ext product vendor odm odm_dlkm vendor_dlkm; do
            SRC=$(pick "$P")
            [ -n "$SRC" ] || continue
            SZ=$(stat -c%s "$SRC")
            [ "$SZ" -gt 0 ] || continue
            USE[$P]="$SRC"
            if [ "$P" != "system" ]; then
              SHMFREE_MB=$(( $(df --output=avail -B1M /dev/shm | tail -1) ))
              NEED_MB=$(( SZ / 1048576 + 300 ))
              if [ "$SHMFREE_MB" -gt "$NEED_MB" ]; then
                cp "$SRC" "$STAGE/$P.img" && USE[$P]="$STAGE/$P.img"
              fi
            fi
            SZR=$(( (SZ + 4095) / 4096 * 4096 ))
            TOTAL=$(( TOTAL + SZR ))
            ARGS+=(--partition="${P}_a:readonly:$SZR:main_a" --image="${P}_a=${USE[$P]}")
            echo "  ${P}_a: $SZ -> $SZR B (${USE[$P]})"
          done
          echo "SUMA partycji _a: $TOTAL B; budzet main_a: $MAIN_GROUP_SIZE B"
          [ "$TOTAL" -le "$MAIN_GROUP_SIZE" ] || { echo "::error::obrazy nie mieszcza sie w main_a!"; exit 1; }
          AVAIL=$(( $(df --output=avail -B1G "$WORK" | tail -1) ))
          echo "dysk przed lpmake: ${AVAIL}G"
          [ "$AVAIL" -ge 6 ] || { echo "::error::za malo na sparse super: ${AVAIL}G < 6G"; exit 1; }
          "$WORK/bin/lpmake" \
            --device-size="$SUPER_SIZE" \
            --metadata-size=65536 \
            --metadata-slots=3 \
            --block-size=4096 \
            --alignment=1048576 \
            --super-name=super \
            -S \
            --group="main_a:$MAIN_GROUP_SIZE" \
            "${ARGS[@]}" \
            -o "$WORK/super_m3_sparse.img"
          ls -la "$WORK/super_m3_sparse.img"
          # WERYFIKACJA duzego sparse BEZ materializacji 9,6G raw:
          # rekonstrukcja glowy (4 MB) z chunkow -> lpinfo.py
          python3 - "$WORK/super_m3_sparse.img" "$SHM/super_head.img" <<'PYEOF'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          f = open(src, 'rb')
          hdr = f.read(28)
          magic, maj, mnr, fhs, chs, blk, nblk, nch, ck = struct.unpack('<IHHHHIIII', hdr)
          assert magic == 0xED26FF3A, f"bad sparse magic {magic:#x}"
          HEAD = 4 * 1024 * 1024
          out = bytearray(HEAD)
          pos = 0
          for _ in range(nch):
            ch = f.read(12)
            ct, res, n, total = struct.unpack('<HHII', ch)
            if ct == 0xCAC1:  # RAW
              data = f.read(total)
              for i in range(n):
                o = i * blk
                if pos + o < HEAD:
                  end = min(pos + o + blk, HEAD)
                  out[pos + o:end] = data[o:o + (end - pos - o)]
            elif ct == 0xCAC2:  # FILL
              fill = f.read(4)
              for i in range(n):
                o = i * blk
                if pos + o < HEAD:
                  end = min(pos + o + blk, HEAD)
                  out[pos + o:end] = (fill * blk)[:end - pos - o]
            else:
              if ct != 0xCAC3:
                f.seek(total, 1)
            pos += n * blk
          open(dst, 'wb').write(out)
          print(f"glowa {HEAD} B zrekonstruowana z {nch} chunkow (device {nblk * blk} B)")
          PYEOF
          python3 tools/lpinfo.py "$SHM/super_head.img" | tee "$WORK/super-built-geometry.txt"
          grep -q "size=9663676416" "$WORK/super-built-geometry.txt"
          grep -q "system_a" "$WORK/super-built-geometry.txt"
          grep -q "main_a" "$WORK/super-built-geometry.txt"
          echo "GEOMETRIA zbudowanego super: ZWERYFIKOWANA (lpinfo na glowie sparse)"
          rm -f "$SHM/super_head.img"
          rm -rf "$STAGE"
          rm -f "$WORK/img/system.img" "$WORK/img/system_ext.img" "$WORK/img/product.img" \
                "$IMGDIR/system.img" "$IMGDIR/system_ext.img" "$IMGDIR/product.img" \
                "$IMGDIR/vendor.img" "$IMGDIR/odm.img" "$IMGDIR/odm_dlkm.img" "$IMGDIR/vendor_dlkm.img"
          df -h / /dev/shm | tail -2

      - name: "6. ~32 czastki (split->tmpfs->move) + vbmeta + boot + kit"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          S="$WORK/super_m3_sparse.img"
          SSZ=$(stat -c%s "$S")
          CHUNK=$(( ( (SSZ + 31) / 32 + 1048575 ) / 1048576 * 1048576 ))
          echo "super sparse: $SSZ B -> czastki po ~$CHUNK B (cel: 32)"
          rm -rf "$SHM/parts"; mkdir -p "$SHM/parts"
          split -b "$CHUNK" -d "$S" "$SHM/parts/super_mystical3.part."
          rm -f "$S"
          mv "$SHM/parts"/* "$WORK/kit/"
          rmdir "$SHM/parts" 2>/dev/null || true
          NP=$(ls "$WORK/kit"/super_mystical3.part.* | wc -l)
          echo "czastek: $NP (rozmiary: $(du -sh "$WORK/kit" | cut -f1))"
          [ "$NP" -le 32 ] || { echo "::error::wiecej niz 32 czastki ($NP)"; exit 1; }
          [ "$NP" -eq 32 ] || echo "::warning::czastek $NP != 32 (sparse mniejszy niz zakladano)"
          python3 "$WORK/bin/avbtool.py" make_vbmeta_image --flags 3 -o "$WORK/kit/vbmeta_disable.img" --padding_size 4096
          truncate -s 8192 "$WORK/kit/vbmeta_disable.img"
          cp "$WORK/kit/vbmeta_disable.img" "$WORK/kit/vbmeta_system_disable.img"
          truncate -s 4096 "$WORK/kit/vbmeta_system_disable.img"
          cp "$WORK/kit/vbmeta_disable.img" "$WORK/kit/vbmeta_vendor_disable.img"
          truncate -s 4096 "$WORK/kit/vbmeta_vendor_disable.img"
          [ -s "$IMGDIR/boot.img" ] && cp "$IMGDIR/boot.img" "$WORK/kit/boot_${BASE_BUILD}.img" \
            || echo "::warning::brak boot.img w bazie"
          cp tools/simg2img.py "$WORK/kit/simg2img.py"
          cat > "$WORK/kit/FLASH-M3.md" <<EOT
          # MysticalOS 3 - flash super.img (TB350FU)

          ## Co to jest
          Pelny kontener super (fabryczna geometria 9 GiB, VAB, slot A) ze
          SPOJNYM zestawem S230982 (system_ext/product/vendor/odm*) + system
          MysticalOS 3 (PURGE GMS [webview zostaje] + microG + FakeStore +
          Aurora + transplant HyperOS + staly refresh rate).

          ## Format
          super_mystical3.part.NN = SPARSE super.img pociety na ~32 czastki.
          Zlozenie: cat super_mystical3.part.* > super_mystical3.img
          (nastepnie sha256sum -c SHA256SUMS.txt).

          ## Flash (fastbootd; bootloader odblokowany)
          1. fastboot flash vbmeta vbmeta_disable.img
          2. fastboot flash vbmeta_system vbmeta_system_disable.img
          3. fastboot flash vbmeta_vendor vbmeta_vendor_disable.img
          4. fastboot flash super super_mystical3.img   (fastbootd sam
             rozpakuje sparse; do fastbootd: fastboot reboot fastboot)
          5. fastboot --set-active=a    (build zawiera TYLKO slot A!)
          6. fastboot reboot
          7. JESLI bootloop (kernel S231044 vs moduly S230982):
             fastboot flash boot boot_${BASE_BUILD}.img && fastboot reboot

          ## UWAGI
          - to NIE jest DSU: super nadpisuje partycje dynamiczne na stale;
            slot B zostaje nietkniety (rollback: fastboot --set-active=b),
          - SP Flash Tool: najpierw konwersja sparse->raw:
            python3 simg2img.py super_mystical3.img super_raw.img
            (plik jest w formacie sparse Android, magic 0xED26FF3A),
          - userdata zostaje (A14->A14, ten sam branch),
          - apki MIUI moga wymagac frameworku MIUI (audyt w trace);
            Aurora Store doinstaluje launcher z sieci w razie problemow.
          EOT
          cat > "$WORK/kit/sprawdz.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u; rc=0
          echo "== sha256sum -c SHA256SUMS.txt =="; sha256sum -c SHA256SUMS.txt || rc=1
          [ $rc -eq 0 ] && echo "WSZYSTKO ZGODNE." || echo "NIEZGODNE - pobierz ponownie."
          exit $rc
          EOF
          chmod +x "$WORK/kit/sprawdz.sh"
          cd "$WORK/kit"
          sha256sum super_mystical3.part.* vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img \
            $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" ) > SHA256SUMS.txt
          { echo "parts=$NP"
            echo "chunk=${CHUNK}"
            echo "size_sparse=$SSZ"
            echo "sha256_sparse_zlozony=$(cat super_mystical3.part.* | sha256sum | cut -d' ' -f1)"; } > super.manifest
          cat super.manifest
          ls -la
          df -h / /dev/shm | tail -2

      - name: "7. Release mysticalos-3-super (czastki + kit)"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          cd "$WORK/kit"
          TRANSPLANT=$(cat /tmp/transplant.status 2>/dev/null | head -1 || echo "?")
          gh release delete mysticalos-3-super --yes --cleanup-tag 2>/dev/null || true
          gh release create mysticalos-3-super --target "$GITHUB_SHA" \
            --title "MysticalOS 3 - TB350FU super.img repack (stock Lenovo base + microG/Aurora + HyperOS transplant)" \
            --notes "MysticalOS 3 = hybrydowy super.img w FABRYCZNEJ geometrii TB350FU (9 GiB, VAB, slot A; wlasny parser liblp v10.x + lpmake AOSP): spojny zestaw S230982 (system_ext/product/vendor/odm*) + system MysticalOS 3 (PURGE GMS z system+product+system_ext; zachowany tylko WebView; microG v0.3.16.252432 + FakeStore + Aurora 4.8.4; transplant: $TRANSPLANT; mitigation display: staly refresh rate). Format: sparse super w ~32 czastkach + vbmeta_disable (flags=3) + boot_S230982 + simg2img.py. Flash: fastbootd wg FLASH-M3.md (vbmeta x3 -> super -> set-active=a). Slot B = rollback. To zamiana partycji dynamicznych, NIE DSU." \
            super_mystical3.part.* vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img \
            FLASH-M3.md sprawdz.sh SHA256SUMS.txt super.manifest simg2img.py $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" )
          gh release view mysticalos-3-super --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)B [\(.state)]")'

      - name: "8. Linki publiczne (gofile; tar w tmpfs)"
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          rm -rf "$SHM/gofile"; mkdir -p "$SHM/gofile"
          tar cf "$SHM/gofile/MysticalOS3_super_kit.tar" -C "$WORK/kit" .
          bash tools/public_links.sh "$SHM/gofile/MysticalOS3_super_kit.tar" /tmp/links-m3.md || true
          rm -rf "$SHM/gofile"

      - name: "9. Raport z linkami + trace do repo"
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          mkdir -p reports
          F="reports/mystical3-links-${{ github.run_id }}.md"
          { echo "### MysticalOS 3 (super.img TB350FU) links (run ${{ github.run_id }})"
            echo "release: mysticalos-3-super"
            echo "transplant: $(cat /tmp/transplant.status 2>/dev/null | head -1 || echo '?')"
            echo "purge product/system_ext: $(cat /tmp/purge-partitions.status 2>/dev/null | tr '\n' ' ' || echo 'brak zmian')"
            echo
            echo "--- gofile (kit tar: czastki + vbmeta + boot + FLASH + simg2img) ---"; cat /tmp/links-m3.md 2>/dev/null || echo "(brak)"
            echo "--- sondy URL ---"; cat "$WORK/urlprobe.log" 2>/dev/null || echo "(brak)"
            echo "--- manifest ---"; cat "$WORK/kit/super.manifest" 2>/dev/null || echo "(brak)"
            echo "--- geometria fabryczna ---"; cat "$WORK/geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- geometria zbudowana ---"; cat "$WORK/super-built-geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- purge GMS ---"; cat /tmp/gms-purge.list 2>/dev/null || echo "(brak)"; } > "$F" || true
          cat "$F" || true
          if [ -f reports/mystical3-build-trace.log ]; then
            echo "trace builda: reports/mystical3-build-trace.log ($(stat -c%s reports/mystical3-build-trace.log) B)"
          fi
          git add -f reports tools/lpinfo.py tools/simg2img.py || true
          git commit -q -m "m3-links+trace: run ${{ github.run_id }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || echo "push nie wyszedl"
          exit 0
