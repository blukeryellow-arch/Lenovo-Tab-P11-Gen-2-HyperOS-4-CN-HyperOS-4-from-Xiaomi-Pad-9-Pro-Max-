          for P in "${!PPATH[@]}"; do
            [ -s "$SHM/m3/$P.img" ] && PPATH[$P]="$SHM/m3/$P.img"
          done
          ORDER=(system system_ext product vendor vendor_dlkm odm_dlkm)
          TOTAL=0; ARGS=()
          declare -A PSZ
          for P in "${ORDER[@]}"; do
            SRC="${PPATH[$P]}"
            if [ ! -s "$SRC" ]; then echo "  $P: brak - pomijam"; continue; fi
            SZ=$(stat -c%s "$SRC"); PSZ[$P]=$SZ
            SZR=$(( (SZ + 4095) / 4096 * 4096 ))
            TOTAL=$(( TOTAL + SZR ))
            ARGS+=(--partition="${P}_a:readonly:$SZR:main_a" --image="${P}_a=$SRC")
            echo "  ${P}_a: $SZ -> $SZR B ($SRC)"
          done
          echo "SUMA partycji _a: $TOTAL B; budzet main_a: $MAIN_GROUP_SIZE B"
          [ "$TOTAL" -le "$MAIN_GROUP_SIZE" ] || { echo "::error::obrazy nie mieszcza sie w main_a!"; exit 1; }
          # guard peaku: 2x system + ext (+ vendor jesli na dysku)
          SYS_SZ=${PSZ[system]:-0}; EXT_SZ=${PSZ[system_ext]:-0}
          VD_SZ=0; PRD_SZ=0
          for P in vendor vendor_dlkm odm_dlkm; do
            case "${PPATH[$P]}" in "$WORK"/*) VD_SZ=$(( VD_SZ + ${PSZ[$P]:-0} ));; esac
          done
          case "${PPATH[product]:-}" in "$WORK"/*) PRD_SZ=${PSZ[product]:-0};; esac
          PEAK=$(( SYS_SZ * 2 + EXT_SZ + VD_SZ + PRD_SZ + 100000000 ))
          AVAIL=$(( $(df --output=avail -B1 "$WORK" | tail -1) ))
          echo "peak estymowany: $PEAK B ($(( PEAK / 1073741824 ))G); avail: $AVAIL B ($(( AVAIL / 1073741824 ))G)"
          [ "$AVAIL" -ge "$PEAK" ] || { echo "::error::peak $PEAK > avail $AVAIL (sprawdz purge; retrigger)"; exit 1; }
          # plan unlink: prog kumulatywny (+16M margin na metadane) -> sciezka
          : > /tmp/unlink-plan
          CUM=$(( 16 * 1048576 ))
          for P in "${ORDER[@]}"; do
            [ -n "${PSZ[$P]:-}" ] || continue
            CUM=$(( CUM + PSZ[$P] + 4096 ))
            echo "$CUM ${PPATH[$P]}" >> /tmp/unlink-plan
          done
          cat /tmp/unlink-plan
          rm -f /tmp/watcher.log /tmp/lpmake-done
          (
            while [ ! -f /tmp/lpmake-done ]; do
              SZ=$(stat -c%s "$WORK/super_m3_sparse.img" 2>/dev/null || echo 0)
              while read -r THR PATHP; do
                [ -n "$THR" ] || continue
                if [ "$SZ" -ge "$THR" ] && [ -f "$PATHP" ]; then
                  rm -f "$PATHP"
                  echo "[watcher] rm $(basename "$PATHP") @ sparse=$SZ" >> /tmp/watcher.log
                fi
              done < /tmp/unlink-plan
              sleep 3
            done
          ) &
          WPID=$!
          "$WORK/bin/lpmake" \
            --device-size="$SUPER_SIZE" \
            --metadata-size=65536 \
            --metadata-slots=3 \
            --block-size=4096 \
            --alignment=1048576 \
            --super-name=super \
            -S \
            --group="main_a:$MAIN_GROUP_SIZE" \
            "${ARGS[@]}" \
            -o "$WORK/super_m3_sparse.img"
          touch /tmp/lpmake-done || true
          sleep 1; kill $WPID 2>/dev/null || true
          echo "== watcher =="; cat /tmp/watcher.log 2>/dev/null || echo "(nic nie usunal?!)"
          ls -la "$WORK/super_m3_sparse.img"
          rm -f "$WORK/img"/*.img "$SHM/m3"/*.img 2>/dev/null || true
          # WERYFIKACJA duzego sparse BEZ materializacji 9,6G raw:
          # rekonstrukcja glowy (4 MB) z chunkow -> lpinfo.py
          python3 - "$WORK/super_m3_sparse.img" "$SHM/super_head.img" <<'PYEOF'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          f = open(src, 'rb')
          hdr = f.read(28)
          magic, maj, mnr, fhs, chs, blk, nblk, nch, ck = struct.unpack('<IHHHHIIII', hdr)
          assert magic == 0xED26FF3A, f"bad sparse magic {magic:#x}"
          HEAD = 4 * 1024 * 1024
          out = bytearray(HEAD)
          pos = 0
          for _ in range(nch):
            ch = f.read(12)
            ct, res, n, total = struct.unpack('<HHII', ch)
            if ct == 0xCAC1:  # RAW
              data = f.read(total)
              for i in range(n):
                o = i * blk
                if pos + o < HEAD:
                  end = min(pos + o + blk, HEAD)
                  out[pos + o:end] = data[o:o + (end - pos - o)]
            elif ct == 0xCAC2:  # FILL
              fill = f.read(4)
              for i in range(n):
                o = i * blk
                if pos + o < HEAD:
                  end = min(pos + o + blk, HEAD)
                  out[pos + o:end] = (fill * blk)[:end - pos - o]
            else:
              if ct != 0xCAC3:
                f.seek(total, 1)
            pos += n * blk
          open(dst, 'wb').write(out)
          print(f"glowa {HEAD} B zrekonstruowana z {nch} chunkow (device {nblk * blk} B)")
          PYEOF
          python3 tools/lpinfo.py "$SHM/super_head.img" | tee "$WORK/super-built-geometry.txt"
          grep -q "size=9663676416" "$WORK/super-built-geometry.txt"
          grep -q "system_a" "$WORK/super-built-geometry.txt"
          grep -q "main_a" "$WORK/super-built-geometry.txt"
          echo "GEOMETRIA zbudowanego super: ZWERYFIKOWANA (lpinfo na glowie sparse)"
          rm -f "$SHM/super_head.img"
          df -h / /dev/shm | tail -2
      - name: "6. ~32 czastki (tail->tmpfs->dysk + truncate zrodla) + vbmeta + kit"
        # Sparse 4,5G + czastki 4,5G naraz = 9G > dysk. Algorytm tail-first:
        # partia czastek OGONOWYCH -> tmpfs -> split wprost do kit (dysk) ->
        # truncate zrodla (ucina skopiowany ogon) -> repeat az zrodro <= PER
        # czastek -> split reszty (glowa) wprost do kit -> rm zrodlo.
        # Peak dysku: malejace zrodro + rosnace czastki <= ~7,7G.
        # (test sandbox: 10,5M/PER=3 -> cat parts == oryginal, wszystkie indeksy)
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          S="$WORK/super_m3_sparse.img"
          SSZ=$(stat -c%s "$S")
          CHUNK=$(( ( (SSZ + 31) / 32 + 1048575 ) / 1048576 * 1048576 ))
          N=$(( (SSZ + CHUNK - 1) / CHUNK ))
          echo "super sparse: $SSZ B -> $N czastek po ~$CHUNK B (cel: 32)"
          CAPB=3200000000
          PER=$(( CAPB / CHUNK )); [ "$PER" -lt 1 ] && PER=1
          echo "czastek na partie (tmpfs cap ~3,2G): $PER"
          mkdir -p "$WORK/kit"
          cur_n=$N; cur_size=$SSZ
          while [ "$cur_n" -gt "$PER" ]; do
            new_n=$(( cur_n - PER ))
            off=$(( new_n * CHUNK ))
            take=$(( cur_size - off ))
            echo "partia ogonowa: czastki [${new_n}, ${cur_n}) = $take B (offset $off)"
            dd if="$S" of="$SHM/parts.bin" bs=1M skip=$(( off / 1048576 )) \
              count=$(( (take + 1048575) / 1048576 )) status=none
            split -b "$CHUNK" -d --numeric-suffixes="$new_n" "$SHM/parts.bin" "$WORK/kit/super_mystical3.part."
            rm -f "$SHM/parts.bin"
            truncate -s "$off" "$S"   # ucinamy skopiowany ogon zrodla
            cur_n=$new_n; cur_size=$off
            df -h / /dev/shm | tail -2
          done
          echo "czastki glowne: [0, ${cur_n}) = $cur_size B"
          split -b "$CHUNK" -d --numeric-suffixes=0 "$S" "$WORK/kit/super_mystical3.part."
          rm -f "$S"
          NP=$(ls "$WORK/kit"/super_mystical3.part.* | wc -l)
          echo "czastek: $NP (rozmiary: $(du -sh "$WORK/kit" | cut -f1))"
          [ "$NP" -le 32 ] || { echo "::error::wiecej niz 32 czastki ($NP)"; exit 1; }
          [ "$NP" -eq 32 ] || echo "::warning::czastek $NP != 32 (sparse mniejszy niz zakladano)"
          python3 "$WORK/bin/avbtool.py" make_vbmeta_image --flags 3 -o "$WORK/kit/vbmeta_disable.img" --padding_size 4096
          truncate -s 8192 "$WORK/kit/vbmeta_disable.img"
          cp "$WORK/kit/vbmeta_disable.img" "$WORK/kit/vbmeta_system_disable.img"
          truncate -s 4096 "$WORK/kit/vbmeta_system_disable.img"
          cp "$WORK/kit/vbmeta_disable.img" "$WORK/kit/vbmeta_vendor_disable.img"
          truncate -s 4096 "$WORK/kit/vbmeta_vendor_disable.img"
          [ -s "$WORK/one/boot.img" ] && cp "$WORK/one/boot.img" "$WORK/kit/boot_${BASE_BUILD}.img" \
            || echo "::warning::brak boot.img"
          cp tools/simg2img.py "$WORK/kit/simg2img.py"
          cat > "$WORK/kit/FLASH-M3.md" <<EOT
          # MysticalOS 3 - flash super.img (TB350FU)

          ## Co to jest
          Pelny kontener super (fabryczna geometria 9 GiB, VAB, slot A) ze
          SPOJNYM zestawem S230982 (system_ext/product/vendor/odm*) + system
          MysticalOS 3 (PURGE GMS [webview zostaje] + microG + FakeStore +
          Aurora + transplant HyperOS + staly refresh rate).

          ## Format
          super_mystical3.part.NN = SPARSE super.img pociety na ~32 czastki.
          Zlozenie: cat super_mystical3.part.* > super_mystical3.img
          (nastepnie sha256sum -c SHA256SUMS.txt).

          ## Flash (fastbootd; bootloader odblokowany)
          1. fastboot flash vbmeta vbmeta_disable.img
          2. fastboot flash vbmeta_system vbmeta_system_disable.img
          3. fastboot flash vbmeta_vendor vbmeta_vendor_disable.img
          4. fastboot flash super super_mystical3.img   (fastbootd sam
             rozpakuje sparse; do fastbootd: fastboot reboot fastboot)
          5. fastboot --set-active=a    (build zawiera TYLKO slot A!)
          6. fastboot reboot
          7. JESLI bootloop (kernel S231044 vs moduly S230982):
             fastboot flash boot boot_${BASE_BUILD}.img && fastboot reboot

          ## UWAGI
          - to NIE jest DSU: super nadpisuje partycje dynamiczne na stale;
            slot B zostaje nietkniety (rollback: fastboot --set-active=b),
          - SP Flash Tool: najpierw konwersja sparse->raw:
            python3 simg2img.py super_mystical3.img super_raw.img
            (plik jest w formacie sparse Android, magic 0xED26FF3A),
          - userdata zostaje (A14->A14, ten sam branch),
          - apki MIUI moga wymagac frameworku MIUI (audyt w trace);
            Aurora Store doinstaluje launcher z sieci w razie problemow.
          EOT
          cat > "$WORK/kit/sprawdz.sh" <<'EOF'
          #!/usr/bin/env bash
          set -u; rc=0
          echo "== sha256sum -c SHA256SUMS.txt =="; sha256sum -c SHA256SUMS.txt || rc=1
          [ $rc -eq 0 ] && echo "WSZYSTKO ZGODNE." || echo "NIEZGODNE - pobierz ponownie."
          exit $rc
          EOF
          chmod +x "$WORK/kit/sprawdz.sh"
          cd "$WORK/kit"
          sha256sum super_mystical3.part.* vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img \
            $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" ) > SHA256SUMS.txt
          { echo "parts=$NP"
            echo "chunk=${CHUNK}"
            echo "size_sparse=$SSZ"
            echo "sha256_sparse_zlozony=$(cat super_mystical3.part.* | sha256sum | cut -d' ' -f1)"; } > super.manifest
          cat super.manifest
          ls -la
          df -h / /dev/shm | tail -2

      - name: "7. Release mysticalos-3-super (czastki + kit)"
        run: |
          set -euo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          cd "$WORK/kit"
          TRANSPLANT=$(cat /tmp/transplant.status 2>/dev/null | head -1 || echo "?")
          gh release delete mysticalos-3-super --yes --cleanup-tag 2>/dev/null || true
          gh release create mysticalos-3-super --target "$GITHUB_SHA" \
            --title "MysticalOS 3 - TB350FU super.img repack (stock Lenovo base + microG/Aurora + HyperOS transplant)" \
            --notes "MysticalOS 3 = hybrydowy super.img w FABRYCZNEJ geometrii TB350FU (9 GiB, VAB, slot A): spojny zestaw S230982 (system_ext/product/vendor/odm*) + system MysticalOS 3 (PURGE GMS z system+product+system_ext; zachowany tylko WebView; microG v0.3.16.252432 + FakeStore + Aurora 4.8.4; transplant: $TRANSPLANT; mitigation display: staly refresh rate). Ekstrakcja bazy: wlasny streaming unpacker liblp (httpzip range + stream_lpunpack, bit-identyczny z lpunpack AOSP). Format: sparse super w ~32 czastkach + vbmeta_disable (flags=3) + boot_S230982 + simg2img.py. Flash: fastbootd wg FLASH-M3.md (vbmeta x3 -> super -> set-active=a). Slot B = rollback. To zamiana partycji dynamicznych, NIE DSU." \
            super_mystical3.part.* vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img \
            FLASH-M3.md sprawdz.sh SHA256SUMS.txt super.manifest simg2img.py $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" )
          gh release view mysticalos-3-super --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)B [\(.state)]")'

      - name: "8. Linki publiczne (gofile; 2 polowkowe tary przez tmpfs)"
        # tar calego kitu (4,5G) nie zmiescilby sie na dysku obok parts;
        # stad 2 tary po ~2,3G: kit-a (czastki 00-polowa + flash) i kit-b.
        run: |
          set -uo pipefail
          exec > >(tee -a "$GITHUB_WORKSPACE/reports/mystical3-build-trace.log") 2>&1
          cd "$WORK/kit"
          rm -rf "$SHM/gf"; mkdir -p "$SHM/gf"
          NP=$(ls super_mystical3.part.* | wc -l)
          HALF=$(( NP / 2 ))
          set -- super_mystical3.part.*
          FIRST=(); i=0
          for F in "$@"; do [ "$i" -lt "$HALF" ] && FIRST+=("$F"); i=$((i+1)); done
          LAST=(); i=0
          for F in "$@"; do [ "$i" -ge "$HALF" ] && LAST+=("$F"); i=$((i+1)); done
          tar cf "$SHM/gf/MysticalOS3_kit-A.tar" "${FIRST[@]}" FLASH-M3.md sprawdz.sh SHA256SUMS.txt super.manifest simg2img.py $( [ -f "boot_${BASE_BUILD}.img" ] && echo "boot_${BASE_BUILD}.img" )
          tar cf "$SHM/gf/MysticalOS3_kit-B.tar" "${LAST[@]}" vbmeta_disable.img vbmeta_system_disable.img vbmeta_vendor_disable.img
          { echo "== MysticalOS 3 super kit (gofile, 2 tary) =="
            echo "Po rozpakowaniu OBU tarow w jednym katalogu: cat super_mystical3.part.* > super_mystical3.img"; } > /tmp/links-m3.md
          bash tools/public_links.sh "$SHM/gf/MysticalOS3_kit-A.tar" /tmp/links-A.md || true
          bash tools/public_links.sh "$SHM/gf/MysticalOS3_kit-B.tar" /tmp/links-B.md || true
          cat /tmp/links-A.md >> /tmp/links-m3.md 2>/dev/null || true
          cat /tmp/links-B.md >> /tmp/links-m3.md 2>/dev/null || true
          rm -rf "$SHM/gf"

      - name: "9. Raport z linkami + trace do repo"
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          mkdir -p reports
          F="reports/mystical3-links-${{ github.run_id }}.md"
          { echo "### MysticalOS 3 (super.img TB350FU) links (run ${{ github.run_id }})"
            echo "release: mysticalos-3-super"
            echo "transplant: $(cat /tmp/transplant.status 2>/dev/null | head -1 || echo '?')"
            echo "purge product/system_ext: $(cat /tmp/purge-partitions.status 2>/dev/null | tr '\n' ' ' || echo 'brak zmian')"
            echo
            echo "--- gofile (2 tary: kit-A czastki+flash, kit-B czastki+vbmeta) ---"; cat /tmp/links-m3.md 2>/dev/null || echo "(brak)"
            echo "--- manifest stream_lpunpack (baza) ---"; cat /tmp/stream-manifest.txt 2>/dev/null || echo "(brak)"
            echo "--- sondy URL ---"; cat "$WORK/urlprobe.log" 2>/dev/null || echo "(brak)"
            echo "--- manifest ---"; cat "$WORK/kit/super.manifest" 2>/dev/null || echo "(brak)"
            echo "--- geometria fabryczna ---"; cat "$WORK/geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- metadane bazowego super ---"; cat "$WORK/base-super-geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- geometria zbudowana ---"; cat "$WORK/super-built-geometry.txt" 2>/dev/null || echo "(brak)"
            echo "--- purge GMS ---"; cat /tmp/gms-purge.list 2>/dev/null || echo "(brak)"; } > "$F" || true
          cat "$F" || true
          if [ -f reports/mystical3-build-trace.log ]; then
            echo "trace builda: reports/mystical3-build-trace.log ($(stat -c%s reports/mystical3-build-trace.log) B)"
          fi
          git add -f reports tools/lpinfo.py tools/simg2img.py tools/httpzip.py tools/stream_lpunpack.py || true
          git commit -q -m "m3-links+trace: run ${{ github.run_id }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || echo "push nie wyszedl"
          exit 0
