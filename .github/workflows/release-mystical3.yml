          df -h / /dev/shm | tail -2
      - name: "5. super.img (lpmake -S + watcher unlink po konsumpcji partycji)"
        # Peak dysku = sparse(t) + img_dyskowe(t). ARGS = kolejnosc offsetow w
        # super (receipt mini-test: kolejnosc argumentow); system_m3 (dysk,
        # najwiekszy) PIERWSZY => watcher usuwa go gdy sparse >= size+16M
        # (TEST: unlink po skonsumowaniu bit-identyczny; unlink PRZED czytaniem
        # = lpmake exit 73 - lpmake otwiera pliki LENIWIEnie!). Potem ext_m3.
        # Suma danych ~5,6-6,5G; peak = 2x(system_m3)+ext_m3 ~ 6,9-7,5G.
        run: |
