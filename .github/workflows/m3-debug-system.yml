name: m3-debug-system

# Debug: co siedzi w system.img TB350FU_S230982 po streaming-unsparse?
# Receipt 36727601026: streaming OK (W system 3678793728 OK, pin OK), partycja
# = ext4 ("ext4 (loop-mount)"), ale drzewo po cp -a NIE MA /app.
# Tu: stream -> /tmp/system.img -> file/e2fsck/mount/debugfs + listingi.

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/m3-debug-system.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      LOLINET_ZIP: https://mirrors.lolinet.com/firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/TB350FU_S230982_251013_ROW.zip
      BASE_ENTRY_PREFIX: TB350FU_S230982_251013_ROW/image
      SIZE_SYSTEM: 3678793728
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: "Stream system.img + probe fs"
        run: |
          set -uo pipefail
          mkdir -p reports
          exec > >(tee -a reports/m3-debug-system.log) 2>&1
          echo "### m3-debug-system $(date -u +%FT%TZ)"
          df -h / | tail -1
          echo "== stream (httpzip | simg2img_stream | stream_lpunpack --only system) =="
          python3 tools/httpzip.py "$LOLINET_ZIP" --entry "${BASE_ENTRY_PREFIX}/super.img" \\
            | python3 tools/simg2img_stream.py \\
            | python3 tools/stream_lpunpack.py --stdin --out /tmp --only system
          ls -la /tmp/system.img
          S=$(stat -c%s /tmp/system.img)
          echo "rozmiar: $S (pin $SIZE_SYSTEM)"
          echo "== file / magic =="
          file /tmp/system.img || true
          python3 - <<'PYEOF'
          d = open('/tmp/system.img','rb').read(4096)
          print("pierwsze 64B:", d[:64].hex())
          # ext4 superblock @1024
          sb = d[1024:1024+120]
          import struct
          if len(sb) >= 56:
              inodes, blocks = struct.unpack('<II', sb[0:8])
              magic = struct.unpack('<H', sb[56:58])[0]
              print(f"ext4 sb?: inodes={inodes} blocks={blocks} magic={magic:#x} (0xef53=ext)")
          # ile zer w pierwszym MB?
          MB = open('/tmp/system.img','rb')
          chunk = MB.read(1048576)
          print("zer w 1. MB:", chunk.count(0), "/ 1048576")
          # sygnal w okolicy 1M-2M (metadata ext4 grup?)
          MB.seek(8*1024*1024)
          c2 = MB.read(1048576)
          print("zer w MB@8M:", c2.count(0), "/ 1048576")
          MB.seek(100*1024*1024)
          c3 = MB.read(1048576)
          print("zer w MB@100M:", c3.count(0), "/ 1048576")
          MB.seek(1000*1024*1024)
          c4 = MB.read(1048576)
          print("zer w MB@1000M:", c4.count(0), "/ 1048576")
          MB.seek(3000*1024*1024)
          c5 = MB.read(1048576)
          print("zer w MB@3000M:", c5.count(0), "/ 1048576")
          PYEOF
          echo "== mount probing =="
          sudo mkdir -p /mnt/m3
          echo "-- proba: erofs"
          sudo mount -t erofs -o ro,loop /tmp/system.img /mnt/m3 2>&1 | head -3 || true
          mountpoint -q /mnt/m3 && echo "MOUNT EROFS OK" || echo "erofs: nie"
          sudo umount /mnt/m3 2>/dev/null || true
          echo "-- proba: ext4 (auto)"
          sudo mount -o ro,loop /tmp/system.img /mnt/m3 2>&1 | head -3 || true
          if mountpoint -q /mnt/m3; then
            echo "MOUNT EXT4 OK; listing root:"
            sudo ls -la /mnt/m3 | head -40
            echo "-- /app? --"
            sudo ls /mnt/m3/app 2>&1 | head -10 || true
            echo "-- /priv-app? --"
            sudo ls /mnt/m3/priv-app 2>&1 | head -5 || true
            sudo umount /mnt/m3
          else
            echo "ext4 mount FAIL -> debugfs"
            which debugfs || sudo apt-get install -y -q e2fsprogs 2>/dev/null | tail -1 || true
            debugfs -R "ls -l /" /tmp/system.img 2>&1 | head -40 || true
            echo "-- stats --"
            debugfs -R "stats" /tmp/system.img 2>&1 | head -20 || true
          fi
          echo "== e2fsck -n (tylko odczyt) =="
          sudo e2fsck -n -f /tmp/system.img 2>&1 | tail -15 || true
          rm -f /tmp/system.img
          exit 0

      - name: "Raport do repo"
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          git add -f reports || true
          git commit -q -m "m3-debug-system: $(date -u +%H%M)Z" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || true
          exit 0
