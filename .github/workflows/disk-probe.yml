name: disk-probe
on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/disk-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          echo "== df =="; df -h / /mnt /tmp 2>&1 || df -h
          echo "== avail GB: / = $(df --output=avail -B1G / | tail -1), /mnt = $(df --output=avail -B1G /mnt 2>/dev/null | tail -1 || echo brak)"
          echo "== lsblk =="; lsblk 2>/dev/null | head -12 || true
      - name: raport do repo
        if: always()
        run: |
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          mkdir -p reports
          { echo "### disk-probe (run ${{ github.run_id }}, $(date -u +%FT%TZ))"
            echo '```'; df -h / /mnt /tmp 2>&1 || df -h; echo '```'
            echo '```'; lsblk 2>/dev/null | head -12; echo '```'; } > reports/disk-probe-${{ github.run_id }}.md
          git add -f reports || true
          git commit -q -m "disk-probe: run ${{ github.run_id }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || true
          exit 0
