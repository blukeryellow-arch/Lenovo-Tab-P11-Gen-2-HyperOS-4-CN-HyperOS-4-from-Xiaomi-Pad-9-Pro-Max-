name: base-probe

# Probe struktury bazowego zipa lolinet TB350FU_S230982_251013_ROW
# (receipt 36603503837: NIE payload.bin tylko pakiet SP Flash Tool z image/).
# Pytania: (1) pelny listing image/ z rozmiarami skompresowanymi (unzip -lv),
# (2) czy super.img jest sparse czy raw (Length vs magic),
# (3) czy lolinet wspiera range requests (streaming bez zapisu zipa),
# (4) flash.xml (mapa partycji SPFT).

on:
  workflow_dispatch:
  push:
    branches: [arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4]
    paths: ['.github/workflows/base-probe.yml']

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOLINET_ZIP: https://mirrors.lolinet.com/firmware/lenowow/2022/Tab_P11_2nd_Gen/TB350FU/TB350FU_S230982_251013_ROW.zip
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: "Range request test (bez pobierania całości)"
        run: |
          set -uo pipefail
          echo "== HEAD =="; curl -sI "$LOLINET_ZIP" | head -15
          echo "== GET pierwsze 64 KB (206?) =="
          curl -s -r 0-65535 -o /tmp/head64k.bin -w "http=%{http_code} size=%{size_download}\n" "$LOLINET_ZIP"
          echo "== magic super/sparse w glowie zipa (wydruk 256B) =="
          xxd /tmp/head64k.bin | head -6
          echo "== range z ogona (central directory) =="
          SZ=$(curl -sI "$LOLINET_ZIP" | grep -i content-length | tr -dc '0-9')
          echo "content-length=$SZ"
          FROM=$(( SZ - 1000000 ))
          curl -s -r "$FROM-$((SZ-1))" -o /tmp/tail1m.bin -w "http=%{http_code} size=%{size_download}\n" "$LOLINET_ZIP"
          python3 - "$SZ" <<'PYEOF'
          import sys, zipfile, io
          # python nie zna offsets w tailu; ale central dir ma podpis PK\x05\x06 na koncu
          data = open('/tmp/tail1m.bin','rb').read()
          eocd = data.rfind(b'PK\x05\x06')
          print("EOCD w tailu:", eocd, "rozmiar tailu:", len(data))
          if eocd >= 0:
              import struct
              cd_size, cd_off = struct.unpack('<II', data[eocd+12:eocd+20])
              total = int(sys.argv[1])
              print(f"central dir: size={cd_size} off={cd_off} (plik {total} B)")
              print("cd_off w tailu?", cd_off >= int(sys.argv[1]) - 1000000)
          PYEOF

      - name: "Pobranie zipa + pelny listing (unzip -lv)"
        run: |
          set -uo pipefail
          df -h / | tail -1
          curl -fL --retry 3 -o /tmp/base.zip "$LOLINET_ZIP" || { echo "download padl"; exit 1; }
          stat -c%s /tmp/base.zip
          echo "== unzip -lv (rozmiary compressed/uncompressed) =="
          unzip -lv /tmp/base.zip | sort -k1 -n -r | head -40
          echo "== flash.xml =="
          unzip -p /tmp/base.zip 'TB350FU_S230982_251013_ROW/flash.xml' 2>/dev/null | head -40 || true
          unzip -p /tmp/base.zip '*flash.xml' 2>/dev/null | head -60 || true
          rm -f /tmp/base.zip /tmp/head64k.bin /tmp/tail1m.bin

      - name: "Raport do repo"
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          mkdir -p reports
          { echo "### base-probe $(date -u +%FT%TZ)"; } > reports/base-probe.md
          git add -f reports || true
          git commit -q -m "base-probe: $(date -u +%H%M)Z" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || true
          exit 0
