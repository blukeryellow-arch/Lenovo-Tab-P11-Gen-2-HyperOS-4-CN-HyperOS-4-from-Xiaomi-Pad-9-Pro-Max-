name: release-port
# Permanentny GitHub Release z artefaktu portu mysticalos3 (runner GH widzi
# blob storage Actions - sandbox agenta NIE widzi, stad ten posrednik).
# Trigger: workflow_dispatch (reczny lub z API po sukcesie mysticalos3).
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID mysticalos3 (puste = ostatni sukces)'
        required: false
        default: ''
concurrency:
  group: release-port
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Znajdz run mysticalos3 + artefakt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RID="${{ inputs.run_id }}"
          if [ -z "$RID" ]; then
            RID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mysticalos3.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].id')
          fi
          echo "Run mysticalos3: $RID"
          AID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RID/artifacts" \
                --jq '[.artifacts[] | select(.name=="MysticalOS_0.5_HyperOS_Port")][0].id')
          echo "Artefakt id: $AID"
          echo "RID=$RID" >> "$GITHUB_ENV"
          echo "AID=$AID" >> "$GITHUB_ENV"

      - name: Pobierz artefakt portu (1,8 GB)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$AID/zip" > port.zip
          ls -la port.zip

      - name: Rozpakuj drobiazgi (INSTRUKCJA + SHA256 + preview + raporty)
        run: |
          mkdir -p rel && cd rel && unzip -o -q ../port.zip
          mv tmp/m2/out/INSTRUKCJA-FASTBOOTD.txt .
          mv tmp/m2/out/SHA256SUMS.txt .
          mv tmp/m2/out/port-report.txt .
          mv tmp/m2/out/mods-report.txt .
          cp tmp/m2/out/preview/preview-boot.jpg .
          cp tmp/m2/out/preview/preview-wallpaper.jpg .
          ls -la .

      - name: Release (PERMANENTNY download bez UI Actions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="0.5-hyperos-port"
          SHA_IMG=$(grep "MysticalOS_0.5_HyperOS_Port.img" rel/SHA256SUMS.txt | awk '{print $1}')
          {
            echo "# MysticalOS 0.5 — PRAWDZIWY PORT HyperOS (nabu OS1.0.6.0 → Lenovo TB350FU)"
            echo
            echo "Run mysticalos3: $RID (SUCCESS) · artefakt: MysticalOS_0.5_HyperOS_Port"
            echo
            echo "## Zawartosc pelnego zipa (MysticalOS_0.5_HyperOS_Port-full.zip)"
            echo "- out/MysticalOS_0.5_HyperOS_Port.img — RAW ext4, 3 489 660 928 B (= PS partycji), stopka AVB flags 2 sha256 no-FEC"
            echo "- out/INSTRUKCJA-FASTBOOTD.txt + out/SHA256SUMS.txt"
            echo "- vbmeta/FLAGS3/ + vbmeta/STOCK-ORYGINAL/ (po 3 pliki)"
            echo "- out/preview/ (bootanim + tapeta) + raporty (port/mods/avb)"
            echo
            echo "SHA256 (img): \`${SHA_IMG}\`"
            echo
            echo "## Wgrywanie — TYLKO system (boot.img NIETYKANY)"
            echo '```'
            echo "fastboot flash vbmeta        vbmeta/FLAGS3/vbmeta.img        # raz, jesli nie wgrywano wczesniej"
            echo "fastboot flash vbmeta_system vbmeta/FLAGS3/vbmeta_system.img"
            echo "fastboot flash vbmeta_vendor vbmeta/FLAGS3/vbmeta_vendor.img"
            echo "adb reboot fastboot                                               # FastbootD"
            echo "fastboot flash system out/MysticalOS_0.5_HyperOS_Port.img"
            echo "fastboot reboot"
            echo '```'
            echo
            echo "Pelna instrukcja (rollback, diagnostyka ADB, kontrola po boocie): INSTRUKCJA-FASTBOOTD.txt w assetach."
            echo
            echo "Evidence: reports/mysticalos3-$RID.md w repo (branch arena)."
          } > NOTES.md
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" port.zip#MysticalOS_0.5_HyperOS_Port-full.zip --clobber
          else
            gh release create "$TAG" \
              --title "MysticalOS 0.5 — PRAWDZIWY PORT HyperOS (Pad Edition)" \
              --notes-file NOTES.md --target "$GITHUB_SHA"
            gh release upload "$TAG" port.zip#MysticalOS_0.5_HyperOS_Port-full.zip
          fi
          gh release upload "$TAG" rel/INSTRUKCJA-FASTBOOTD.txt rel/SHA256SUMS.txt \
            rel/port-report.txt rel/mods-report.txt rel/preview-boot.jpg rel/preview-wallpaper.jpg --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
