name: build-hyperos-look

on:
  push:
    paths:
      - 'drive-probe.request'
      - 'tools/drive_form_post.py'
      - 'tools/raw_parts_on_runner.sh'
      - 'tools/push_spool_branch.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'drive-probe.request'
      - 'tools/drive_form_post.py'
      - 'tools/raw_parts_on_runner.sh'
      - 'tools/push_spool_branch.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-system-to-spool:
    # A push tagged [drive-probe] is deliberate: it transfers the public Drive
    # asset to a temporary Git branch in <=90 MiB verified pieces, where this
    # sandbox can fetch it through git.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || contains(github.event.head_commit.message, '[drive-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download public Google Drive image and verify its identity
        env:
          DRIVE_ID: 1341C_UdIvdqgT4CdZ1V4VpbCHQcK5z-O
          EXPECTED_SIZE: '920039464'
          EXPECTED_SHA256: 8b71ea568dfb6043cfb3234372b3b672c30f9dfb2e81d11ed1bbae89e98dc14f
        run: |
          set -euo pipefail
          chmod +x tools/drive_form_post.py tools/raw_parts_on_runner.sh tools/push_spool_branch.sh
          mkdir -p input transfer
          out=input/system_hyperos4_p11g2.img
          cookie=$(mktemp)
          warning=$(mktemp)
          trap 'rm -f "$cookie" "$warning"' EXIT
          for url in \
            "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t&authuser=0" \
            "https://drive.google.com/uc?export=download&confirm=t&id=$DRIVE_ID"; do
            rm -f "$out"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
              --cookie "$cookie" --cookie-jar "$cookie" -o "$out" "$url" || continue
            size=$(stat -c%s "$out" 2>/dev/null || echo 0)
            if [ "$size" -eq "$EXPECTED_SIZE" ]; then break; fi
            cp "$out" "$warning" || true
            rm -f "$out"
          done
          if [ ! -f "$out" ] && [ -s "$warning" ]; then
            python3 tools/drive_form_post.py --html "$warning" --jar "$cookie" \
              --out "$out" --id "$DRIVE_ID" --log input/download.log
          fi
          test -f "$out"
          test "$(stat -c%s "$out")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $out" | sha256sum -c -

      - name: Split verified source into Git-safe parts
        run: |
          set -euo pipefail
          RUN_TAG="$GITHUB_RUN_ID" tools/raw_parts_on_runner.sh \
            input/system_hyperos4_p11g2.img transfer 0 0
          find transfer -type f -printf '%f %s bytes\n' | sort

      - name: Publish parts to temporary transfer-spool branch
        run: |
          set -euo pipefail
          tools/push_spool_branch.sh transfer transfer-spool

  inspect-donor-011:
    # The requested official Xiaomi yingtian 4.0.11.0 donor is inspected on a
    # disposable GitHub runner. Only a compact audit is committed back; no 11.8
    # GiB firmware archive or image is put in Git.
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free runner space and install filesystem tools
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/graalvm /home/runner/.gradle/caches || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils file unzip
          command -v simg2img
          command -v fsck.erofs
          df -h .

      - name: Download and inspect yingtian China OS4.0.11.0.XBMCNXM
        env:
          DONOR_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.11.0.XBMCNXM/yingtian-images-OS4.0.11.0.XBMCNXM-user-20260916.0000.00-17.0-cn-60633b4ba6.tgz
        run: |
          set -euo pipefail
          mkdir -p donor extract reports
          archive=donor/yingtian-images-OS4.0.11.0.XBMCNXM.tgz
          curl --fail --location --retry 3 --connect-timeout 45 --output "$archive" "$DONOR_URL"
          test -s "$archive"
          tar -tzf "$archive" > donor/archive-files.txt
          {
            echo '# Donor audit: yingtian China OS4.0.11.0.XBMCNXM'
            echo
            echo "- source: \`$DONOR_URL\`"
            echo "- archive bytes: \`$(stat -c%s "$archive")\`"
            echo "- archive SHA-256: \`$(sha256sum "$archive" | cut -d' ' -f1)\`"
            echo
            echo '## Images present in the Fastboot archive'
            echo '```'
            grep -E '(^|/)(system|system_ext)\.img$' donor/archive-files.txt || true
            echo '```'
          } > reports/donor-011-${GITHUB_RUN_ID}.md

          mapfile -t images < <(grep -E '(^|/)(system|system_ext)\.img$' donor/archive-files.txt)
          test "${#images[@]}" -gt 0
          tar -xzf "$archive" -C extract "${images[@]}"

          for part in system system_ext; do
            image=$(find extract -type f -name "$part.img" | head -1 || true)
            [ -n "$image" ] || continue
            raw="extract/$part.raw.img"
            kind=$(python3 - "$image" <<'PY'
import struct, sys
with open(sys.argv[1], 'rb') as f:
    print('sparse' if f.read(4) == struct.pack('<I', 0xed26ff3a) else 'raw')
PY
)
            if [ "$kind" = sparse ]; then
              simg2img "$image" "$raw"
            else
              cp "$image" "$raw"
            fi
            root="extract/$part.root"
            mkdir -p "$root"
            fsck.erofs --extract="$root" --no-preserve "$raw" >/dev/null 2>&1 || \
              fsck.erofs --extract="$root" "$raw" >/dev/null 2>&1
            {
              echo
              echo "## $part battery/framework inventory"
              echo '```'
              find "$root" -type f \( -name 'services.jar' -o -name '*services*.jar' -o -name '*.odex' -o -name '*.vdex' \) -printf '%p %s B\n' | sort
              echo '```'
              echo
              echo "### $part strings relevant to the Lenovo battery mismatch"
              echo '```'
              find "$root" -type f \( -name '*.jar' -o -name '*.odex' -o -name '*.vdex' \) -print0 | while IFS= read -r -d '' f; do
                if unzip -p "$f" 'classes*.dex' 2>/dev/null | strings | grep -qE 'IBatteryServiceManager|com\.lenovo\.lgsi|mBatteryServiceManager'; then
                  echo "-- $f"
                  unzip -p "$f" 'classes*.dex' 2>/dev/null | strings | grep -E 'IBatteryServiceManager|com\.lenovo\.lgsi|mBatteryServiceManager' | head -20
                fi
              done
              echo '```'
            } >> reports/donor-011-${GITHUB_RUN_ID}.md
          done

      - name: Commit compact donor audit to this working branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/donor-011-*.md
          git commit -m "Audit yingtian donor OS4.0.11.0 (run $GITHUB_RUN_ID)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
