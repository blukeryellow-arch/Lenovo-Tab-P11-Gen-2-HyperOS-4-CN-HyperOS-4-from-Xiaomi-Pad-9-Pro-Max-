name: build-hyperos-look

on:
  push:
    paths:
      - 'drive-probe.request'
      - 'tools/drive_form_post.py'
      - 'tools/extract_sparse_super_partitions.py'
      - 'tools/inspect_lenovo_runtime.sh'
      - 'tools/inspect_lenovo_super.sh'
      - 'tools/inspect_hyperos_target.sh'
      - 'tools/build_hybrid_super.sh'
      - 'tools/inject_logical_partition.py'
      - 'tools/inspect_hyperos_recovery.sh'
      - 'tools/raw_parts_on_runner.sh'
      - 'tools/push_spool_branch.sh'
      - '.github/workflows/build.yml'
  pull_request:
    paths:
      - 'drive-probe.request'
      - 'tools/drive_form_post.py'
      - 'tools/extract_sparse_super_partitions.py'
      - 'tools/inspect_lenovo_runtime.sh'
      - 'tools/inspect_lenovo_super.sh'
      - 'tools/inspect_hyperos_target.sh'
      - 'tools/build_hybrid_super.sh'
      - 'tools/inject_logical_partition.py'
      - 'tools/inspect_hyperos_recovery.sh'
      - 'tools/raw_parts_on_runner.sh'
      - 'tools/push_spool_branch.sh'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-system-to-spool:
    # A push tagged [drive-probe] is deliberate: it transfers the public Drive
    # asset to a temporary Git branch in <=90 MiB verified pieces, where this
    # sandbox can fetch it through git. Ordinary PR synchronization never
    # starts another 920 MiB transfer.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[drive-probe]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Download public Google Drive image and verify its identity
        env:
          DRIVE_ID: 1341C_UdIvdqgT4CdZ1V4VpbCHQcK5z-O
          EXPECTED_SIZE: '920039464'
          EXPECTED_SHA256: 8b71ea568dfb6043cfb3234372b3b672c30f9dfb2e81d11ed1bbae89e98dc14f
        run: |
          set -euo pipefail
          chmod +x tools/drive_form_post.py tools/raw_parts_on_runner.sh tools/push_spool_branch.sh
          mkdir -p input transfer
          out=input/system_hyperos4_p11g2.img
          cookie=$(mktemp)
          warning=$(mktemp)
          trap 'rm -f "$cookie" "$warning"' EXIT
          for url in \
            "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t&authuser=0" \
            "https://drive.google.com/uc?export=download&confirm=t&id=$DRIVE_ID"; do
            rm -f "$out"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
              --cookie "$cookie" --cookie-jar "$cookie" -o "$out" "$url" || continue
            size=$(stat -c%s "$out" 2>/dev/null || echo 0)
            if [ "$size" -eq "$EXPECTED_SIZE" ]; then break; fi
            cp "$out" "$warning" || true
            rm -f "$out"
          done
          if [ ! -f "$out" ] && [ -s "$warning" ]; then
            python3 tools/drive_form_post.py --html "$warning" --jar "$cookie" \
              --out "$out" --id "$DRIVE_ID" --log input/download.log
          fi
          test -f "$out"
          test "$(stat -c%s "$out")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $out" | sha256sum -c -

      - name: Split verified source into Git-safe parts
        run: |
          set -euo pipefail
          RUN_TAG="$GITHUB_RUN_ID" tools/raw_parts_on_runner.sh \
            input/system_hyperos4_p11g2.img transfer 0 0
          find transfer -type f -printf '%f %s bytes\n' | sort

      - name: Publish parts to temporary transfer-spool branch
        run: |
          set -euo pipefail
          tools/push_spool_branch.sh transfer transfer-spool

  inspect-donor-011:
    # The requested official Xiaomi yingtian 4.0.11.0 donor is inspected on a
    # disposable GitHub runner. Only a compact audit is committed back; no 11.8
    # GiB firmware archive or image is put in Git.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[donor-011]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free runner space and install filesystem tools
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/graalvm /home/runner/.gradle/caches || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils file unzip
          command -v simg2img
          command -v fsck.erofs
          df -h .

      - name: Download and inspect yingtian China OS4.0.11.0.XBMCNXM
        env:
          DONOR_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.11.0.XBMCNXM/yingtian-images-OS4.0.11.0.XBMCNXM-user-20260916.0000.00-17.0-cn-60633b4ba6.tgz
        run: |
          set -euo pipefail
          mkdir -p donor extract reports
          archive=donor/yingtian-images-OS4.0.11.0.XBMCNXM.tgz
          report=reports/donor-011-${GITHUB_RUN_ID}.md
          {
            echo '# Donor audit: yingtian China OS4.0.11.0.XBMCNXM'
            echo
            echo "- source: \`$DONOR_URL\`"
          } > "$report"
          diagnose_failure() {
            rc=$?
            trap - ERR
            {
              echo
              echo '## Audit failure diagnostic'
              echo
              echo "- failed command: \`$BASH_COMMAND\`"
              echo "- exit code: \`$rc\`"
              echo
              echo '### Download / extraction state'
              echo '```'
              find donor extract -maxdepth 2 -type f -printf '%p %s B\n' 2>/dev/null | sort || true
              echo '```'
              while IFS= read -r log; do
                [ -s "$log" ] || continue
                echo
                echo "### $log (tail)"
                echo '```'
                tail -80 "$log" || true
                echo '```'
              done < <(find donor -maxdepth 1 -type f \( -name '*.stderr' -o -name '*.log' \) | sort)
            } >> "$report"
            exit "$rc"
          }
          trap diagnose_failure ERR
          curl --fail --location --retry 3 --connect-timeout 45 --output "$archive" "$DONOR_URL" 2>donor/curl.stderr
          test -s "$archive"
          tar -tzf "$archive" > donor/archive-files.txt
          {
            echo "- archive bytes: \`$(stat -c%s "$archive")\`"
            echo "- archive SHA-256: \`$(sha256sum "$archive" | cut -d' ' -f1)\`"
            echo
            echo '## System-image candidates in the Fastboot archive'
            echo '```'
            grep -Ei '(^|/)(super|system|system_ext)(_[a-z])?\.img$' donor/archive-files.txt || true
            echo '```'
          } >> "$report"

          # Fastboot packages may ship standalone system/system_ext images, or a
          # dynamic-partition super.img. Handle both representations.
          mapfile -t images < <(grep -Ei '(^|/)(system|system_ext)(_[a-z])?\.img$' donor/archive-files.txt)
          if [ "${#images[@]}" -gt 0 ]; then
            tar -xzf "$archive" -C extract "${images[@]}"
          else
            mapfile -t super_images < <(grep -Ei '(^|/)super\.img$' donor/archive-files.txt)
            test "${#super_images[@]}" -gt 0
            tar -xzf "$archive" -C extract "${super_images[@]}"
            super=$(find extract -type f -iname 'super.img' | head -1)
            test -n "$super"
            curl --fail --location --retry 3 --connect-timeout 45 \
              --output donor/lpunpack.py \
              https://raw.githubusercontent.com/unix3dgforce/lpunpack/c59b8f3b069c5a8aa438a049fa4a091177172434/lpunpack.py \
              2>donor/lpunpack.stderr
            {
              echo
              echo '## Dynamic-partition extractor used'
              echo
              echo '- tool: `unix3dgforce/lpunpack` at commit `c59b8f3b069c5a8aa438a049fa4a091177172434`'
              echo '- license: `LGPL-3.0`; downloaded only to the disposable runner for this read-only audit'
            } >> "$report"
            # Read the sparse super image virtually: materializing its full raw
            # form exhausts hosted-runner disk before system can be inspected.
            python3 tools/extract_sparse_super_partitions.py \
              --lpunpack donor/lpunpack.py --list "$super" \
              >donor/logical-partitions.txt 2>donor/lpunpack-list.stderr
            mapfile -t logical_parts < <(grep -Ex 'system(_a)?|system_ext(_a)?' donor/logical-partitions.txt)
            test "${#logical_parts[@]}" -gt 0
            part_args=()
            for logical_part in "${logical_parts[@]}"; do
              part_args+=(--partition "$logical_part")
            done
            mkdir -p extract/logical
            python3 tools/extract_sparse_super_partitions.py \
              --lpunpack donor/lpunpack.py "${part_args[@]}" \
              "$super" extract/logical >donor/lpunpack.log 2>&1
          fi

          for part in system system_ext; do
            image=$(find extract -type f \( -name "$part.img" -o -name "${part}_a.img" \) | head -1 || true)
            [ -n "$image" ] || continue
            raw="$image"
            kind=$(python3 - "$image" <<'PY'
          import struct, sys
          with open(sys.argv[1], 'rb') as f:
              print('sparse' if f.read(4) == struct.pack('<I', 0xed26ff3a) else 'raw')
          PY
            )
            if [ "$kind" = sparse ]; then
              raw="extract/$part.raw.img"
              simg2img "$image" "$raw"
            fi
            root="extract/$part.root"
            mkdir -p "$root"
            fsck.erofs --extract="$root" --no-preserve "$raw" >"donor/${part}-extract.log" 2>&1 || \
              fsck.erofs --extract="$root" "$raw" >>"donor/${part}-extract.log" 2>&1
            {
              echo
              echo "## $part battery/framework inventory"
              echo '```'
              find "$root" -type f \( -name 'services.jar' -o -name '*services*.jar' -o -name '*.odex' -o -name '*.vdex' \) -printf '%p %s B\n' | sort
              echo '```'
              echo
              echo "### $part strings relevant to the Lenovo battery mismatch"
              echo '```'
              find "$root" -type f \( -name '*.jar' -o -name '*.odex' -o -name '*.vdex' \) -print0 | while IFS= read -r -d '' f; do
                if unzip -p "$f" 'classes*.dex' 2>/dev/null | strings | grep -qE 'IBatteryServiceManager|com\.lenovo\.lgsi|mBatteryServiceManager'; then
                  echo "-- $f"
                  unzip -p "$f" 'classes*.dex' 2>/dev/null | strings | grep -E 'IBatteryServiceManager|com\.lenovo\.lgsi|mBatteryServiceManager' | head -20
                fi
              done
              echo '```'
            } >> "$report"
          done

      - name: Commit compact donor audit to this working branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/donor-011-*.md
          git commit -m "Audit yingtian donor OS4.0.11.0 (run $GITHUB_RUN_ID)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  inspect-lenovo-runtime:
    # This forensic job downloads the exact TB350FU build named by the device
    # log. It never inserts Lenovo files into the Xiaomi/HyperOS final image.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lenovo-runtime]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free runner space and install filesystem tools
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/graalvm /home/runner/.gradle/caches || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils e2fsprogs file unzip
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          df -h .

      - name: Locate TB350FU Lenovo battery runtime
        run: |
          set -euo pipefail
          bash tools/inspect_lenovo_runtime.sh \
            "reports/lenovo-runtime-${GITHUB_RUN_ID}.md"

      - name: Commit compact Lenovo runtime audit to this working branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/lenovo-runtime-*.md
          git commit -m "Audit TB350FU Lenovo runtime (run $GITHUB_RUN_ID)"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"

  inspect-lenovo-drive-super:
    # The exact Lenovo stock super image was supplied by the user through a
    # public Drive folder.  This is forensic input only; it is never used as a
    # replacement HyperOS system image.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[lenovo-drive-super]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free runner space and install filesystem tools
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/graalvm /home/runner/.gradle/caches || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils e2fsprogs file unzip binutils
          sudo apt-get install -y -qq --no-install-recommends baksmali || \
            sudo apt-get install -y -qq --no-install-recommends libsmali-java
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          command -v baksmali || test -f /usr/share/java/baksmali.jar
          df -h .

      - name: Download user-supplied TB350FU super image
        env:
          DRIVE_ID: 1J6RMoBpZPyDsD1M8zaxPTjn8zTw7grd4
          EXPECTED_SIZE: '8298777076'
          EXPECTED_MD5: adfad47a49c78f6b9ec1c740ea5399e2
        run: |
          set -euo pipefail
          chmod +x tools/drive_form_post.py
          mkdir -p input
          out=input/TB350FU_S231044_260105_ROW.super.img
          cookie=$(mktemp)
          warning=$(mktemp)
          trap 'rm -f "$cookie" "$warning"' EXIT
          for url in \
            "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t&authuser=0" \
            "https://drive.google.com/uc?export=download&confirm=t&id=$DRIVE_ID"; do
            rm -f "$out"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
              --cookie "$cookie" --cookie-jar "$cookie" -o "$out" "$url" || continue
            if [ "$(stat -c%s "$out")" = "$EXPECTED_SIZE" ]; then break; fi
            mv "$out" "$warning"
          done
          if [ ! -f "$out" ] && [ -s "$warning" ]; then
            python3 tools/drive_form_post.py --html "$warning" --jar "$cookie" \
              --out "$out" --id "$DRIVE_ID" --log input/download.log
          fi
          test -f "$out"
          test "$(stat -c%s "$out")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_MD5  $out" | md5sum -c -

      - name: Inspect exact Lenovo framework and vendor runtime
        run: |
          set -euo pipefail
          chmod +x tools/inspect_lenovo_super.sh
          bash tools/inspect_lenovo_super.sh \
            "reports/lenovo-super-${GITHUB_RUN_ID}.md" \
            input/TB350FU_S231044_260105_ROW.super.img audit

      - name: Publish compact audit report, including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lenovo-super-audit-${{ github.run_id }}
          path: reports/lenovo-super-${{ github.run_id }}.md
          if-no-files-found: warn
          retention-days: 7

      - name: Publish selected framework archives for bytecode review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: lenovo-stock-framework-${{ github.run_id }}
          path: audit/selected-framework
          if-no-files-found: warn
          retention-days: 7

      - name: Commit compact Lenovo super audit to this working branch
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          report="reports/lenovo-super-${GITHUB_RUN_ID}.md"
          if [ ! -f "$report" ]; then
            echo 'No audit report was produced; artifact upload carries diagnostics.'
            exit 0
          fi
          git add -f "$report"
          git commit -m "Audit supplied TB350FU super image (run $GITHUB_RUN_ID)"
          # This job is the sole writer for the report of its own run. Avoid a
          # pull/rebase after a diagnostic failure: it obscures the forensic
          # report that must be retained for the next repair step.
          git push origin "HEAD:$GITHUB_REF_NAME"

  inspect-hyperos-target:
    # Audit the original port image only when explicitly requested. This
    # compares classpaths; it does not replace the Xiaomi HyperOS base.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[target-runtime]')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Install filesystem and DEX inspection tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            erofs-utils android-sdk-libsparse-utils e2fsprogs file unzip binutils
          sudo apt-get install -y -qq --no-install-recommends baksmali || \
            sudo apt-get install -y -qq --no-install-recommends libsmali-java
          command -v simg2img
          command -v fsck.erofs
          command -v debugfs
          command -v baksmali || test -f /usr/share/java/baksmali.jar

      - name: Download exact original HyperOS system input
        env:
          DRIVE_ID: 1341C_UdIvdqgT4CdZ1V4VpbCHQcK5z-O
          EXPECTED_SIZE: '920039464'
          EXPECTED_SHA256: 8b71ea568dfb6043cfb3234372b3b672c30f9dfb2e81d11ed1bbae89e98dc14f
        run: |
          set -euo pipefail
          chmod +x tools/drive_form_post.py
          mkdir -p input
          out=input/system_hyperos4_p11g2.img
          cookie=$(mktemp)
          warning=$(mktemp)
          trap 'rm -f "$cookie" "$warning"' EXIT
          for url in \
            "https://drive.usercontent.google.com/download?id=$DRIVE_ID&export=download&confirm=t&authuser=0" \
            "https://drive.google.com/uc?export=download&confirm=t&id=$DRIVE_ID"; do
            rm -f "$out"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
              --cookie "$cookie" --cookie-jar "$cookie" -o "$out" "$url" || continue
            if [ "$(stat -c%s "$out")" = "$EXPECTED_SIZE" ]; then break; fi
            mv "$out" "$warning"
          done
          if [ ! -f "$out" ] && [ -s "$warning" ]; then
            python3 tools/drive_form_post.py --html "$warning" --jar "$cookie" \
              --out "$out" --id "$DRIVE_ID" --log input/download.log
          fi
          test "$(stat -c%s "$out")" = "$EXPECTED_SIZE"
          echo "$EXPECTED_SHA256  $out" | sha256sum -c -

      - name: Compare target BatteryService with exact Lenovo runtime
        run: |
          set -euo pipefail
          chmod +x tools/inspect_hyperos_target.sh
          bash tools/inspect_hyperos_target.sh \
            "reports/hyperos-target-${GITHUB_RUN_ID}.md" \
            input/system_hyperos4_p11g2.img target-audit

      - name: Publish target audit, including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hyperos-target-audit-${{ github.run_id }}
          path: reports/hyperos-target-${{ github.run_id }}.md
          if-no-files-found: warn
          retention-days: 7

      - name: Publish original target framework for bytecode review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hyperos-target-framework-${{ github.run_id }}
          path: target-audit/target-framework
          if-no-files-found: warn
          retention-days: 7

      - name: Commit compact target audit to this working branch
        if: always()
        run: |
          set -euo pipefail
          report="reports/hyperos-target-${GITHUB_RUN_ID}.md"
          if [ ! -f "$report" ]; then
            echo 'No target audit report was produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$report"
          git commit -m "Audit original HyperOS target image (run $GITHUB_RUN_ID)"
          git push origin "HEAD:$GITHUB_REF_NAME"

  build-hybrid-super:
    # Creates a complete dynamic-super flash package. The Xiaomi HyperOS system
    # payload is installed in both Lenovo system slots; all device-specific
    # vendor/product/system_ext data stays from the exact user-supplied build.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[build-hybrid-super]')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Free runner space and install image tools
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/graalvm /home/runner/.gradle/caches || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            android-sdk-libsparse-utils e2fsprogs file curl
          command -v simg2img
          command -v img2simg
          df -h .

      - name: Download verified Lenovo super and exact HyperOS system inputs
        env:
          LENOVO_DRIVE_ID: 1J6RMoBpZPyDsD1M8zaxPTjn8zTw7grd4
          LENOVO_SIZE: '8298777076'
          LENOVO_MD5: adfad47a49c78f6b9ec1c740ea5399e2
          HYPEROS_DRIVE_ID: 1341C_UdIvdqgT4CdZ1V4VpbCHQcK5z-O
          HYPEROS_SIZE: '920039464'
          HYPEROS_SHA256: 8b71ea568dfb6043cfb3234372b3b672c30f9dfb2e81d11ed1bbae89e98dc14f
        run: |
          set -Eeuo pipefail
          chmod +x tools/drive_form_post.py
          mkdir -p input reports
          report="reports/hybrid-super-${GITHUB_RUN_ID}.md"
          transfer_failure() {
            rc=$?
            trap - ERR
            {
              echo '# TB350FU HyperOS 4 CN hybrid-super build'
              echo
              echo '## Input-transfer failure diagnostic'
              echo
              echo "- failed command: \`$BASH_COMMAND\`"
              echo "- exit code: \`$rc\`"
              echo '```'
              find input -maxdepth 1 -type f -printf '%p %s B\n' 2>/dev/null | sort || true
              echo '```'
              for log in input/*.download.log input/*.curl.log; do
                [ -s "$log" ] || continue
                echo
                echo "### $(basename "$log")"
                echo '```'
                tail -80 "$log" || true
                echo '```'
              done
              for response in input/*.img; do
                [ -f "$response" ] || continue
                [ "$(stat -c%s "$response")" -le 8192 ] || continue
                echo
                echo "### $(basename "$response") response body"
                echo '```html'
                tr '\000' '?' < "$response" | head -c 8192 || true
                echo
                echo '```'
              done
            } >> "$report"
            exit "$rc"
          }
          trap transfer_failure ERR
          download_drive() {
            local id=$1 expected_size=$2 output=$3
            local cookie warning url size
            cookie=$(mktemp); warning=$(mktemp)
            for url in \
              "https://drive.usercontent.google.com/open?id=$id" \
              "https://drive.usercontent.google.com/download?id=$id&export=download&confirm=t&authuser=0" \
              "https://drive.google.com/uc?export=download&confirm=t&id=$id"; do
              rm -f "$output"
              curl --fail --location --silent --show-error --retry 3 --connect-timeout 30 \
                --cookie "$cookie" --cookie-jar "$cookie" -o "$output" "$url" 2>>"${output}.curl.log" || continue
              size=$(stat -c%s "$output" 2>/dev/null || printf 0)
              if [ "$size" = "$expected_size" ]; then break; fi
              {
                echo "unexpected response from $url: $size B (expected $expected_size B)"
                head -c 2048 "$output" 2>/dev/null | tr '\000' '?' || true
                echo
              } >>"${output}.download.log"
              mv "$output" "$warning"
            done
            if [ ! -f "$output" ] && [ -s "$warning" ]; then
              python3 tools/drive_form_post.py --html "$warning" --jar "$cookie" \
                --out "$output" --id "$id" --log "${output}.download.log"
            fi
            rm -f "$cookie" "$warning"
            test "$(stat -c%s "$output")" = "$expected_size"
          }
          download_drive "$LENOVO_DRIVE_ID" "$LENOVO_SIZE" input/TB350FU_S231044_260105_ROW.super.img
          echo "$LENOVO_MD5  input/TB350FU_S231044_260105_ROW.super.img" | md5sum -c -
          download_drive "$HYPEROS_DRIVE_ID" "$HYPEROS_SIZE" input/system_hyperos4_p11g2.img
          echo "$HYPEROS_SHA256  input/system_hyperos4_p11g2.img" | sha256sum -c -

      - name: Build and verify dual-slot HyperOS dynamic super image
        run: |
          set -euo pipefail
          chmod +x tools/build_hybrid_super.sh
          bash tools/build_hybrid_super.sh \
            "reports/hybrid-super-${GITHUB_RUN_ID}.md" \
            input/TB350FU_S231044_260105_ROW.super.img \
            input/system_hyperos4_p11g2.img output

      - name: Publish build report, including failures
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hybrid-super-report-${{ github.run_id }}
          path: reports/hybrid-super-${{ github.run_id }}.md
          if-no-files-found: warn
          retention-days: 14

      - name: Publish verified ROM download parts
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: TB350FU-HyperOS4-CN-ROM-${{ github.run_id }}
          path: output/download-parts
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Commit compact hybrid build report
        if: always()
        run: |
          set -euo pipefail
          report="reports/hybrid-super-${GITHUB_RUN_ID}.md"
          if [ ! -f "$report" ]; then
            echo 'No hybrid build report was produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$report"
          git commit -m "Build hybrid TB350FU HyperOS super image (run $GITHUB_RUN_ID)"
          git push origin "HEAD:$GITHUB_REF_NAME"

  inspect-hyperos-full-recovery:
    # Explicit user-requested audit of the 4.0.11.0 recovery archive. This
    # does not build or flash a ROM: it proves that its system payload is the
    # requested yingtian release before it can be considered as a source.
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-full-recovery]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Free runner space and install audited extraction prerequisites
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
            /usr/share/swift /usr/local/graalvm /home/runner/.gradle/caches || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            unzip file curl erofs-utils e2fsprogs binutils golang-go
          sudo apt-get install -y -qq --no-install-recommends baksmali || \
            sudo apt-get install -y -qq --no-install-recommends libsmali-java
          command -v fsck.erofs
          command -v baksmali || test -f /usr/share/java/baksmali.jar
          df -h .

      - name: Download the user-supplied exact 4.0.11.0 recovery source
        env:
          # Resolved from the exact miuirom.org catalogue URL supplied by the
          # user, then cross-checked against the yingtian 4.0.11 listing.
          RECOVERY_URL: https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS4.0.11.0.XBMCNXM/yingtian-ota_full-OS4.0.11.0.XBMCNXM-user-17.0-a12ac31de7.zip
        run: |
          set -Eeuo pipefail
          mkdir -p input reports
          archive=input/miui_YINGTIAN_OS4.0.11.0.XBMCNXM_recovery.zip
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 45 \
            --referer 'https://miuirom.org/tablets/xiaomi-pad-9-pro-max' \
            --user-agent 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131 Safari/537.36' \
            --output "$archive" "$RECOVERY_URL" 2>input/recovery-download.stderr
          # A catalogue/error page is never accepted as firmware.
          test "$(stat -c%s "$archive")" -gt 9000000000
          unzip -Z1 "$archive" | grep -qx payload.bin

      - name: Extract only the recovery system payload and verify its runtime
        run: |
          set -Eeuo pipefail
          # The project uses numeric Git tags (not Go's v-prefixed module
          # tags), so build the pinned, audited tag rather than resolving a
          # mutable module version.
          git clone --depth 1 --branch 1.3.0 https://github.com/ssut/payload-dumper-go.git work/payload-dumper-src
          test "$(git -C work/payload-dumper-src rev-parse HEAD)" = \
            a51234eaead276ff3d8b8c4c439c51c7f46a96a8
          go build -trimpath -o work/payload-dumper-go ./work/payload-dumper-src
          chmod +x tools/inspect_hyperos_recovery.sh tools/inspect_hyperos_target.sh
          bash tools/inspect_hyperos_recovery.sh \
            "reports/hyperos-recovery-${GITHUB_RUN_ID}.md" \
            input/miui_YINGTIAN_OS4.0.11.0.XBMCNXM_recovery.zip \
            work/payload-dumper-go work/recovery
          system=$(find work/recovery/extracted -type f -name 'system*.img' -print -quit)
          test -n "$system"
          bash tools/inspect_hyperos_target.sh \
            "reports/hyperos-recovery-system-${GITHUB_RUN_ID}.md" "$system" work/recovery-system

      - name: Publish full-recovery audit reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: hyperos-full-recovery-audit-${{ github.run_id }}
          path: reports/hyperos-recovery*-${{ github.run_id }}.md
          if-no-files-found: warn
          retention-days: 14

      - name: Commit text-only recovery audit reports
        if: always()
        run: |
          set -euo pipefail
          shopt -s nullglob
          reports=(reports/hyperos-recovery*-${GITHUB_RUN_ID}.md)
          if [ ${#reports[@]} -eq 0 ]; then
            echo 'No recovery audit report was produced.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "${reports[@]}"
          git commit -m "Audit full HyperOS 4.0.11.0 recovery (run $GITHUB_RUN_ID)"
          git push origin "HEAD:$GITHUB_REF_NAME"
