name: build-hyperos-look

# Dwa niezalezne joby:
#   build-module    - sklada modul RRO z wrzuconych do repo zrodel. Bez ROM-u,
#                     bez HF, bez sekretow. To jest sciezka codzienna.
#   unpack-source   - odpalany recznie (workflow_dispatch): pobiera obrazy z HF,
#                     rozpakowuje je i wyciaga zasoby. To jest job, ktory NIE MOZE
#                     przejsc w sandboxie agenta (brak trasy do huggingface.co,
#                     brak lpunpack, brak roota do apt) i dlatego istnieje tutaj.

on:
  push:
    paths:
      - 'modules/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
  pull_request:
  workflow_dispatch:
    inputs:
      hf_repo:
        description: 'Repo Hugging Face z obrazami, np. BBB1239/Lenovo-Tab-P11-Gen-2-HyperOS-4'
        required: false
        default: ''
      source_file:
        description: 'Plik do rozpakowania (payload.bin | super.img | sciezka w repo HF)'
        required: false
        default: 'payload.bin'
      partitions:
        description: 'Partycje do wyciagniecia (spacja rozdzielone)'
        required: false
        default: 'system product system_ext'
      # --- do joba drive-probe (omija limit 100 MiB konektora Drive) ---
      drive_ids:
        description: 'ID plikow na Google Drive, spacja rozdzielone (np. 1funWH4... 13e-okL...)'
        required: false
        default: ''
      do_unpack:
        description: '1 = wyciagnij rowniez drzewo partycji i build.prop (wolniejsze, duze obrazy)'
        required: false
        default: '0'

permissions:
  contents: read

env:
  MODULE_ID: hyperos_look_p11g2

jobs:
  build-module:
    name: Zbuduj modul (RRO + ZIP)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ma Android SDK preinstalowany (/usr/local/lib/android/sdk).
      # Nie uzywamy setup-android: ta akcja sciaga commandlinetools z dl.google.com
      # i to ona wywrocila poprzedni przebieg. Tu tylko lokalizujemy to, co jest,
      # ewentualnie dobieramy brakujacy build-tools przez sdkmanager.
      - name: Znajdz Android SDK (build-tools + platform)
        run: |
          set -uo pipefail
          for c in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
            [ -n "$c" ] && [ -d "$c" ] && { echo "ANDROID_HOME=$c" >> "$GITHUB_ENV"; HOME_SDK=$c; break; }
          done
          echo "SDK: ${HOME_SDK:-NIE ZNALEZIONY}"
          if [ -z "${HOME_SDK:-}" ]; then
            echo "::error::Brak Android SDK na runnerze - wypisz zawartosc /usr/local/lib/android, zeby zobaczyc co tu jest"
            ls -la /usr/local/lib/android 2>&1 | sed 's/^/  /'
            exit 1
          fi
          echo "--- build-tools ---"; ls "$HOME_SDK/build-tools" 2>&1 | sed 's/^/  /'
          echo "--- platforms ---";  ls "$HOME_SDK/platforms"  2>&1 | sed 's/^/  /'
          echo "--- cmdline-tools ---"; ls "$HOME_SDK/cmdline-tools" 2>&1 | sed 's/^/  /'
          for t in aapt2 zipalign apksigner sdkmanager; do
            found=$(find "$HOME_SDK/build-tools" "$HOME_SDK/cmdline-tools" -name "$t" -type f 2>/dev/null | sort -V | tail -1)
            echo "  $t: ${found:-BRAK}"
          done
          if [ ! -e "$HOME_SDK/platforms/android-34/android.jar" ] && [ ! -e "$HOME_SDK/platforms/android-35/android.jar" ]; then
            echo "dobieram platforme 34 przez sdkmanager"
            yes | "$HOME_SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" 2>&1 | tail -3
          fi

      - name: Budowa APK overlayu
        run: |
          bash scripts/build_overlay_apk.sh --debug-key
          ls -l modules/hyperos-look/system/product/overlay/

      - name: Walidacja struktury modulu
        run: |
          set -euo pipefail
          test -f modules/hyperos-look/module.prop
          for f in id name version versionCode author description; do
            grep -q "^$f=" modules/hyperos-look/module.prop || { echo "BRAK $f= w module.prop"; exit 1; }
          done
          # Twardy zakaz: modul nie moze nic miec w vendorze.
          if find modules/hyperos-look/system -path '*vendor*' | grep -q .; then
            echo "MODUL ZAWIERA SCIEZKI vendor/ - to jest zabronione w tej sciezce"
            exit 1
          fi
          # Skrypty musza byc wykonywalne i skladniowo poprawne.
          for s in post-fs-data.sh service.sh customize.sh; do
            p=modules/hyperos-look/$s
            [ -f "$p" ] && bash -n "$p" && echo "OK skladnia: $s"
          done

      - name: Paczka do instalacji przez adb (katalog)
        run: |
          cd modules/hyperos-look
          tar czf ../../hyperos-look-dir.tar.gz --exclude=overlay-app --exclude=staging .
          cd ../..
          ls -lh hyperos-look-dir.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: hyperos-look-module
          path: |
            hyperos-look-dir.tar.gz
            modules/hyperos-look/system/product/overlay/*.apk
          if-no-files-found: error
          retention-days: 30

  unpack-source:
    name: Rozpakuj obrazy zrodlowe (HF -> runner)
    if: github.event_name == 'workflow_dispatch' && inputs.hf_repo != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Wymagane sekret
        env:
          T: ${{ secrets.HF_TOKEN }}
        run: |
          [ -n "$T" ] || { echo "Brak HF_TOKEN w Settings -> Secrets and variables -> Actions. Token NIE moze byc w kodzie ani w tym pliku."; exit 1; }

      - name: Rozpoznanie dostepnych narzedzi (apt na runnerze ma pelny internet)
        run: |
          set -uo pipefail
          sudo apt-get -qq update
          for pkg in simg2img img2simg erofs-utils e2fsprogs cpio p7zip-full unzip device-tree-compiler lpunpack; do
            printf '%-22s ' "$pkg"
            if apt-cache policy "$pkg" 2>/dev/null | grep -q Candidate && \
               ! apt-cache policy "$pkg" 2>/dev/null | grep -q 'Candidate: (none)'; then
              echo "dostepny -> $(apt-cache policy "$pkg" | sed -n 's/.*Candidate: //p')"
            else
              echo "BRAK PAKIETU"
            fi
          done
          echo "--- instalacja tego, co jest ---"
          for pkg in simg2img img2simg erofs-utils e2fsprogs cpio p7zip-full unzip; do
            sudo apt-get install -y -qq "$pkg" 2>/dev/null && echo "zainstalowano: $pkg" || echo "pominieto: $pkg"
          done
          echo "lpmake/lpunpack: jesli powyzsze pokazalo 'BRAK PAKIETU', trzeba je"
          echo "wziasc z prebuilts AOSP albo zbudowac - nie udajemy, ze apt je ma."

      - name: Pobierz z Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -m pip install -q -U huggingface_hub payload_dumper
          hf download "${{ inputs.hf_repo }}" "${{ inputs.source_file }}" \
            --repo-type model --token "$HF_TOKEN" --local-dir ./input
          ls -lh ./input

      - name: Rozpakuj
        run: |
          set -euo pipefail
          mkdir -p ./unpacked
          case "${{ inputs.source_file }}" in
            *payload.bin)
              payload_dumper ./input/payload.bin --out ./unpacked
              ;;
            *super.img)
              if command -v simg2img >/dev/null 2>&1; then
                simg2img ./input/super.img ./unpacked/super.raw.img
              else
                cp ./input/super.img ./unpacked/super.raw.img
              fi
              if ! command -v lpunpack >/dev/null 2>&1; then
                echo "BRAK lpunpack - zatrzymam sie tutaj, zamiast generowac smieci." >&2
                exit 3
              fi
              lpunpack ./unpacked/super.raw.img ./unpacked/
              ;;
            *)
              echo "Nieobslugiwany format: ${{ inputs.source_file }}" >&2; exit 2 ;;
          esac
          du -sh ./unpacked/* 2>/dev/null | sort -h | tail -20

      - name: Wyciagnij zasoby HyperOS (biala lista + odmowy)
        run: |
          bash scripts/extract_hyperos_assets.sh ./unpacked ./assets
          echo "--- raport ---"; tail -60 ./assets/REPORT.txt || true

      - name: Rozmiary partycji - czy cokolwiek sie zmiesci
        run: |
          for img in ./unpacked/*.img; do
            [ -e "$img" ] || continue
            printf '%-28s %10s  ' "$(basename "$img")" "$(du -h "$img" | cut -f1)"
            file -b "$img" 2>/dev/null | cut -c1-40
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hyperos-assets
          path: ./assets
          retention-days: 7

  # ---------------------------------------------------------------------------
  # drive-probe: omija limit 100 MiB konektora Drive.
  #
  # Zmierzone 2026-09-22: sandbox agenta ma egres TYLKO do github.com i
  # api.github.com (oba 200); drive.google.com, drive.usercontent.google.com,
  # www.googleapis.com, objects.githubusercontent.com = 000. Konektor ma twardy
  # pre-check 104857600 B/plik (sondy: return_download_url -> zablokowany w schema
  # na false; range_header -> laczony z URL-em, a URL serwuje caly plik;
  # acknowledge_abuse -> limit odpala sie wczesniej). stad nie ciagniemy duzych
  # obrazow do agenta, tylko analizujemy je TAM, GDZIE SIE DA - na runnerze.
  #
  # Runner sciaga plik bez zadnych secrets: wystarczy publiczny link
  # ("Kazdy, kto ma link" - viewer). Bez HF_TOKEN, bez payload_dumpera.
  # Raport wraca commitem, bo logow CI z sandboxa nie widac.
  # ---------------------------------------------------------------------------
  drive-probe:
    name: Analiza obrazow prosto z Google Drive
    # Start: reczny dispatch LUB push z "[drive-probe]" w tytule commita.
    # To drugie istnieje, bo token integration (Arena) nie dostaje prawa do
    # POST /actions/workflows/.../dispatches -> 403 Resource not accessible by
    # integration. Uruchomienie przez commit jest jedyna trasa z sandboxa.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[drive-probe]'))
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Wczytaj zapytanie (input albo drive-probe.request)
        id: req
        run: |
          set -uo pipefail
          IDS="${{ inputs.drive_ids }}"
          UNP="${{ inputs.do_unpack }}"
          if [ -f drive-probe.request ]; then
            if [ -z "$IDS" ]; then
              IDS=$(grep -Ev '^[[:space:]]*(#|do_unpack:)' drive-probe.request | tr -d '\r' | paste -sd' ' -)
              echo "zapytanie z pliku drive-probe.request"
            fi
            [ -z "$UNP" ] && UNP=$(sed -n 's/^[[:space:]]*do_unpack:[[:space:]]*\([01]\).*/\1/p' drive-probe.request | head -1)
          fi
          echo "DRIVE_IDS=$IDS" >> "$GITHUB_ENV"
          echo "DO_UNPACK=${UNP:-0}" >> "$GITHUB_ENV"
          echo "liczba id: $(echo $IDS | wc -w)  do_unpack=${UNP:-0}"
          if [ -z "$IDS" ]; then echo "nic do roboty - pusty wykaz id"; fi

      - name: Narzedzia FS i AVB
        run: |
          set -uo pipefail
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq e2fsprogs erofs-utils simg2img file || true
          echo "dumpe2fs: $(command -v dumpe2fs || echo BRAK)"
          echo "debugfs:  $(command -v debugfs || echo BRAK)"
          echo "fsck.erofs: $(command -v fsck.erofs || echo BRAK)"
          git clone -q --depth 1 https://github.com/LineageOS/android_external_avb.git "$HOME/avb"
          echo "AVBTOOL=$HOME/avb/avbtool.py" >> "$GITHUB_ENV"
          python3 tools/fs_probe.py --selftest

      - name: Pobierz i opisaz kazdy plik z Drive
        run: |
          set +e
          set -u
          mkdir -p out reports
          R="reports/drive-probe-$GITHUB_RUN_ID.md"
          { echo "# Raport drive-probe"; echo
            echo "- run: \`$GITHUB_REPOSITORY@$GITHUB_SHA\`"; echo "- wejscie ids: \`$DRIVE_IDS\`"; echo
            echo "Pobieranie bez OAuth i bez klucza API: probujemy drive.usercontent (confirm=t, omija strone skanu), drive.google.com/uc oraz googleapis alt=media."
            echo; } > "$R"

          # pobranie publiczne odporne na: (a) brak klucza API przy googleapis,
          # (b) wbudowana strona "Google nie moze obecnie skanowac..." dla duzych plikow
          get_from_drive() { # $1=id $2=plik  (klasyczny obieg "skan Google")
            local id=$1 out=$2 u sz
            for u in \
              "https://drive.usercontent.google.com/download?id=$id&export=download&authuser=0" \
              "https://drive.google.com/uc?export=download&id=$id"; do
              rm -f "$out" /tmp/hdr.html
              rm -f /tmp/hdr.body
              curl -sSL --retry 2 --connect-timeout 25 -c /tmp/dk.txt -D /tmp/hdr.head -o /tmp/hdr.body "$u" || { echo "curl $u -> rc=1" >> /tmp/probe.log; continue; }
              cp /tmp/hdr.body /tmp/hdr.html
              # (a) od razu plik?
              if [ "$(stat -c%s /tmp/hdr.html 2>/dev/null || echo 0)" -gt 4096 ] && ! head -c 400 /tmp/hdr.html | grep -qi '<!doctype html'; then
                mv /tmp/hdr.html "$out"; echo "    pobrane wprost: $(stat -c%s "$out") B"; return 0
              fi
              # (b) strona ze skanem -> wyciagnij formularz i POSTnij go
            { echo "    probe $u: HTTP $(head -1 /tmp/hdr.head 2>/dev/null | tr -d '\r') $(stat -c%s /tmp/hdr.body 2>/dev/null || echo 0) B"
              echo "    tresc: $(tr -d '\000-\010\013\014\016-\037' < /tmp/hdr.body | head -c 300 | tr '\n' ' ')"; } >> /tmp/probe.log
              if grep -qi 'drive.usercontent.google.com/download' /tmp/hdr.html 2>/dev/null; then
                act=$(grep -o 'action="[^"]*"' /tmp/hdr.html | head -1 | sed 's/action="//;s/"$//')
                [ -n "$act" ] || act="https://drive.usercontent.google.com/download"
                for f in id uuid confirm export token; do
                  eval "F_$f=\"$(sed -n 's/.*name="'$f'"[^>]*value="\([^"]*\)".*/\1/p' /tmp/hdr.html | head -1)\""
                done
                rm -f "$out"
                curl -sSL --retry 2 --connect-timeout 25 -b /tmp/dk.txt -c /tmp/dk.txt -o "$out" \
                  -X POST "$act" \
                  --data-urlencode "id=${F_id:-$id}" --data-urlencode "export=download" \
                  ${F_uuid:+--data-urlencode "uuid=$F_uuid"} ${F_confirm:+--data-urlencode "confirm=$F_confirm"} ${F_token:+--data-urlencode "token=$F_token"} || continue
                sz=$(stat -c%s "$out" 2>/dev/null || echo 0)
                if [ "$sz" -gt 4096 ] && ! head -c 400 "$out" | grep -qi '<!doctype html'; then
                  echo "    pobrane przez formularz skanu ($sz B) z $act"; return 0
                fi
                echo "    formularz zwrocil $sz B (HTML lub za malo)" >> /tmp/probe.log
              else
                { echo "    pod $u: HTTP $(head -1 /tmp/hdr.head 2>/dev/null) | $(stat -c%s /tmp/hdr.body 2>/dev/null || echo 0) B"
                  echo "    <<< $(tr -d '\000-\010\013\014\016-\037' < /tmp/hdr.body | head -c 400 | tr '\n' ' ')"
                } >> /tmp/probe.log
              fi
            done
            # (c) ostatecznie REST bez klucza (dziala dla niektorych udostepnien)
            curl -sSL -o "$out" "https://www.googleapis.com/drive/v3/files/$id?alt=media&supportsAllDrives=true" 2>/dev/null
            sz=$(stat -c%s "$out" 2>/dev/null || echo 0)
            if [ "$sz" -gt 4096 ] && ! head -c 400 "$out" | grep -qi '<!doctype html'; then
              echo "    pobrane przez alt=media ($sz B)"; return 0
            fi
            return 1
          }
          for id in $DRIVE_IDS; do
            [ -n "$id" ] || continue
            echo "===== $id ====="
            { echo "## \`$id\`"; echo; } >> "$R"
            # nazwa z metadanych - anonimowo bywa 403, wiec to tylko ozdobnik
            meta=$(curl -sS "https://www.googleapis.com/drive/v3/files/$id?fields=id,name,size" 2>/dev/null || true)
            name=$(echo "$meta" | sed -n 's/.*"name" *: *"\([^"]*\)".*/\1/p')
            case "$name" in *.img) :;; *) name="drive-$id.img";; esac
            echo "  nazwa z API: ${name} ; metadane: $(echo "$meta" | head -c 120)" >> "$R"
            if get_from_drive "$id" "out/$name"; then
              UNPACKED=0
              sz=$(stat -c%s "out/$name"); sh=$(sha256sum "out/$name" | cut -d' ' -f1)
              echo "  OK $name: $sz B  sha256=$sh"
              { echo "- plik: \`$name\`"; echo "- rozmiar: \`$sz\` B"; echo "- sha256: \`$sh\`"; echo; } >> "$R"
              { echo '### Geometria (tools/fs_probe.py)'; echo; echo '```'
                python3 tools/fs_probe.py "out/$name" 2>&1; echo '```'; echo; } >> "$R"
              { echo '### AVB (avbtool info_image)'; echo; echo '```'
                python3 "$AVBTOOL" info_image --image "out/$name" 2>&1 | head -90; echo '```'; echo; } >> "$R"
              # ROZPAKOWANIE W TEJ SAMEJ ITERACJI: skrypt kasuje obraz po zapakowaniu.
              # Bez tego 11,9 GB lezaloby naraz - runner ma ~14 GB i padloby ENOSPC.
              if [ "${DO_UNPACK:-0}" = "1" ]; then
                mkdir -p one && cp "out/$name" "one/$name" && {
                  KEEP_MANIFEST=1 bash tools/unpack_on_runner.sh one transfer || true; }
                rm -rf one
                UNPACKED=1
                { echo '### Rozpakowanie'; echo; echo '```'; tail -25 transfer/UNPACK_REPORT.txt 2>/dev/null; echo '```'; echo; } >> "$R"
              fi
              [ "${UNPACKED:-0}" = "1" ] || rm -f "out/$name"
            else
              echo "::error::$id nie dal sie pobrac publicznie"
              { echo "powody odrzucenia:"; echo '```'; cat /tmp/probe.log 2>/dev/null; echo '```'; echo; } >> "$R"
              { echo "**BLAD**: zadny endpoint nie zwrocil pliku (sprawdz 'kazdy z linkiem')."; echo; } >> "$R"
            fi
            df -h "$GITHUB_WORKSPACE" | tail -1
          done
          echo; echo "=========== RAPORT ==========="; cat "$R"

      - name: Podsumowanie kawalkow do sciagniecia przez agenta
        if: always()
        run: |
          set -uo pipefail
          mkdir -p transfer
          if [ -s transfer/MANIFEST.tsv ]; then
            wc -l < transfer/MANIFEST.tsv | sed 's/^/  linii manifestu: /'
            ls -l transfer | tail -25
            du -sh transfer | sed 's/^/  do przeslania: /'
            { echo "## Kawalki do sciagniecia przez agenta"; echo
              echo "Galaz: \`$GITHUB_REF_NAME\`; potem:"
              echo "\`\`\`"; echo "tools/pull_via_git.sh <repo-url> $GITHUB_REF_NAME ./incoming"; echo "\`\`\`"; echo
              cat transfer/MANIFEST.tsv; echo; } >> "reports/drive-probe-$GITHUB_RUN_ID.md"
          else
            echo "brak kawalkow (do_unpack=0 albo zaden FS nie dal sie rozpakowac)"
          fi

      - name: Wypchnij raport do repo
        # always(): przy timeout/cancel i tak chcemy to, co zdazylo sie zebrac -
        # bez tego przerwany run nie zostawia zadnego sladu (logow CI nie widac).
        if: always()
        run: |
          set +e
          set -u
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p reports transfer
          [ -f reports/drive-probe-$GITHUB_RUN_ID.md ] || { ls -la reports/ | sed "s/^/  /"; echo "# pusty raport (krok glowny padl wczesniej)" > reports/drive-probe-$GITHUB_RUN_ID.md; }
          git add -f reports transfer
          echo "### do commita:"; git status --porcelain | head -20
          if git diff --cached --quiet; then echo "brak zmian"; else
            git commit -q -m "drive-probe: raport + kawalki (run ${{ github.run_id }})"
            git push -q origin "HEAD:${{ github.ref_name }}" && echo "raport na ${{ github.ref_name }}"
          fi
