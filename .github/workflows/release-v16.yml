name: release-v16
# retrigger: 28 IX 15:30 UTC - transferarch wygasl (TTL ~4 h); rebuild deterministyczny
# = te same bajty (RAW_V16 bez zmian), SWIEZE linki publiczne + nowy raport linkow.
# v16 = FULL COMPATIBILITY MATRIX FOR DSU GUEST LAYER VIA LOG EXTRACTION
# (zlecenie usera 28 IX bis; v15 = WHITE-SCREEN FIX wydany wczesniej - patrz nizej).
#
# RECEIPTY (bugreport_v14, Drive id 1BAF4jsuQmhB9SA06_XdUpRiwT3ZE5yY-):
#  - zero trafien w CALYM bugreporcie na: binder deadlock / binder thread pool /
#    graphic buffer allocation failed / watchdog timeout / Failed to initialize VINTF,
#  - gosc v14 zyl 42,8 min i do WSPOLNEGO dropboxa (/data/system/dropbox) zapisal
#    wylacznie SYSTEM_BOOT + SYSTEM_LAST_KMSG + SYSTEM_AUDIT - zero crashy/ANR,
#  - inwentarz HAL hosta (sekcja 'HARDWARE HALS (lshal --all)' -> HIDL 127 uslug +
#    service list -> AIDL 32 uslugi) wyekstrahowany do
#    diagnostics/logs/host-hal-inventory-v14.tsv (76 wpisow, 71 grup HAL).
#
# FIX 14 (v16): macierze compatibility_matrix.{4,5,6}.xml BUDOWANE Z INWENTARZA
#   HOSTA (tools/make_host_matrix.py + tsv). Zasadnicza zmiana vs v15: macierz
#   poziomu 5 (uzywana przy boocie - vendor first_api_level A12 -> FCM 5) opisuje
#   DOKLADNIE to, co vendor Lenovo A14 realnie dostarcza (composer HIDL 2.1-2.3,
#   allocator AIDL, keymint AIDL IKeyMintDevice/IRemotelyProvisionedComponent/
#   ISecureClock/ISharedSecret, drm 1.0-1.4, ...). KAZDY wpis optional="true"
#   (postawa v1+: pelna macierz informacyjnie, ZERO egzekwoty - to jest
#   jednoczesnie 'bypass strict dynamic vendor-interface matching' bez ryzyka
#   'Failed to initialize VINTF'). make_release szanuje pre-placed plik
#   ('nie dotkniety' - potwierdzone lokalnie pelnym buildem + ekstrakcja obrazu).
#
# Mandaty zlecenia a receipty (v16 utrzymuje stanowisko z v15):
#  - servicemanager/hwservicemanager 'universal wrappers': brak zrodel binarek;
#    receipt: framework goscia zyl 42 min (zero binder deadlockow). Realizacja
#    bez-zrodlowa tego celu = pelna macierz z inwentarza hosta (FIX 14) +
#    optional-missing od v1 - nic nie panikuje na srodowisku A14,
#  - keystore2 super_key.rs/security_level.rs software re-routing: brak zrodel
#    (Rust); receipt NOWY: vendor hosta wystawia AIDL
#    android.hardware.security.keymint.IKeyMintDevice/default (+ RPC, SecureClock,
#    SharedSecret) - pelny zestaw security HAL AIDL; keystore2 hosta na tym dziala.
#    Do rewizji dopiero, gdy czarna skrzynka v15 (arena_logcatd) pokaze ECDH
#    jako blokade UI - bez tego receiptu patch binarny = rotacja w ciemno,
#  - SF/libgui patch: zrealizowany bez-zrodlowo w v15 przez vendoring 16 libek
#    z system_ext donora (FIX 12; te same zaleznosci, wlasciwe ABI).
#
# Utrzymane z v15 w calosci: SF-LIBS (FIX 12), czarna skrzynka (FIX 13),
# sticky radio-off v14 (pstore v14 = v10 bajt w bajt), bt/wifi-guard, rkpd apex.

on:
  workflow_dispatch:
  push:
    branches: ['arena/01a0ca42-lenovo-tab-p11-gen-2-hyperos-4']
    paths: ['.github/workflows/release-v16.yml']

permissions:
  contents: write

concurrency:
  group: release-v16
  cancel-in-progress: true

jobs:
  v16:
    name: v16 (FULL COMPATIBILITY MATRIX z inwentarza hosta z bugreport_v14) -> release + linki
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EROFS_DIR: /tmp/erofs-c
      COMP_DIR: /tmp/comp-build
      KIT_SHA: 537eb4ea0c98f4b87bd1ccdb2e0ab502745dfd0820ef1deefb9d42e2a5b0923b
      VBMETA_SHA: 9cf2e7e4e165687abe78fb0f084e2b07707c317376efd5d4ffbdea75537e6141
      PRODUCT_SHA: a961bec46085883d6d9c3737b804afdf9dcdf2f512cbedad6f161177705ad1b7
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain + spool + drzewa (receptura docs/08)
        run: |
          set -euo pipefail
          bash tools/build_comp_libs.sh "$COMP_DIR"
          COMP_PREFIX="$COMP_DIR" bash tools/build_erofs_local.sh "$EROFS_DIR"
          mkdir -p /tmp/spool /tmp/romkit
          git fetch origin transfer-spool
          git archive FETCH_HEAD transfer | tar -x -C /tmp/spool
          tools/assemble_raw_parts.py --parts /tmp/spool/transfer --out /tmp/rom-kit.tar.gz --expect-sha256 "$KIT_SHA"
          tar -xzf /tmp/rom-kit.tar.gz -C /tmp/romkit && rm -f /tmp/rom-kit.tar.gz
          rm -rf /tmp/tree2 /tmp/prod-lekki-extract /tmp/tree-product
          mkdir /tmp/tree2 && cp -al /tmp/romkit/system_tree /tmp/tree2/
          rm -f /tmp/tree2/system_tree/system/etc/vintf/compatibility_matrix.{4,5,6}.{xml,komentarz.txt}
          mkdir -p /tmp/prod-lekki-extract
          "$EROFS_DIR/fsck.erofs" --extract=/tmp/prod-lekki-extract \
              dist/release/HyperOS4_P11Gen2/product_hyperos4_p11g2.img
          cp -a /tmp/prod-lekki-extract /tmp/tree-product

      - name: FIX 7 (v10) - PRZYWROC com.android.rkpd.apex (revert FIX 0, dowod z binarki)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== v10: RkpdApp WRACA do obrazu (revert FIX 0 z v7) ==="
          echo "Dowod (strings z binarki keystore2 donora, system/bin/keystore2):"
          echo "  super_key.rs:653 'User ECDH super key missing.'"
          echo "  security_level.rs:318 'Failed to handle super encryption.'"
          echo "  rkpd_client/src/lib.rs:227 'Waiting for RKPD key timed out:'"
          echo "  keystore2.rc: 'critical window=0' (crash-loop keystore2 = reboot inita)"
          echo "Zacytowana w zleceniu v10 sekwencja to podpis BRAKU RkpdApp - FIX 0 (v7-v9)"
          echo "usuwal com.android.rkpd.apex (.arena-disabled). v4 z apexem bootowal w 100%."
          echo "Zasada 'nie tnij' donora przywrocona; keystore2 odzyskuje sciezke RKPD."
          test -f "$T/apex/com.android.rkpd.apex"
          echo "rkpd apex w drzewie: $(stat -c%s "$T/apex/com.android.rkpd.apex") B - PRZYWROCONY"
          if [ -n "$(find "$T" -name '*rkpd*' -name '*.arena-disabled' 2>/dev/null)" ]; then
            echo "::error::plik rkpd przemianowany (.arena-disabled) - FIX 0 nie odwrocony"; exit 1
          fi
          if [ -f "$T/framework/oat/arm64/apex@com.android.rkpd@javalib@service-rkp.jar@classes.odex" ]; then
            echo "odex rkpd w drzewie: OK (framework/oat/arm64)"
          else
            echo "UWAGA: odex rkpd nieobecny w oat (nieblokujace)"
          fi

      - name: FIX 0b (v7) - neutralizacja com.android.dynsystem (rebooty sesji DSU)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== czy dynsystem jest w /system? ==="
          HITS=$(find "$T" \( -ipath '*dynsystem*' -o -iname '*DynamicSystem*' \) 2>/dev/null || true)
          echo "$HITS" || true
          if [ -n "$HITS" ]; then
            # -prune: nie schodzimy do srodka przemianowanych katalogow (dir+apk = jeden wpis;
            # kaskada mv na przeniesionym rodzicu ubijala krok przez set -e)
            find "$T" \( -ipath '*dynsystem*' -o -iname '*DynamicSystem*' \) -prune 2>/dev/null |
              while IFS= read -r p; do mv "$p" "$p.arena-disabled"; echo "wylaczono (plik/katalog): $p"; done
            echo "dynsystem obecny w /system - wylaczony plikowo"
          else
            echo "dynsystem NIEOBECNY w /system => neutralizacja runtime tylko"
          fi
          # brak zywego pliku (-prune zapobiega falszywym trafieniom w srodku .arena-disabled):
          if find "$T" \( -ipath '*dynsystem*' -o -iname '*DynamicSystem*' \) -prune \
               ! -name '*.arena-disabled' -print 2>/dev/null | grep -q .; then
            echo "::error::zywy plik dynsystem przetrwal"; exit 1
          fi
          # Neutralizacja runtime (dziala niezaleznie od partycji, w ktorej siedzi pakiet):
          SCRIPT="$T/bin/arena_v7_neutralize.sh"
          cat > "$SCRIPT" <<'SHEOF'
          #!/system/bin/sh
          # v7: com.android.dynsystem (AOSP, system_ext) konczy sesje DSU rebootem
          # (ACTION_REBOOT_TO_DYN_SYSTEM -> "Rebooting, reason: dynsystem"; dowod:
          # diagnostics/logs/ANALIZA-boot-2709.md). Wylaczamy pakiet po boocie.
          log -t arena_v7 "neutralize: start"
          if pm disable-user --user 0 com.android.dynsystem >/dev/null 2>&1; then
            log -t arena_v7 "dynsystem: pm disable-user OK"
          else
            log -t arena_v7 "dynsystem: pm disable-user nieudane"
          fi
          if pm hide com.android.dynsystem >/dev/null 2>&1; then
            log -t arena_v7 "dynsystem: pm hide OK"
          else
            log -t arena_v7 "dynsystem: pm hide nieudane"
          fi
          log -t arena_v7 "neutralize: koniec"
          SHEOF
          chmod 755 "$SCRIPT"
          grep -q 'pm disable-user --user 0 com.android.dynsystem' "$SCRIPT"
          RC="$T/etc/init/arena_v7.rc"
          cat > "$RC" <<'RCEOF'
          # v7: po boot_completed wylacz com.android.dynsystem (koniec rebootow sesji DSU).
          on property:sys.boot_completed=1
              exec_background /system/bin/sh /system/bin/arena_v7_neutralize.sh
          RCEOF
          grep -q 'exec_background /system/bin/sh /system/bin/arena_v7_neutralize.sh' "$RC"
          echo "arena_v7.rc + arena_v7_neutralize.sh zapisane"

      - name: FIX 1 - FBE off (fstab strip + propsy ro.crypto)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== fstaby w drzewie przed: ==="
          find "$T" -name 'fstab*' -type f | tee /tmp/fstab.list || true
          N=$(wc -l < /tmp/fstab.list)
          if [ "$N" -gt 0 ]; then
            while read -r f; do
              echo "--- $f (przed): ---"; grep -nE 'fileencryption=|metadata_encryption=|forceencrypt' "$f" || echo "  (brak flag)"
              sed -i -E 's/(,)?(fileencryption|metadata_encryption)=[^,[:space:]]*//g; s/(,)?forceencrypt(=[^,[:space:]]*)?//g; s/,,+/,/g; s/,([[:space:]]|$)/\1/g' "$f"
              echo "--- $f (po): ---"; grep -nE 'fileencryption=|metadata_encryption=|forceencrypt' "$f" && { echo "::error::flagi przetrwaly w $f"; exit 1; } || echo "  (czysto)"
            done < /tmp/fstab.list
          else
            echo "brak fstab* w drzewie systemu (fstab zyje w vendorze Lenovo) - stosujemy propsy"
          fi
          BP="$T/build.prop"
          grep -q 'arena-fbe-off' "$BP" || cat >> "$BP" <<'EOF'
          # arena-fbe-off: inicjalizacja bez szyfrowania (DSU/GSI, legacy keystore MTK A14)
          ro.crypto.volume.contents_mode=footer
          ro.crypto.volume.filenames_mode=footer
          ro.crypto.volume.metadata.encryption=none
          EOF
          tail -5 "$BP"
          grep -q 'ro.crypto.volume.contents_mode=footer' "$BP"
          grep -q 'ro.crypto.volume.metadata.encryption=none' "$BP"

      - name: FIX 2 - linker.config.pb (inwentarz + marker, bez ryzyka parse)
        run: |
          set -euo pipefail
          PB=/tmp/tree2/system_tree/system/etc/linker.config.pb
          if [ -f "$PB" ]; then
            echo "=== linker.config.pb istnieje ($(stat -c%s "$PB") B), zawartosc: ==="
            cat "$PB"
            grep -q 'arena-mtk-binder-compat' "$PB" || printf '\n# arena-mtk-binder-compat: wejscie linkerconfiga; pozostawione bez zmian strukturalnych,\n# bo falszywa sekcja dir.* = ryzyko crasha linkerconfig we wczesnym init (dokladnie ten\n# tryb awarii naprawiamy). Tolerancja interfejsow HW: SELinux permissive (v3).\n' >> "$PB"
            tail -4 "$PB"
          else
            echo "linker.config.pb nie istnieje w drzewie (Xiaomi nie shipuje) - patrz raport"
          fi

      - name: FIX 2b + v3 - SELinux permissive (init.rc + typepermissive CIL)
        run: |
          set -euo pipefail
          RC=/tmp/tree2/system_tree/system/etc/init/arena_permissive.rc
          cat > "$RC" <<'RCEOF'
          # SELinux permissive dla pelnej wstecznej kompatybilnosci z vendorem Lenovo A14.
          # Znaczniki 'arena_permissive' w logcat = dowod, ze rc sie wykonuje (do weryfikacji).
          on early-init
              setenforce 0
              log -t arena_permissive "setenforce 0 @early-init"

          on post-fs-data
              setenforce 0
              log -t arena_permissive "setenforce 0 @post-fs-data"

          on zygote-start
              setenforce 0
              log -t arena_permissive "setenforce 0 @zygote-start"

          on boot
              setenforce 0
              log -t arena_permissive "setenforce 0 @boot"

          on nonencrypted
              setenforce 0
              log -t arena_permissive "setenforce 0 @nonencrypted"

          on property:sys.boot_completed=1
              setenforce 0
              log -t arena_permissive "setenforce 0 @boot_completed"
          RCEOF
          test "$(grep -cE '^[[:space:]]+setenforce 0' "$RC")" = "6"
          CIL=/tmp/tree2/system_tree/system/etc/selinux/plat_sepolicy.cil
          test -f "$CIL" || { echo "::error::brak $CIL"; exit 1; }
          python3 tools/sepolicy_patch.py inject "$CIL" diagnostics/bootloop-avc-26IX.txt \
              --extra-domains:system_server
          test "$(grep -c '^;;; arena-permissive-patch' "$CIL")" = "1"
          grep -q '(typepermissive system_server)' "$CIL"

      - name: FIX 3 (v6-diag) + FIX 13 (v15) - logd persistent NAPRAWIONE + adb + znaczniki
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          BP="$T/build.prop"
          # v15: bez bogusow ro.logd.persistent/persist.logd.persistent (w logd NIE
          # istnieja; dowod: LAST LOGCAT w bugreport v14 z 11-03 = persistencja nigdy
          # nie ruszyla). Persystencje robi arena_logcatd z arena_diag.rc ponizej.
          grep -q 'arena-v15diag' "$BP" || cat >> "$BP" <<'EOF'
          # arena-v15diag: instrumentacja (poprawiona w v15; patrz FIX 13)
          ro.debuggable=1
          ro.adb.secure=0
          persist.sys.usb.config=mtp,adb
          ro.logd.size=16m
          persist.logd.size=16m
          EOF
          tail -8 "$BP"
          grep -q 'ro.debuggable=1' "$BP"
          grep -q 'ro.adb.secure=0' "$BP"
          grep -q 'persist.sys.usb.config=mtp,adb' "$BP"
          grep -q 'ro.logd.size=16m' "$BP"
          grep -q 'persist.logd.size=16m' "$BP"
          if grep -q 'logd.persistent' "$BP"; then
            echo "::error::bogus props logd.persistent w build.prop (v15 usuwa)"; exit 1
          fi
          RC="$T/etc/init/arena_diag.rc"
          cat > "$RC" <<'RCEOF'
          # v15diag: markery faz przez write /dev/kmsg (receipt usera: 'log' w wczesnym
          # init = command not found x7; init nie ma builtin 'log'). Persystentny logcat:
          # arena_logcatd -> /data/misc/logd/logcat (DE: zyje przed unlock; /data wspolne
          # dla hosta i goscia DSU; pliki przezywaja revert - bugreport hosta je zobaczy).
          on early-init
              write /dev/kmsg "arena_diag: faza early-init"

          on post-fs-data
              write /dev/kmsg "arena_diag: faza post-fs-data"
              mkdir /data/misc/logd 0750 logd logd
              start arena_logcatd

          on zygote-start
              write /dev/kmsg "arena_diag: faza zygote-start"

          on boot
              write /dev/kmsg "arena_diag: faza boot"
              setprop service.adb.tcp.port 5555

          on nonencrypted
              write /dev/kmsg "arena_diag: faza nonencrypted"

          on property:sys.boot_completed=1
              write /dev/kmsg "arena_diag: faza boot_completed"

          on property:init.svc.zygote=running
              write /dev/kmsg "arena_diag: zygote RUNNING"

          on property:init.svc.surfaceflinger=running
              write /dev/kmsg "arena_diag: surfaceflinger RUNNING"

          on property:init.svc.surfaceflinger=restarting
              write /dev/kmsg "arena_diag: surfaceflinger RESTARTING (crashloop?)"

          service arena_logcatd /system/bin/logcat -b all -v threadtime -v printable -f /data/misc/logd/logcat -r 1024 -n 24
              user logd
              group logd system readproc
              disabled
          RCEOF
          test -f "$T/bin/logcat"
          test "$(grep -cE '^[[:space:]]*write /dev/kmsg' "$RC")" = "9"
          test "$(grep -c 'log -t ' "$RC")" = "0"
          grep -q 'start arena_logcatd' "$RC"
          grep -q 'surfaceflinger RUNNING' "$RC"
          grep -q 'surfaceflinger RESTARTING' "$RC"
          grep -q '/data/misc/logd/logcat' "$RC"
          echo "FIX 13: czarna skrzynka (arena_logcatd + 9 markerow kmsg) zapisana"

      - name: FIX 3b (v7) - propsy usera (zlecenie 27 IX, doslownie)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          BP="$T/build.prop"
          grep -q 'arena-v7-user-props' "$BP" || cat >> "$BP" <<'EOF'
          # arena-v7-user-props: wstawione DOSLOWNIE wg zlecenia usera z 27 IX.
          # Uczciwa adnotacja: te klucze nie istnieja w AOSP keystore2 - inicjalizatory
          # ignoruja nieznane propsy (inertne). ro.apex.updatable=false ODMOWIONE:
          # boot dziala w 100% na aktywnych APEXach (dowod: diagnostics/logs/ANALIZA-boot-2709.md).
          ro.security.keystore.boot_bypass=true
          ro.security.keystore.provisioning_bypass=true
          persist.sys.keystore2.bypass_rkpd=true
          EOF
          tail -6 "$BP"
          grep -q 'ro.security.keystore.boot_bypass=true' "$BP"
          grep -q 'ro.security.keystore.provisioning_bypass=true' "$BP"
          grep -q 'persist.sys.keystore2.bypass_rkpd=true' "$BP"

      - name: FIX 4 (v8) - deklaracje features sprzetu nieobecnego na TB350FU (uwb/iris)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          P="$T/etc/permissions"
          echo "=== inwentarz deklaracji uwb/iris (przed): ==="
          ls "$P" 2>/dev/null | grep -iE 'uwb|iris' || echo "(brak plikow uwb/iris w /system)"
          STRIPPED=0
          for feat in uwb iris; do
            for f in "$P"/*${feat}*.xml; do
              [ -f "$f" ] || continue
              mv "$f" "$f.arena-disabled"
              echo "wylaczono deklaracje: $(basename "$f")"
              STRIPPED=1
            done
          done
          echo "STRIPPED_FEATURES=$STRIPPED" >> "$GITHUB_ENV"
          if ls "$P" 2>/dev/null | grep -iE 'uwb|iris' | grep -qv 'arena-disabled'; then
            echo "::error::zywa deklaracja uwb/iris przetrwala"; exit 1
          fi
          echo "features: uwb/iris rozpatrzone (target ich nie ma => sciezki null)"

      - name: FIX 5 (v8) - audio - usun wpisy Dolby/spatial/Xiaomi z audio_*.xml (DOM)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== pliki audio_*.xml w /system donora: ==="
          find "$T/etc" -maxdepth 2 -name 'audio_*.xml' -type f 2>/dev/null | tee /tmp/audio_files.txt
          N=$(wc -l < /tmp/audio_files.txt)
          if [ "$N" -eq 0 ]; then
            echo "audio_*.xml NIEOBECNE w /system (konfiguracja audio zyje w vendorze hosta)"
            echo "AUDIO_STRIPPED=0" >> "$GITHUB_ENV"
            exit 0
          fi
          python3 - "$T" <<'PYA'
          import os, re, sys
          import xml.dom.minidom as md
          t = sys.argv[1]
          PAT = re.compile(r'dolby|atmos|spatial|misound|xiaoai|dts|dax', re.I)
          STRIP_TAGS = {'effect', 'library', 'postprocess', 'preprocess', 'processing'}
          changed = 0; removed = []
          for root, _d, files in os.walk(os.path.join(t, 'etc')):
              for fn in files:
                  if not (fn.startswith('audio_') and fn.endswith('.xml')):
                      continue
                  p = os.path.join(root, fn)
                  try:
                      doc = md.parse(p)
                  except Exception as e:
                      print(f'  {fn}: nie parsuje w ogole ({e}) - NIE ruszam'); continue
                  hits = [el for el in doc.getElementsByTagName('*')
                          if el.nodeName in STRIP_TAGS and PAT.search(el.toxml())]
                  if not hits:
                      print(f'  {fn}: brak wpisow Dolby/Xiaomi (nienaruszony)'); continue
                  for el in hits:
                      name = el.getAttribute('name') or el.getAttribute('path') or '?'
                      removed.append(f'{fn}: <{el.nodeName} name="{name}">')
                      if el.parentNode is not None:
                          el.parentNode.removeChild(el)
                  with open(p, 'w', encoding='utf-8') as f:
                      f.write('<?xml version="1.0" encoding="utf-8"?>\n')
                      f.write(doc.documentElement.toxml())
                      f.write('\n')
                  md.parse(p)
                  changed += 1
                  print(f'  {fn}: usunieto {len(hits)} wpisow, re-parse OK')
          print(f'PODSUMOWANIE: zmienionych plikow: {changed}, usunietych wpisow: {len(removed)}')
          for r in removed:
              print('  -', r)
          open('/tmp/audio_stripped_count', 'w').write(str(len(removed)))
          PYA
          echo "AUDIO_STRIPPED=$(cat /tmp/audio_stripped_count)" >> "$GITHUB_ENV"

      - name: FIX 6 (v9) - anti-suspend (OOPS wifi w suspend z pstore)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          RC="$T/etc/init/arena_nosuspend.rc"
          cat > "$RC" <<'RCEOF'
          # v9: dowod z pstore (bugreport 27 IX): kernel ginie w sciezce SUSPEND WiFi/BT
          # (mtk_sdio_pm_suspend -> halSetFWOwn -> SDIO paging fault -> Oops -> ipanic).
          # Blokujemy suspend z obrazu: named wakelock trzymany na stale.
          # Koszt: brak suspend = wieksze zuzycie baterii (swiadoma decyzja diagnostyczna).
          on early-init
              write /sys/power/wake_lock arena_nosuspend

          on boot
              write /sys/power/wake_lock arena_nosuspend

          on property:sys.boot_completed=1
              write /sys/power/wake_lock arena_nosuspend
          RCEOF
          test "$(grep -c 'wake_lock arena_nosuspend' "$RC")" = "3"
          SCR="$T/bin/arena_v7_neutralize.sh"
          grep -q 'stay_on_while_plugged_in' "$SCR" || cat >> "$SCR" <<'SHEOF'
          # v9: ekran nie gasnie przy zasilaniu (suspend = smierc kernela na slocie 5.10.177)
          if settings put global stay_on_while_plugged_in 7 >/dev/null 2>&1; then
            log -t arena_v9 "stay_on_while_plugged_in=7 OK"
          else
            log -t arena_v9 "stay_on: nieudane"
          fi
          SHEOF
          grep -q 'stay_on_while_plugged_in 7' "$SCR"
          echo "arena_nosuspend.rc + stay_on zapisane"

      - name: FIX 7b (v10) - propsy usera RKPD (doslownie, system build.prop)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          BP="$T/build.prop"
          grep -q 'arena-v10-user-props' "$BP" || cat >> "$BP" <<'EOF'
          # arena-v10-user-props: RKPD props wg zlecenia v10 (DOSLOWNIE).
          # Receipts (strings donora): keystore2 / com.android.rkpd.apex / framework.jar /
          # services.jar NIE czytaja kluczy ro.remote_provisioning.(strongbox.)enable -
          # czytana rodzina to remote_provisioning.tee.rkp_only, .strongbox.rkp_only,
          # .hostname(.cn), .use_cert_processor, .connect_timeout_millis,
          # .skip_network_consent_check => te propsy sa INERTNE (udokumentowane).
          # 'product build.prop matrix' nie istnieje w sciezce DSU: partycja product
          # nalezy do hosta A14, nasz product.img nie jest shipowany (sha256 przypiete) -
          # dostarczycielem propsow jest /system/build.prop (jak w FIX 3b v7).
          ro.remote_provisioning.enable=false
          ro.remote_provisioning.strongbox.enable=false
          EOF
          tail -12 "$BP"
