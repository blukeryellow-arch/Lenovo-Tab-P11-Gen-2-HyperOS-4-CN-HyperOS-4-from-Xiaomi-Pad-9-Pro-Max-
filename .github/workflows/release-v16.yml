      - name: FIX 8 (v11) - anty-wlan-suspend (petla paniki z pstore bugreportu v10)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          SCR="$T/bin/arena_v11_wifi.sh"
          cat > "$SCR" <<'SHEOF'
          #!/system/bin/sh
          # v11: pstore bugreportu v10: zabojca = suspend urzadzenia wlan (mtk_sdio_pm_suspend
          # -> halSetFWOwn -> Oops 96000145 -> ipanic) na slocie _b (5.10.177). To suspend
          # URZADZENIA SDIO (runtime-PM), nie systemu - wakelock z v9 tego nie blokuje.
          log -t arena_v11 "wifi-guard: start"
          N=0
          for f in /sys/bus/sdio/devices/*/power/control; do
            [ -w "$f" ] || continue
            if echo on > "$f" 2>/dev/null; then N=$((N+1)); fi
          done
          log -t arena_v11 "sdio power/control=on: $N urzadzen"
          W=0
          for f in /sys/bus/sdio/devices/*/power/wakeup; do
            [ -w "$f" ] || continue
            if echo enabled > "$f" 2>/dev/null; then W=$((W+1)); fi
          done
          log -t arena_v11 "sdio wakeup=enabled: $W urzadzen"
          # WiFi domyslnie OFF (decyzja diagnostyczna; koszt udokumentowany w README):
          # sciezka paniki nie ruszy bez aktywnego wlan. Wlaczenie: svc wifi enable / Ustawienia.
          if svc wifi disable >/dev/null 2>&1; then
            log -t arena_v11 "wifi: DISABLED (domyslne v11; wlacz recznie: svc wifi enable)"
          else
            log -t arena_v11 "wifi: disable nieudane (kontynuuje)"
          fi
          log -t arena_v11 "wifi-guard: koniec"
          SHEOF
          chmod 755 "$SCR"
          grep -q '/sys/bus/sdio/devices/\*/power/control' "$SCR"
          grep -q 'svc wifi disable' "$SCR"
          RC="$T/etc/init/arena_v11.rc"
          cat > "$RC" <<'RCEOF'
          # v11: po boot_completed zablokuj runtime-PM urzadzen SDIO (wlan) i domyslnie wylacz WiFi.
          on property:sys.boot_completed=1
              exec_background /system/bin/sh /system/bin/arena_v11_wifi.sh
          RCEOF
          grep -q 'exec_background /system/bin/sh /system/bin/arena_v11_wifi.sh' "$RC"
          echo "arena_v11_wifi.sh + arena_v11.rc zapisane"

      - name: FIX 9 (v12) - slot-agnostic audit (statyczny lock slotu wg zlecenia)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          echo "=== zlecenie v12: 'statyczny lock slotu w drzewie systemu' - AUDYT ==="
          echo "--- fstab* w /system (wlacznie z fstab.postboot z zlecenia): ---"
          FST=$(find "$T" -maxdepth 3 -name 'fstab*' -type f 2>/dev/null || true)
          if [ -n "$FST" ]; then
            echo "$FST"
          else
            echo "0 plikow - fstab zyje w VENDORZE hosta; sloty montuje binarny init hosta"
            echo "wg androidboot.slot_suffix z bootloadera (poza obrazem goscia)"
          fi
          echo "--- twarde referencje suffiksow _a/_b w konfigach: ---"
          HITS=$(grep -rIlE '/dev/block/(by-name|mapper)/[A-Za-z0-9_-]+_(a|b)([^a-zA-Z0-9_]|$)' "$T/etc" 2>/dev/null || true)
          HITS2=$(grep -rIlE '(system|vendor|product|system_ext)_(a|b)([^a-zA-Z0-9_]|$)' "$T/etc/init" "$T/etc/permissions" 2>/dev/null || true)
          echo "blokowe _a/_b: ${HITS:-BRAK}; partycje_a/b: ${HITS2:-BRAK}"
          if [ -n "${HITS}${HITS2}" ]; then
            echo "::error::twardy lock slotu w drzewie (patrz wyzej)"; exit 1
          fi
          echo "WERDYKT: obraz goscia SLOT-AGNOSTYCZNY (0 twardych referencji - receipt w logu)."
          echo "Dowod v4: ten sam system bootowal przez DSU z pelnym UI - layout slotow hosta"
          echo "nie jest przeszkoda dla goscia (DSU: system z /data, vendor z aktywnego slotu)."
          RC="$T/etc/init/arena_v12.rc"
          cat > "$RC" <<'RCEOF'
          # v12: znaczniki slotu/DSU/AVB do logow (white-screen v11 potrzebuje logcat z petli!)
          on property:sys.boot_completed=1
              exec_background /system/bin/sh /system/bin/arena_v12_slot.sh
          RCEOF
          grep -q 'arena_v12_slot.sh' "$RC"
          SCR="$T/bin/arena_v12_slot.sh"
          cat > "$SCR" <<'SHEOF'
          #!/system/bin/sh
          # v12: kazdy przyszly log/bugreport bedzie mial kontekst slotu i DSU w logcat.
          log -t arena_v12 "slot_suffix=$(getprop ro.boot.slot_suffix)"
          log -t arena_v12 "gsid.image_installed=$(getprop gsid.image_installed) image_running=$(getprop ro.gsid.image_running)"
          log -t arena_v12 "bootreason=$(getprop ro.boot.bootreason)"
          log -t arena_v12 "veritymode=$(getprop ro.boot.veritymode) verifiedbootstate=$(getprop ro.boot.verifiedbootstate)"
          log -t arena_v12 "focus=$(dumpsys window 2>/dev/null | grep -m1 'mCurrentFocus' || echo brak)"
          SHEOF
          chmod 755 "$SCR"
          grep -q 'slot_suffix' "$SCR"
          grep -q 'mCurrentFocus' "$SCR"
          echo "arena_v12.rc + arena_v12_slot.sh zapisane (znaczniki diagnostyczne)"

      - name: FIX 9b (v12) - propsy AVB wg zlecenia (doslownie, inertne)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          BP="$T/build.prop"
          grep -q 'arena-v12-avb-props' "$BP" || cat >> "$BP" <<'EOF'
          # arena-v12-avb-props: zlecenie v12 "usun scisle AVB binding slotow" - DOSLOWNIE.
          # Receipts: vbmeta w kicie od v1 ma Flags=3 (verification+verity WYLACZONE,
          # tools/make_release.sh --flags 3) - na sciezce fastboot scisla weryfikacja juz
          # nie istnieje. Na sciezce DSU vbmeta goscia nie jest konsumowane (system z /data,
          # host weryfikuje wlasne partycje). ro.boot.* przychodzi z cmdline bootloadera
          # ZANIM wczyta sie build.prop => ponizsze duplikaty init zignoruje (INERTNE);
          # wlasciwe wartosci i tak sa wlasciwe: veritymode=disabled (Flags=3),
          # verifiedbootstate=orange (BL odblokowany - fakt usera).
          ro.boot.veritymode=disabled
          ro.boot.verifiedbootstate=orange
          EOF
          tail -10 "$BP"
          grep -q 'ro.boot.veritymode=disabled' "$BP"
          grep -q 'ro.boot.verifiedbootstate=orange' "$BP"
          echo "propsy AVB v12 zapisane (doslownie wg zlecenia; inertnosc udokumentowana)"

      - name: FIX 10 (v13) - BT-GUARD (btmtk w sekwencji smierci slotu _b z pstore)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          SCR="$T/bin/arena_v13_bt.sh"
          cat > "$SCR" <<'SHEOF'
          #!/system/bin/sh
          # v13: pstore slotu _b (kernel 5.10.177): 952 linii btmtk w oknie smierci,
          # "btmtk subsys reset failed, do whole chip reset!" -> SDIO Oops. Stary driver
          # BT nie moze zostac aktywny na nieaktualnym slocie - wylaczamy domyslnie.
          log -t arena_v13 "bt-guard: start"
          if svc bluetooth disable >/dev/null 2>&1; then
            log -t arena_v13 "bluetooth: DISABLED (domyslne v13; wlacz: svc bluetooth enable)"
          else
            log -t arena_v13 "bluetooth: disable nieudane (kontynuuje)"
          fi
          if settings put global ble_scan_always_on 0 >/dev/null 2>&1; then
            log -t arena_v13 "ble_scan_always_on=0 OK (BLE scan nie budzi drivera)"
          else
            log -t arena_v13 "ble_scan: nieudane (kontynuuje)"
          fi
          log -t arena_v13 "bt-guard: koniec"
          SHEOF
          chmod 755 "$SCR"
          grep -q 'svc bluetooth disable' "$SCR"
          grep -q 'ble_scan_always_on 0' "$SCR"
          RC="$T/etc/init/arena_v13.rc"
          cat > "$RC" <<'RCEOF'
          # v13: po boot_completed wylacz BT (stary driver btmtk na slocie _b zabija kernel).
          on property:sys.boot_completed=1
              exec_background /system/bin/sh /system/bin/arena_v13_bt.sh
          RCEOF
          grep -q 'exec_background /system/bin/sh /system/bin/arena_v13_bt.sh' "$RC"
          echo "arena_v13_bt.sh + arena_v13.rc zapisane"

      - name: FIX 11 (v14) - SLOT B EDITION - sticky radio-off + re-arm (init)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          SCR="$T/bin/arena_v14_slotb.sh"
          cat > "$SCR" <<'SHEOF'
          #!/system/bin/sh
          # v14 SLOT B EDITION: stary kernel 5.10.177 - radia maja byc martwe na stale.
          # airplane mode trzyma wifi/bt wylaczone na poziomie frameworku; svc disable
          # dodatkowo wylacza serwisy. Ten skrypt odpala sie przy boot ORAZ przy KAZDEJ
          # probie wznowienia serwisu wifi/bt (re-arm z arena_v14.rc).
          echo "arena_v14: slot-b guard: start" > /dev/kmsg
          if settings put global airplane_mode_on 1 >/dev/null 2>&1; then
            echo "arena_v14: airplane_mode_on=1 OK" > /dev/kmsg
          else
            echo "arena_v14: airplane_mode: nieudane (kontynuuje)" > /dev/kmsg
          fi
          am broadcast -a android.intent.action.AIRPLANE_MODE --ez state true >/dev/null 2>&1 \
            && echo "arena_v14: AIRPLANE_MODE broadcast OK" > /dev/kmsg \
            || echo "arena_v14: broadcast: pominiety" > /dev/kmsg
          svc wifi disable >/dev/null 2>&1 \
            && echo "arena_v14: wifi: DISABLED" > /dev/kmsg \
            || echo "arena_v14: wifi disable: nieudane" > /dev/kmsg
          svc bluetooth disable >/dev/null 2>&1 \
            && echo "arena_v14: bluetooth: DISABLED" > /dev/kmsg \
            || echo "arena_v14: bluetooth disable: nieudane" > /dev/kmsg
          settings put global ble_scan_always_on 0 >/dev/null 2>&1 \
            && echo "arena_v14: ble_scan_always_on=0 OK" > /dev/kmsg \
            || echo "arena_v14: ble_scan: nieudane" > /dev/kmsg
          echo "arena_v14: slot-b guard: koniec" > /dev/kmsg
          SHEOF
          chmod 755 "$SCR"
          grep -q 'airplane_mode_on 1' "$SCR"
          grep -q 'svc wifi disable' "$SCR"
          grep -q 'svc bluetooth disable' "$SCR"
          RC="$T/etc/init/arena_v14.rc"
          cat > "$RC" <<'RCEOF'
          # v14 SLOT B EDITION: boot + re-arm - kazda proba wznowienia wifi/bt na starym
          # kernelu (5.10.177) konczy sie natychmiastowym wylaczeniem (pstore: panika
          # wlan/bt w suspend). Radia sa martwe na stale; to zamierzzone dla slotu _b.
          on property:sys.boot_completed=1
              exec_background /system/bin/sh /system/bin/arena_v14_slotb.sh

          on property:init.svc.wifi=running
              exec_background /system/bin/sh /system/bin/arena_v14_slotb.sh

          on property:init.svc.bluetooth=running
              exec_background /system/bin/sh /system/bin/arena_v14_slotb.sh
          RCEOF
          test "$(grep -c 'exec_background /system/bin/sh /system/bin/arena_v14_slotb.sh' "$RC")" = "3"
          grep -q 'on property:init.svc.wifi=running' "$RC"
          grep -q 'on property:init.svc.bluetooth=running' "$RC"
          echo "arena_v14_slotb.sh + arena_v14.rc (boot + 2x re-arm) zapisane"

      - name: FIX 12 (v15) - SF-LIBS z system_ext donora do /system (bialy ekran)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          # RECEIPT (bugreport v14 + readelf na donorze): SF HyperOS NEEDED libki, ktorych
          # nie ma w system donora (Xiaomi trzyma je w system_ext). Gosc DSU dostaje
          # system_ext od LENOVO A14 -> zle ABI albo nic -> SF nie wstaje -> bialy ekran
          # bez crashu. Vendorujemy wlasne libki do /system/{lib,lib64} (default namespace
          # przeszukuje /system/lib64 PRZED /system_ext - nasze wygrywaja).
          python3 tools/assemble_raw_parts.py --parts /tmp/spool/transfer \
            --out /tmp/system_ext.img \
            --expect-sha256 7340a8367d3da8e4bdcf56a0f53dd7b77d87f81389d08b2a7e9e449fc02a5385 \
            --md5 f879747f3f7ebb5eb026eddeb02f8d13
          rm -rf /tmp/se-root && mkdir -p /tmp/se-root
          "$EROFS_DIR/fsck.erofs" --extract=/tmp/se-root /tmp/system_ext.img
          MAN="$T/etc/arena-v15-sflibs.txt"
          {
            echo "# v15 FIX 12: libki SF vendorowane z system_ext donora (Xiaomi Pad 9 Pro Max)"
            echo "# zrodlo: system_ext.img 632840192 B sha256 7340a8367d3da8e4bd... md5(Google) f879747f3f7e..."
          } > "$MAN"
          N=0
          for L in libsurfaceflinger.so libsurfaceflinger_common_shared.so libfolme.so \
                   libmisight.so android.hardware.graphics.composer@2.1.so \
                   android.hardware.graphics.composer@2.2.so \
                   android.hardware.graphics.composer@2.3.so \
                   android.hardware.graphics.composer@2.4.so; do
            for D in lib64 lib; do
              test -f "/tmp/se-root/$D/$L"
              cp "/tmp/se-root/$D/$L" "$T/$D/$L"
              chmod 644 "$T/$D/$L"
              echo "$(sha256sum "$T/$D/$L" | awk '{print $1}')  $D/$L  $(stat -c%s "$T/$D/$L") B" >> "$MAN"
              N=$((N+1))
            done
          done
          test "$N" = "16"
          # domkniecie: vendorowane libki nie wymagaja niczego spoza /system/{lib,lib64}
          # (libc/libm/libdl zyja z APEX runtime - to nie brak). Sprawdzone offline na
          # donorze; tu bramka na zywo.
          for D in lib64 lib; do
            for F in "$T/$D"/libsurfaceflinger.so "$T/$D"/libsurfaceflinger_common_shared.so \
                     "$T/$D"/libfolme.so "$T/$D"/libmisight.so "$T/$D"/android.hardware.graphics.composer@2.*.so; do
              [ -f "$F" ] || continue
              for ND in $(readelf -d "$F" | awk -F'[][]' '/NEEDED/{print $2}'); do
                case "$ND" in libc.so|libm.so|libdl.so) continue;; esac
                if [ ! -e "$T/lib64/$ND" ] && [ ! -e "$T/lib/$ND" ]; then
                  echo "::error::domkniecie: $F wymaga $ND (brak w /system/{lib,lib64})"; exit 1
                fi
              done
            done
          done
          echo "FIX 12: 16 libek SF z system_ext donora w /system/{lib,lib64} + manifest z sumami"
          # higiena dysku runnera (v15 doklada ~2,1 GB posrednikow; bez tego Zestaw
          # tonie na ENOSPC): czesci spoolu, obraz system_ext i ekstrakcja sa juz
          # skonsumowane; kit-image nie jest wejsciem make_release (tylko drzewa).
          rm -rf /tmp/spool /tmp/se-root
          rm -f /tmp/system_ext.img /tmp/romkit/system_hyperos4_p11g2.img
          df -h /tmp | tail -1

      - name: FIX 14 (v16) - FULL COMPATIBILITY MATRIX z inwentarza hosta (z bugreport_v14)
        run: |
          set -euo pipefail
          T=/tmp/tree2/system_tree/system
          # Inwentarz HAL hosta (ekstrakcja z bugreport_v14: lshal 'HARDWARE HALS' +
          # service list) -> macierze VINTF 4/5/6. Kazdy wpis optional="true" (pelna
          # macierz informacyjnie, zero egzekwoty = bypass strict VINTF matching).
          # make_release widzac istniejacy plik poziomu 5 zostawia go 'nie dotkniety'.
          python3 tools/make_host_matrix.py \
            --inventory diagnostics/logs/host-hal-inventory-v14.tsv \
            --vintf-dir "$T/etc/vintf" --levels 4,5,6
          # bramki lokalne (to samo, co w Build na ekstrakcie obrazu)
          python3 - <<'PYEOF'
          import xml.dom.minidom as m
          for lvl in (4, 5, 6):
              p = "/tmp/tree2/system_tree/system/etc/vintf/compatibility_matrix.%d.xml" % lvl
              d = m.parse(p)
              hals = d.getElementsByTagName("hal")
              names = [h.getElementsByTagName("name")[0].firstChild.data for h in hals]
              assert len(hals) >= 70, lvl
              assert all(h.getAttribute("optional") == "true" for h in hals), lvl
              for must in ("android.hardware.graphics.composer",
                           "android.hardware.graphics.allocator",
                           "android.hardware.security.keymint"):
                  assert must in names, (lvl, must)
          print("macierze 4/5/6: hal>=70, wszystkie optional, composer+allocator+keymint OBECNE")
          PYEOF
          grep -q "bugreport_v14" "$T/etc/vintf/compatibility_matrix.5.xml"
          echo "FIX 14: macierze VINTF 4/5/6 z inwentarza hosta (bugreport_v14) w drzewie"

      - name: Build systemu v16 (EROFS, surowy obraz)
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/reports"
          exec > >(tee "$GITHUB_WORKSPACE/reports/v16-build-trace.log") 2>&1
          set -x
          tools/make_release.sh --product-tree /tmp/tree-product --system-tree /tmp/tree2/system_tree \
            --vintf-level 5 --vintf-optional-missing --out /tmp/rebuild-v16 \
            --erofs-dir "$EROFS_DIR" --exclude-regex '\.komentarz\.txt$' --allow-no-vbmeta
          cd /tmp/rebuild-v16
          echo "$PRODUCT_SHA  product_hyperos4_p11g2.img" | sha256sum -c -
          # DOWOD: wszystkie fixy fizycznie w obrazie
          mkdir -p /tmp/imgcheck && rm -rf /tmp/imgcheck/*
          "$EROFS_DIR/fsck.erofs" --extract=/tmp/imgcheck system_hyperos4_p11g2.img >/dev/null
          test "$(grep -cE '^[[:space:]]+setenforce 0' /tmp/imgcheck/system/etc/init/arena_permissive.rc)" = "6"
          grep -q '(typepermissive system_server)' /tmp/imgcheck/system/etc/selinux/plat_sepolicy.cil
          grep -q 'ro.crypto.volume.contents_mode=footer' /tmp/imgcheck/system/build.prop
          grep -q 'ro.crypto.volume.metadata.encryption=none' /tmp/imgcheck/system/build.prop
          if grep -q 'logd.persistent' /tmp/imgcheck/system/build.prop; then
            echo "::error::bogus propsy logd.persistent przetrwaly w obrazie"; exit 1
          fi
          grep -q 'ro.logd.size=16m' /tmp/imgcheck/system/build.prop
          grep -q 'ro.debuggable=1' /tmp/imgcheck/system/build.prop
          grep -q 'ro.adb.secure=0' /tmp/imgcheck/system/build.prop
          grep -q 'persist.sys.usb.config=mtp,adb' /tmp/imgcheck/system/build.prop
          grep -q 'ro.security.keystore.boot_bypass=true' /tmp/imgcheck/system/build.prop
          grep -q 'ro.security.keystore.provisioning_bypass=true' /tmp/imgcheck/system/build.prop
          grep -q 'persist.sys.keystore2.bypass_rkpd=true' /tmp/imgcheck/system/build.prop
          # dowod neutralizacji dynsystem: rc + skrypt w obrazie (pakiet zyje w system_ext hosta)
          grep -q 'exec_background /system/bin/sh /system/bin/arena_v7_neutralize.sh' \
            /tmp/imgcheck/system/etc/init/arena_v7.rc
          grep -q 'pm disable-user --user 0 com.android.dynsystem' \
            /tmp/imgcheck/system/bin/arena_v7_neutralize.sh
          echo "dynsystem: neutralizacja runtime udokumentowana w obrazie (arena_v7)"
          if [ -n "$(find /tmp/imgcheck/system \( -ipath '*dynsystem*' -o -iname '*DynamicSystem*' \) -prune ! -name '*.arena-disabled' -print 2>/dev/null)" ]; then
            echo "UWAGA: dynsystem obecny w /system bez wylaczenia - sprawdz FIX 0b"; exit 1
          fi
          # v10: rkpd apex MUSI zyc w obrazie (revert FIX 0; dowod w FIX 7)
          test -f /tmp/imgcheck/system/apex/com.android.rkpd.apex
          if [ -n "$(find /tmp/imgcheck/system -name '*rkpd*' -name '*.arena-disabled' 2>/dev/null)" ]; then
            echo "::error::rkpd przemianowany w obrazie (FIX 0 nie odwrocony)"; exit 1
          fi
          echo "rkpd: com.android.rkpd.apex zywy w obrazie - revert FIX 0 OK (v10)"
          grep -q 'ro.remote_provisioning.enable=false' /tmp/imgcheck/system/build.prop
          grep -q 'ro.remote_provisioning.strongbox.enable=false' /tmp/imgcheck/system/build.prop
          echo "propsy v10 (RKPD, doslownie wg zlecenia): w obrazie"
          grep -qF '/sys/bus/sdio/devices/*/power/control' /tmp/imgcheck/system/bin/arena_v11_wifi.sh
          grep -qF 'svc wifi disable' /tmp/imgcheck/system/bin/arena_v11_wifi.sh
