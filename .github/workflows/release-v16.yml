          - propsy usera wg zlecenia (doslownie): ro.security.keystore.boot_bypass=true,
            ro.security.keystore.provisioning_bypass=true, persist.sys.keystore2.bypass_rkpd=true
            (inertne w AOSP - udokumentowane), ro.apex.updatable=false ODMOWIONE
            (boot dziala na aktywnych APEXach; flaga ryzykowalaby rozwalenie lancucha),
          - utrzymane: FBE off, SELinux permissive 6x + typepermissive (RkpdApp off z v7 ODWROCONY w v10 - patrz FIX 7),
            logd persistent (/data/misc/logd), adb bez autoryzacji RSA, arena_diag.

          ## Jak uruchomic — DWIE sciezki

          A) FASTBOOT (permanentnie, zalecane):
              fastboot flash vbmeta_a  vbmeta_hyperos4_p11g2.img
              fastboot flash vbmeta_b  vbmeta_hyperos4_p11g2.img
              fastboot flash system_a  system_hyperos4_p11g2.img
              fastboot flash system_b  system_hyperos4_p11g2.img
              fastboot reboot

          B) DSU (przez DSU Sideloader): obraz zostaje, ALE:
             1) wgraj system_hyperos4_p11g2.img przez DSU Sideloader (jak wczesniej),
             2) PO pierwszym starciu sie HyperOS w DSU wlacz STICKY MODE:
                    adb shell gsi_tool enable
                - wtedy kazdy reboot wraca do HyperOS zamiast do hosta Lenovo,
             3) z v7 notyfikacja DSU (przycisk Restart) znika - nic nie przerwie sesji
                z wnetrza obrazu.

          | plik | rozmiar | sha256 |
          |---|---|---|
          | system_hyperos4_p11g2.img | $(stat -c%s /tmp/kit16/system_hyperos4_p11g2.img) B | $RAW_V16 |
          | vbmeta_hyperos4_p11g2.img | 4096 B | $VBMETA_SHA |
          EOT
          sha256sum system_hyperos4_p11g2.img vbmeta_hyperos4_p11g2.img > SHA256SUMS.txt
          bash sprawdz.sh
          tar czf /tmp/HyperOS4_P11Gen2_v16.tar.gz .
          zip -q -r /tmp/HyperOS4_P11Gen2_v16.zip .
          ls -l /tmp/HyperOS4_P11Gen2_v16.tar.gz /tmp/HyperOS4_P11Gen2_v16.zip

      - name: Release hyperos4-p11g2-v16 (tar.gz + zip + raw img)
        run: |
          set -euo pipefail
          gh release delete hyperos4-p11g2-v16 --yes --cleanup-tag 2>/dev/null || true
          gh release create hyperos4-p11g2-v16 --target "$GITHUB_SHA" \
            --title "HyperOS 4 v16 - Lenovo Tab P11 Gen 2: FULL COMPATIBILITY MATRIX z inwentarza hosta (ekstrakcja bugreport_v14)" \
            --notes "v16 FULL COMPATIBILITY MATRIX = v15 (WHITE-SCREEN FIX: SF-libs z system_ext donora + czarna skrzynka arena_logcatd) + FIX 14: macierze VINTF 4/5/6 budowane z INWENTARZA HAL HOSTA wyekstrahowanego z bugreport_v14 (lshal HARDWARE HALS -> HIDL 127 uslug + service list -> AIDL 32; tsv: diagnostics/logs/host-hal-inventory-v14.tsv, 76 wpisow / 71 grup HAL). Macierz poziomu 5 (FCM vendora A12) opisuje dokladnie to, co vendor Lenovo A14 dostarcza: composer HIDL 2.1-2.3, allocator AIDL, keymint AIDL (IKeyMintDevice + IRemotelyProvisionedComponent + ISecureClock + ISharedSecret), drm 1.0-1.4, boot 1.0-1.2, health 2.0-2.1 itd. Kazdy wpis optional=true: pelna macierz informacyjnie, zero egzekwoty (bypass strict VINTF matching bez ryzyka Failed to initialize VINTF). Receipty wprost z bugreportu: zero binder deadlockow, zero graphic buffer alloc failures, zero watchdog timeout, gosc v14 zyl 42,8 min (dropbox: tylko SYSTEM_BOOT/LAST_KMSG/AUDIT). Odmowy utrzymane: binarne wrappery servicemanager/hwservicemanager i patch keystore2 (brak zrodel; keymint AIDL zyje na vendorze - do rewizji dopiero po receipcie z czarnej skrzynki v15). Surowy system sha256 $RAW_V16." \
            /tmp/HyperOS4_P11Gen2_v16.tar.gz /tmp/HyperOS4_P11Gen2_v16.zip
          gh release view hyperos4-p11g2-v16 --json url,assets -q '.url, (.assets[] | "\(.name) \(.size)B [\(.state)]")'

      - name: Linki publiczne (tar.gz + zip)
        run: |
          set -uo pipefail
          bash tools/public_links.sh /tmp/HyperOS4_P11Gen2_v16.tar.gz /tmp/links-v16-tgz.md || true
          bash tools/public_links.sh /tmp/HyperOS4_P11Gen2_v16.zip /tmp/links-v16-zip.md || true

      - name: Raport z linkami + trace do repo
        if: always()
        run: |
          set -u
          git config user.name "github-actions[bot]" || true
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com" || true
          mkdir -p reports
          F="reports/v16-links-${{ github.run_id }}.md"
          { echo "### v16 links (run ${{ github.run_id }})"; echo "RAW_V16=${RAW_V16:-brak}"; echo
            echo "--- tar.gz ---"; cat /tmp/links-v16-tgz.md 2>/dev/null || echo "(brak)"
            echo "--- zip ---"; cat /tmp/links-v16-zip.md 2>/dev/null || echo "(brak)"; } > "$F" || true
          cat "$F" || true
          if [ -f reports/v16-build-trace.log ]; then
            echo "trace builda: reports/v16-build-trace.log ($(stat -c%s reports/v16-build-trace.log) B)"
          fi
          git add -f reports || true
          git commit -q -m "v7-links+trace: run ${{ github.run_id }}" || true
          git push -q origin "HEAD:${{ github.ref_name }}" || echo "push nie wyszedl"
          exit 0
